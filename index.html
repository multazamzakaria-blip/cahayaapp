<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAHAYA APP - Portal Utama</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg-light: #ecfdf5;
    }

    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: linear-gradient(135deg, var(--primary-dark), #115e59);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .login-container {
      background: white;
      color: #1f2937;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 380px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    .login-container img {
      width: 70px;
      margin-bottom: 10px;
    }

    .login-container h1 {
      margin: 0;
      color: var(--primary-dark);
      font-size: 1.4rem;
    }

    .login-container p {
      font-size: 0.9rem;
      margin-top: 6px;
      margin-bottom: 20px;
      color: #4b5563;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .login-container {
        margin: 0 16px;
        padding: 24px 18px;
      }
      .login-container h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <img src="logofi.png" alt="Logo Pesantren">
    <h1>Selamat Datang di<br><b>CAHAYA APP</b></h1>
    <p>Portal Utama Pesantren Cahaya Fajrul Islam</p>

    <input type="text" id="username" placeholder="Nama Pengguna" autocomplete="off">
    <input type="password" id="password" placeholder="Kata Sandi">
    <button onclick="login()">Masuk</button>

    <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
  </div>

  <script src="portal-script.js"></script>
</body>
</html>
