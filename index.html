<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌅 CAHAYA APP - Portal Utama</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px 32px;
      background: rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      width: 90%;
      max-width: 420px;
    }
    .logo {
      width: 90px;
      border-radius: 50%;
      object-fit: contain;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }
    p {
      color: #d1fae5;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .petugas {
      background: #f9fafb;
      color: #0f766e;
    }
    .petugas:hover {
      background: white;
      transform: translateY(-2px);
    }
    .wali {
      background: #facc15;
      color: #1f2937;
    }
    .wali:hover {
      background: #fde68a;
      transform: translateY(-2px);
    }
    footer {
      font-size: 0.8rem;
      color: #d1d5db;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logofi.png" alt="Logo Pesantren" class="logo" />
    <h1>🌅 CAHAYA APP</h1>
    <p>Portal Administrasi Santri<br>Pesantren Cahaya Fajrul Islam</p>

    <button class="petugas" onclick="window.location.href='login/petugas.html'">
      🧑‍🏫 Login Petugas (Admin / Guru / Naqib)
    </button>
    <button class="wali" onclick="window.location.href='wali/wali-login.html'">
      👨‍👩‍👧 Login Wali Santri
    </button>

    <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
  </div>
</body>
</html>
