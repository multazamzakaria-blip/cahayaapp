<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAHAYA APP - Portal Utama</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg: #f0fdfa;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, var(--primary-dark), #115e59);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .login-box {
      background: white;
      color: #1f2937;
      border-radius: 18px;
      padding: 30px 25px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    .login-box img {
      width: 75px;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.4rem;
      margin-bottom: 5px;
    }

    p {
      font-size: 0.9rem;
      color: #475569;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13,148,136,0.2);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      width: 100%;
      padding: 10px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    footer {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    @keyframes fadeIn {
      from {opacity:0;transform:translateY(20px);}
      to {opacity:1;transform:translateY(0);}
    }

    @media(max-width:480px){
      .login-box{padding:24px 18px;}
      h1{font-size:1.2rem;}
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="logofi.png" alt="Logo Pesantren">
    <h1>Selamat Datang di<br><b>CAHAYA APP</b></h1>
    <p>Portal Utama Pesantren Cahaya Fajrul Islam</p>

    <input type="text" id="username" placeholder="Nama Pengguna" autocomplete="off">
    <input type="password" id="password" placeholder="Kata Sandi">
    <button onclick="login()">Masuk</button>

    <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
  </div>

  <script src="portal-script.js"></script>
</body>
</html>
