    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --accent-gold: #d4af37;
      --accent-gold-light: #fef08a;
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(212, 175, 55, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    /* ===== BODY ENTERPRISE LUXURY ===== */
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: 
        radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.15), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.08), transparent 45%),
        linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
      overflow: hidden;
      text-align: center;
    }

    /* Tekstur Halus Overlay */
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23d4af37' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
      pointer-events: none; z-index: -1;
    }

    /* ===== SPLASH SCREEN ===== */
    #splash {
      position: fixed; inset: 0;
      background: var(--primary-dark);
      display: flex; justify-content: center; align-items: center;
      z-index: 100;
      animation: fadeOut 1.5s cubic-bezier(0.7,0,0.3,1) forwards;
      animation-delay: 1.8s; /* Sedikit lebih lama untuk efek eksklusif */
    }
    #splash img {
      width: 140px;
      animation: zoomInPosh 1.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.6));
    }
    @keyframes zoomInPosh { 
      0% { transform: scale(0.6); opacity: 0; filter: blur(12px) drop-shadow(0 0 0 rgba(212, 175, 55, 0)); } 
      100% { transform: scale(1); opacity: 1; filter: blur(0) drop-shadow(0 0 35px rgba(212, 175, 55, 0.6)); } 
    }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; transform: scale(1.05); } }

    /* ===== LOGO AREA ===== */
    .logo-area {
      margin-bottom: 40px;
      animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.8s both;
    }
    @keyframes fadeInUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .logo-area img {
      width: 100px; margin-bottom: 18px;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
    }
    .logo-area h1 {
      margin: 0; font-family: 'Playfair Display', serif;
      font-size: 2.5rem; font-weight: 700; letter-spacing: 4px;
      background: linear-gradient(to right, var(--text-main), var(--accent-gold), var(--accent-gold-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
    }
    .logo-area p {
      margin-top: 10px; font-size: 0.95rem; color: var(--text-muted);
      letter-spacing: 3px; text-transform: uppercase; font-weight: 400;
    }

    /* ===== LOGIN CARD LUXURY ===== */
    .login-box {
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 55px 45px;
      width: 90%; max-width: 440px;
      box-shadow: 
        0 40px 80px -20px rgba(0,0,0,0.9),
        inset 0 1px 1px rgba(255,255,255,0.08);
      display: flex; flex-direction: column; gap: 24px;
      position: relative; overflow: hidden;
      animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 2s both;
    }
    /* Efek kilau di sudut card */
    .login-box::before {
      content: ''; position: absolute; top: -100px; right: -100px; width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ===== INPUT FIELD ===== */
    .input-group { position: relative; width: 100%; }
    
    input {
      width: 100%; height: 60px;
      padding: 0 22px; border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0, 0, 0, 0.45);
      color: var(--text-main); font-size: 1.05rem; font-family: inherit;
      box-sizing: border-box; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px;
    }
    input::placeholder { color: rgba(255,255,255,0.35); font-weight: 300; }
    
    input:focus {
      outline: none; background: rgba(0, 0, 0, 0.65);
      border-color: rgba(212, 175, 55, 0.6);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12), inset 0 2px 4px rgba(0,0,0,0.3);
      transform: translateY(-1px);
    }

    /* ===== BUTTON PREMIUM ===== */
    button.btn-login {
      height: 60px; border-radius: 18px; border: none;
      font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 2px;
      cursor: pointer; color: var(--primary-dark);
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25);
      position: relative; overflow: hidden; margin-top: 15px;
    }
    button.btn-login::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: all 0.6s ease;
    }
    button.btn-login:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(212, 175, 55, 0.4);
      filter: brightness(1.1);
    }
    button.btn-login:hover::after { left: 100%; }
    button.btn-login:active { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }

    /* ===== FOOTER ===== */
    .footer-text {
      margin-top: 45px; font-size: 0.9rem; color: rgba(148, 163, 184, 0.7);
      letter-spacing: 1.5px; font-family: 'Playfair Display', serif; font-style: italic;
      animation: fadeInUp 1s ease 2.2s both;
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width: 480px) {
      .logo-area img { width: 85px; margin-bottom: 12px;}
      .logo-area h1 { font-size: 2rem; letter-spacing: 2px;}
      .login-box { padding: 45px 30px; border-radius: 24px;}
      input, button.btn-login { height: 55px; }
      .footer-text { margin-top: 30px; font-size: 0.8rem;}
    }

    /* === Modal Pilihan Peran === */
    .modal {
      display: none; position: fixed; z-index: 999; inset: 0;
      background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px);
      justify-content: center; align-items: center; animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    
    .modal-content {
      background: linear-gradient(145deg, #0f172a, #1e293b);
      border: 1px solid var(--glass-border);
      border-radius: 28px; padding: 45px 35px;
      max-width: 420px; width: 90%; text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes scaleIn { from {transform: scale(0.85); opacity: 0;} to {transform: scale(1); opacity: 1;} }
    
    .modal-logo { width: 65px; margin-bottom: 20px; filter: drop-shadow(0 5px 15px rgba(212, 175, 55, 0.4)); }
    .modal-content h2 { color: var(--accent-gold); font-size: 1.6rem; font-family: 'Playfair Display', serif; margin: 0; letter-spacing: 1px;}
    .modal-content p { color: var(--text-muted); font-size: 0.95rem; margin: 15px 0 30px; line-height: 1.6; }
    
    .role-buttons { display: flex; flex-direction: column; gap: 16px; }
    .role-btn {
      border: 1px solid rgba(255,255,255,0.08); padding: 16px; border-radius: 16px;
      font-size: 1.05rem; font-weight: 500; cursor: pointer; color: var(--text-main);
      background: rgba(255,255,255,0.03); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px; position: relative; overflow: hidden;
    }
    .role-btn::before {
        content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
        background: var(--accent-gold); transform: scaleY(0); transition: transform 0.3s ease; transform-origin: bottom;
    }
    .role-btn:hover { 
        background: linear-gradient(90deg, rgba(212, 175, 55, 0.1), rgba(255,255,255,0.05)); 
        border-color: rgba(212, 175, 55, 0.3); transform: translateX(5px); color: var(--accent-gold-light);
    }
    .role-btn:hover::before { transform: scaleY(1); }
  </style>
</head>

  /* === LOGIN UTAMA === */
  async function login() {
    let u = document.getElementById("username").value.trim().toLowerCase();
    const p = document.getElementById("password").value.trim();

    if (!u.includes("@") && !waliList.some(w => w.username.toLowerCase() === u)) {
      u = u + "@cahayaapp.id";
    }

    // === LOGIN WALI SANTRI ===
    if (!u.endsWith("@cahayaapp.id")) {
      const wali = waliList.find(w => w.username.toLowerCase() === u && w.password === p);
      if (!wali) {
        alert("❌ Username atau password salah.");
        return;
      }
      const found = { role: "wali", namaAnak: wali.nama, username: wali.username, label: `Wali ${wali.nama}` };
      localStorage.setItem("cahayaCurrentUser", JSON.stringify(found));
      location.href = "wali/dashboard/index.html";
      return;
    }

    // === LOGIN PETUGAS (Firebase Auth) ===
    try {
      const email = u;
      const userCredential = await firebase.auth().signInWithEmailAndPassword(email, p);
      const user = userCredential.user;
      const uname = email.split("@")[0];
      const localUser = users.find(a => a.username === uname);

      if (!localUser) {
        alert("❌ Akun tidak terdaftar di sistem lokal.");
        await firebase.auth().signOut();
        return;
      }

      if (localUser.roles && localUser.roles.length > 1) {
        tampilModalPeran(localUser);
        return;
      }

      const role = localUser.role;
      const found = { role, email: user.email, username: uname, label: localUser.label, uid: user.uid };
      localStorage.setItem("cahayaCurrentUser", JSON.stringify(found));

      const db = firebase.database();
      await db.ref("users/" + user.uid).set({
        nama: localUser.label, username: uname, email: user.email, role: role, waktu_login: new Date().toISOString()
      });

      // Redirect Visual Premium
      tampilkanLoadingPosh(`Memasuki Portal ${role.toUpperCase()}...`);
      setTimeout(() => {
        if(role === "guru") location.href = "guru/fitur.html";
        else if(role === "naqib") location.href = "naqib/dashboard.html";
        else if(role === "admin") location.href = "admin/index.html";
      }, 1500);

    } catch (error) {
      alert("❌ Gagal login: " + error.message);
    }
  }

  /* === AUTO LOGIN === */
  (function autoLogin() {
    const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
    if (!user) return;
    switch (user.role) {
      case "guru": window.location.href = "guru/fitur.html"; break;
      case "naqib": window.location.href = "naqib/dashboard.html"; break;
      case "admin": window.location.href = "admin/index.html"; break;
      case "wali": window.location.href = "wali/dashboard/index.html"; break;
      default: localStorage.removeItem("cahayaCurrentUser"); break;
    }
  })();

  /* === Modal Peran & Efek Loading === */
  let pendingUser = null;
  function tampilModalPeran(user) {
    pendingUser = user;
    document.getElementById('roleModal').style.display = 'flex';
  }

  async function pilihPeran(role) {
    document.getElementById('roleModal').style.display = 'none';
    const uname = pendingUser.username;
    const label = pendingUser.label;
    const email = uname + "@cahayaapp.id";
    const found = { role, email, username: uname, label };
    localStorage.setItem("cahayaCurrentUser", JSON.stringify(found));

    tampilkanLoadingPosh(`Mempersiapkan area ${role.toUpperCase()}...`);
    setTimeout(() => {
      if (role === 'guru') window.location.href = 'guru/fitur.html';
      else if (role === 'naqib') window.location.href = 'naqib/dashboard.html';
    }, 1500);
  }

  function tampilkanLoadingPosh(text) {
    const loading = document.createElement('div');
    loading.style.cssText = `position:fixed; inset:0; background:rgba(2,6,23,0.9); backdrop-filter:blur(15px); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#d4af37; font-family:'Playfair Display',serif; font-size:1.5rem; letter-spacing:2px; animation: fadeIn 0.5s ease;`;
    loading.innerHTML = `<img src="logofi.png" style="width:90px; margin-bottom:25px; filter:drop-shadow(0 0 20px rgba(212,175,55,0.6)); animation:pulse 1.2s infinite alternate;" /><div>${text}</div>`;
    document.body.appendChild(loading);
  }
  </script>

      <div class="role-buttons">
        <button class="role-btn" onclick="pilihPeran('guru')">Ruang Akademik (Guru)</button>
        <button class="role-btn" onclick="pilihPeran('naqib')">Ruang Asrama (Naqib)</button>
      </div>
    </div>
