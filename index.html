<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAHAYA APP - Portal Utama</title>
  <link rel="icon" type="image/png" href="logofi.png" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px 36px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    img {
      width: 90px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 10px 0 5px;
    }

    p {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
    }

    button {
      background: #facc15;
      color: #1f2937;
      border: none;
      border-radius: 10px;
      width: 100%;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #fde68a;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <img src="logofi.png" alt="Logo Pesantren" />
    <h2>🔑 Login CAHAYA APP</h2>
    <p>Masukkan username & password sesuai peran Anda</p>

    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Masuk</button>

    <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
  </div>

  <script>
    // === DATA LOGIN PETUGAS ===
    const users = [
      // === GURU ===
      { username: "multazam", password: "guru123", role: "guru", label: "Abah Multazam Zakaria" },
      { username: "alvin", password: "guru123", role: "guru", label: "Mu'allim Alvin Dwianto" },
      { username: "haidar", password: "guru123", role: "guru", label: "Mu'allim Haidar" },
      { username: "meilisa", password: "guru123", role: "guru", label: "Mu'allimah Meilisa" },

      // === NAQIB ===
      { username: "dimas", password: "dimas123", role: "naqib", label: "Naqib Dimas Bayu Aditya", naqibName: "Dimas" },
      { username: "regen", password: "regen123", role: "naqib", label: "Naqib Regen Prayitno", naqibName: "Regen" },
      { username: "evita", password: "evita123", role: "naqib", label: "Naqibah Evita", naqibName: "Evita" },

      // === ADMIN ===
      { username: "admin", password: "cahaya2026", role: "admin", label: "Admin Pesantren" },
    ];

    // === DATA LOGIN WALISANTRI ===
    const waliList = [
      { nama: "Ahmad Maulana", username: "ahmad312", password: "Cahaya@8723" },
      { nama: "Najmihadi Syauqii Tamaam", username: "najmi827", password: "Cahaya@7721" },
      { nama: "Fitrah Kirana", username: "fitrah607", password: "Cahaya@7839" },
      // ... (kamu bisa masukkan semua daftar wali yang sudah ada)
    ];

    // === LOGIN FUNCTION ===
    function login() {
      const u = username.value.trim().toLowerCase();
      const p = password.value.trim();

      // cek petugas dulu
      let found = users.find(a => a.username === u && a.password === p);

      // kalau tidak ditemukan, cek wali
      if (!found) {
        const wali = waliList.find(w => w.username.toLowerCase() === u && w.password === p);
        if (wali) {
          found = {
            role: "wali",
            namaAnak: wali.nama,
            username: wali.username,
            label: `Wali ${wali.nama}`,
          };
        }
      }

      if (!found) {
        alert("❌ Username atau password salah.");
        return;
      }

      // simpan ke localStorage global unified
      localStorage.setItem("cahayaCurrentUser", JSON.stringify(found));

      // arahkan berdasarkan role
      switch (found.role) {
        case "guru":
          location.href = "guru/fitur.html";
          break;
        case "naqib":
          location.href = "naqib/dashboard.html";
          break;
        case "wali":
          location.href = "wali/wali-dashboard.html";
          break;
        case "admin":
          location.href = "admin/index.html";
          break;
        default:
          alert("Peran tidak dikenali.");
      }
    }

    // === AUTO-LOGIN (jika sudah tersimpan di localStorage) ===
    (function autoLogin() {
      const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
      if (!user) return;

      switch (user.role) {
        case "guru":
          location.href = "guru/fitur.html";
          break;
        case "naqib":
          location.href = "naqib/dashboard.html";
          break;
        case "wali":
          location.href = "wali/wali-dashboard.html";
          break;
        case "admin":
          location.href = "admin/index.html";
          break;
      }
    })();
  </script>
</body>
</html>
