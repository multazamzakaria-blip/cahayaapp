<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌅 CAHAYA APP - Portal Utama</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }
    img {
      width: 90px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }
    p {
      color: #d1fae5;
      margin-bottom: 20px;
    }
    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .petugas {
      background: white;
      color: #0f766e;
    }
    .petugas:hover {
      background: #f3f4f6;
      transform: translateY(-2px);
    }
    .wali {
      background: #facc15;
      color: #1e293b;
    }
    .wali:hover {
      background: #fde68a;
      transform: translateY(-2px);
    }
    footer {
      font-size: 0.85rem;
      color: #d1d5db;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logofi.png" alt="Logo Pesantren">
    <h1>🌅 CAHAYA APP</h1>
    <p>Portal Administrasi Santri<br>Pesantren Cahaya Fajrul Islam</p>

    <button class="petugas" onclick="window.location.href='login/petugas.html'">🧑‍🏫 Login Petugas (Guru / Naqib / Admin)</button>
    <button class="wali" onclick="window.location.href='login/wali.html'">👨‍👩‍👧 Login Wali Santri</button>

    <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
  </div>
</body>
</html>
