<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAHAYA APP - Portal Utama</title>
  <link rel="icon" type="image/png" href="logofi.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-dark: #134e4a;
      --green-light: #0f766e;
      --yellow: #facc15;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, var(--green-light), var(--green-dark));
      color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    /* === SPLASH LOGO === */
    #splash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--green-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      animation: fadeOut 1.5s ease forwards;
      animation-delay: 1.6s;
    }
    #splash img {
      width: 130px;
      animation: zoomIn 1.3s ease;
    }
    @keyframes zoomIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    /* === LOGO AREA === */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      margin-top: -20px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    .logo-area img {
      width: 130px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
    }
    .logo-area h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
    }
    .logo-area p {
      font-size: 1rem;
      opacity: 0.9;
      margin-top: 4px;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.25);
    }

    /* === LOGIN BOX === */
    .login-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 25px 22px;
      width: 85%;
      max-width: 300px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      animation: fadeInUp 1s ease 1.7s both;
      box-sizing: border-box;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.95);
      color: #1f2937;
      box-shadow: inset 0 0 3px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background: var(--yellow);
      color: #1f2937;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    button:hover {
      background: #fde68a;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .footer-text {
      font-size: 0.9rem;
      margin-top: 20px;
      opacity: 0.9;
      text-shadow: 0 0 5px rgba(255,255,255,0.25);
    }

    @media (max-width: 480px) {
      .logo-area img { width: 100px; }
      .logo-area h1 { font-size: 1.6rem; }
      .login-box { padding: 20px; max-width: 260px; }
    }
  </style>
</head>

<body>
  <!-- SPLASH SCREEN -->
  <div id="splash">
    <img src="logofi.png" alt="Logo Cahaya App" />
  </div>

  <!-- HEADER -->
  <div class="logo-area">
    <img src="logofi.png" alt="Logo" />
    <h1>CAHAYA APP</h1>
    <p>Pesantren Cahaya Fajrul Islam</p>
  </div>

  <!-- LOGIN BOX -->
  <div class="login-box">
    <input type="text" id="username" placeholder="Username" autocomplete="off" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Masuk</button>
  </div>

  <div class="footer-text">Baca “Bismillah” terlebih dahulu</div>

  <script>
    // =====================================================
    // 🔁 Auto reset cache lama jika versi data berubah
    // =====================================================
    const cacheVersion = "v2"; // ubah ke v3 jika ada update nama/data wali
    if (localStorage.getItem("cahayaCacheVersion") !== cacheVersion) {
      localStorage.clear();
      localStorage.setItem("cahayaCacheVersion", cacheVersion);
      console.log("Cache lama dihapus. Versi baru:", cacheVersion);
    }

    /* === DAFTAR USER === */
    const users = [
      { username: "multazam", password: "guru123", role: "guru", label: "Abah Multazam Zakaria" },
      { username: "alvin", password: "guru123", role: "guru", label: "Mu'allim Alvin Dwianto" },
      { username: "kamal", password: "guru123", role: "guru", label: "Mu'allim Kamal" },
      { username: "favian", password: "guru123", role: "guru", label: "Mu'allim Favian" },
      { username: "fatimah", password: "guru123", role: "guru", label: "Mu'allimah Fatimah" },
      { username: "evita", password: "guru123", role: "guru", label: "Mrs Evita" },
      { username: "shafwan", password: "guru123", role: "guru", label: "Mu'allim Shafwan" },
      { username: "alzam", password: "guru123", role: "guru", label: "Mu'allim Alzam" },
      { username: "faiq", password: "guru123", role: "guru", label: "Mu'allim Faiq" },
      { username: "khaizuran", password: "guru123", role: "guru", label: "Mu'allim Khaizuran" },
      { username: "favian", password: "guru123", role: "guru", label: "Mu'allim Favian" },
      { username: "mulia", password: "guru123", role: "guru", label: "Mu'allim Mulia" },
      { username: "fahmi", password: "guru123", role: "guru", label: "Mu'allim Fahmi" },
      { username: "meilisa", password: "guru123", role: "guru", label: "Mu'allimah Meilisa" },
      { username: "dimas", password: "dimas123", role: "naqib", label: "Naqib Dimas" },
      { username: "regen", password: "regen123", role: "naqib", label: "Naqib Regen" },
      { username: "favian", password: "favian123", role: "naqib", label: "Naqib Favian" },
      { username: "shafwan", password: "shafwan123", role: "naqib", label: "Naqib Shafwan" },
      { username: "kamal", password: "kamal123", role: "naqib", label: "Naqib Kamal" },
      { username: "evita", password: "evita123", role: "naqib", label: "Naqibah Evita" },
      { username: "fatimah", password: "fatimah123", role: "naqib", label: "Naqibah Fatimah" },
      { username: "admin", password: "cahaya2026", role: "admin", label: "Admin Pesantren" }
    ];

    const waliList = [
      {nama:"Naufal Akbar Alkhatiri",username:"naufal502",password:"Cahaya@8888"},
      // ... (data wali lainnya)
    ];

    function login() {
      const u = username.value.trim().toLowerCase();
      const p = password.value.trim();

      let found = users.find(a => a.username === u && a.password === p);

      if (!found) {
        const wali = waliList.find(w => w.username.toLowerCase() === u && w.password === p);
        if (wali) {
          found = { role: "wali", namaAnak: wali.nama, username: wali.username, label: `Wali ${wali.nama}` };
        }
      }

      if (!found) {
        alert("❌ Username atau password salah.");
        return;
      }

      if (found.role === "naqib") {
        const cleanName = found.label.replace(/^Naqib(ah)?\s+/i, "").trim();
        found.naqibName = cleanName;
      }

      localStorage.setItem("cahayaCurrentUser", JSON.stringify(found));

      switch (found.role) {
        case "guru": location.href = "guru/fitur.html"; break;
        case "naqib": location.href = "naqib/dashboard.html"; break;
        case "wali": location.href = "wali/dashboard/index.html"; break;
        case "admin": location.href = "admin/index.html"; break;
      }
    }

    (function autoLogin() {
      const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
      if (!user) return;
      switch (user.role) {
        case "guru": window.location.href = "guru/fitur.html"; break;
        case "naqib": window.location.href = "naqib/dashboard.html"; break;
        case "admin": window.location.href = "admin/index.html"; break;
        case "wali": window.location.href = "wali/dashboard/index.html"; break;
        default: localStorage.removeItem("cahayaCurrentUser"); break;
      }
    })();
  </script>
</body>
</html>
