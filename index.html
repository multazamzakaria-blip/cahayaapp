<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAHAYA APP - Portal Utama</title>
  <link rel="icon" type="image/png" href="logofi.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-dark: #134e4a;
      --green-light: #0f766e;
      --yellow: #facc15;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, var(--green-light), var(--green-dark));
      color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* === SPLASH LOGO === */
    #splash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--green-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      animation: fadeOut 1.6s ease forwards;
      animation-delay: 1.6s;
    }
    #splash img {
      width: 130px;
      animation: zoomIn 1.3s ease;
    }
    @keyframes zoomIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    /* === LOGO AREA === */
    .logo-area {
      text-align: center;
      margin-bottom: 14px;
    }
    .logo-area img {
      width: 90px;
      vertical-align: middle;
      margin-right: 10px;
    }
    .logo-area h1 {
      display: inline-block;
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
      vertical-align: middle;
    }
    .logo-area p {
      margin: 4px 0 0;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    /* === LOGIN BOX === */
    .login-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      width: 85%;
      max-width: 300px;
      text-align: center;
      animation: slideUp 0.9s ease 1.3s both;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
    }

    .login-box button {
      background: var(--yellow);
      color: #1f2937;
      border: none;
      border-radius: 8px;
      width: 100%;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-box button:hover {
      background: #fde68a;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
    }

    @media (max-width: 480px) {
      .logo-area img { width: 70px; }
      .logo-area h1 { font-size: 1.5rem; }
      .login-box { max-width: 240px; padding: 20px; }
    }
  </style>
</head>

<body>
  <!-- SPLASH -->
  <div id="splash">
    <img src="logofi.png" alt="Logo Cahaya App" />
  </div>

  <!-- HEADER -->
  <div class="logo-area">
    <img src="logofi.png" alt="Logo" />
    <h1>CAHAYA APP</h1>
    <p>Pesantren Cahaya Fajrul Islam</p>
  </div>

  <!-- LOGIN BOX -->
  <div class="login-box">
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Masuk</button>
  </div>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>

  <script>
    /* === DAFTAR USER === */
    const users = [
      // --- Guru ---
      { username: "multazam", password: "guru123", role: "guru", label: "Abah Multazam Zakaria" },
      { username: "alvin", password: "guru123", role: "guru", label: "Mu'allim Alvin Dwianto" },
      { username: "kamal", password: "guru123", role: "guru", label: "Mu'allim Kamal" },
      { username: "favian", password: "guru123", role: "guru", label: "Mu'allim Favian" },
      { username: "fatimah", password: "guru123", role: "guru", label: "Mu'allimah Fatimah" },
      { username: "evita", password: "guru123", role: "guru", label: "Mrs Evita" },

      // --- Naqib / Naqibah ---
      { username: "dimas", password: "dimas123", role: "naqib", label: "Naqib Dimas" },
      { username: "regen", password: "regen123", role: "naqib", label: "Naqib Regen" },
      { username: "favian", password: "favian123", role: "naqib", label: "Naqib Favian" },
      { username: "shafwan", password: "shafwan123", role: "naqib", label: "Naqib Shafwan" },
      { username: "kamal", password: "kamal123", role: "naqib", label: "Naqib Kamal" },
      { username: "evita", password: "evita123", role: "naqib", label: "Naqibah Evita" },
      { username: "fatimah", password: "fatimah123", role: "naqib", label: "Naqibah Fatimah" },

      // --- Admin ---
      { username: "admin", password: "cahaya2026", role: "admin", label: "Admin Pesantren" }
    ];

    /* === WALI SANTRI === */
    const waliList = [
      { nama: "Ahmad Maulana", username: "ahmad312", password: "Cahaya@8723" },
      { nama: "Juanda Nur Ilham", username: "juanda491", password: "Cahaya@1049" },
      { nama: "Najmihadi Syauqii Tamaam", username: "najmi827", password: "Cahaya@7721" },
      // ... dst (data wali tetap sama seperti sebelumnya)
    ];

    /* === LOGIN UTAMA === */
    function login() {
      const u = username.value.trim().toLowerCase();
      const p = password.value.trim();

      let found = users.find(a => a.username === u && a.password === p);

      // Jika bukan petugas, cek wali santri
      if (!found) {
        const wali = waliList.find(w => w.username.toLowerCase() === u && w.password === p);
        if (wali) {
          found = {
            role: "wali",
            namaAnak: wali.nama,
            username: wali.username,
            label: `Wali ${wali.nama}`
          };
        }
      }

      if (!found) {
        alert("❌ Username atau password salah.");
        return;
      }

      // === FIX UTAMA: Simpan nama naqib tanpa awalan "Naqib" ===
      if (found.role === "naqib") {
        const cleanName = found.label.replace(/^Naqib(ah)?\s+/i, "").trim();
        found.naqibName = cleanName; // contoh: "Naqib Kamal" → "Kamal"
      }

      // Simpan ke localStorage
      localStorage.setItem("cahayaCurrentUser", JSON.stringify(found));

      // Redirect sesuai role
      switch (found.role) {
        case "guru": location.href = "guru/fitur.html"; break;
        case "naqib": location.href = "naqib/dashboard.html"; break;
        case "wali": location.href = "wali/wali-dashboard.html"; break;
        case "admin": location.href = "admin/index.html"; break;
      }
    }

    /* === AUTO LOGIN === */
    (function autoLogin() {
      const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
      if (!user) return;
      switch (user.role) {
        case "guru": location.href = "guru/fitur.html"; break;
        case "naqib": location.href = "naqib/dashboard.html"; break;
        case "wali": location.href = "wali/wali-dashboard.html"; break;
        case "admin": location.href = "admin/index.html"; break;
      }
    })();
  </script>
</body>
</html>
