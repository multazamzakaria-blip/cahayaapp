<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📖 Rekap Setoran Tahfiz</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9fafb; margin: 0; color: #1f2937; }
    header { background: #059669; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
    select, input[type="date"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 0.9rem; margin-top: 4px; }
    button { background: #059669; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #047857; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; background: white; }
    th, td { border: 1px solid #e5e7eb; padding: 6px 8px; text-align: center; }
    th { background: #059669; color: white; font-weight: bold; }
    tr:nth-child(even) td { background: #f9fafb; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
    .filter-row > div { flex: 1; min-width: 200px; }
  </style>
</head>
<body>
<header>
  <h1>📖 Rekap Setoran Tahfiz</h1>
  <button onclick="history.back()">⬅ Kembali</button>
</header>

<main>
  <div class="card">
    <div class="filter-row">
      <div><label>Rentang Waktu</label>
        <select id="rangeSelect" onchange="toggleCustomDate()">
          <option value="hari">Hari Ini</option>
          <option value="pekan">Pekan Ini</option>
          <option value="bulan">Bulan Ini</option>
          <option value="rentang">Rentang Tanggal</option>
        </select>
      </div>
      <div id="customDate" style="display:none;flex:2;gap:8px;flex-wrap:wrap;">
        <div><label>Dari</label><input type="date" id="startDate"></div>
        <div><label>Sampai</label><input type="date" id="endDate"></div>
      </div>
    </div>

    <div style="margin-top:10px;">
      <button onclick="tampilkanRekap()">🔍 Tampilkan Rekap</button>
      <button id="exportBtn" onclick="exportExcel()" disabled>💾 Export Excel</button>
    </div>

    <p id="info" style="margin-top:10px;font-size:0.9rem;color:#374151;"></p>

    <div style="overflow-x:auto;margin-top:10px;">
      <table id="rekapTable">
        <thead><tr id="rekapHead"></tr></thead>
        <tbody id="rekapBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  let lastData = [];

  window.toggleCustomDate = function() {
    document.getElementById("customDate").style.display =
      document.getElementById("rangeSelect").value === "rentang" ? "flex" : "none";
  };

  function getRange(mode) {
    const now = new Date();
    let start, end;
    if (mode === "hari") {
      start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    } else if (mode === "pekan") {
      const first = now.getDate() - now.getDay();
      start = new Date(now.getFullYear(), now.getMonth(), first);
      end = new Date(now.getFullYear(), now.getMonth(), first + 6, 23, 59, 59);
    } else if (mode === "bulan") {
      start = new Date(now.getFullYear(), now.getMonth(), 1);
      end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
    } else {
      const s = document.getElementById("startDate").value;
      const e = document.getElementById("endDate").value;
      if (!s || !e) return null;
      start = new Date(s);
      end = new Date(e + "T23:59:59");
    }
    return { start, end };
  }

  window.tampilkanRekap = async function() {
    const info = document.getElementById("info");
    const tbody = document.getElementById("rekapBody");
    const thead = document.getElementById("rekapHead");
    const exportBtn = document.getElementById("exportBtn");

    info.textContent = "⏳ Mengambil data...";
    tbody.innerHTML = ""; thead.innerHTML = ""; exportBtn.disabled = true;

    const rangeSel = document.getElementById("rangeSelect").value;
    const range = getRange(rangeSel);
    if (!range) { info.textContent = "❌ Lengkapi tanggal."; return; }
    const { start, end } = range;

    const snap = await get(child(ref(db), "cahaya_app/setoran_tahfiz"));
    if (!snap.exists()) { info.textContent = "❌ Tidak ada data."; return; }

    const raw = snap.val();
    const records = [];
    for (const [id, d] of Object.entries(raw)) {
      const tgl = new Date(d.tanggal);
      if (tgl < start || tgl > end) continue;
      records.push({
        tanggal: d.tanggal,
        santri: d.nama || "-",
        surat: d.surat || "-",
        status: d.status || "-",
        nilai: d.nilai || "-",
        guru: d.guru || "-"
      });
    }

    if (records.length === 0) { info.textContent = "ℹ️ Tidak ada data pada rentang ini."; return; }

    thead.innerHTML = "<th>Tanggal</th><th>Santri</th><th>Surat / Juz</th><th>Status</th><th>Nilai</th><th>Guru</th>";
    tbody.innerHTML = records.map(r => `
      <tr><td>${r.tanggal}</td><td style="text-align:left">${r.santri}</td><td>${r.surat}</td><td>${r.status}</td><td>${r.nilai}</td><td>${r.guru}</td></tr>
    `).join("");

    lastData = records; exportBtn.disabled = false;
    info.textContent = `✅ ${records.length} data setoran tahfiz ditemukan.`;
  };

  window.exportExcel = function() {
    if (!lastData.length) return alert("Tidak ada data.");
    const ws = XLSX.utils.json_to_sheet(lastData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Setoran Tahfiz");
    XLSX.writeFile(wb, `Rekap_Setoran_Tahfiz_${new Date().toISOString().split("T")[0]}.xlsx`);
  };
</script>
</body>
</html>
