<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎓 Rekap Nilai Ujian</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9fafb; margin: 0; color: #1f2937; }
    header { background: #7c3aed; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: center; }
    th { background: #7c3aed; color: white; }
    button { background: #7c3aed; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-weight: bold; }
  </style>
</head>
<body>
<header>
  <h1>🎓 Rekap Nilai Ujian</h1>
  <button onclick="history.back()">⬅ Kembali</button>
</header>
<main>
  <button onclick="tampilkan()">🔍 Tampilkan Rekap</button>
  <button id="exportBtn" onclick="exportExcel()" disabled>💾 Export Excel</button>
  <p id="info"></p>
  <table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  const firebaseConfig={apiKey:"AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",authDomain:"absensi-santri-fajrul-islam.firebaseapp.com",databaseURL:"https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",projectId:"absensi-santri-fajrul-islam",storageBucket:"absensi-santri-fajrul-islam.appspot.com",messagingSenderId:"739928369926",appId:"1:739928369926:web:7e95375c3ddba0f584cdd07"};
  const app=initializeApp(firebaseConfig);const db=getDatabase(app);let last=[];
  window.tampilkan=async function(){const info=document.getElementById("info");info.textContent="⏳ Mengambil data...";const snap=await get(child(ref(db),"cahaya_app/nilai_ujian"));if(!snap.exists()){info.textContent="❌ Tidak ada data.";return;}const data=snap.val();const rows=[];for(const[id,d]of Object.entries(data)){rows.push({tanggal:d.tanggal||"-",nama:d.nama||"-",mapel:d.mapel||"-",nilai:d.nilai||"-",penguji:d.penguji||"-"});}document.getElementById("thead").innerHTML="<th>Tanggal</th><th>Nama</th><th>Mapel</th><th>Nilai</th><th>Penguji</th>";document.getElementById("tbody").innerHTML=rows.map(r=>`<tr><td>${r.tanggal}</td><td>${r.nama}</td><td>${r.mapel}</td><td>${r.nilai}</td><td>${r.penguji}</td></tr>`).join("");info.textContent=`✅ ${rows.length} data ditemukan.`;last=rows;document.getElementById("exportBtn").disabled=false;};
  window.exportExcel=function(){if(!last.length)return alert("Tidak ada data.");const ws=XLSX.utils.json_to_sheet(last);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Nilai");XLSX.writeFile(wb,"Rekap_Nilai.xlsx");};
</script>
</body>
</html>
