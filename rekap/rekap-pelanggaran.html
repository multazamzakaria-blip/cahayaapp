<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚠️ Rekap Pelanggaran Santri</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9fafb; margin: 0; color: #1f2937; }
    header { background: #dc2626; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
    select, input[type="date"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 0.9rem; margin-top: 4px; }
    button { background: #dc2626; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #b91c1c; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; background: white; }
    th, td { border: 1px solid #e5e7eb; padding: 6px 8px; text-align: center; }
    th { background: #dc2626; color: white; font-weight: bold; }
  </style>
</head>
<body>
<header>
  <h1>⚠️ Rekap Pelanggaran Santri</h1>
  <button onclick="history.back()">⬅ Kembali</button>
</header>

<main>
  <div class="card">
    <div><label>Rentang Waktu</label>
      <select id="rangeSelect" onchange="toggleCustomDate()">
        <option value="bulan">Bulan Ini</option>
        <option value="rentang">Rentang Tanggal</option>
      </select>
    </div>
    <div id="customDate" style="display:none;margin-top:10px;">
      <label>Dari</label><input type="date" id="startDate">
      <label>Sampai</label><input type="date" id="endDate">
    </div>

    <div style="margin-top:10px;">
      <button onclick="tampilkanRekap()">🔍 Tampilkan Rekap</button>
      <button id="exportBtn" onclick="exportExcel()" disabled>💾 Export Excel</button>
    </div>

    <p id="info"></p>
    <table><thead><tr id="rekapHead"></tr></thead><tbody id="rekapBody"></tbody></table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI", authDomain: "absensi-santri-fajrul-islam.firebaseapp.com", databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com", projectId: "absensi-santri-fajrul-islam", storageBucket: "absensi-santri-fajrul-islam.appspot.com", messagingSenderId: "739928369926", appId: "1:739928369926:web:7e95375c3ddba0f584cdd07" };
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  let lastData = [];

  window.toggleCustomDate = function(){ document.getElementById("customDate").style.display = document.getElementById("rangeSelect").value === "rentang" ? "block" : "none"; };
  function getRange(){ const s=document.getElementById("startDate").value;const e=document.getElementById("endDate").value;return s&&e?{start:new Date(s),end:new Date(e+"T23:59:59")}:null;}

  window.tampilkanRekap = async function(){
    const info=document.getElementById("info");const tbody=document.getElementById("rekapBody");const thead=document.getElementById("rekapHead");const exportBtn=document.getElementById("exportBtn");
    info.textContent="⏳ Mengambil data...";tbody.innerHTML="";thead.innerHTML="";exportBtn.disabled=true;
    const range=getRange();const snap=await get(child(ref(db),"cahaya_app/pelanggaran_santri"));
    if(!snap.exists()){info.textContent="❌ Tidak ada data.";return;}
    const data=snap.val();const rows=[];
    for(const[id,d]of Object.entries(data)){rows.push({tanggal:d.tanggal||"-",nama:d.nama||"-",kategori:d.kategori||"-",deskripsi:d.deskripsi||"-",penindak:d.petugas||"-"});}
    if(!rows.length){info.textContent="ℹ️ Tidak ada data.";return;}
    thead.innerHTML="<th>Tanggal</th><th>Nama Santri</th><th>Kategori</th><th>Deskripsi</th><th>Petugas</th>";
    tbody.innerHTML=rows.map(r=>`<tr><td>${r.tanggal}</td><td>${r.nama}</td><td>${r.kategori}</td><td>${r.deskripsi}</td><td>${r.penindak}</td></tr>`).join("");
    lastData=rows;exportBtn.disabled=false;info.textContent=`✅ ${rows.length} data ditemukan.`;
  };

  window.exportExcel=function(){if(!lastData.length)return alert("Tidak ada data.");const ws=XLSX.utils.json_to_sheet(lastData);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Pelanggaran");XLSX.writeFile(wb,"Rekap_Pelanggaran.xlsx");};
</script>
</body>
</html>
