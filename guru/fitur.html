<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Guru</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ======== STYLE DASAR ======== */
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --bg: #f5f7f9;
      --text: #333;
      --shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: "Poppins", Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 1.3rem;
      margin: 0;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.25s ease;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    main {
      padding: 24px;
      max-width: 1000px;
      margin: auto;
    }

    /* ======== CARD STYLE ======== */
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      animation: fadeIn 0.5s ease;
    }

    h2, h3, h4 {
      margin-top: 0;
      color: var(--primary-dark);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ======== DASHBOARD ======== */
    .dashboard-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .dashboard-buttons button {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      padding: 14px;
      border-radius: 12px;
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
      transition: 0.3s;
    }

    .dashboard-buttons button:hover {
      background: var(--primary);
      color: white;
      transform: scale(1.04);
    }

    /* ======== FORM DAN TABEL ======== */
    label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
    }

    select, input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 6px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
      color: #333;
    }

    .hidden { display: none; }

    /* ======== RESPONSIVE ======== */
    @media (max-width: 600px) {
      header h1 { font-size: 1.1rem; }
      main { padding: 16px; }
      .card { padding: 18px; }
    }
  </style>
</head>

<body>
<header>
  <h1>📘 CAHAYA APP – Guru</h1>
  <div class="btn-group">
    <button onclick="goBack()">⬅️ Kembali</button>
    <button onclick="logout()">🚪 Keluar</button>
  </div>
</header>

<main>
  <!-- DASHBOARD -->
  <div id="dashboard" class="card">
    <h2>Dashboard Guru</h2>
    <div class="dashboard-buttons">
      <button onclick="window.location.href='absensiPembelajaran.html'">📋 Absensi Kehadiran Santri</button>
      <button onclick="window.location.href='absensiDeep.html'">🧠 Absensi Deep Learning</button>
      <button onclick="window.location.href='inputSetoranTahfiz.html'">📖 Input Setoran Tahfiz</button>
      <button onclick="window.location.href='asasmentCahaya.html'">🌟 Assasment Cahaya</button>
      <button onclick="showSection('inputNilaiPage')">🧾 Input Nilai Ujian</button>
    </div>
  </div>

  <!-- INPUT NILAI UJIAN -->
  <div id="inputNilaiPage" class="card hidden">
    <h3>📘 Input Nilai Ujian</h3>
    <p>Isi nilai ujian santri berdasarkan jenis kelas, subprogram, kelompok, dan mata pelajaran.</p>

    <label>Jenis Kelas:</label>
    <select id="nilaiKelas" onchange="updateKelompokNilai()">
      <option value="">-- pilih kelas --</option>
      <option>Keilmuan Islam & Umum</option>
      <option>Bahasa Internasional</option>
      <option>Tahsin & Tahfiz Al-Qur'an</option>
    </select>

    <div id="subProgramWrapper" class="hidden">
      <label>Sub Program (Khusus Tahsin/Tahfiz):</label>
      <select id="nilaiSubProgram" onchange="loadSantriUjian()">
        <option value="">-- pilih program --</option>
        <option value="Tahsin">Tahsin</option>
        <option value="Tahfiz">Tahfiz</option>
      </select>
    </div>

    <label>Kelompok:</label>
    <select id="nilaiKelompok" onchange="loadSantriUjian()">
      <option value="">-- pilih kelompok --</option>
    </select>

    <label>Mapel:</label>
    <select id="nilaiMapel">
      <option value="">-- pilih mapel --</option>
      <option>Fiqih</option>
      <option>Nahwu</option>
      <option>Tahfiz</option>
      <option>Tahsin</option>
    </select>

    <label>Bulan:</label>
    <select id="nilaiBulan">
      <option value="">-- Pilih Bulan --</option>
      <option value="0">Januari</option>
      <option value="1">Februari</option>
      <option value="2">Maret</option>
      <option value="3">April</option>
      <option value="4">Mei</option>
      <option value="5">Juni</option>
      <option value="6">Juli</option>
      <option value="7">Agustus</option>
      <option value="8">September</option>
      <option value="9">Oktober</option>
      <option value="10">November</option>
      <option value="11">Desember</option>
    </select>

    <label>Materi Ujian:</label>
    <input type="text" id="nilaiMateri" placeholder="Contoh: Bab Shalat / Bab Nahwu">

    <label>Tanggal Ujian:</label>
    <input type="date" id="nilaiTanggal">

    <h4>Daftar Santri</h4>
    <table id="tabelNilaiSantri">
      <thead>
        <tr><th>No</th><th>Nama Santri</th><th>Nilai</th></tr>
      </thead>
      <tbody id="nilaiSantriBody">
        <tr><td colspan="3" style="text-align:center;color:#777">Pilih kelas & kelompok untuk menampilkan santri.</td></tr>
      </tbody>
    </table>

    <br>
    <div class="btn-group">
      <button onclick="simpanNilaiUjian()">💾 Simpan Nilai</button>
      <button onclick="goBack()" style="background:#777">⬅️ Kembali</button>
    </div>
  </div>
</main>

window.showSection = function(id){
  document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
window.goBack = function(){
  document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
  document.getElementById('dashboard').classList.remove('hidden');
}
window.logout = function(){
  localStorage.removeItem('cahayaCurrentUser');
  window.location.href = '../index.html';
}
</script>
</body>
</html>
