<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Input Setoran Santri</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --accent-gold: #d4af37;
      --accent-gold-light: #fef08a;
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(212, 175, 55, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1), transparent 40%),
        linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Background Texture */
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23d4af37' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
      pointer-events: none; z-index: -1;
    }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(20px) saturate(150%);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent-gold); letter-spacing: 1px; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn-header {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.3s; font-family: 'Poppins';
    }
    .btn-header:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); color: var(--accent-gold-light);}

    main { max-width: 700px; margin: 40px auto; padding: 0 20px 80px; animation: fadeInUp 0.8s ease backwards; }
    @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* CARD STYLES */
    .card {
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 40px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7);
      margin-bottom: 40px; position: relative;
    }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--accent-gold-light); margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; text-align: center;}

    /* FORM GROUPS */
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    
    select, input[type="date"], input[type="text"], input[type="number"], textarea {
      width: 100%; padding: 14px 20px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4);
      color: white; font-family: inherit; font-size: 1rem;
      transition: all 0.3s; outline: none;
    }
    select:focus, input[type="date"]:focus, input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
      border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); background: rgba(0,0,0,0.6);
    }
    select option { background: var(--primary-blue); color: white; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    textarea { resize: vertical; min-height: 80px; }

    /* INPUT KHUSUS PREDIKAT */
    .input-predikat { font-weight: 700 !important; text-align: center; letter-spacing: 1px; transition: 0.3s; font-size: 1.2rem; }
    .pred-mumtaz { color: #34d399 !important; border-color: rgba(16,185,129,0.4) !important; background: rgba(16,185,129,0.1) !important; }
    .pred-jayyid { color: #38bdf8 !important; border-color: rgba(14,165,233,0.4) !important; background: rgba(14,165,233,0.1) !important; }
    .pred-maqbul { color: #fbbf24 !important; border-color: rgba(245,158,11,0.4) !important; background: rgba(245,158,11,0.1) !important; }
    .pred-bimbingan { color: #f87171 !important; border-color: rgba(239,68,68,0.4) !important; background: rgba(239,68,68,0.1) !important; }

    /* GRID UNTUK BARIS INPUT */
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    /* SECTION INPUT INDIVIDU */
    #sectionInputData { 
      display: none; 
      margin-top: 30px; 
      padding-top: 30px; 
      border-top: 1px dashed rgba(255,255,255,0.2); 
      animation: fadeInUp 0.5s ease;
    }

    /* SAVE BUTTON */
    .btn-save {
      width: 100%; padding: 18px; border-radius: 16px; border: none;
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
      color: var(--primary-dark); font-family: 'Playfair Display', serif; font-size: 1.1rem;
      font-weight: 700; letter-spacing: 1px; cursor: pointer; margin-top: 30px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); transition: all 0.3s;
    }
    .btn-save:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5); filter: brightness(1.1); }

    @media (max-width: 768px) {
      .card { padding: 25px 20px; }
      .input-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header>
  <h1>Al-Qur'an Center</h1>
  <div class="btn-group">
    <button class="btn-header" onclick="goBack()">⬅️ Beranda</button>
    <button class="btn-header" onclick="logout()">Keluar</button>
  </div>
</header>

<main>
  <div class="card">
    <h2 class="card-title">📖 Input Setoran Individu</h2>

    <div class="form-group">
      <label>📅 Tanggal Setoran</label>
      <input type="date" id="tfzTanggal">
    </div>

    <div class="input-row">
      <div class="form-group">
        <label>📚 Program</label>
        <select id="tfzProgram" onchange="updateKelompok()">
          <option value="">-- Pilih Program --</option>
          <option value="Tahsin">Tahsin</option>
          <option value="Tahfiz">Tahfiz</option>
        </select>
      </div>
      <div class="form-group">
        <label>👥 Halaqah</label>
        <select id="tfzKelompok" onchange="updateSantri()">
          <option value="">-- Menunggu Program --</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>👤 Nama Santri</label>
      <select id="tfzNamaSantri" onchange="siapkanForm()">
        <option value="">-- Pilih Halaqah Dulu --</option>
      </select>
    </div>

    <div id="sectionInputData">
      <div class="form-group">
        <label>📖 Surat & Ayat yang Disetorkan</label>
        <input type="text" id="inputSurat" placeholder="Cth: Al-Baqarah ayat 1-10">
      </div>
      
      <div class="input-row">
        <div class="form-group">
          <label>🔢 Jumlah Ayat</label>
          <input type="number" id="inputJumlahAyat" min="1" placeholder="Cth: 10">
        </div>
        <div class="form-group">
          <label>❌ Jumlah Kesalahan Lahn Jali</label>
          <input type="number" id="inputKesalahan" min="0" placeholder="0" oninput="hitungPredikat()">
        </div>
      </div>

      <div class="form-group">
        <label>🏆 Predikat Penilaian</label>
        <input type="text" id="inputPredikat" class="input-predikat" readonly placeholder="Otomatis terisi...">
      </div>

      <div class="form-group">
        <label>📝 Catatan / Tajwid (Opsional)</label>
        <textarea id="inputCatatan" placeholder="Tuliskan catatan perbaikan makhraj atau tajwid di sini..."></textarea>
      </div>

      <button class="btn-save" id="btnSimpanSetoran" onclick="simpanSetoranPerAnak()">💾 SIMPAN DATA SANTRI INI</button>
    </div>

  </div>
</main>

<script src="dataSantri.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const user = JSON.parse(localStorage.getItem('cahayaCurrentUser') || 'null');

  window.init = function() {
    if (!user || user.role !== 'guru') {
      alert('Sesi habis. Silakan login sebagai Guru.');
      window.location.href = '../index.html';
      return;
    }
    document.getElementById('tfzTanggal').value = new Date().toISOString().split('T')[0];
  };

  // 1. Mengisi Dropdown Halaqah berdasarkan Program
  window.updateKelompok = function() {
    const program = document.getElementById('tfzProgram').value;
    const kelompokSelect = document.getElementById('tfzKelompok');
    const namaSelect = document.getElementById('tfzNamaSantri');
    const sectionForm = document.getElementById('sectionInputData');

    kelompokSelect.innerHTML = '<option value="">-- Pilih Kelompok --</option>';
    namaSelect.innerHTML = '<option value="">-- Pilih Halaqah Dulu --</option>';
    sectionForm.style.display = 'none'; // Sembunyikan form

    if (!program) return;
    if (typeof dataSantri === 'undefined') { alert("Data Santri tidak ditemukan!"); return; }
    
    // Sesuai dengan dataSantri.js yang baru, namanya "Halqah Quraniyah"
    const kategori = dataSantri["Halqah Quraniyah"];
    if (!kategori) return;

    const kelompokList = Object.keys(kategori)
      .filter(k => k.startsWith(program + ' '))
      .map(k => k.replace(program + ' ', ''));

    if (kelompokList.length === 0) {
      kelompokSelect.innerHTML = '<option value="">(Kosong) Tidak ada data</option>';
      return;
    }

    kelompokList.forEach(k => {
      const opt = document.createElement('option');
      opt.textContent = k;
      kelompokSelect.appendChild(opt);
    });
  };

  // 2. Mengisi Dropdown Nama Santri berdasarkan Halaqah yang dipilih
  window.updateSantri = function() {
    const program = document.getElementById('tfzProgram').value;
    const kelompok = document.getElementById('tfzKelompok').value;
    const namaSelect = document.getElementById('tfzNamaSantri');
    const sectionForm = document.getElementById('sectionInputData');
    
    namaSelect.innerHTML = '<option value="">-- Pilih Santri --</option>';
    sectionForm.style.display = 'none';

    if (!program || !kelompok) return;

    const kategori = dataSantri["Halqah Quraniyah"];
    const key = `${program} ${kelompok}`;
    const list = kategori[key] || [];

    if (list.length === 0) {
      namaSelect.innerHTML = '<option value="">(Kosong) Tidak ada santri</option>';
      return;
    }

    list.forEach(nama => {
      const opt = document.createElement('option');
      opt.value = nama;
      opt.textContent = nama;
      namaSelect.appendChild(opt);
    });
  };

  // 3. Menampilkan Form Input ketika nama santri dipilih
  window.siapkanForm = function() {
    const nama = document.getElementById('tfzNamaSantri').value;
    const sectionForm = document.getElementById('sectionInputData');
    
    if (nama) {
        sectionForm.style.display = 'block';
        // Reset isi form
        document.getElementById('inputSurat').value = '';
        document.getElementById('inputJumlahAyat').value = '';
        document.getElementById('inputKesalahan').value = '';
        document.getElementById('inputPredikat').value = '';
        document.getElementById('inputPredikat').className = 'input-predikat';
        document.getElementById('inputCatatan').value = '';
    } else {
        sectionForm.style.display = 'none';
    }
  };

  // 4. Logika Hitung Predikat Otomatis
  window.hitungPredikat = function() {
    const inputKesalahan = document.getElementById('inputKesalahan');
    const nilaiInput = document.getElementById('inputPredikat');
    let salah = parseInt(inputKesalahan.value, 10);
    
    if (isNaN(salah) || salah < 0) {
        salah = 0;
        inputKesalahan.value = ""; 
        nilaiInput.value = "";
        nilaiInput.className = "input-predikat"; 
        return;
    }

    nilaiInput.className = "input-predikat";

    let predikat = '';
    if (salah === 0) {
        predikat = 'MUMTAZ';
        nilaiInput.classList.add('pred-mumtaz');
    } else if (salah >= 1 && salah <= 2) {
        predikat = 'JAYYID JIDDAN';
        nilaiInput.classList.add('pred-jayyid');
    } else if (salah >= 3 && salah <= 4) {
        predikat = 'JAYYID';
        nilaiInput.classList.add('pred-jayyid');
    } else if (salah >= 5 && salah <= 6) {
        predikat = 'MAQBUL';
        nilaiInput.classList.add('pred-maqbul');
    } else {
        predikat = 'BIMBINGAN';
        nilaiInput.classList.add('pred-bimbingan');
    }

    nilaiInput.value = predikat;
  };

  // 5. Menyimpan Data ke Firebase
  window.simpanSetoranPerAnak = function() {
    const tanggal = document.getElementById('tfzTanggal').value;
    const program = document.getElementById('tfzProgram').value;
    const kelompok = document.getElementById('tfzKelompok').value;
    const nama = document.getElementById('tfzNamaSantri').value;
    
    const surat = document.getElementById('inputSurat').value.trim();
    const ayat = document.getElementById('inputJumlahAyat').value;
    const kesalahan = document.getElementById('inputKesalahan').value;
    const predikat = document.getElementById('inputPredikat').value;
    const catatan = document.getElementById('inputCatatan').value.trim();

    if (!tanggal || !program || !kelompok || !nama) {
      alert('⚠️ Identitas santri belum lengkap.');
      return;
    }

    if (!surat || !ayat || predikat === "") {
      alert('⚠️ Mohon isi Surat, Jumlah Ayat, dan Kesalahan terlebih dahulu.');
      return;
    }

    const btn = document.getElementById('btnSimpanSetoran');
    btn.innerHTML = "⏳ MENYIMPAN..."; btn.disabled = true;

    // Membungkus data individu ke dalam array agar format database tetap seragam
    const log = {
      tanggal, program, kelompok, guru: user.username,
      data: [{ nama, setoran: surat, ayat, kesalahan, nilai: predikat, keterangan: catatan }],
      waktuSimpan: new Date().toISOString()
    };

    const setoranRef = ref(db, 'cahaya_app/setoran_tahfiz');
    push(setoranRef, log)
      .then(() => {
        alert(`✅ BERHASIL!\nData setoran atas nama ${nama} telah tersimpan.`);
        btn.innerHTML = "💾 SIMPAN DATA SANTRI INI"; btn.disabled = false;
        
        // Kosongkan nama santri agar form tertutup dan siap untuk santri berikutnya
        document.getElementById('tfzNamaSantri').value = "";
        siapkanForm();
      })
      .catch(err => {
        console.error(err);
        alert('❌ Terjadi kesalahan: ' + err.message);
        btn.innerHTML = "💾 SIMPAN DATA SANTRI INI"; btn.disabled = false;
      });
  };

  window.goBack = function() { window.location.href = 'fitur.html'; };
  window.logout = function() { localStorage.removeItem('cahayaCurrentUser'); window.location.href = '../index.html'; };
  
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
