<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Input Setoran Tahfiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --accent-gold: #d4af37;
      --accent-gold-light: #fef08a;
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(212, 175, 55, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1), transparent 40%),
        linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Background Texture */
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23d4af37' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
      pointer-events: none; z-index: -1;
    }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(20px) saturate(150%);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent-gold); letter-spacing: 1px; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn-header {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.3s; font-family: 'Poppins';
    }
    .btn-header:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); color: var(--accent-gold-light);}

    main { max-width: 1100px; margin: 40px auto; padding: 0 20px 80px; animation: fadeInUp 0.8s ease backwards; }
    @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* CARD STYLES */
    .card {
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 40px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7);
      margin-bottom: 40px; position: relative;
    }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--text-main); margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}

    /* FILTERS GRID */
    .filters {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-bottom: 30px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    
    select, input[type="date"] {
      width: 100%; padding: 14px 20px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4);
      color: white; font-family: inherit; font-size: 1rem;
      transition: all 0.3s; outline: none;
    }
    select:focus, input[type="date"]:focus {
      border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); background: rgba(0,0,0,0.6);
    }
    select option { background: var(--primary-blue); color: white; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    /* TABLE LAYOUT */
    .table-wrapper { width: 100%; overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; min-width: 800px; }
    thead th { color: var(--text-muted); font-weight: 500; font-size: 0.85rem; text-align: center; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    thead th:nth-child(2) { text-align: left; }

    tbody tr { background: rgba(255,255,255,0.03); border-radius: 12px; transition: all 0.3s ease; }
    tbody td { padding: 10px; text-align: center; border-top: 1px solid transparent; border-bottom: 1px solid transparent; }
    tbody td:first-child { border-radius: 12px 0 0 12px; border-left: 1px solid transparent; }
    tbody td:nth-child(2) { text-align: left; font-weight: 500; letter-spacing: 0.5px; color: var(--text-main); }
    tbody td:last-child { border-radius: 0 12px 12px 0; border-right: 1px solid transparent; }
    tr:hover td { background: rgba(255,255,255,0.06); }

    /* INPUT DALAM TABEL */
    td input[type="text"], td input[type="number"] {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3); color: white; font-family: inherit; outline: none; transition: 0.3s;
    }
    td input[type="text"]:focus, td input[type="number"]:focus { border-color: var(--accent-gold); background: rgba(0,0,0,0.6); }
    
    td input[type="number"] { text-align: center; font-weight: bold; color: var(--accent-gold-light); }
    
    /* Input Readonly (Otomatis Predikat) */
    .input-predikat { font-weight: 700 !important; text-align: center; letter-spacing: 1px; transition: 0.3s; }
    .pred-mumtaz { color: #34d399 !important; border-color: rgba(16,185,129,0.4) !important; background: rgba(16,185,129,0.1) !important; }
    .pred-jayyid { color: #38bdf8 !important; border-color: rgba(14,165,233,0.4) !important; background: rgba(14,165,233,0.1) !important; }
    .pred-maqbul { color: #fbbf24 !important; border-color: rgba(245,158,11,0.4) !important; background: rgba(245,158,11,0.1) !important; }
    .pred-bimbingan { color: #f87171 !important; border-color: rgba(239,68,68,0.4) !important; background: rgba(239,68,68,0.1) !important; }

    /* SAVE BUTTON */
    .btn-save {
      width: 100%; padding: 18px; border-radius: 16px; border: none;
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
      color: var(--primary-dark); font-family: 'Playfair Display', serif; font-size: 1.1rem;
      font-weight: 700; letter-spacing: 1px; cursor: pointer; margin-top: 30px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); transition: all 0.3s;
    }
    .btn-save:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5); filter: brightness(1.1); }

    @media (max-width: 768px) {
      .card { padding: 25px 20px; }
      .filters { grid-template-columns: 1fr; gap: 15px; }
      .table-wrapper { border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    }
  </style>
</head>

<body>

<header>
  <h1>Al-Qur'an Center</h1>
  <div class="btn-group">
    <button class="btn-header" onclick="goBack()">⬅️ Beranda</button>
    <button class="btn-header" onclick="logout()">Keluar</button>
  </div>
</header>

<main>
  <div class="card">
    <h2 class="card-title">📖 Log Setoran Tahfiz & Tahsin</h2>

    <div class="filters">
      <div class="filter-item">
        <label>📅 Tanggal Setoran</label>
        <input type="date" id="tfzTanggal">
      </div>
      <div class="filter-item">
        <label>📚 Program</label>
        <select id="tfzProgram" onchange="updateKelompok()">
          <option value="">-- Pilih Program --</option>
          <option value="Tahsin">Tahsin</option>
          <option value="Tahfiz">Tahfiz</option>
        </select>
      </div>
      <div class="filter-item">
        <label>👥 Kelompok (Halaqah)</label>
        <select id="tfzKelompok" onchange="tampilkanSantri()">
          <option value="">-- Menunggu Program --</option>
        </select>
      </div>
    </div>

    <h3 style="margin-top: 40px; font-family:'Playfair Display'; color:var(--accent-gold-light);">Daftar Santri Halaqah</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th width="5%">No</th>
            <th width="20%">Nama Lengkap</th>
            <th width="20%">Surat & Ayat (Setoran)</th>
            <th width="10%">Jml Ayat</th>
            <th width="10%">Kesalahan</th>
            <th width="15%">Predikat (Auto)</th>
            <th width="20%">Catatan / Tajwid</th>
          </tr>
        </thead>
        <tbody id="tfzBody">
          <tr>
            <td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px;font-style:italic;">
              Pilih program & kelompok halaqah untuk menampilkan daftar santri.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <button class="btn-save" onclick="simpanSetoran()">💾 SIMPAN DATA SETORAN</button>
  </div>
</main>

<script src="dataSantri.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const user = JSON.parse(localStorage.getItem('cahayaCurrentUser') || 'null');

  window.init = function() {
    if (!user || user.role !== 'guru') {
      alert('Sesi habis. Silakan login sebagai Guru.');
      window.location.href = '../index.html';
      return;
    }
    document.getElementById('tfzTanggal').value = new Date().toISOString().split('T')[0];
  };

  window.updateKelompok = function() {
    const program = document.getElementById('tfzProgram').value;
    const kelompokSelect = document.getElementById('tfzKelompok');
    const tbody = document.getElementById('tfzBody');
    kelompokSelect.innerHTML = '<option value="">-- Pilih Kelompok --</option>';
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);font-style:italic;">Silakan pilih kelompok halaqah.</td></tr>';

    if (!program) return;
    if (typeof dataSantri === 'undefined') { alert("Data Santri tidak ditemukan!"); return; }
    const kategori = dataSantri["Tahsin & Tahfiz Al-Qur'an"];
    if (!kategori) return;

    const kelompokList = Object.keys(kategori)
      .filter(k => k.startsWith(program + ' '))
      .map(k => k.replace(program + ' ', ''));

    if (kelompokList.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = '(Kosong) Tidak ada data';
      kelompokSelect.appendChild(opt);
      return;
    }

    kelompokList.forEach(k => {
      const opt = document.createElement('option');
      opt.textContent = k;
      kelompokSelect.appendChild(opt);
    });
  };

  window.tampilkanSantri = function() {
    const program = document.getElementById('tfzProgram').value;
    const kelompok = document.getElementById('tfzKelompok').value;
    const kategori = dataSantri["Tahsin & Tahfiz Al-Qur'an"];
    const key = `${program} ${kelompok}`;
    const list = kategori[key] || [];
    const tbody = document.getElementById('tfzBody');
    tbody.innerHTML = '';

    if (!program || !kelompok) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);font-style:italic;">Lengkapi program & kelompok.</td></tr>';
      return;
    }

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#f87171;padding:20px;">Tidak ada data santri di kelompok ini.</td></tr>`;
      return;
    }

    list.forEach((nama, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td style="text-align:left; font-weight:500;">${nama}</td>
        <td><input type="text" placeholder="Cth: Al-Baqarah 1-10" /></td>
        <td><input type="number" min="1" max="300" placeholder="0" /></td>
        <td><input type="number" min="0" placeholder="0" oninput="hitungNilai(this)" /></td>
        <td><input type="text" class="input-predikat" readonly placeholder="-" /></td>
        <td><input type="text" placeholder="Lancar / Perbaiki Mad..." /></td>
      `;
      tbody.appendChild(tr);
    });
  };

  // === LOGIKA NILAI OTOMATIS + WARNA DINAMIS ===
  window.hitungNilai = function(inputKesalahan) {
    const row = inputKesalahan.closest('tr');
    const nilaiInput = row.cells[5].querySelector('input');
    let salah = parseInt(inputKesalahan.value, 10);
    
    // Validasi input negatif
    if (isNaN(salah) || salah < 0) {
        salah = 0;
        inputKesalahan.value = ""; 
        nilaiInput.value = "";
        nilaiInput.className = "input-predikat"; // Reset class
        return;
    }

    // Reset Class
    nilaiInput.className = "input-predikat";

    let predikat = '';
    if (salah === 0) {
        predikat = 'MUMTAZ';
        nilaiInput.classList.add('pred-mumtaz');
    } else if (salah >= 1 && salah <= 2) {
        predikat = 'JAYYID JIDDAN';
        nilaiInput.classList.add('pred-jayyid');
    } else if (salah >= 3 && salah <= 4) {
        predikat = 'JAYYID';
        nilaiInput.classList.add('pred-jayyid');
    } else if (salah >= 5 && salah <= 6) {
        predikat = 'MAQBUL';
        nilaiInput.classList.add('pred-maqbul');
    } else {
        predikat = 'BIMBINGAN';
        nilaiInput.classList.add('pred-bimbingan');
    }

    nilaiInput.value = predikat;
  };

  window.simpanSetoran = function() {
    const tanggal = document.getElementById('tfzTanggal').value;
    const program = document.getElementById('tfzProgram').value;
    const kelompok = document.getElementById('tfzKelompok').value;

    if (!tanggal || !program || !kelompok) {
      alert('⚠️ Lengkapi Tanggal, Program, dan Kelompok terlebih dahulu.');
      return;
    }

    const rows = document.querySelectorAll('#tfzBody tr');
    const data = [];

    rows.forEach(row => {
      if(row.cells.length < 7) return; // Skip baris info kosong
      
      const nama = row.cells[1].innerText;
      const setoran = row.cells[2].querySelector('input').value.trim();
      const ayat = row.cells[3].querySelector('input').value;
      const kesalahan = row.cells[4].querySelector('input').value;
      const nilai = row.cells[5].querySelector('input').value.trim();
      const keterangan = row.cells[6].querySelector('input').value.trim(); 

      if (setoran !== '') {
        data.push({ nama, setoran, ayat, kesalahan, nilai, keterangan });
      }
    });

    if (data.length === 0) {
      alert('⚠️ Belum ada data Surat/Ayat yang diisi untuk disimpan.');
      return;
    }

    const btn = document.querySelector('.btn-save');
    btn.innerHTML = "⏳ MENYIMPAN..."; btn.disabled = true;

    const log = {
      tanggal, program, kelompok, guru: user.username, data,
      waktuSimpan: new Date().toISOString()
    };

    const setoranRef = ref(db, 'cahaya_app/setoran_tahfiz');
    push(setoranRef, log)
      .then(() => {
        alert('✅ BERHASIL!\nData setoran Al-Qur\'an telah tersimpan di sistem.');
        btn.innerHTML = "💾 SIMPAN DATA SETORAN"; btn.disabled = false;
        // Opsional: Kosongkan form setelah simpan
        // tampilkanSantri(); 
      })
      .catch(err => {
        console.error(err);
        alert('❌ Terjadi kesalahan: ' + err.message);
        btn.innerHTML = "💾 SIMPAN DATA SETORAN"; btn.disabled = false;
      });
  };

  window.goBack = function() { window.location.href = 'fitur.html'; };
  window.logout = function() { localStorage.removeItem('cahayaCurrentUser'); window.location.href = '../index.html'; };
  
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
