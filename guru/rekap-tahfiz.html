<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CAHAYA APP - Rekap Setoran Tahfiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-dark: #020617;
            --primary-blue: #0f172a;
            --accent-gold: #d4af37;
            --accent-gold-light: #fef08a;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(212, 175, 55, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
            color: var(--text-main);
            padding-bottom: 30px;
        }

        header {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        
        header h1 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--accent-gold); margin: 0;}
        
        .btn-header {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main); padding: 5px 12px; border-radius: 50px;
            cursor: pointer; font-family: 'Poppins'; font-size: 0.85rem;
        }

        main { max-width: 1200px; margin: 15px auto; padding: 0 10px; }

        .card {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 15px;
            padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .card-title {
            font-family: 'Playfair Display', serif; font-size: 1.1rem; 
            color: var(--accent-gold-light); margin-bottom: 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
            text-align: center;
        }

        .filter-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px;
        }

        label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; font-weight: 600;}
        
        select, input[type="date"] {
            width: 100%; padding: 8px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4);
            color: white; font-family: inherit; font-size: 0.9rem; outline: none;
        }
        select:focus, input[type="date"]:focus { border-color: var(--accent-gold); }
        select option { background: var(--primary-blue); }

        .summary-box {
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(255,255,255,0.05); border-radius: 10px;
            padding: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);
        }
        .summary-item { text-align: center; }
        
        .summary-val-container {
            display: flex; align-items: baseline; justify-content: center; gap: 4px; margin-bottom: 2px;
        }
        
        .summary-val { font-size: 1.2rem; font-weight: bold; line-height: 1; }
        .summary-percent { font-size: 0.75rem; font-weight: 600; opacity: 0.8; }
        
        .val-total { color: #60a5fa; }
        .val-sudah { color: var(--success); }
        .val-belum { color: var(--danger); }
        .summary-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}

        .santri-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }
        
        .santri-card {
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 80px;
        }
        
        .santri-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .card-sudah::before { background-color: var(--success); }
        .card-sudah { background: linear-gradient(to bottom, rgba(16, 185, 129, 0.05), rgba(0,0,0,0.3)); border-color: rgba(16, 185, 129, 0.2); }
        .card-belum::before { background-color: var(--danger); }
        .card-belum { background: linear-gradient(to bottom, rgba(239, 68, 68, 0.05), rgba(0,0,0,0.3)); border-color: rgba(239, 68, 68, 0.2); opacity: 0.7; }

        .santri-number { position: absolute; top: 6px; left: 6px; font-size: 0.6rem; color: var(--text-muted); font-weight: bold; }
        .santri-name { font-weight: 600; font-size: 0.85rem; line-height: 1.2; margin-top: 5px; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .santri-detail { font-size: 0.65rem; color: var(--accent-gold-light); line-height: 1.1; }
        .badge-status { display: inline-block; margin-top: auto; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; letter-spacing: 0.5px; }
        .text-sudah { color: var(--success); }
        .text-belum { color: var(--danger); }

        .loading-text { text-align: center; color: var(--accent-gold); font-size: 0.9rem; margin: 20px 0;}
        
        .chart-container { position: relative; height: 250px; width: 100%; }

        @media (max-width: 400px) {
            .santri-grid { grid-template-columns: repeat(2, 1fr); } 
            .santri-name { font-size: 0.75rem; }
            .chart-container { height: 200px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Rekap Tahfiz</h1>
    <button class="btn-header" onclick="window.history.back()">⬅️ Kembali</button>
</header>

<main>
    <div class="card">
        <div class="filter-row">
            <div>
                <label>Tanggal</label>
                <input type="date" id="filterTanggal" onchange="tarikDataFirebase()">
            </div>
            <div>
                <label>Program</label>
                <select id="filterProgram" onchange="updateDropdownKelompok(); tarikDataFirebase()">
                    <option value="Tahfiz">Tahfiz</option>
                    <option value="Tahsin">Tahsin</option>
                </select>
            </div>
            <div>
                <label>Halaqah</label>
                <select id="filterKelompok" onchange="tarikDataFirebase()">
                    </select>
            </div>
        </div>

        <div class="summary-box">
            <div class="summary-item">
                <div class="summary-val-container">
                    <span class="summary-val val-total" id="txtTotal">0</span>
                </div>
                <div class="summary-label">Total</div>
            </div>
            <div class="summary-item">
                <div class="summary-val-container">
                    <span class="summary-val val-sudah" id="txtSudah">0</span>
                    <span class="summary-percent val-sudah" id="pctSudah">(0%)</span>
                </div>
                <div class="summary-label">Sudah</div>
            </div>
            <div class="summary-item">
                <div class="summary-val-container">
                    <span class="summary-val val-belum" id="txtBelum">0</span>
                    <span class="summary-percent val-belum" id="pctBelum">(0%)</span>
                </div>
                <div class="summary-label">Belum</div>
            </div>
        </div>

        <div id="loadingIndicator" class="loading-text">Menarik data dari server... ⏳</div>

        <div class="santri-grid" id="gridSantri">
            </div>
    </div>

    <div class="card" id="cardGrafik" style="display: none;">
        <h2 class="card-title">📈 Progres Setoran (7 Hari Terakhir)</h2>
        <div class="chart-container">
            <canvas id="trendChart"></canvas>
        </div>
    </div>
</main>

<script src="dataSantri.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
        authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
        databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
        projectId: "absensi-santri-fajrul-islam",
        storageBucket: "absensi-santri-fajrul-islam.appspot.com",
        messagingSenderId: "739928369926",
        appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // Variabel global untuk menyimpan instance grafik agar bisa di-update
    let chartInstance = null;

    window.onload = () => {
        document.getElementById('filterTanggal').value = new Date().toISOString().split('T')[0];
        updateDropdownKelompok();
        tarikDataFirebase(); 
    };

    window.updateDropdownKelompok = function() {
        const program = document.getElementById('filterProgram').value;
        const kelompokSelect = document.getElementById('filterKelompok');
        kelompokSelect.innerHTML = '';

        if (typeof dataSantri === 'undefined' || !dataSantri["Halqah Quraniyah"]) return;

        const kelompokList = Object.keys(dataSantri["Halqah Quraniyah"])
            .filter(k => k.startsWith(program + ' '))
            .map(k => k.replace(program + ' ', ''));

        if(kelompokList.length === 0){
             kelompokSelect.innerHTML = '<option value="">Kosong</option>';
             return;
        }

        kelompokList.forEach(k => {
            const opt = document.createElement('option');
            opt.value = k;
            opt.textContent = k;
            kelompokSelect.appendChild(opt);
        });
        
        if(kelompokSelect.options.length > 0) {
            kelompokSelect.selectedIndex = 0;
        }
    };

    document.getElementById('filterProgram').addEventListener('change', () => {
        updateDropdownKelompok();
        tarikDataFirebase();
    });

    window.tarikDataFirebase = async function() {
        const tanggalPilih = document.getElementById('filterTanggal').value;
        const programPilih = document.getElementById('filterProgram').value;
        const kelompokPilih = document.getElementById('filterKelompok').value;
        const keyDataSantri = `${programPilih} ${kelompokPilih}`;

        if (!tanggalPilih || !kelompokPilih) return;

        const gridContainer = document.getElementById('gridSantri');
        const loading = document.getElementById('loadingIndicator');
        const cardGrafik = document.getElementById('cardGrafik');
        
        gridContainer.innerHTML = '';
        loading.style.display = 'block';
        cardGrafik.style.display = 'none'; // Sembunyikan grafik saat loading

        const daftarSantriMaster = dataSantri["Halqah Quraniyah"][keyDataSantri] || [];
        const totalSantri = daftarSantriMaster.length;
        
        // Objek untuk menampung status HARI INI
        let rekapStatus = {};
        daftarSantriMaster.forEach(nama => {
            rekapStatus[nama] = { status: 'Belum', surat: '', predikat: '' };
        });

        // Objek untuk menampung data TREN (Banyak Hari)
        // Format: { '2026-02-20': Set(nama1, nama2), '2026-02-21': Set(...) }
        let dataTrenHarian = {};

        const setoranRef = ref(db, 'cahaya_app/setoran_tahfiz');
        try {
            const snapshot = await get(setoranRef);
            
            if (snapshot.exists()) {
                const dataServer = snapshot.val();
                
                for (let key in dataServer) {
                    const record = dataServer[key];
                    
                    // Filter berdasarkan Program dan Kelompok saja (Tanpa filter tanggal)
                    if (record.program === programPilih && record.kelompok === kelompokPilih) {
                        
                        // Siapkan Set() untuk tanggal tersebut jika belum ada
                        if (!dataTrenHarian[record.tanggal]) {
                            dataTrenHarian[record.tanggal] = new Set();
                        }

                        if (record.data && Array.isArray(record.data)) {
                            record.data.forEach(item => {
                                // 1. Masukkan ke data HARI INI (Jika tanggalnya cocok)
                                if (record.tanggal === tanggalPilih && rekapStatus[item.nama]) {
                                    rekapStatus[item.nama].status = 'Sudah';
                                    rekapStatus[item.nama].surat = item.setoran;
                                    rekapStatus[item.nama].predikat = item.nilai;
                                }
                                
                                // 2. Masukkan ke data TREN (Hitung santri unik per tanggal)
                                // Pastikan anak ini terdaftar di master agar datanya valid
                                if (daftarSantriMaster.includes(item.nama)) {
                                    dataTrenHarian[record.tanggal].add(item.nama);
                                }
                            });
                        }
                    }
                }
            }
            
            loading.style.display = 'none';
            cardGrafik.style.display = 'block'; // Tampilkan kembali grafik
            
            renderGrid(rekapStatus, daftarSantriMaster);
            renderGrafikTren(dataTrenHarian, totalSantri);

        } catch (error) {
            console.error("Error:", error);
            loading.innerHTML = "Gagal memuat data.";
        }
    };

    function renderGrid(rekapStatus, daftarSantriMaster) {
        const gridContainer = document.getElementById('gridSantri');
        let countSudah = 0;
        let countBelum = 0;
        const totalSantri = daftarSantriMaster.length;

        const santriSorted = [...daftarSantriMaster].sort((a, b) => {
            if (rekapStatus[a].status === 'Belum' && rekapStatus[b].status === 'Sudah') return -1;
            if (rekapStatus[a].status === 'Sudah' && rekapStatus[b].status === 'Belum') return 1;
            return 0; 
        });

        santriSorted.forEach((nama, i) => {
            const indexAsli = daftarSantriMaster.indexOf(nama) + 1;
            const dataAnak = rekapStatus[nama];
            const isSudah = dataAnak.status === 'Sudah';
            
            if (isSudah) countSudah++;
            else countBelum++;

            const namaPanggilan = nama.split(' ').slice(0, 2).join(' ');

            const div = document.createElement('div');
            div.className = `santri-card ${isSudah ? 'card-sudah' : 'card-belum'}`;
            
            let detailHtml = isSudah 
                ? `<div class="santri-detail">${dataAnak.surat}<br>🏆 ${dataAnak.predikat}</div>` 
                : `<div class="badge-status text-belum">BELUM SETOR</div>`;

            div.innerHTML = `
                <div class="santri-number">${indexAsli}</div>
                <div class="santri-name" title="${nama}">${namaPanggilan}</div>
                ${detailHtml}
            `;
            gridContainer.appendChild(div);
        });

        document.getElementById('txtTotal').textContent = totalSantri;
        document.getElementById('txtSudah').textContent = countSudah;
        document.getElementById('txtBelum').textContent = countBelum;

        if (totalSantri > 0) {
            const persenSudah = Math.round((countSudah / totalSantri) * 100);
            const persenBelum = Math.round((countBelum / totalSantri) * 100);
            document.getElementById('pctSudah').textContent = `(${persenSudah}%)`;
            document.getElementById('pctBelum').textContent = `(${persenBelum}%)`;
        }
    }

    // FUNGSI BARU: Merender Grafik Batang
    function renderGrafikTren(dataTrenHarian, totalSantri) {
        // Ambil semua tanggal yang ada datanya, urutkan dari terlama ke terbaru
        let tanggalTersedia = Object.keys(dataTrenHarian).sort();
        
        // Ambil maksimal 7 hari terakhir agar grafik tidak terlalu padat
        if (tanggalTersedia.length > 7) {
            tanggalTersedia = tanggalTersedia.slice(-7);
        }

        const labels = [];
        const dataJumlah = [];
        const dataPersen = [];

        tanggalTersedia.forEach(tgl => {
            // Ubah format '2026-02-25' jadi '25 Feb' untuk label
            const dateObj = new Date(tgl);
            const labelTgl = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
            
            const jumlahAnak = dataTrenHarian[tgl].size; // Berapa anak unik yang nyetor
            const persenAnak = totalSantri > 0 ? Math.round((jumlahAnak / totalSantri) * 100) : 0;

            labels.push(labelTgl);
            dataJumlah.push(jumlahAnak);
            dataPersen.push(persenAnak);
        });

        const ctx = document.getElementById('trendChart').getContext('2d');
        
        // Hancurkan grafik lama jika ada (agar tidak tertumpuk saat ganti halaqah)
        if (chartInstance) {
            chartInstance.destroy();
        }

        // Buat Grafik Baru
        chartInstance = new Chart(ctx, {
            type: 'bar', // Gunakan grafik batang (bar)
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Jumlah Santri Setoran',
                        data: dataJumlah,
                        backgroundColor: 'rgba(16, 185, 129, 0.6)', // Hijau Success
                        borderColor: '#10b981',
                        borderWidth: 2,
                        borderRadius: 6, // Ujung batang melengkung
                        order: 2 // Digambar di belakang
                    },
                    {
                        label: 'Target Kurva (%)',
                        data: dataJumlah, // Menggunakan titik data yang sama untuk tinggi kurva
                        type: 'line', // Kurva garis di atas batang
                        borderColor: '#d4af37', // Warna emas
                        backgroundColor: '#d4af37',
                        borderWidth: 2,
                        tension: 0.4, // Kurva melengkung halus
                        pointRadius: 4,
                        order: 1 // Digambar di depan
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }, // Sembunyikan legenda agar lebih luas
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleColor: '#d4af37',
                        callbacks: {
                            // Format isi tooltip saat batang diklik/disentuh
                            label: function(context) {
                                const index = context.dataIndex;
                                const jumlah = dataJumlah[index];
                                const persen = dataPersen[index];
                                return `✅ Setoran: ${jumlah} Santri (${persen}%)`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: totalSantri, // Tinggi maksimal grafik adalah total anak di halaqah
                        ticks: { color: '#94a3b8', stepSize: 5 },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }
                    },
                    x: {
                        ticks: { color: '#94a3b8' },
                        grid: { display: false }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
