  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #0f172a;
      --accent-gold: #b8860b;
      --bg-color: #f8fafc;
      --text-main: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 20px; }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      border-top: 4px solid var(--accent-gold);
    }

    h2 { text-align: center; color: var(--primary-dark); margin-bottom: 20px; }

    .form-group { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
    .form-group label { font-weight: 600; }
    .form-group select {
      padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;
      font-family: inherit; font-size: 1rem; outline: none; min-width: 250px;
    }
    .form-group select:focus { border-color: var(--accent-gold); }

    table {
      width: 100%; border-collapse: collapse; margin-top: 10px;
    }
    th, td {
      border: 1px solid #e2e8f0; padding: 12px; text-align: center;
    }
    th {
      background-color: var(--primary-dark); color: white; font-weight: 500; font-size: 0.9rem;
    }
    .th-reguler { background-color: #1e293b; }
    .th-cahaya { background-color: #b8860b; }
    
    .santri-name { text-align: left; font-weight: 600; }
    
    input[type="number"] {
      width: 80px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-family: inherit;
    }
    input[type="number"]:focus { outline: none; border-color: var(--accent-gold); }
    
    .juz-auto {
      font-weight: 700; color: var(--accent-gold); background: #fefce8; padding: 5px 10px; border-radius: 6px; display: inline-block; min-width: 60px;
    }

    .btn-save {
      display: block; width: 100%; margin-top: 25px; padding: 15px; background: var(--accent-gold);
      color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    .btn-save:hover { background: #9a7009; }

  </style>
</head>

</div>

  // Fungsi memuat tabel santri
  window.loadSantri = function() {
    const halqah = document.getElementById('halqah').value;
    const tbody = document.getElementById('bodyTahfiz');
    tbody.innerHTML = ''; 

    if (!halqah || !window.dataSantri["Halqah Quraniyah"][halqah]) {
      tbody.innerHTML = '<tr><td colspan="5" style="color: #64748b; font-style: italic;">Silakan pilih halqah terlebih dahulu.</td></tr>';
      return;
    }

    // Sortir nama santri sesuai abjad agar rapi
    const listSantri = [...window.dataSantri["Halqah Quraniyah"][halqah]].sort((a, b) => a.localeCompare(b));
    
    listSantri.forEach((nama, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td class="santri-name">${nama}</td>
        
        <td>
          <input type="number" min="0" placeholder="0" class="input-hal" oninput="hitungJuz(this)">
        </td>
        <td>
          <span class="juz-auto">0.00</span>
        </td>

        <td>
          <input type="number" min="0" placeholder="0" class="input-ayat">
        </td>
      `;
      tbody.appendChild(tr);
    });
  };

  // Fungsi otomatis hitung Juz
  window.hitungJuz = function(element) {
    const tr = element.closest('tr');
    const halaman = parseFloat(element.value) || 0;
    const juzText = tr.querySelector('.juz-auto');
    
    const hitung = halaman / 20;
    juzText.textContent = hitung.toFixed(2);
  };

  // Fungsi Simpan ke Firebase (Deduplikasi)
  window.simpanData = async function() {
    const halqah = document.getElementById('halqah').value;
    if(!halqah) {
      alert("Pilih halqah terlebih dahulu!");
      return;
    }

    const rows = document.querySelectorAll('#bodyTahfiz tr');
    if(rows.length === 0 || rows[0].cells.length === 1) return;

    const btnSimpan = document.getElementById('btnSimpan');
    btnSimpan.innerHTML = "⏳ Menyimpan Data...";
    btnSimpan.disabled = true;

    try {
      const syahadahRef = ref(db, 'cahaya_app/syahadah_tahfiz');
      const snapshot = await get(syahadahRef);
      const dataLama = snapshot.exists() ? snapshot.val() : {};

      let count = 0;
      let promises = [];

      rows.forEach(tr => {
        const nama = tr.querySelector('.santri-name').innerText;
        const hal = tr.querySelector('.input-hal').value;
        const juz = tr.querySelector('.juz-auto').innerText;
        const ayat = tr.querySelector('.input-ayat').value;

        // Hanya simpan jika ada isian (halaman ATAU ayat tidak kosong)
        if (hal !== "" || ayat !== "") {
          
          // 1. CEK DATA LAMA, JIKA ADA SANTRI YANG SAMA, HAPUS DULU (REPLACE)
          for (let key in dataLama) {
            if (dataLama[key].nama_santri === nama) {
               promises.push(remove(ref(db, `cahaya_app/syahadah_tahfiz/${key}`)));
            }
          }

          // 2. SIAPKAN DATA BARU
          const dataToSave = {
            nama_santri: nama,
            kategori_halqah: halqah,
            reguler_halaman: hal ? parseFloat(hal) : 0,
            reguler_juz: parseFloat(juz) || 0,
            cahaya_ayat: ayat ? parseFloat(ayat) : 0,
            timestamp: new Date().toISOString()
          };
          
          // Push simpan data baru
          promises.push(push(syahadahRef, dataToSave));
          count++;
        }
      });

      if (count > 0) {
        // TUNGGU SEMUA PROSES HAPUS DAN SIMPAN SELESAI
        await Promise.all(promises);
        
        alert(`✅ Alhamdulillah, ${count} data Syahadah untuk Halqah ${halqah} berhasil disimpan ke database!`);
        document.getElementById('halqah').value = "";
        window.loadSantri();
      } else {
        alert("⚠️ Belum ada nilai halaman atau ayat yang diisi.");
      }

    } catch (error) {
      alert("⚠️ Terjadi kesalahan saat menyimpan: " + error.message);
    } finally {
      btnSimpan.innerHTML = "💾 Simpan Syahadah";
      btnSimpan.disabled = false;
    }
  };
</script>
