<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP – Rapor Persentase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --bg-gradient: radial-gradient(circle at top left, #dbeafe, #eef2ff 40%, #f8fafc); }
    body { font-family: 'Poppins', sans-serif; background: var(--bg-gradient); color: #0f172a; margin: 0; padding: 0; }

    header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2); position: sticky; top: 0; z-index: 50; }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }

    main { padding: 20px; max-width: 800px; margin: 0 auto; padding-bottom: 80px; }

    /* INFO BAR TARGET */
    .target-box { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 1px solid #fcd34d; color: #92400e; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .target-label { font-size: 0.85rem; color: #b45309; }
    .target-number { font-weight: 800; font-size: 1.3rem; color: #b45309; }

    .usrah-section { background: white; border-radius: 16px; padding: 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .usrah-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 15px; }
    .usrah-title { font-size: 1.2rem; color: #1e40af; font-weight: 700; margin: 0; }

    .santri-card { padding: 15px; border-radius: 12px; margin-bottom: 12px; background: #f8fafc; border: 1px solid transparent; cursor: pointer; position: relative; transition: 0.2s; }
    .santri-card:hover { background: #eff6ff; border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.1); }
    
    .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .santri-name { font-weight: 600; color: #334155; font-size: 1rem; }
    .rank-badge { width: 24px; height: 24px; background: #cbd5e1; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; margin-right: 8px; }
    .rank-1 { background: #f59e0b; } .rank-2 { background: #64748b; } .rank-3 { background: #b45309; }
    
    .progress-container { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .progress-bar { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b; margin-top: 5px; }
    
    /* STYLE PREDIKAT BARU */
    .predikat { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; letter-spacing: 0.5px; }
    .p-mumtaz { background: #dcfce7; color: #166534; }
    .p-standar { background: #e0f2fe; color: #075985; } /* Biru Standar */
    .p-kurang { background: #fee2e2; color: #991b1b; } /* Merah Kurang */
    .p-netral { background: #f3f4f6; color: #6b7280; border: 1px solid #d1d5db; } /* Abu-abu (0/0) */

    .highlight-child { border: 2px solid #2563eb; background: #dbeafe; }

    /* MODAL STYLE */
    .modal { display: none; position: fixed; z-index: 100; inset: 0; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
    .modal-content { background: white; width: 95%; max-width: 500px; height: 80vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { flex: 1; overflow-y: auto; padding: 0; background: #fff; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #f1f5f9; }
    .h-poin.plus { color: #16a34a; } .h-poin.minus { color: #dc2626; }
    .modal-footer { padding: 15px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; gap: 10px; }
    .btn-action { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .btn-edit { background: var(--primary); color: white; }
    .btn-close { background: #e2e8f0; color: #475569; }
    #editForm { display: none; padding: 20px; background: #eff6ff; border-top: 1px solid #dbeafe; }
    #editForm input, #editForm select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>

<header>
  <h1>🏆 Rapor Dinamis</h1>
  <div><button onclick="goBack()">⬅️ Kembali</button></div>
</header>

<main id="mainContent">
  <div style="text-align:center; padding: 40px; color: #64748b;">Menganalisis data absensi...</div>
</main>

<div id="detailModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div><h3 id="dNama" style="margin:0">Nama</h3><span id="dPredikat" class="predikat p-mumtaz">PREDIKAT</span></div>
      <div id="dTotal" style="font-size:1.5rem;font-weight:800;color:var(--primary)">0%</div>
    </div>
    <div class="modal-body" id="historyList"></div>
    <div id="editForm">
      <h4 style="margin-top:0; color:#1e40af">🔧 Koreksi Poin</h4>
      <select id="manualType"><option value="bonus">➕ Tambah (Bonus)</option><option value="denda">➖ Kurang (Denda)</option></select>
      <input type="number" id="manualAmount" placeholder="Jumlah Poin">
      <input type="text" id="manualReason" placeholder="Keterangan">
      <div style="display:flex; gap:10px;"><button class="btn-action btn-edit" onclick="saveManualPoint()">Simpan</button><button class="btn-action btn-close" onclick="toggleEditForm()">Batal</button></div>
    </div>
    <div class="modal-footer">
      <button class="btn-action btn-close" onclick="closeModal()">Tutup</button>
      <button id="btnShowEdit" class="btn-action btn-edit" onclick="toggleEditForm()">⚙️ Edit Poin</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MASTER_SANTRI = {
    "Kamal": ["ADITYA PUTRA IBRAHIM","AIRLANGGA AZKA ABQORI","AQIELA MARSYAH","BRILLY HANDRIAN","DARREN ATHAYA","DZIKRI MUDHOFFAR","ELLENO QUTHBIE HERMAWAN","FADIL NURHALIM","GABRIEL AL FATIH","HADINATA SAPUTRA","MIKO VAJAR","M. ALMISKY PRATAMA","M. AQIL RIDHO","M. IZAM SAPUTRA","M. SYAKIR HUTABARAT","M. YASIR AL FAZAR JHIRA","M. ZIYAD ZHAZHA","RAFA","WAHYU REYDINATA","NIZAM KABISAT","JUANDA NUR ILHAM","M. DIRGATAMA","DAFFA AL MUSYARI","MOHAMMAD IKHSAN HAIRULI","REYFAS RAMADHAN","FALIZH DAFFA QATRUNNADA","HAFIDZ AL ROZI","CANZA RYANDA HUTASUHUT","NAJMIHADI SYAUQII TAMAAM","EZA FEBRI AL FADZRI"],
    "Favian": ["ABDULLAH MUKTI HAFIDZALLAH","AHMAD RIYADI","AKBAR PRAYOGA","ALIF MUHAMMAD YUSUF","ALVIN HERFIANTINO","ANDES AFENDRA","BASRI AL HAZIQ ZULFAHMI","AHMAD MAULANA","DANANG PRASDITYA SANTOSO","DEDI SETIADI","DIKKI KURNIAWAN","FAKHRI AL MUZAKKI","FEBRI GHALIH AL FAROBI","GHOZY FATURRAHMAN","ILHAM MUKMIN AL FARABI","M. AL FALAH","M. FAQIH HAFIDZALLAH","M. FIRAAS AL INSYIROH","MUHAMMAD ALLAM NUR HUSHAIN","M. RAID MAHRUS","M. RIJALUL KAMIL","NABIL NAJMI","RADEN AZAA PANCA PUTRA","RAFI RAMADHAN","SATRIO ABIMAYU","TEGAR HIDAYAT","VERY SYACH","WAFII FADHLURROHMAN","ZAHIR ZIBRAN","ZULFAKIH HAERUNNASIHIN"],
    "Shafwan": ["ANGGA PRATAMA PUTRA","KI AGUS MUHAMMAD ABDULLAH SHIDDIQ AGTSALI","MIKA RAHIEL YUSUF","PRAWIRO PUJO TUNGGAL JATI","M. XAVI NF","REYNALDI MALIK IBRAHIM ALFARIDZI","FAHRIE OKTAVIRANO FITRIS","FARAZH SAYYID PUTRA KENEGA","LUTHFAN ADZAKI","MARFEL SAPUTRA","MELDI NOVRIANSYAH","ALIF SAMUDRA","ARYA DIFA ALSYA","FAUZAN IBNI JABAR","HAFIDZ ALRIZKY","M. ABIL IRWANSYAH","M. FADHIL BUANA","M. FAISAL FIKRIANSYAH","NAUFAL AKBAR ALKHATIRI","QHEIZAN ALQIZA ARISDA","REZFY FAKHRYAZKA","SYAHRUL RAMADHAN","ROID AFDAL","ROHADIN FIRDAUS AL QAUSAR","RENAL MARTIN","RAKA SEPTIAN","NAFIS","M. USAMAH","MUHAMAD YUSUF ARROSIYD","MAHESA AULIA GIFFARI","M. ARYA MAHDI WAFI EL-FAUZANI","ILHAM","IHZA TRINANDI","HABIB RAMADHAN","FAHRY AKBAR RAMDHANI","CAHYIS ISZAM","ANUGRAH PRATAMA","AHMAD FARHAAN"],
    "Fatimah": ["QELZA RAMADHANI ATH THAHIRAH","ASHIFA FITRI RAMADHONI","ADIBA AILA KHANZA","AISYAH NUR KHALIFAH","NYAYU MARLITSA ARDHANI","WILDA","WINDY WINDARI","AISYAH NURUL AULIA","NESSYA RAMADHANY","AMIRAH BALQIS RAHADATUL A'ISYAH","EARLYTA ARSYFA SALSABILA","DAFIA NAFLA SYAKIRA","ANISYA SEPTIANI"],
    "Evita": ["BILQIS NUR ANISAH","JESSICA PUTRY AYRA","GHENIS ANDIENTIAZ","DINA RUHAYAH","PITRI RAMADANI","GRINNETA NALANI PUTRI","INAYAH NOURAH ANINDYA","SHELENA","FITRAH KIRANA"]
  };

  const TANGGAL_MULAI_HITUNG = "2024-05-01"; 

  let TARGET_DINAMIS = 0;
  let currentUser = null;
  let allStudentsData = {};
  let mapSantriUsrah = {};
  let selectedSantriName = null;

  // === RUMUS PREDIKAT (DISEDERHANAKAN) ===
  function getPredikat(persen, totalPoin) {
    // 1. Kondisi Netral (Belum ada data / Poin 0)
    if (TARGET_DINAMIS === 0 || (persen === 0 && totalPoin === 0)) {
       return { label: "MENUNGGU DATA", class: "p-netral", color: "#64748b", info: "Belum ada poin tercatat" };
    }

    // 2. Kondisi Mumtaz
    if (persen >= 90) {
       return { label: "MUMTAZ", class: "p-mumtaz", color: "#16a34a", info: "✅ Layak Dapat Bonus" };
    }

    // 3. Kondisi Lainnya (Jayyid, Maqbul, Rasib dijadikan satu pesan)
    let label = "JAYYID";
    let style = "p-standar";
    let color = "#2563eb";

    if (persen < 50) { label = "RASIB"; style = "p-kurang"; color = "#dc2626"; }
    else if (persen < 75) { label = "MAQBUL"; style = "p-standar"; color = "#ca8a04"; }

    return { label: label, class: style, color: color, info: "💪 Harus Lebih Disiplin Lagi untuk Dapat Bonus" };
  }

  document.addEventListener('DOMContentLoaded', async () => {
    currentUser = JSON.parse(localStorage.getItem('cahayaCurrentUser') || 'null');
    if (!currentUser) { window.location.href = 'index.html'; return; }

    for (const [namaKelompok, listSantri] of Object.entries(MASTER_SANTRI)) {
      listSantri.forEach(nama => { mapSantriUsrah[nama] = namaKelompok; });
    }

    await loadAllData();
  });

  async function loadAllData() {
    try {
      const refs = [
        get(ref(db, 'cahaya_app/absensi_program_harian')),
        get(ref(db, 'cahaya_app/absensi_pembelajaran')),
        get(ref(db, 'cahaya_app/poin_manual'))
      ];
      const snapshots = await Promise.all(refs);
      processData(snapshots[0].val() || {}, snapshots[1].val() || {}, snapshots[2].val() || {});
    } catch (error) {
      document.getElementById('mainContent').innerHTML = `<p style="color:red;text-align:center">${error.message}</p>`;
    }
  }

  function processData(ibadahLog, akademikLog, manualLog) {
    const students = {};
    const getStudent = (nama) => {
      let usrahResmi = mapSantriUsrah[nama];
      if (!usrahResmi) return null;
      if (!students[nama]) {
        students[nama] = { name: nama, totalMurni: 0, totalAkhir: 0, naqib: usrahResmi, history: [] };
      }
      return students[nama];
    };

    [ibadahLog, akademikLog].forEach(log => {
      Object.values(log).forEach(session => {
        if (session.tanggal < TANGGAL_MULAI_HITUNG) return;
        if (session.data) {
          session.data.forEach(s => {
            const entry = getStudent(s.nama);
            if (entry) {
              let p = parseInt(s.poin) || 0;
              entry.totalMurni += p; 
              entry.totalAkhir += p;
              entry.history.push({ 
                date: session.tanggal, 
                title: session.program || session.mapel, 
                status: s.status, 
                poin: p 
              });
            }
          });
        }
      });
    });

    let maxScore = 0;
    Object.values(students).forEach(s => {
      if (s.totalMurni > maxScore) maxScore = s.totalMurni;
    });
    TARGET_DINAMIS = maxScore;

    Object.values(manualLog).forEach(log => {
      const entry = getStudent(log.namaSantri);
      if (entry) {
        let p = parseInt(log.poin) || 0;
        entry.totalAkhir += p;
        entry.history.push({ date: log.waktu.split('T')[0], title: 'Manual/Admin', status: log.keterangan, poin: p });
      }
    });

    Object.values(students).forEach(s => {
      let pembagi = TARGET_DINAMIS > 0 ? TARGET_DINAMIS : 1; 
      let persen = Math.round((s.totalAkhir / pembagi) * 100);
      s.persen = persen;
      s.persenTampil = persen > 100 ? 100 : (persen < 0 ? 0 : persen);
      s.history.sort((a, b) => new Date(b.date) - new Date(a.date));
    });

    allStudentsData = students;
    renderUI(students);
  }

  function renderUI(studentsObj) {
    const main = document.getElementById('mainContent');
    
    // Tampilan Target Dinamis
    let targetText = `${TARGET_DINAMIS} Poin`;
    let targetSub = "Target Tertinggi (Benchmark)";
    if (TARGET_DINAMIS === 0) {
        targetText = "Menunggu Data";
        targetSub = "Belum ada absensi masuk";
    }

    main.innerHTML = `
      <div class="target-box">
        <div><div class="target-label">${targetSub}</div></div>
        <div class="target-number">${targetText}</div>
      </div>
    `;
    
    const usrahGroup = {};
    Object.values(studentsObj).forEach(s => {
      if (!usrahGroup[s.naqib]) usrahGroup[s.naqib] = [];
      usrahGroup[s.naqib].push(s);
    });

    let usrahsToShow = Object.keys(usrahGroup);
    if (currentUser.role === 'naqib') {
      usrahsToShow = usrahsToShow.filter(n => n.toLowerCase().includes(currentUser.username.toLowerCase()));
    }

    usrahsToShow.sort().forEach(groupName => {
      let santriList = usrahGroup[groupName];
      santriList.sort((a, b) => b.persen - a.persen);

      const section = document.createElement('div');
      section.className = 'usrah-section';
      let html = `<div class="usrah-header"><div><h2 class="usrah-title">${groupName}</h2></div></div>`;

      santriList.forEach((s, index) => {
        const predikat = getPredikat(s.persen, s.totalAkhir);
        
        const rank = index + 1;
        let rankClass = rank<=3 ? `rank-${rank}` : '';
        let isMyChild = (currentUser.role === 'wali' && s.name.toLowerCase().includes(currentUser.childName?.toLowerCase()));

        html += `
          <div class="santri-card ${isMyChild ? 'highlight-child' : ''}" onclick="showDetail('${s.name}')">
            <div class="card-top">
              <div style="display:flex;align-items:center;">
                <div class="rank-badge ${rankClass}">${rank}</div>
                <span class="santri-name">${s.name} ${isMyChild ? '(Ananda)' : ''}</span>
              </div>
              <div class="poin-badge">${s.persen}%</div>
            </div>
            
            <div class="progress-container">
              <div class="progress-bar" style="width:${s.persenTampil}%; background:${predikat.color}"></div>
            </div>
            
            <div class="progress-info">
              <span>${s.totalAkhir} Poin</span>
              <span class="predikat ${predikat.class}">${predikat.label}</span>
            </div>
          </div>`;
      });
      section.innerHTML = html;
      main.appendChild(section);
    });
  }

  window.showDetail = (name) => {
    selectedSantriName = name;
    const data = allStudentsData[name];
    if(!data) return;
    
    const predikat = getPredikat(data.persen, data.totalAkhir);
    document.getElementById('dNama').textContent = data.name;
    document.getElementById('dPredikat').textContent = predikat.label;
    document.getElementById('dPredikat').className = `predikat ${predikat.class}`;
    document.getElementById('dTotal').textContent = `${data.persen}%`;
    document.getElementById('dTotal').style.color = predikat.color;

    document.getElementById('btnShowEdit').style.display = (currentUser.role === 'admin') ? 'block' : 'none';

    const list = document.getElementById('historyList');
    list.innerHTML = '';
    
    // Header Reward
    list.innerHTML += `<div style="padding:15px;background:#f0fdf4;border-bottom:1px solid #e2e8f0;font-size:0.9rem;color:#166534;text-align:center">
      <strong>🎁 Status Bonus:</strong><br>${predikat.info}
    </div>`;

    if (data.history.length === 0) {
       list.innerHTML += `<div style="padding:20px;text-align:center;color:#94a3b8">Belum ada riwayat absensi.</div>`;
    }

    data.history.forEach(h => {
      const cls = h.poin > 0 ? 'plus' : (h.poin < 0 ? 'minus' : '');
      const sgn = h.poin > 0 ? '+' : '';
      list.innerHTML += `<div class="history-item">
        <div style="font-size:0.75rem;color:#94a3b8;width:80px">${h.date}</div>
        <div style="flex:1;padding:0 10px"><div style="font-weight:600;font-size:0.9rem">${h.title}</div><div style="font-size:0.75rem;color:#64748b">${h.status}</div></div>
        <div class="h-poin ${cls}">${sgn}${h.poin}</div>
      </div>`;
    });
    
    document.getElementById('editForm').style.display = 'none';
    document.getElementById('detailModal').style.display = 'flex';
  };

  window.saveManualPoint = () => {
    const type = document.getElementById('manualType').value;
    let amount = parseInt(document.getElementById('manualAmount').value);
    const reason = document.getElementById('manualReason').value;
    if (!amount || !reason) return;
    if (type === 'denda') amount = -amount;

    push(ref(db, 'cahaya_app/poin_manual'), {
      namaSantri: selectedSantriName, poin: amount, keterangan: reason,
      admin: currentUser.username, waktu: new Date().toISOString()
    }).then(() => { location.reload(); });
  };

  window.toggleEditForm = () => { const f = document.getElementById('editForm'); f.style.display = f.style.display==='none'?'block':'none'; };
  window.closeModal = () => { document.getElementById('detailModal').style.display = 'none'; };
  window.goBack = () => {
    if (!currentUser) window.location.href = 'index.html';
    else if (currentUser.role === 'admin') window.location.href = 'admin/index.html';
    else if (currentUser.role === 'naqib') window.location.href = 'naqib/dashboard.html';
    else if (currentUser.role === 'wali') window.location.href = 'wali/dashboard.html';
    else window.location.href = 'guru/fitur.html';
  };
</script>

</body>
</html>
