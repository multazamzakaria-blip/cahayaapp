<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP – Klasemen & Rapor Dinamis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --accent-gold: #d4af37;
      --accent-gold-light: #fef08a;
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: 
        radial-gradient(circle at top right, rgba(212, 175, 55, 0.1), transparent 40%),
        radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.05), transparent 40%),
        linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Background Texture */
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23d4af37' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
      pointer-events: none; z-index: -1;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent-gold); letter-spacing: 1px; }
    .btn-back {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.3s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }

    main { max-width: 900px; margin: 40px auto; padding: 0 20px 80px; animation: fadeInUp 0.8s ease backwards; }
    @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* TARGET BOX LUXURY */
    .target-box {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(15, 23, 42, 0.6) 100%);
      border: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(10px);
      padding: 20px 25px; border-radius: 20px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 35px; box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      position: relative; overflow: hidden;
    }
    .target-box::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 60%); pointer-events: none;
    }
    .target-label { font-size: 0.9rem; color: var(--accent-gold-light); text-transform: uppercase; letter-spacing: 1px; }
    .target-number { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 2rem; color: var(--accent-gold); text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3); }

    /* USRAH SECTION */
    .usrah-section { margin-bottom: 40px; }
    .usrah-header {
      margin-bottom: 20px; padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .usrah-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--text-main); font-weight: 700; letter-spacing: 1px; }

    /* SANTRI CARD */
    .santri-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 20px 25px; border-radius: 16px; margin-bottom: 15px;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative; overflow: hidden;
    }
    .santri-card:hover {
      background: rgba(255,255,255,0.08); transform: translateY(-4px) scale(1.01);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.15);
    }

    .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .santri-name { font-weight: 600; color: var(--text-main); font-size: 1.05rem; }
    .poin-badge { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; }

    /* BADGE RANKING */
    .rank-badge {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; margin-right: 12px;
      background: rgba(255,255,255,0.1); color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.2);
    }
    /* Emas, Perak, Perunggu */
    .rank-1 { background: linear-gradient(135deg, #fef08a, #d4af37); color: #000; border: none; box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
    .rank-2 { background: linear-gradient(135deg, #f8fafc, #94a3b8); color: #000; border: none; box-shadow: 0 0 15px rgba(148, 163, 184, 0.5); }
    .rank-3 { background: linear-gradient(135deg, #fdba74, #b45309); color: #000; border: none; box-shadow: 0 0 15px rgba(180, 83, 9, 0.5); }

    /* PROGRESS BAR */
    .progress-container { background: rgba(0,0,0,0.5); height: 8px; border-radius: 10px; overflow: hidden; margin-top: 10px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
    .progress-bar { height: 100%; border-radius: 10px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }

    /* PREDIKAT STYLES */
    .predikat { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .p-mumtaz { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .p-standar { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }
    .p-kurang { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .p-netral { background: rgba(255, 255, 255, 0.05); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1); }

    .highlight-child { border: 1px solid var(--accent-gold); background: linear-gradient(90deg, rgba(212, 175, 55, 0.05), transparent); }

    /* MODAL DETAIL (KACA GELAP) */
    .modal { display: none; position: fixed; z-index: 200; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); align-items: center; justify-content: center; }
    .modal-content { background: linear-gradient(145deg, #0f172a, #1e293b); width: 90%; max-width: 500px; max-height: 85vh; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--glass-border); box-shadow: 0 30px 60px rgba(0,0,0,0.7); animation: scaleIn 0.3s ease; }
    @keyframes scaleIn { from {transform: scale(0.9); opacity: 0;} to {transform: scale(1); opacity: 1;} }
    
    .modal-header { padding: 25px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); }
    .modal-header h3 { color: var(--text-main); font-size: 1.1rem; margin-bottom: 5px; }
    .modal-body { flex: 1; overflow-y: auto; padding: 0; }
    .modal-footer { padding: 20px; border-top: 1px solid var(--glass-border); display: flex; gap: 10px; background: rgba(255,255,255,0.02); }
    
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
    .history-item:hover { background: rgba(255,255,255,0.05); }
    .h-poin.plus { color: #34d399; font-weight: 700; font-size: 1.1rem; }
    .h-poin.minus { color: #f87171; font-weight: 700; font-size: 1.1rem; }
    
    .btn-action { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-edit { background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold)); color: #000; }
    .btn-edit:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .btn-close { background: rgba(255,255,255,0.1); color: var(--text-main); }
    .btn-close:hover { background: rgba(255,255,255,0.2); }

    #editForm { display: none; padding: 25px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--glass-border); }
    #editForm input, #editForm select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; outline: none; }
    #editForm input:focus, #editForm select:focus { border-color: var(--accent-gold); }
    
    @media(max-width: 600px) {
      .santri-card { padding: 15px; }
      .rank-badge { width: 25px; height: 25px; font-size: 0.75rem; }
      .target-number { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Indeks Kedisiplinan Santri</h1>
  <div><button class="btn-back" onclick="goBack()">Kembali</button></div>
</header>

<main id="mainContent">
  <div style="text-align:center; padding: 50px; color: var(--text-muted); font-style: italic;">
    <span style="font-size:2rem; display:block; margin-bottom:10px;">✨</span>
    Menyelaraskan data klasemen...
  </div>
</main>

<div id="detailModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <h3 id="dNama">Nama Santri</h3>
        <span id="dPredikat" class="predikat p-mumtaz">PREDIKAT</span>
      </div>
      <div id="dTotal" style="font-size:1.8rem;font-weight:700;color:var(--accent-gold);font-family:'Playfair Display'">0%</div>
    </div>
    <div class="modal-body" id="historyList"></div>
    
    <div id="editForm">
      <h4 style="margin-top:0; color:var(--accent-gold); font-family:'Playfair Display'; margin-bottom:15px;">🔧 Koreksi Poin</h4>
      <select id="manualType">
        <option value="bonus">➕ Tambah (Bonus)</option>
        <option value="denda">➖ Kurang (Denda)</option>
      </select>
      <input type="number" id="manualAmount" placeholder="Jumlah Poin">
      <input type="text" id="manualReason" placeholder="Keterangan Spesifik">
      <div style="display:flex; gap:10px;">
        <button class="btn-action btn-edit" onclick="saveManualPoint()">Simpan</button>
        <button class="btn-action btn-close" onclick="toggleEditForm()">Batal</button>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn-action btn-close" onclick="closeModal()">Tutup</button>
      <button id="btnShowEdit" class="btn-action btn-edit" onclick="toggleEditForm()">⚙️ Edit Poin</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MASTER_SANTRI = {
    "Kamal": ["ADITYA PUTRA IBRAHIM","AIRLANGGA AZKA ABQORI","AQIELA MARSYAH","BRILLY HANDRIAN","DARREN ATHAYA","DZIKRI MUDHOFFAR","ELLENO QUTHBIE HERMAWAN","FADIL NURHALIM","GABRIEL AL FATIH","HADINATA SAPUTRA","MIKO VAJAR","M. ALMISKY PRATAMA","M. AQIL RIDHO","M. IZAM SAPUTRA","M. SYAKIR HUTABARAT","M. YASIR AL FAZAR JHIRA","M. ZIYAD ZHAZHA","RAFA","WAHYU REYDINATA","NIZAM KABISAT","JUANDA NUR ILHAM","M. DIRGATAMA","DAFFA AL MUSYARI","MOHAMMAD IKHSAN HAIRULI","REYFAS RAMADHAN","FALIZH DAFFA QATRUNNADA","HAFIDZ AL ROZI","CANZA RYANDA HUTASUHUT","NAJMIHADI SYAUQII TAMAAM","EZA FEBRI AL FADZRI"],
    "Favian": ["ABDULLAH MUKTI HAFIDZALLAH","AHMAD RIYADI","AKBAR PRAYOGA","ALIF MUHAMMAD YUSUF","ALVIN HERFIANTINO","ANDES AFENDRA","BASRI AL HAZIQ ZULFAHMI","AHMAD MAULANA","DANANG PRASDITYA SANTOSO","DEDI SETIADI","DIKKI KURNIAWAN","FAKHRI AL MUZAKKI","FEBRI GHALIH AL FAROBI","GHOZY FATURRAHMAN","ILHAM MUKMIN AL FARABI","M. AL FALAH","M. FAQIH HAFIDZALLAH","M. FIRAAS AL INSYIROH","MUHAMMAD ALLAM NUR HUSHAIN","M. RAID MAHRUS","M. RIJALUL KAMIL","NABIL NAJMI","RADEN AZAA PANCA PUTRA","RAFI RAMADHAN","SATRIO ABIMAYU","TEGAR HIDAYAT","VERY SYACH","WAFII FADHLURROHMAN","ZAHIR ZIBRAN","ZULFAKIH HAERUNNASIHIN"],
    "Shafwan": ["ANGGA PRATAMA PUTRA","KI AGUS MUHAMMAD ABDULLAH SHIDDIQ AGTSALI","MIKA RAHIEL YUSUF","PRAWIRO PUJO TUNGGAL JATI","M. XAVI NF","REYNALDI MALIK IBRAHIM ALFARIDZI","FAHRIE OKTAVIRANO FITRIS","FARAZH SAYYID PUTRA KENEGA","LUTHFAN ADZAKI","MARFEL SAPUTRA","MELDI NOVRIANSYAH","ALIF SAMUDRA","ARYA DIFA ALSYA","FAUZAN IBNI JABAR","HAFIDZ ALRIZKY","M. ABIL IRWANSYAH","M. FADHIL BUANA","M. FAISAL FIKRIANSYAH","NAUFAL AKBAR ALKHATIRI","QHEIZAN ALQIZA ARISDA","REZFY FAKHRYAZKA","SYAHRUL RAMADHAN","ROID AFDAL","ROHADIN FIRDAUS AL QAUSAR","RENAL MARTIN","RAKA SEPTIAN","NAFIS","M. USAMAH","MUHAMAD YUSUF ARROSIYD","MAHESA AULIA GIFFARI","M. ARYA MAHDI WAFI EL-FAUZANI","ILHAM","IHZA TRINANDI","HABIB RAMADHAN","FAHRY AKBAR RAMDHANI","CAHYIS ISZAM","ANUGRAH PRATAMA","AHMAD FARHAAN"],
    "Fatimah": ["QELZA RAMADHANI ATH THAHIRAH","ASHIFA FITRI RAMADHONI","ADIBA AILA KHANZA","AISYAH NUR KHALIFAH","NYAYU MARLITSA ARDHANI","WILDA","WINDY WINDARI","AISYAH NURUL AULIA","NESSYA RAMADHANY","AMIRAH BALQIS RAHADATUL A'ISYAH","EARLYTA ARSYFA SALSABILA","DAFIA NAFLA SYAKIRA","ANISYA SEPTIANI"],
    "Evita": ["BILQIS NUR ANISAH","JESSICA PUTRY AYRA","GHENIS ANDIENTIAZ","DINA RUHAYAH","PITRI RAMADANI","GRINNETA NALANI PUTRI","INAYAH NOURAH ANINDYA","SHELENA","FITRAH KIRANA"]
  };

  const TANGGAL_MULAI_HITUNG = "2024-05-01"; 

  let TARGET_DINAMIS = 0;
  let currentUser = null;
  let allStudentsData = {};
  let mapSantriUsrah = {};
  let selectedSantriName = null;

  function getPredikat(persen, totalPoin) {
    if (TARGET_DINAMIS === 0 || (persen === 0 && totalPoin === 0)) {
       return { label: "MENUNGGU DATA", class: "p-netral", color: "#64748b", info: "Belum ada poin tercatat" };
    }
    if (persen >= 90) return { label: "MUMTAZ", class: "p-mumtaz", color: "#34d399", info: "✅ Layak Dapat Bonus / Kunjungan" };
    
    let label = "JAYYID"; let style = "p-standar"; let color = "#38bdf8";
    if (persen < 50) { label = "RASIB"; style = "p-kurang"; color = "#f87171"; }
    else if (persen < 75) { label = "MAQBUL"; style = "p-standar"; color = "#fbbf24"; }

    return { label: label, class: style, color: color, info: "💪 Harus Lebih Disiplin Lagi" };
  }

  document.addEventListener('DOMContentLoaded', async () => {
    currentUser = JSON.parse(localStorage.getItem('cahayaCurrentUser') || 'null');
    if (!currentUser) { window.location.href = 'index.html'; return; }

    for (const [namaKelompok, listSantri] of Object.entries(MASTER_SANTRI)) {
      listSantri.forEach(nama => { mapSantriUsrah[nama] = namaKelompok; });
    }
    await loadAllData();
  });

  async function loadAllData() {
    try {
      const refs = [
        get(ref(db, 'cahaya_app/absensi_program_harian')),
        get(ref(db, 'cahaya_app/absensi_pembelajaran')),
        get(ref(db, 'cahaya_app/poin_manual'))
      ];
      const snapshots = await Promise.all(refs);
      processData(snapshots[0].val() || {}, snapshots[1].val() || {}, snapshots[2].val() || {});
    } catch (error) {
      document.getElementById('mainContent').innerHTML = `<p style="color:#f87171;text-align:center">${error.message}</p>`;
    }
  }

  function processData(ibadahLog, akademikLog, manualLog) {
    const students = {};
    const getStudent = (nama) => {
      let usrahResmi = mapSantriUsrah[nama];
      if (!usrahResmi) return null;
      if (!students[nama]) students[nama] = { name: nama, totalMurni: 0, totalAkhir: 0, naqib: usrahResmi, history: [] };
      return students[nama];
    };

    [ibadahLog, akademikLog].forEach(log => {
      Object.values(log).forEach(session => {
        if (session.tanggal < TANGGAL_MULAI_HITUNG) return;
        if (session.data) {
          session.data.forEach(s => {
            const entry = getStudent(s.nama);
            if (entry) {
              let p = parseInt(s.poin) || 0;
              entry.totalMurni += p; entry.totalAkhir += p;
              entry.history.push({ date: session.tanggal, title: session.program || session.mapel, status: s.status, poin: p });
            }
          });
        }
      });
    });

    let maxScore = 0;
    Object.values(students).forEach(s => { if (s.totalMurni > maxScore) maxScore = s.totalMurni; });
    TARGET_DINAMIS = maxScore;

    Object.values(manualLog).forEach(log => {
      const entry = getStudent(log.namaSantri);
      if (entry) {
        let p = parseInt(log.poin) || 0;
        entry.totalAkhir += p;
        entry.history.push({ date: log.waktu.split('T')[0], title: 'Catatan Manual', status: log.keterangan, poin: p });
      }
    });

    Object.values(students).forEach(s => {
      let pembagi = TARGET_DINAMIS > 0 ? TARGET_DINAMIS : 1; 
      let persen = Math.round((s.totalAkhir / pembagi) * 100);
      s.persen = persen;
      s.persenTampil = persen > 100 ? 100 : (persen < 0 ? 0 : persen);
      s.history.sort((a, b) => new Date(b.date) - new Date(a.date));
    });

    allStudentsData = students;
    renderUI(students);
  }

  function renderUI(studentsObj) {
    const main = document.getElementById('mainContent');
    
    let targetText = `${TARGET_DINAMIS} Poin`;
    let targetSub = "BENCHMARK TERTINGGI (100%)";
    if (TARGET_DINAMIS === 0) { targetText = "-"; targetSub = "Menunggu Data Pertama Masuk"; }

    main.innerHTML = `
      <div class="target-box">
        <div><div class="target-label">${targetSub}</div></div>
        <div class="target-number">${targetText}</div>
      </div>
    `;
    
    const usrahGroup = {};
    Object.values(studentsObj).forEach(s => {
      if (!usrahGroup[s.naqib]) usrahGroup[s.naqib] = [];
      usrahGroup[s.naqib].push(s);
    });

    let usrahsToShow = Object.keys(usrahGroup);
    if (currentUser.role === 'naqib') usrahsToShow = usrahsToShow.filter(n => n.toLowerCase().includes(currentUser.username.toLowerCase()));

    usrahsToShow.sort().forEach(groupName => {
      let santriList = usrahGroup[groupName];
      santriList.sort((a, b) => b.persen - a.persen);

      const section = document.createElement('div');
      section.className = 'usrah-section';
      let html = `<div class="usrah-header"><h2 class="usrah-title">Asrama ${groupName}</h2></div>`;

      santriList.forEach((s, index) => {
        const predikat = getPredikat(s.persen, s.totalAkhir);
        const rank = index + 1;
        let rankClass = rank<=3 ? `rank-${rank}` : '';
        let isMyChild = (currentUser.role === 'wali' && s.name.toLowerCase().includes(currentUser.childName?.toLowerCase()));

        html += `
          <div class="santri-card ${isMyChild ? 'highlight-child' : ''}" onclick="showDetail('${s.name}')">
            <div class="card-top">
              <div style="display:flex;align-items:center;">
                <div class="rank-badge ${rankClass}">${rank}</div>
                <span class="santri-name">${s.name} ${isMyChild ? '(Ananda)' : ''}</span>
              </div>
              <div class="poin-badge" style="color:${predikat.color}">${s.persen}%</div>
            </div>
            
            <div class="progress-container">
              <div class="progress-bar" style="width:${s.persenTampil}%; background:${predikat.color}; box-shadow: 0 0 10px ${predikat.color}"></div>
            </div>
            
            <div class="progress-info">
              <span><strong>${s.totalAkhir}</strong> Poin</span>
              <span class="predikat ${predikat.class}">${predikat.label}</span>
            </div>
          </div>`;
      });
      section.innerHTML = html;
      main.appendChild(section);
    });
  }

  // --- DETAIL & MODAL ---
  window.showDetail = (name) => {
    selectedSantriName = name;
    const data = allStudentsData[name];
    if(!data) return;
    
    const predikat = getPredikat(data.persen, data.totalAkhir);
    document.getElementById('dNama').textContent = data.name;
    document.getElementById('dPredikat').textContent = predikat.label;
    document.getElementById('dPredikat').className = `predikat ${predikat.class}`;
    document.getElementById('dTotal').textContent = `${data.persen}%`;
    document.getElementById('dTotal').style.color = predikat.color;

    // KODE YANG DIUBAH: Memberikan akses Edit Poin untuk 'admin' DAN 'naqib'
    document.getElementById('btnShowEdit').style.display = (currentUser.role === 'admin' || currentUser.role === 'naqib') ? 'block' : 'none';

    // Opsi tambahan: Jika Naqib hanya boleh menambah poin bonus (tidak boleh potong denda), kita bisa atur opsi dropdownnya
    if (currentUser.role === 'naqib') {
        // Baris di bawah ini akan menyembunyikan opsi "Denda" jika penggunanya adalah Naqib
        // document.querySelector('#manualType option[value="denda"]').style.display = 'none';
        
        // (Saya biarkan menjadi komentar agar Naqib tetap bisa denda jika diperlukan. Jika ingin dikunci hanya bonus, hapus tanda // di awal baris atas)
    }

    const list = document.getElementById('historyList');
    list.innerHTML = '';
    
    list.innerHTML += `<div style="padding:15px;background:rgba(255,255,255,0.05);border-bottom:1px solid rgba(255,255,255,0.1);font-size:0.85rem;color:var(--text-muted);text-align:center">
      ${predikat.info}
    </div>`;

    if (data.history.length === 0) {
       list.innerHTML += `<div style="padding:30px;text-align:center;color:#64748b;font-style:italic;">Riwayat masih kosong.</div>`;
    }

    data.history.forEach(h => {
      const cls = h.poin > 0 ? 'plus' : (h.poin < 0 ? 'minus' : '');
      const sgn = h.poin > 0 ? '+' : '';
      list.innerHTML += `
        <div class="history-item">
          <div style="font-size:0.75rem;color:var(--text-muted);width:80px">${h.date}</div>
          <div style="flex:1;padding:0 10px">
            <div style="font-weight:600;font-size:0.95rem;color:white">${h.title}</div>
            <div style="font-size:0.75rem;color:var(--text-muted)">${h.status}</div>
          </div>
          <div class="h-poin ${cls}">${sgn}${h.poin}</div>
        </div>`;
    });
    
    document.getElementById('editForm').style.display = 'none';
    document.getElementById('detailModal').style.display = 'flex';
  };

  window.saveManualPoint = () => {
    const type = document.getElementById('manualType').value;
    let amount = parseInt(document.getElementById('manualAmount').value);
    const reason = document.getElementById('manualReason').value;
    if (!amount || !reason) return;
    if (type === 'denda') amount = -amount;

    push(ref(db, 'cahaya_app/poin_manual'), {
      namaSantri: selectedSantriName, poin: amount, keterangan: reason,
      admin: currentUser.username, // Tetap menggunakan properti 'admin' agar tidak merusak struktur data lama di Firebase
      waktu: new Date().toISOString()
    }).then(() => { location.reload(); });
  };

  window.toggleEditForm = () => { const f = document.getElementById('editForm'); f.style.display = f.style.display==='none'?'block':'none'; };
  window.closeModal = () => { document.getElementById('detailModal').style.display = 'none'; };
  window.goBack = () => {
    if (!currentUser) window.location.href = 'index.html';
    else if (currentUser.role === 'admin') window.location.href = 'admin/index.html';
    else if (currentUser.role === 'naqib') window.location.href = 'naqib/dashboard.html';
    else if (currentUser.role === 'wali') window.location.href = 'wali/dashboard/index.html';
    else window.location.href = 'guru/fitur.html';
  };
</script>

</body>
</html>
