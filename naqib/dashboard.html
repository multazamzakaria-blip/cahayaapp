<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Naqib</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: linear-gradient(135deg, #1e3a8a, #2563eb);
      --text-dark: #1f2933;
      --text-light: #e5e7eb;
    }

    body {
      font-family: "Poppins", Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 1.3rem;
      margin: 0;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 28px;
      color: white;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    h2 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #fff;
    }

    .small {
      font-size: 0.9rem;
      color: #dbeafe;
      margin-bottom: 16px;
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    button {
      background: white;
      color: var(--primary);
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 3px 10px rgba(255,255,255,0.2);
    }

    button:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }

    footer {
      text-align: center;
      color: var(--text-light);
      font-size: 12px;
      padding: 8px 0;
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(6px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.1rem; }
      .card { padding: 22px; }
      button { font-size: 13px; padding: 10px; }
    }
  </style>
</head>

<body>
<header>
  <h1>🌟 CAHAYA APP – Naqib</h1>
  <div class="btn-group" style="gap:6px;">
    <button onclick="backToPortal()">⬅️ Portal</button>
    <button onclick="logout()">🚪 Keluar</button>
  </div>
</header>

<main>
  <div class="card">
    <h2 id="naqibTitle">Dashboard Naqib</h2>
    <p class="small" id="naqibInfo">Memuat data akses...</p>

    <div class="btn-group">
      <button onclick="goAbsensi()">🧍 Absensi Program Harian</button>
      <button onclick="goPelanggaran()">📋 Form Pelanggaran Santri</button>
      <button onclick="goCahaya()">💚 CAHAYA Assessment</button>
    </div>

    <p class="small" style="margin-top:18px;">
      Selalu isi dengan <b>Teliti dan Objektif</b>.
    </p>
  </div>
</main>

<footer>
  © 2025 Pesantren Cahaya Fajrul Islam — Naqib Dashboard
</footer>

<script>
  // === DATABASE KELOMPOK SANTRI ===
  const dataSantri = {
    "Regen":[ "AHMAD MAULANA","JUANDA NUR ILHAM","NAJMIHADI SYAUQII TAMAAM","NIZAM KABISAT","MOHAMMAD IKHSAN HAIRULI","REYFAS RAMADHAN","EZA FEBRI AL FADZRI","HAFIDZ AL ROZI","ANDES AFENDRA","FEBRI GHALIH AL FAROBI","DANANG PRASDITYA SANTOSO","MUHAMMAD RAID MAHRUS","MUHAMMAD DIRGATAMA","CANZA RYANDA HUTASUHUT","FALIZH DAFFA QATRUNNADA","DAFFA AL MUSYARI","RAFI RAMADHAN","WAHYU REYDINATA","AKBAR PRAYOGA","VERY SYACH","MUHAMMAD AL FALAH"],
    "Kamal":[ "ADITYA PUTRA IBRAHIM","AIRLANGGA AZKA ABQORI","AQIELA MARSYAH","BRILLY HANDRIAN","DARREN ATHAYA","DZIKRI MUDHOFFAR","ELLENO QUTHBIE HERMAWAN","FADIL NURHALIM","GABRIEL AL FATIH","HADINATA SAPUTRA","MIKO VAJAR","MUHAMMAD ALMISKY PRATAMA","MUHAMMAD AQIL RIDHO","MUHAMMAD IZAM SAPUTRA","MUHAMMAD SYAKIR HUTABARAT","MUHAMMAD ZIYAD ZHAZHA","MUHAMMAD YASIR AL FAZAR JHIRA","RAFA"],
    "Favian":[ "ANGGA PRATAMA PUTRA","PRAWIRO PUJO TUNGGAL JATI","MUHAMMAD MARPIN","MARFEL SAPUTRA","MELDI NOVRIANSYAH","FAUZAN IBNI JABAR","MUHAMMAD FADHIL BUANA","QHEIZAN ALQIZA ARISDA","REZFY FAKHRYAZKA","MIKA RAHEL YUSUF","KI AGUS MUHAMMAD ABDULLAH SHIDDIQ AGTSALI","ARYA DIFA ALSYA","REYNALDI MALIK IBRAHIM ALFARIDZI","MUHAMMAD XAVI NF","MUHAMMAD FAISAL FIKRIANSYAH","HAFIDZ ALRIZKY","NAUFAL AKBAR ALKHATIRI","FARAZH SAYYID PUTRA KENEGA","SYAHRUL RAMADHAN","LUTHFAN ADZAKI","MUHAMMAD ABIL IRWANSYAH","ALIF SAMUDRA","FAHRIE OKTAVIRANO FITRIS"],
    "Dimas":[ "DIKKI KURNIAWAN","GHOZY FATURRAHMAN","MUHAMMAD THOORIQ","AHMAD RIYADI","ALIF MUHAMMAD YUSUF","BASRI AL HAZIQ ZULFAHMI","MUHAMMAD FAQIH HAFIDZALLAH","ABDULLAH MUKTI HAFIDZALLAH","DEDI SETIADI","FAKHRI AL MUZAKKI","ILHAM MUKMIN AL FARABI","MUHAMMAD ALLAM NUR HUSAIN","MUHAMMAD FIRAAS AL INSYIROH","NABIL NAJMI","SATRIO ABIMAYU","TEGAR HIDAYAT","WAFII FADHLURROHMAN","MUHAMMAD RIJALUL KAMIL","ALVIN HERFIANTINO","ZAHIR ZIBRAN","RADEN AZAA PANCA PUTRA","ZULFAKIH HAERUNNASIHIN"],
    "Shafwan":[ "AHMAD FARHAAN","ANUGRAH PRATAMA","CAHYIS ISZAM","FAHRY AKBAR RAMDHANI","HABIB RAMADHAN","IHZA TRINANDI","ILHAM","M.ARYA MAHDI WAFI EL-FAUZANI","MAHESA AULIA GIFFARI","MUHAMAD YUSUF ARROSIYD","MUHAMMAD USAMAH","NAFIS","RAKA SEPTIAN","RENAL MARTIN","ROHADIN FIRDAUS AL QAUSAR","ROID AFDAL"],
    "Fatimah":[ "NILAM CAHYA","QELZA RAMADHANI ATH THAHIRAH","ASHIFA FITRI RAMADHONI","ADIBA AILA KHANZA","AISYAH NUR KHALIFAH","NYAYU MARLITSA ARDHANI","WILDA","WINDY WINDARI","AISYAH NURUL AULIA","NESSYA RAMADHANY","AMIRAH BALQIS RAHADATUL A'ISYAH","EARLYTA ARSYFA SALSABILA","DAFIA NAFLA SYAKIRA","ANISYA SEPTIANI"],
    "Evita":[ "BILQIS NUR ANISAH","JESSICA PUTRY AYRA","GHENIS ANDIENTIAZ","DINA RUHAYAH","PITRI RAMADANI","GRINNETA NALANI PUTRI","INAYAH NOURAH ANINDYA","SHELENA","FITRAH KIRANA"]
  };

  const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "{}");
  const title = document.getElementById("naqibTitle");
  const info = document.getElementById("naqibInfo");

  // Jika belum login
  if (!user || user.role !== "naqib") {
    title.textContent = "Dashboard Naqib (Belum Login)";
    info.textContent = "Silakan login dari portal utama.";
  } else {
    title.textContent = user.label;
    const namaNaqib = user.label?.split(" ")[1] || "";
    const kelompok = dataSantri[namaNaqib];
    if (kelompok) {
      info.textContent = `Kelompok: ${namaNaqib} (${kelompok.length} santri)`;
      localStorage.setItem("kelompokNaqib", JSON.stringify(kelompok));
    } else {
      info.textContent = "❌ Kelompok tidak ditemukan.";
    }
  }

  function backToPortal(){ window.location.href = "../index.html"; }
  function logout(){ localStorage.removeItem("cahayaCurrentUser"); window.location.href = "../index.html"; }
  function goAbsensi(){ window.location.href = "absensi.html"; }
  function goPelanggaran(){ window.location.href = "pelanggaran.html"; }
  function goCahaya(){ window.location.href = "assassment.html"; }
</script>

</body>
</html>
