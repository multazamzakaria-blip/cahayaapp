<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Pantauan Disiplin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --danger-main: #ef4444;
      --warning-main: #f59e0b;
      --accent-gold: #d4af37;
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #f8fafc; }
    
    .btn-back {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px; cursor: pointer;
    }

    main { max-width: 900px; margin: 40px auto; padding: 0 20px; padding-bottom: 60px; }

    .priority-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 40px;
    }
    .priority-card {
      background: rgba(239, 68, 68, 0.1);
      border-left: 5px solid var(--danger-main);
      padding: 20px;
      border-radius: 12px;
    }
    .priority-card.warning { background: rgba(245, 158, 11, 0.1); border-left-color: var(--warning-main); }
    .priority-card h3 { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }
    .priority-card .count { font-size: 2rem; font-weight: 700; color: white; display: block; }

    .pulse-danger { animation: pulse-red 2s infinite; }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .filter-box {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
      padding: 20px; border-radius: 16px; margin-bottom: 30px;
      display: flex; align-items: center; justify-content: space-between; gap: 15px;
    }
    .filter-box input[type="date"] {
      padding: 12px 20px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.4);
      background: rgba(0,0,0,0.5); color: white; font-family: inherit;
    }

    .section-title { font-family: 'Playfair Display', serif; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; margin-top: 50px; margin-bottom: 20px; font-size: 1.5rem; }
    .title-lapor { color: #fca5a5; }
    .title-absen { color: #fcd34d; }

    .usrah-group { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .usrah-title { color: var(--accent-gold); font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 15px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; background: rgba(255,255,255,0.02); border-radius: 12px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
    th { background: rgba(0,0,0,0.4); color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 0.8rem; }
    
    .list-item { margin-bottom: 8px; padding-left: 15px; position: relative; }
    .list-item::before { content: "•"; position: absolute; left: 0; color: var(--accent-gold); }

    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-right: 5px; }
    .b-alpa { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .b-telat { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

    .pelapor-rahasia {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); cursor: pointer; color: #94a3b8; font-size: 0.8rem;
    }
    .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>Pantauan Disiplin Asrama</h1>
  <button class="btn-back" onclick="window.location.href='dashboard.html'">Kembali</button>
</header>

<main>
  <div class="filter-box">
    <label>📅 Tanggal:</label>
    <input type="date" id="filterTanggal" onchange="prosesData()">
  </div>

  <div id="prioritySummary" class="priority-container"></div>

  <div id="dataContainer">
    <h2 class="section-title title-lapor">🚨 Santri Terlapor</h2>
    <div id="containerLaporan"></div>

    <h2 class="section-title title-absen">⚠️ Indisipliner Absensi</h2>
    <div id="containerAbsen"></div>

    <h2 class="section-title title-setor">📖 Belum Setoran</h2>
    <div id="containerSetoran"></div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MASTER_SANTRI = {
    "Kamal": ["ADITYA PUTRA IBRAHIM","AIRLANGGA AZKA ABQORI","AQIELA MARSYAH","BRILLY HANDRIAN","DARREN ATHAYA","DZIKRI MUDHOFFAR","ELLENO QUTHBIE HERMAWAN","FADIL NURHALIM","GABRIEL AL FATIH","HADINATA SAPUTRA","MIKO VAJAR","M. ALMISKY PRATAMA","M. AQIL RIDHO","M. IZAM SAPUTRA","M. SYAKIR HUTABARAT","M. YASIR AL FAZAR JHIRA","M. ZIYAD ZHAZHA","RAFA","WAHYU REYDINATA","NIZAM KABISAT","JUANDA NUR ILHAM","M. DIRGATAMA","DAFFA AL MUSYARI","MOHAMMAD IKHSAN HAIRULI","REYFAS RAMADHAN","FALIZH DAFFA QATRUNNADA","HAFIDZ AL ROZI","CANZA RYANDA HUTASUHUT","NAJMIHADI SYAUQII TAMAAM","EZA FEBRI AL FADZRI"],
    "Favian": ["ABDULLAH MUKTI HAFIDZALLAH","AHMAD RIYADI","AKBAR PRAYOGA","ALIF MUHAMMAD YUSUF","ALVIN HERFIANTINO","ANDES AFENDRA","BASRI AL HAZIQ ZULFAHMI","AHMAD MAULANA","DANANG PRASDITYA SANTOSO","DEDI SETIADI","DIKKI KURNIAWAN","FAKHRI AL MUZAKKI","FEBRI GHALIH AL FAROBI","GHOZY FATURRAHMAN","ILHAM MUKMIN AL FARABI","M. AL FALAH","M. FAQIH HAFIDZALLAH","M. FIRAAS AL INSYIROH","MUHAMMAD ALLAM NUR HUSHAIN","M. RAID MAHRUS","M. RIJALUL KAMIL","NABIL NAJMI","RADEN AZAA PANCA PUTRA","RAFI RAMADHAN","SATRIO ABIMAYU","TEGAR HIDAYAT","VERY SYACH","WAFII FADHLURROHMAN","ZAHIR ZIBRAN","ZULFAKIH HAERUNNASIHIN"],
    "Shafwan": ["ANGGA PRATAMA PUTRA","KI AGUS MUHAMMAD ABDULLAH SHIDDIQ AGTSALI","MIKA RAHIEL YUSUF","PRAWIRO PUJO TUNGGAL JATI","M. XAVI NF","REYNALDI MALIK IBRAHIM ALFARIDZI","FAHRIE OKTAVIRANO FITRIS","FARAZH SAYYID PUTRA KENEGA","LUTHFAN ADZAKI","MARFEL SAPUTRA","MELDI NOVRIANSYAH","ALIF SAMUDRA","ARYA DIFA ALSYA","FAUZAN IBNI JABAR","HAFIDZ ALRIZKY","M. ABIL IRWANSYAH","M. FADHIL BUANA","M. FAISAL FIKRIANSYAH","NAUFAL AKBAR ALKHATIRI","QHEIZAN ALQIZA ARISDA","REZFY FAKHRYAZKA","SYAHRUL RAMADHAN","ROID AFDAL","ROHADIN FIRDAUS AL QAUSAR","RENAL MARTIN","RAKA SEPTIAN","NAFIS","M. USAMAH","MUHAMAD YUSUF ARROSIYD","MAHESA AULIA GIFFARI","M. ARYA MAHDI WAFI EL-FAUZANI","ILHAM","IHZA TRINANDI","HABIB RAMADHAN","FAHRY AKBAR RAMDHANI","CAHYIS ISZAM","ANUGRAH PRATAMA","AHMAD FARHAAN"],
    "Fatimah": ["QELZA RAMADHANI ATH THAHIRAH","ASHIFA FITRI RAMADHONI","ADIBA AILA KHANZA","AISYAH NUR KHALIFAH","NYAYU MARLITSA ARDHANI","WILDA","WINDY WINDARI","AISYAH NURUL AULIA","NESSYA RAMADHANY","AMIRAH BALQIS RAHADATUL A'ISYAH","EARLYTA ARSYFA SALSABILA","DAFIA NAFLA SYAKIRA","ANISYA SEPTIANI"],
    "Evita": ["BILQIS NUR ANISAH","JESSICA PUTRY AYRA","GHENIS ANDIENTIAZ","DINA RUHAYAH","PITRI RAMADANI","GRINNETA NALANI PUTRI","INAYAH NOURAH ANINDYA","SHELENA","FITRAH KIRANA"]
  };

  const SANTRI_TAHFIZ = ["M. AL FALAH", "MIKA RAHIEL YUSUF", "ANGGA PRATAMA PUTRA", "NIZAM KABISAT", "PRAWIRO PUJO TUNGGAL JATI", "MAHESA AULIA GIFFARI", "NAJMIHADI SYAUQII TAMAAM", "MARFEL SAPUTRA", "MELDI NOVRIANSYAH", "RENAL MARTIN", "AHMAD RIYADI", "ABDULLAH MUKTI HAFIDZALLAH", "AKBAR PRAYOGA", "ANDES AFENDRA", "BASRI AL HAZIQ ZULFAHMI", "CANZA RYANDA HUTASUHUT", "DAFFA AL MUSYARI", "DANANG PRASDITYA SANTOSO", "FAKHRI AL MUZAKKI", "FALIZH DAFFA QATRUNNADA", "FEBRI GHALIH AL FAROBI", "HAFIDZ AL ROZI", "HAFIDZ ALRIZKY", "ILHAM MUKMIN AL FARABI", "LUTHFAN ADZAKI", "DIKKI KURNIAWAN", "ROID AFDAL", "IHZA TRINANDI", "ILHAM", "KI AGUS MUHAMMAD ABDULLAH SHIDDIQ AGTSALI", "AHMAD MAULANA", "ALIF MUHAMMAD YUSUF", "ARYA DIFA ALSYA", "FARAZH SAYYID PUTRA KENEGA", "GHOZY FATURRAHMAN", "M. FAQIH HAFIDZALLAH", "M. RIJALUL KAMIL", "MUHAMMAD ALLAM NUR HUSHAIN", "M. RAID MAHRUS", "NAFIS", "RAFI RAMADHAN", "REYNALDI MALIK IBRAHIM ALFARIDZI", "WAFII FADHLURROHMAN", "M. FADHIL BUANA", "M. FIRAAS AL INSYIROH", "M. XAVI NF", "NABIL NAJMI", "NAUFAL AKBAR ALKHATIRI", "QHEIZAN ALQIZA ARISDA", "REYFAS RAMADHAN", "ROHADIN FIRDAUS AL QAUSAR", "SATRIO ABIMAYU", "WAHYU REYDINATA", "ZAHIR ZIBRAN", "ZULFAKIH HAERUNNASIHIN", "HABIB RAMADHAN", "MUHAMAD YUSUF ARROSIYD", "VERY SYACH", "M. FAISAL FIKRIANSYAH", "TEGAR HIDAYAT", "WILDA", "NESSYA RAMADHANY", "GHENIS ANDIENTIAZ", "JESSICA PUTRY AYRA", "NYAYU MARLITSA ARDHANI", "GRINNETA NALANI PUTRI", "AMIRAH BALQIS RAHADATUL A'ISYAH", "BILQIS NUR ANISAH", "QELZA RAMADHANI ATH THAHIRAH"];

  let mapSantriUsrah = {};
  for (const [usrah, list] of Object.entries(MASTER_SANTRI)) {
    list.forEach(nama => mapSantriUsrah[nama] = usrah);
  }

  function getUsrah(nama) { return mapSantriUsrah[nama] || "Luar"; }

  let allData = { lapor: {}, absenHarian: {}, absenKBM: {}, setoran: {} };

  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('filterTanggal').value = new Date().toISOString().split('T')[0];
    try {
      const snaps = await Promise.all([
        get(ref(db, 'cahaya_app/log_lapor_inisiatif')),
        get(ref(db, 'cahaya_app/absensi_program_harian')),
        get(ref(db, 'cahaya_app/absensi_pembelajaran')),
        get(ref(db, 'cahaya_app/setoran_tahfiz'))
      ]);
      allData.lapor = snaps[0].val() || {};
      allData.absenHarian = snaps[1].val() || {};
      allData.absenKBM = snaps[2].val() || {};
      allData.setoran = snaps[3].val() || {};
      prosesData();
    } catch(err) { alert(err.message); }
  });

  window.prosesData = function() {
    const tgl = document.getElementById('filterTanggal').value;
    renderLaporan(tgl);
    renderAbsensi(tgl);
    renderSetoran(tgl);
    generatePriority(tgl);
  };

  function generatePriority(tgl) {
    let lapor = 0, alfa = 0;
    Object.values(allData.lapor).forEach(l => { if(l.waktu?.startsWith(tgl) && l.tipe === "Lapor Pelanggaran") lapor++; });
    [allData.absenHarian, allData.absenKBM].forEach(db => {
      Object.values(db).forEach(log => {
        if(log.tanggal === tgl && log.data) log.data.forEach(s => { if(s.status?.toLowerCase()==='alfa') alfa++; });
      });
    });
    document.getElementById('prioritySummary').innerHTML = `
      <div class="priority-card ${lapor>0?'pulse-danger':''}"><h3>Laporan</h3><span class="count">${lapor}</span></div>
      <div class="priority-card warning ${alfa>0?'pulse-danger':''}"><h3>Alfa</h3><span class="count">${alfa}</span></div>
    `;
  }

  // LOGIKA PENYEMPURNAAN: GROUPING BY NAME
  function renderLaporan(tgl) {
    let grouped = {}; // { usrah: { nama: [kejadian1, kejadian2] } }
    Object.values(allData.lapor).forEach(log => {
      if (log.waktu?.startsWith(tgl) && log.tipe === "Lapor Pelanggaran") {
        let u = getUsrah(log.dilaporkan), n = log.dilaporkan;
        if (!grouped[u]) grouped[u] = {};
        if (!grouped[u][n]) grouped[u][n] = { list: [], pelapor: [] };
        grouped[u][n].list.push(log.keterangan);
        grouped[u][n].pelapor.push(log.pelapor);
      }
    });

    let html = '';
    if (Object.keys(grouped).length === 0) html = '<div class="empty-state">Nihil Laporan.</div>';
    else {
      for (let u in grouped) {
        html += `<div class="usrah-group"><div class="usrah-title">🏠 Usrah ${u}</div><table><tr><th>Nama</th><th>Daftar Kejadian</th><th>Info Pelapor</th></tr>`;
        for (let nama in grouped[u]) {
          let kejadianHTML = grouped[u][nama].list.map(k => `<div class="list-item">${k}</div>`).join('');
          let pelaporHTML = grouped[u][nama].pelapor.map(p => `
            <div class="pelapor-rahasia" onclick="togglePelapor(this, '${p}')" style="margin-bottom:4px;">
              <span>🔒 ••••••••</span>
            </div>`).join('<br>');
          html += `<tr><td><b>${nama}</b></td><td>${kejadianHTML}</td><td>${pelaporHTML}</td></tr>`;
        }
        html += `</table></div>`;
      }
    }
    document.getElementById('containerLaporan').innerHTML = html;
  }

  function renderAbsensi(tgl) {
    let grouped = {}; 
    [allData.absenHarian, allData.absenKBM].forEach(db => {
      Object.values(db).forEach(log => {
        if(log.tanggal === tgl && log.data) {
          log.data.forEach(s => {
            let st = s.status?.toLowerCase();
            if(st === 'alfa' || st === 'terlambat') {
              let u = getUsrah(s.nama), n = s.nama;
              if(!grouped[u]) grouped[u] = {};
              if(!grouped[u][n]) grouped[u][n] = [];
              grouped[u][n].push({ status: s.status, kegiatan: log.program || log.mapel });
            }
          });
        }
      });
    });

    let html = '';
    if (Object.keys(grouped).length === 0) html = '<div class="empty-state">Disiplin Terjaga.</div>';
    else {
      for (let u in grouped) {
        html += `<div class="usrah-group"><div class="usrah-title">🏠 Usrah ${u}</div><table><tr><th>Nama</th><th>Keterangan Absensi</th></tr>`;
        for (let nama in grouped[u]) {
          let itemHTML = grouped[u][nama].map(i => `
            <div class="list-item">
              <span class="badge ${i.status.toLowerCase()==='alfa'?'b-alpa':'b-telat'}">${i.status}</span>
              ${i.kegiatan}
            </div>`).join('');
          html += `<tr><td><b>${nama}</b></td><td>${itemHTML}</td></tr>`;
        }
        html += `</table></div>`;
      }
    }
    document.getElementById('containerAbsen').innerHTML = html;
  }

  function renderSetoran(tgl) {
    let sudah = [];
    Object.values(allData.setoran).forEach(log => { if(log.tanggal === tgl && log.data) log.data.forEach(s => sudah.push(s.nama)); });
    let belum = SANTRI_TAHFIZ.filter(n => !sudah.includes(n));
    let html = '';
    if(!belum.length) html = '<div class="empty-state">Selesai Semua.</div>';
    else {
      let grp = {}; belum.forEach(n => { let u = getUsrah(n); if(!grp[u]) grp[u] = []; grp[u].push(n); });
      for(let u in grp) {
        html += `<div class="usrah-group"><div class="usrah-title">🏠 Usrah ${u}</div><table>`;
        grp[u].forEach(n => { html += `<tr><td>${n}</td><td style="color:var(--danger-main)">Belum Setoran</td></tr>`; });
        html += `</table></div>`;
      }
    }
    document.getElementById('containerSetoran').innerHTML = html;
  }

  window.togglePelapor = function(el, nama) {
    const span = el.querySelector('span');
    if(span.textContent.includes('••••')) { span.textContent = '👁️ ' + nama; el.style.color = 'white'; }
    else { span.textContent = '🔒 ••••••••'; el.style.color = '#94a3b8'; }
  };
</script>
</body>
</html>
