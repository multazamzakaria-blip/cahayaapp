<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Pantauan Disiplin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --danger-main: #ef4444;
      --warning-main: #f59e0b;
      --info-main: #38bdf8;
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #f8fafc; }
    
    .btn-back {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px; cursor: pointer;
    }

    main { max-width: 900px; margin: 40px auto; padding: 0 20px; padding-bottom: 60px; }

    .filter-box {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
      padding: 20px; border-radius: 16px; margin-bottom: 30px;
      display: flex; align-items: center; justify-content: space-between; gap: 15px;
      flex-wrap: wrap;
    }
    .filter-box label { font-weight: 600; color: #d4af37; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px;}
    .filter-box input[type="date"] {
      padding: 12px 20px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.4);
      background: rgba(0,0,0,0.5); color: white; font-family: inherit; font-size: 1rem;
      outline: none; cursor: pointer;
    }
    .filter-box input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    .section-title { font-family: 'Playfair Display', serif; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; margin-top: 50px; margin-bottom: 20px; font-size: 1.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .title-lapor { color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
    .title-absen { color: #fcd34d; border-color: rgba(245, 158, 11, 0.3); }
    .title-setor { color: #bae6fd; border-color: rgba(56, 189, 248, 0.3); }

    .usrah-group { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .usrah-title { color: var(--accent-gold); font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; background: rgba(255,255,255,0.02); border-radius: 12px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { background: rgba(0,0,0,0.4); color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 0.8rem; }
    tr:hover { background: rgba(255,255,255,0.05); }
    
    .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .b-alpa { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .b-telat { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }

    .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; background: rgba(0,0,0,0.2); border-radius: 12px; }
    
    .keterangan-sumber { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; display: block; }
    .highlight-kegiatan { color: #d4af37; font-weight: 600; }

    /* CSS KHUSUS PELAPOR RAHASIA */
    .pelapor-rahasia {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); cursor: pointer;
      color: #94a3b8; transition: 0.3s;
    }
    .pelapor-rahasia:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); color: white; }
    .pelapor-ikon { font-size: 0.8rem; opacity: 0.7; }
  </style>
</head>
<body>

<header>
  <h1>Pantauan Disiplin Asrama</h1>
  <button class="btn-back" onclick="window.location.href='dashboard.html'">Kembali</button>
</header>

<main>
  <div class="filter-box">
    <label>📅 Pantauan Tanggal:</label>
    <input type="date" id="filterTanggal" onchange="prosesData()">
  </div>

  <div id="loadingIndicator" style="text-align:center; padding: 40px; display:none; color: #d4af37; font-style:italic;">
    ⏳ Menarik seluruh data asrama...
  </div>

  <div id="dataContainer">
    <h2 class="section-title title-lapor">🚨 Santri Terlapor (Berdasarkan Usrah)</h2>
    <div id="containerLaporan"><div class="empty-state">Memuat...</div></div>

    <h2 class="section-title title-absen">⚠️ Indisipliner Absensi (Alfa / Telat)</h2>
    <div id="containerAbsen"><div class="empty-state">Memuat...</div></div>

    <h2 class="section-title title-setor">📖 Belum Setoran Al-Qur'an (Khusus Tahfiz)</h2>
    <div id="containerSetoran"><div class="empty-state">Memuat...</div></div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MASTER_SANTRI = {
    "Kamal": ["ADITYA PUTRA IBRAHIM","AIRLANGGA AZKA ABQORI","AQIELA MARSYAH","BRILLY HANDRIAN","DARREN ATHAYA","DZIKRI MUDHOFFAR","ELLENO QUTHBIE HERMAWAN","FADIL NURHALIM","GABRIEL AL FATIH","HADINATA SAPUTRA","MIKO VAJAR","M. ALMISKY PRATAMA","M. AQIL RIDHO","M. IZAM SAPUTRA","M. SYAKIR HUTABARAT","M. YASIR AL FAZAR JHIRA","M. ZIYAD ZHAZHA","RAFA","WAHYU REYDINATA","NIZAM KABISAT","JUANDA NUR ILHAM","M. DIRGATAMA","DAFFA AL MUSYARI","MOHAMMAD IKHSAN HAIRULI","REYFAS RAMADHAN","FALIZH DAFFA QATRUNNADA","HAFIDZ AL ROZI","CANZA RYANDA HUTASUHUT","NAJMIHADI SYAUQII TAMAAM","EZA FEBRI AL FADZRI"],
    "Favian": ["ABDULLAH MUKTI HAFIDZALLAH","AHMAD RIYADI","AKBAR PRAYOGA","ALIF MUHAMMAD YUSUF","ALVIN HERFIANTINO","ANDES AFENDRA","BASRI AL HAZIQ ZULFAHMI","AHMAD MAULANA","DANANG PRASDITYA SANTOSO","DEDI SETIADI","DIKKI KURNIAWAN","FAKHRI AL MUZAKKI","FEBRI GHALIH AL FAROBI","GHOZY FATURRAHMAN","ILHAM MUKMIN AL FARABI","M. AL FALAH","M. FAQIH HAFIDZALLAH","M. FIRAAS AL INSYIROH","MUHAMMAD ALLAM NUR HUSHAIN","M. RAID MAHRUS","M. RIJALUL KAMIL","NABIL NAJMI","RADEN AZAA PANCA PUTRA","RAFI RAMADHAN","SATRIO ABIMAYU","TEGAR HIDAYAT","VERY SYACH","WAFII FADHLURROHMAN","ZAHIR ZIBRAN","ZULFAKIH HAERUNNASIHIN"],
    "Shafwan": ["ANGGA PRATAMA PUTRA","KI AGUS MUHAMMAD ABDULLAH SHIDDIQ AGTSALI","MIKA RAHIEL YUSUF","PRAWIRO PUJO TUNGGAL JATI","M. XAVI NF","REYNALDI MALIK IBRAHIM ALFARIDZI","FAHRIE OKTAVIRANO FITRIS","FARAZH SAYYID PUTRA KENEGA","LUTHFAN ADZAKI","MARFEL SAPUTRA","MELDI NOVRIANSYAH","ALIF SAMUDRA","ARYA DIFA ALSYA","FAUZAN IBNI JABAR","HAFIDZ ALRIZKY","M. ABIL IRWANSYAH","M. FADHIL BUANA","M. FAISAL FIKRIANSYAH","NAUFAL AKBAR ALKHATIRI","QHEIZAN ALQIZA ARISDA","REZFY FAKHRYAZKA","SYAHRUL RAMADHAN","ROID AFDAL","ROHADIN FIRDAUS AL QAUSAR","RENAL MARTIN","RAKA SEPTIAN","NAFIS","M. USAMAH","MUHAMAD YUSUF ARROSIYD","MAHESA AULIA GIFFARI","M. ARYA MAHDI WAFI EL-FAUZANI","ILHAM","IHZA TRINANDI","HABIB RAMADHAN","FAHRY AKBAR RAMDHANI","CAHYIS ISZAM","ANUGRAH PRATAMA","AHMAD FARHAAN"],
    "Fatimah": ["QELZA RAMADHANI ATH THAHIRAH","ASHIFA FITRI RAMADHONI","ADIBA AILA KHANZA","AISYAH NUR KHALIFAH","NYAYU MARLITSA ARDHANI","WILDA","WINDY WINDARI","AISYAH NURUL AULIA","NESSYA RAMADHANY","AMIRAH BALQIS RAHADATUL A'ISYAH","EARLYTA ARSYFA SALSABILA","DAFIA NAFLA SYAKIRA","ANISYA SEPTIANI"],
    "Evita": ["BILQIS NUR ANISAH","JESSICA PUTRY AYRA","GHENIS ANDIENTIAZ","DINA RUHAYAH","PITRI RAMADANI","GRINNETA NALANI PUTRI","INAYAH NOURAH ANINDYA","SHELENA","FITRAH KIRANA"]
  };

  let mapSantriUsrah = {};
  for (const [usrah, list] of Object.entries(MASTER_SANTRI)) {
    list.forEach(nama => mapSantriUsrah[nama] = usrah);
  }

  function getUsrah(namaSantri) {
    return mapSantriUsrah[namaSantri] || "Usrah Tidak Diketahui";
  }

  const SANTRI_TAHFIZ = [
    "M. AL FALAH", "MIKA RAHIEL YUSUF", "ANGGA PRATAMA PUTRA", "NIZAM KABISAT", "PRAWIRO PUJO TUNGGAL JATI", "MAHESA AULIA GIFFARI", "NAJMIHADI SYAUQII TAMAAM", "MARFEL SAPUTRA", "MELDI NOVRIANSYAH", "RENAL MARTIN", "AHMAD RIYADI", "ABDULLAH MUKTI HAFIDZALLAH", "AKBAR PRAYOGA", "ANDES AFENDRA", "BASRI AL HAZIQ ZULFAHMI", "CANZA RYANDA HUTASUHUT", "DAFFA AL MUSYARI", "DANANG PRASDITYA SANTOSO", "FAKHRI AL MUZAKKI", "FALIZH DAFFA QATRUNNADA", "FEBRI GHALIH AL FAROBI", "HAFIDZ AL ROZI", "HAFIDZ ALRIZKY", "ILHAM MUKMIN AL FARABI", "LUTHFAN ADZAKI", "DIKKI KURNIAWAN", "ROID AFDAL", "IHZA TRINANDI", "ILHAM", "KI AGUS MUHAMMAD ABDULLAH SHIDDIQ AGTSALI",
    "AHMAD MAULANA", "ALIF MUHAMMAD YUSUF", "ARYA DIFA ALSYA", "FARAZH SAYYID PUTRA KENEGA", "GHOZY FATURRAHMAN", "M. FAQIH HAFIDZALLAH", "M. RIJALUL KAMIL", "MUHAMMAD ALLAM NUR HUSHAIN", "M. RAID MAHRUS", "NAFIS", "RAFI RAMADHAN", "REYNALDI MALIK IBRAHIM ALFARIDZI", "WAFII FADHLURROHMAN", "M. FADHIL BUANA", "M. FIRAAS AL INSYIROH", "M. XAVI NF", "NABIL NAJMI", "NAUFAL AKBAR ALKHATIRI", "QHEIZAN ALQIZA ARISDA", "REYFAS RAMADHAN", "ROHADIN FIRDAUS AL QAUSAR", "SATRIO ABIMAYU", "WAHYU REYDINATA", "ZAHIR ZIBRAN", "ZULFAKIH HAERUNNASIHIN", "HABIB RAMADHAN", "MUHAMAD YUSUF ARROSIYD", "VERY SYACH", "M. FAISAL FIKRIANSYAH", "TEGAR HIDAYAT",
    "WILDA", "NESSYA RAMADHANY", "GHENIS ANDIENTIAZ", "JESSICA PUTRY AYRA", "NYAYU MARLITSA ARDHANI", "GRINNETA NALANI PUTRI", "AMIRAH BALQIS RAHADATUL A'ISYAH", "BILQIS NUR ANISAH", "QELZA RAMADHANI ATH THAHIRAH"
  ];

  let allData = { lapor: {}, absenHarian: {}, absenKBM: {}, setoran: {} };

  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('filterTanggal').value = new Date().toISOString().split('T')[0];
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('dataContainer').style.display = 'none';

    try {
      const snaps = await Promise.all([
        get(ref(db, 'cahaya_app/log_lapor_inisiatif')),
        get(ref(db, 'cahaya_app/absensi_program_harian')),
        get(ref(db, 'cahaya_app/absensi_pembelajaran')),
        get(ref(db, 'cahaya_app/setoran_tahfiz'))
      ]);
      
      allData.lapor = snaps[0].val() || {};
      allData.absenHarian = snaps[1].val() || {};
      allData.absenKBM = snaps[2].val() || {};
      allData.setoran = snaps[3].val() || {};

      document.getElementById('loadingIndicator').style.display = 'none';
      document.getElementById('dataContainer').style.display = 'block';
      
      prosesData();
    } catch(err) {
      alert("Gagal memuat data dari server: " + err.message);
    }
  });

  window.prosesData = function() {
    const tglPilih = document.getElementById('filterTanggal').value;
    
    renderLaporan(tglPilih);
    renderAbsensi(tglPilih);
    renderSetoran(tglPilih);
  };

  // FUNGSI UNTUK MENGUBAH TAMPILAN NAMA PELAPOR SAAT DIKLIK
  window.togglePelapor = function(element, namaAsli) {
    const textSpan = element.querySelector('.pelapor-text');
    const iconSpan = element.querySelector('.pelapor-ikon');
    
    if (textSpan.textContent === '••••••••') {
      textSpan.textContent = namaAsli;
      iconSpan.textContent = '👁️';
    } else {
      textSpan.textContent = '••••••••';
      iconSpan.textContent = '🔒';
    }
  };

  function renderLaporan(tanggal) {
    let groupedData = {};
    let totalKasus = 0;

    Object.values(allData.lapor).forEach(log => {
      if (log.waktu && log.waktu.startsWith(tanggal) && log.tipe === "Lapor Pelanggaran") {
        let usrah = getUsrah(log.dilaporkan);
        if (!groupedData[usrah]) groupedData[usrah] = [];
        groupedData[usrah].push(log);
        totalKasus++;
      }
    });

    let html = '';
    if (totalKasus === 0) {
      html = `<div class="empty-state">Alhamdulillah, tidak ada laporan pelanggaran dari seluruh asrama hari ini.</div>`;
    } else {
      for (const [usrah, logs] of Object.entries(groupedData)) {
        html += `<div class="usrah-group">
                  <div class="usrah-title">🏠 Dari Usrah ${usrah}</div>
                  <table>
                    <tr><th width="30%">Santri Dilaporkan</th><th width="45%">Kejadian</th><th width="25%">Pelapor</th></tr>`;
        
        logs.forEach(log => {
          let pelaporRahasiaHTML = `
            <div class="pelapor-rahasia" onclick="togglePelapor(this, '${log.pelapor}')" title="Klik untuk melihat/menyembunyikan">
              <span class="pelapor-ikon">🔒</span>
              <span class="pelapor-text">••••••••</span>
            </div>
          `;
          html += `<tr>
            <td style="color:#fca5a5; font-weight:bold;">${log.dilaporkan}</td>
            <td>${log.keterangan}</td>
            <td>${pelaporRahasiaHTML}</td>
          </tr>`;
        });
        html += `</table></div>`;
      }
    }
    document.getElementById('containerLaporan').innerHTML = html;
  }

  function renderAbsensi(tanggal) {
    let listBermasalah = [];

    // Kumpulkan Harian
    Object.values(allData.absenHarian).forEach(log => {
      if (log.tanggal === tanggal && log.data) {
        log.data.forEach(s => {
          let st = (s.status || '').toLowerCase();
          if (st === 'alfa' || st === 'terlambat') {
            listBermasalah.push({ nama: s.nama, status: s.status, kegiatan: log.program, tipeKegiatan: "Program Harian" });
          }
        });
      }
    });

    // Kumpulkan KBM
    Object.values(allData.absenKBM).forEach(log => {
      if (log.tanggal === tanggal && log.data) {
        log.data.forEach(s => {
          let st = (s.status || '').toLowerCase();
          if (st === 'alfa' || st === 'terlambat') {
            listBermasalah.push({ nama: s.nama, status: s.status, kegiatan: log.mapel, tipeKegiatan: `KBM Kelas (${log.guru})` });
          }
        });
      }
    });

    let groupedData = {};
    let totalBermasalah = 0;

    listBermasalah.forEach(item => {
      let usrah = getUsrah(item.nama);
      if (!groupedData[usrah]) groupedData[usrah] = [];
      groupedData[usrah].push(item);
      totalBermasalah++;
    });

    let html = '';
    if (totalBermasalah === 0) {
      html = `<div class="empty-state">Alhamdulillah, seluruh santri asrama disiplin waktu hari ini.</div>`;
    } else {
      for (const [usrah, logs] of Object.entries(groupedData)) {
        html += `<div class="usrah-group">
                  <div class="usrah-title">🏠 Dari Usrah ${usrah}</div>
                  <table>
                    <tr><th width="35%">Nama Santri</th><th width="20%">Status</th><th width="45%">Detail Keterangan</th></tr>`;
        
        logs.forEach(item => {
          let badgeCls = item.status.toLowerCase() === 'alfa' ? 'b-alpa' : 'b-telat';
          html += `<tr>
            <td style="font-weight:bold; color:white;">${item.nama}</td>
            <td><span class="badge ${badgeCls}">${item.status}</span></td>
            <td>
              <span class="highlight-kegiatan">${item.kegiatan}</span>
              <span class="keterangan-sumber">Sumber: ${item.tipeKegiatan}</span>
            </td>
          </tr>`;
        });
        html += `</table></div>`;
      }
    }
    document.getElementById('containerAbsen').innerHTML = html;
  }

  function renderSetoran(tanggal) {
    let santriSudahSetor = [];

    // Kumpulkan semua santri yang sudah setor
    Object.values(allData.setoran).forEach(log => {
      if (log.tanggal === tanggal && log.data) {
        log.data.forEach(s => { santriSudahSetor.push(s.nama); });
      }
    });

    // Cek siapa dari total SANTRI_TAHFIZ yang BELUM setor
    let santriBelumSetor = SANTRI_TAHFIZ.filter(nama => !santriSudahSetor.includes(nama));

    let groupedData = {};
    let totalBelumSetor = 0;

    santriBelumSetor.forEach(nama => {
      let usrah = getUsrah(nama);
      if (!groupedData[usrah]) groupedData[usrah] = [];
      groupedData[usrah].push(nama);
      totalBelumSetor++;
    });

    let html = '';
    if (totalBelumSetor === 0) {
      html = `<div class="empty-state">Luar biasa! Seluruh santri Tahfiz di Pesantren sudah menyelesaikan setoran hari ini.</div>`;
    } else {
      for (const [usrah, logs] of Object.entries(groupedData)) {
        html += `<div class="usrah-group">
                  <div class="usrah-title">🏠 Dari Usrah ${usrah}</div>
                  <table>
                    <tr><th width="10%">No</th><th>Nama Santri Tahfiz (Belum Setor)</th></tr>`;
        
        logs.forEach((nama, index) => {
          html += `<tr>
            <td>${index + 1}</td>
            <td style="color:#fca5a5; font-weight:500;">
              ${nama} 
              <span class="keterangan-sumber">Wajib Setor Hafalan</span>
            </td>
          </tr>`;
        });
        html += `</table></div>`;
      }
    }
    document.getElementById('containerSetoran').innerHTML = html;
  }
</script>
</body>
</html>
