<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Pantauan Inisiatif Kebaikan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --accent-gold: #d4af37;
      --success-main: #10b981;
      --success-light: #34d399;
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--success-light); }
    
    .btn-back {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px; cursor: pointer;
    }

    main { max-width: 900px; margin: 40px auto; padding: 0 20px; padding-bottom: 60px; }

    .filter-box {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
      padding: 20px; border-radius: 16px; margin-bottom: 30px;
      display: flex; align-items: center; justify-content: space-between; gap: 15px;
    }
    .filter-box label { font-weight: 600; color: var(--success-light); font-size: 0.95rem; text-transform: uppercase; }
    .filter-box input[type="date"] {
      padding: 12px 20px; border-radius: 10px; border: 1px solid rgba(52, 211, 153, 0.4);
      background: rgba(0,0,0,0.5); color: white; font-family: inherit;
    }

    .section-title { font-family: 'Playfair Display', serif; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; margin-top: 30px; margin-bottom: 20px; font-size: 1.5rem; color: var(--success-light); }

    .usrah-group { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .usrah-title { color: var(--accent-gold); font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 15px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; background: rgba(255,255,255,0.02); border-radius: 12px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
    th { background: rgba(0,0,0,0.4); color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 0.8rem; }
    
    /* Style untuk daftar kebaikan */
    .kebaikan-item { margin-bottom: 8px; position: relative; padding-left: 18px; line-height: 1.4; }
    .kebaikan-item::before { content: "✨"; position: absolute; left: 0; font-size: 0.8rem; }

    .poin-rahasia {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); cursor: pointer;
      color: #94a3b8; font-weight: 600; min-width: 100px; justify-content: center;
    }
    .poin-rahasia.terbuka { background: rgba(16, 185, 129, 0.15); border-color: var(--success-light); color: var(--success-light); }

    .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>🌟 Pantauan Inisiatif Kebaikan</h1>
  <button class="btn-back" onclick="window.location.href='dashboard.html'">Kembali</button>
</header>

<main>
  <div class="filter-box">
    <label>📅 Tanggal:</label>
    <input type="date" id="filterTanggal" onchange="prosesData()">
  </div>

  <div id="loadingIndicator" style="text-align:center; padding: 40px; display:none; color: var(--success-light); font-style:italic;">
    ⏳ Mengumpulkan data amal saleh santri...
  </div>

  <div id="dataContainer">
    <h2 class="section-title">✨ Daftar Inisiator Kebaikan</h2>
    <div id="containerInisiatif"><div class="empty-state">Memuat...</div></div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MASTER_SANTRI = {
    "Kamal": ["ADITYA PUTRA IBRAHIM","AIRLANGGA AZKA ABQORI","AQIELA MARSYAH","BRILLY HANDRIAN","DARREN ATHAYA","DZIKRI MUDHOFFAR","ELLENO QUTHBIE HERMAWAN","FADIL NURHALIM","GABRIEL AL FATIH","HADINATA SAPUTRA","MIKO VAJAR","M. ALMISKY PRATAMA","M. AQIL RIDHO","M. IZAM SAPUTRA","M. SYAKIR HUTABARAT","M. YASIR AL FAZAR JHIRA","M. ZIYAD ZHAZHA","RAFA","WAHYU REYDINATA","NIZAM KABISAT","JUANDA NUR ILHAM","M. DIRGATAMA","DAFFA AL MUSYARI","MOHAMMAD IKHSAN HAIRULI","REYFAS RAMADHAN","FALIZH DAFFA QATRUNNADA","HAFIDZ AL ROZI","CANZA RYANDA HUTASUHUT","NAJMIHADI SYAUQII TAMAAM","EZA FEBRI AL FADZRI"],
    "Favian": ["ABDULLAH MUKTI HAFIDZALLAH","AHMAD RIYADI","AKBAR PRAYOGA","ALIF MUHAMMAD YUSUF","ALVIN HERFIANTINO","ANDES AFENDRA","BASRI AL HAZIQ ZULFAHMI","AHMAD MAULANA","DANANG PRASDITYA SANTOSO","DEDI SETIADI","DIKKI KURNIAWAN","FAKHRI AL MUZAKKI","FEBRI GHALIH AL FAROBI","GHOZY FATURRAHMAN","ILHAM MUKMIN AL FARABI","M. AL FALAH","M. FAQIH HAFIDZALLAH","M. FIRAAS AL INSYIROH","MUHAMMAD ALLAM NUR HUSHAIN","M. RAID MAHRUS","M. RIJALUL KAMIL","NABIL NAJMI","RADEN AZAA PANCA PUTRA","RAFI RAMADHAN","SATRIO ABIMAYU","TEGAR HIDAYAT","VERY SYACH","WAFII FADHLURROHMAN","ZAHIR ZIBRAN","ZULFAKIH HAERUNNASIHIN"],
    "Shafwan": ["ANGGA PRATAMA PUTRA","KI AGUS MUHAMMAD ABDULLAH SHIDDIQ AGTSALI","MIKA RAHIEL YUSUF","PRAWIRO PUJO TUNGGAL JATI","M. XAVI NF","REYNALDI MALIK IBRAHIM ALFARIDZI","FAHRIE OKTAVIRANO FITRIS","FARAZH SAYYID PUTRA KENEGA","LUTHFAN ADZAKI","MARFEL SAPUTRA","MELDI NOVRIANSYAH","ALIF SAMUDRA","ARYA DIFA ALSYA","FAUZAN IBNI JABAR","HAFIDZ ALRIZKY","M. ABIL IRWANSYAH","M. FADHIL BUANA","M. FAISAL FIKRIANSYAH","NAUFAL AKBAR ALKHATIRI","QHEIZAN ALQIZA ARISDA","REZFY FAKHRYAZKA","SYAHRUL RAMADHAN","ROID AFDAL","ROHADIN FIRDAUS AL QAUSAR","RENAL MARTIN","RAKA SEPTIAN","NAFIS","M. USAMAH","MUHAMAD YUSUF ARROSIYD","MAHESA AULIA GIFFARI","M. ARYA MAHDI WAFI EL-FAUZANI","ILHAM","IHZA TRINANDI","HABIB RAMADHAN","FAHRY AKBAR RAMDHANI","CAHYIS ISZAM","ANUGRAH PRATAMA","AHMAD FARHAAN"],
    "Fatimah": ["QELZA RAMADHANI ATH THAHIRAH","ASHIFA FITRI RAMADHONI","ADIBA AILA KHANZA","AISYAH NUR KHALIFAH","NYAYU MARLITSA ARDHANI","WILDA","WINDY WINDARI","AISYAH NURUL AULIA","NESSYA RAMADHANY","AMIRAH BALQIS RAHADATUL A'ISYAH","EARLYTA ARSYFA SALSABILA","DAFIA NAFLA SYAKIRA","ANISYA SEPTIANI"],
    "Evita": ["BILQIS NUR ANISAH","JESSICA PUTRY AYRA","GHENIS ANDIENTIAZ","DINA RUHAYAH","PITRI RAMADANI","GRINNETA NALANI PUTRI","INAYAH NOURAH ANINDYA","SHELENA","FITRAH KIRANA"]
  };

  let mapSantriUsrah = {};
  for (const [usrah, list] of Object.entries(MASTER_SANTRI)) {
    list.forEach(nama => mapSantriUsrah[nama] = usrah);
  }

  function getUsrah(nama) { return mapSantriUsrah[nama] || "Luar"; }

  let allDataInisiatif = {};

  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('filterTanggal').value = new Date().toISOString().split('T')[0];
    document.getElementById('loadingIndicator').style.display = 'block';
    try {
      const snap = await get(ref(db, 'cahaya_app/log_lapor_inisiatif'));
      allDataInisiatif = snap.val() || {};
      document.getElementById('loadingIndicator').style.display = 'none';
      prosesData();
    } catch(err) { alert(err.message); }
  });

  window.prosesData = function() {
    const tgl = document.getElementById('filterTanggal').value;
    renderInisiatif(tgl);
  };

  window.togglePoin = function(element, poin) {
    const text = element.querySelector('.poin-text');
    const icon = element.querySelector('.poin-ikon');
    if (text.textContent === '•••') {
      text.textContent = `+${poin} Poin`;
      icon.textContent = '👁️';
      element.classList.add('terbuka');
    } else {
      text.textContent = '•••';
      icon.textContent = '🔒';
      element.classList.remove('terbuka');
    }
  };

  // LOGIKA PENYEMPURNAAN: GROUPING BY NAME
  function renderInisiatif(tanggal) {
    let grouped = {}; // { usrah: { nama: { list: [], total: 0 } } }
    let hasData = false;

    Object.values(allDataInisiatif).forEach(log => {
      if (log.waktu?.startsWith(tanggal) && log.tipe === "Inisiatif Kebaikan") {
        let u = getUsrah(log.pelapor);
        let n = log.pelapor;
        let p = parseInt(log.poinDiberikan) || 0;

        if (!grouped[u]) grouped[u] = {};
        if (!grouped[u][n]) grouped[u][n] = { list: [], total: 0 };
        
        grouped[u][n].list.push(log.keterangan);
        grouped[u][n].total += p;
        hasData = true;
      }
    });

    let html = '';
    if (!hasData) {
      html = `<div class="empty-state">Belum ada catatan inisiatif kebaikan hari ini.</div>`;
    } else {
      for (const [usrah, students] of Object.entries(grouped)) {
        html += `<div class="usrah-group">
                  <div class="usrah-title">🏠 Usrah ${usrah}</div>
                  <table>
                    <tr><th width="30%">Nama Inisiator</th><th width="50%">Rangkuman Kebaikan</th><th width="20%">Total Apresiasi</th></tr>`;
        
        for (const [nama, data] of Object.entries(students)) {
          let kebaikanHTML = data.list.map(k => `<div class="kebaikan-item">${k}</div>`).join('');
          
          html += `<tr>
            <td style="font-weight:bold;">${nama}</td>
            <td>${kebaikanHTML}</td>
            <td>
              <div class="poin-rahasia" onclick="togglePoin(this, '${data.total}')">
                <span class="poin-ikon">🔒</span>
                <span class="poin-text">•••</span>
              </div>
            </td>
          </tr>`;
        }
        html += `</table></div>`;
      }
    }
    document.getElementById('containerInisiatif').innerHTML = html;
  }
</script>
</body>
</html>
