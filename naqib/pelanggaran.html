<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Tindak Kasus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --danger-main: #dc2626;
      --danger-dark: #7f1d1d;
      --danger-glow: rgba(220, 38, 38, 0.4);
      --accent-gold: #d4af37;
      
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(220, 38, 38, 0.3); /* Border kemerahan */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: 
        radial-gradient(circle at top right, rgba(220, 38, 38, 0.1), transparent 50%),
        radial-gradient(circle at bottom left, rgba(212, 175, 55, 0.05), transparent 40%),
        linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Texture */
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23d4af37' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
      pointer-events: none; z-index: -1;
    }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #fca5a5; letter-spacing: 1px; }
    
    .btn-back {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.3s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }

    main { max-width: 800px; margin: 40px auto; padding: 0 20px 80px; animation: fadeInUp 0.8s ease backwards; }
    @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* INFO BOX */
    .info-box {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.1), rgba(127, 29, 29, 0.2));
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 15px 20px; border-radius: 16px; font-size: 0.9rem; color: #fca5a5;
      margin-bottom: 30px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2); backdrop-filter: blur(10px);
    }

    /* FORM CARD */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 40px;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7);
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: -50px; right: -50px; width: 200px; height: 200px;
      background: radial-gradient(circle, var(--danger-glow) 0%, transparent 70%); pointer-events: none;
    }

    label { display: block; font-weight: 600; margin-top: 20px; margin-bottom: 8px; color: #fca5a5; font-size: 0.95rem; letter-spacing: 0.5px; text-transform: uppercase; }
    
    select, textarea, input { 
      width: 100%; padding: 14px 20px;
      border-radius: 12px; border: 1px solid rgba(220, 38, 38, 0.3);
      background: rgba(0,0,0,0.4); color: white;
      font-family: inherit; font-size: 1rem;
      transition: all 0.3s; outline: none; resize: vertical;
    }
    select:focus, textarea:focus, input:focus {
      border-color: var(--danger-main); box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15); background: rgba(0,0,0,0.6);
    }
    
    /* Auto Field */
    .auto-field { background: rgba(255,255,255,0.02); color: var(--text-muted); border-color: rgba(255,255,255,0.05); cursor: not-allowed; font-weight: bold; }

    .poin-preview { 
      margin-top: 15px; font-weight: bold; text-align: right; 
      color: #fca5a5; font-size: 1rem; font-family: 'Playfair Display', serif;
      letter-spacing: 1px;
    }
    .poin-number { font-size: 1.8rem; color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }

    /* SAVE BUTTON */
    .btn-save {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white; border: none; padding: 16px; width: 100%;
      border-radius: 16px; margin-top: 35px; font-weight: 700; font-size: 1.1rem;
      font-family: inherit; letter-spacing: 1px; cursor: pointer; transition: 0.3s;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
    }
    .btn-save:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(220, 38, 38, 0.6); filter: brightness(1.1); }
    .btn-save:disabled { background: #475569; cursor: not-allowed; box-shadow: none; transform: none; color: #94a3b8; }

    /* TABLE */
    .table-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #fca5a5; margin-top: 50px; margin-bottom: 20px; border-bottom: 1px solid rgba(220,38,38,0.2); padding-bottom: 10px; }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 0.9rem; }
    thead th { text-align: left; padding: 10px 15px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    
    tbody tr { background: rgba(255,255,255,0.03); border-radius: 12px; transition: 0.2s; }
    tbody tr:hover { background: rgba(255,255,255,0.05); }
    
    tbody td { padding: 15px; border-top: 1px solid transparent; border-bottom: 1px solid transparent; color: var(--text-main); }
    tbody td:first-child { border-left: 1px solid transparent; border-radius: 12px 0 0 12px; color: var(--text-muted); }
    tbody td:last-child { border-right: 1px solid transparent; border-radius: 0 12px 12px 0; color: #fca5a5; }

    @media(max-width: 600px) {
      .card { padding: 25px; }
      table { font-size: 0.8rem; }
      tbody td { padding: 10px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Tindak Kasus</h1>
  <button class="btn-back" onclick="window.location.href='dashboard.html'">Kembali</button>
</header>

<main>
  <div class="info-box">
    <span style="font-size: 1.2rem;">⚠️</span>
    <span>Otorisasi Naqib: Data santri otomatis difilter berdasarkan anggota Usrah Anda.</span>
  </div>

  <div class="card">
    <label>Nama Santri Terhukum</label>
    <select id="namaSantri">
      <option value="">-- Memuat Data --</option>
    </select>

    <label>Jenis Pelanggaran</label>
    <select id="namaPelanggaran" onchange="autoSetKategori()">
      <option value="">-- Pilih Jenis Pelanggaran --</option>
    </select>

    <label>Kategori Sistem</label>
    <input type="text" id="kategoriDisplay" class="auto-field" readonly placeholder="Terisi otomatis berdasarkan jenis pelanggaran...">
    
    <div id="previewPoin" class="poin-preview"></div>

    <label>Kronologi / Keterangan Kejadian</label>
    <textarea id="keterangan" rows="2" placeholder="Tuliskan detail spesifik kejadian..."></textarea>

    <label>Tindak Lanjut & Sanksi Diberikan</label>
    <textarea id="tindakLanjut" rows="2" placeholder="Contoh: Push up 50x, Hafalan surat, Pemanggilan Orang Tua..."></textarea>

    <button id="btnEksekusi" class="btn-save" onclick="simpanPelanggaran()">EKSEKUSI POTONG POIN</button>
  </div>

  <h3 class="table-title">Riwayat Input Hari Ini</h3>
  <table id="tabelPelanggaran">
    <thead>
      <tr>
        <th width="5%">No</th>
        <th width="30%">Santri</th>
        <th width="35%">Pelanggaran</th>
        <th width="30%">Sanksi</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  // === DATABASE 65 PELANGGARAN ===
  const DAFTAR_PELANGGARAN = [
    { no:1, nama:"Seragam tidak sesuai", kat:"Ringan" },
    { no:2, nama:"Membuat keributan di masjid", kat:"Ringan" },
    { no:3, nama:"Bermain ketika dzikir", kat:"Ringan" },
    { no:4, nama:"Tidak puasa sunnah", kat:"Ringan" },
    { no:5, nama:"Berkata kotor/tidak sopan", kat:"Ringan" },
    { no:6, nama:"Terlambat bangun tidur", kat:"Ringan" },
    { no:7, nama:"Terlambat kegiatan wajib", kat:"Ringan" },
    { no:8, nama:"Tidak berbahasa resmi", kat:"Ringan" },
    { no:9, nama:"Pakaian tidak rapi keluar kamar", kat:"Ringan" },
    { no:10, nama:"Gantung pakaian kotor di kamar", kat:"Ringan" },
    { no:11, nama:"Sandal tidak di rak", kat:"Ringan" },
    { no:12, nama:"Barang berserakan", kat:"Ringan" },
    { no:13, nama:"Lalai piket kebersihan", kat:"Ringan" },
    { no:14, nama:"Buang sampah sembarangan", kat:"Ringan" },
    { no:15, nama:"Ribut saat istirahat", kat:"Ringan" },
    { no:16, nama:"Tidur saat jam belajar", kat:"Ringan" },
    { no:17, nama:"Coret-coret buku/alat", kat:"Ringan" },
    { no:18, nama:"Baca komik/majalah tidak mendidik", kat:"Ringan" },
    { no:19, nama:"Di kamar saat jam kegiatan", kat:"Ringan" },
    { no:20, nama:"Ke masjid tanpa perlengkapan", kat:"Ringan" },
    { no:21, nama:"Potong rambut model aneh", kat:"Ringan" },
    { no:22, nama:"Pakaian ketat/mencolok", kat:"Ringan" },
    { no:23, nama:"Tidak cuci piring", kat:"Ringan" },
    { no:24, nama:"Tempat tidur berantakan", kat:"Ringan" },
    { no:25, nama:"Masuk kamar orang lain", kat:"Ringan" },
    { no:26, nama:"Keluar pondok tanpa izin (sebentar)", kat:"Sedang" },
    { no:27, nama:"Merokok / Vaping", kat:"Sedang" },
    { no:28, nama:"Simpan HP/Elektronik (Ringan)", kat:"Sedang" },
    { no:29, nama:"Vandalisme ringan fasilitas", kat:"Sedang" },
    { no:30, nama:"Berkelahi ringan/cekcok", kat:"Sedang" },
    { no:31, nama:"Berbohong kepada pengurus", kat:"Sedang" },
    { no:32, nama:"Simpan konten tidak pantas", kat:"Sedang" },
    { no:33, nama:"Mengganggu santri lain (fisik)", kat:"Sedang" },
    { no:34, nama:"Bawa uang saku berlebih", kat:"Sedang" },
    { no:35, nama:"Alpa Ujian/KBM", kat:"Sedang" },
    { no:36, nama:"Rambut gondrong", kat:"Sedang" },
    { no:37, nama:"Kosmetik berlebihan", kat:"Sedang" },
    { no:38, nama:"Bawa alat masak/bahaya api", kat:"Sedang" },
    { no:39, nama:"Perundungan verbal (Ejekan)", kat:"Sedang" },
    { no:40, nama:"Palsukan tanda tangan ringan", kat:"Sedang" },
    { no:41, nama:"Melanggar jam malam", kat:"Sedang" },
    { no:42, nama:"Aktivitas membahayakan", kat:"Sedang" },
    { no:43, nama:"Sebar gosip/isu", kat:"Sedang" },
    { no:44, nama:"Main Medsos tanpa izin", kat:"Sedang" },
    { no:45, nama:"Pelanggaran ringan berulang (3x)", kat:"Sedang" },
    { no:46, nama:"Mencuri (Sariqah)", kat:"Berat" },
    { no:47, nama:"Narkoba / Miras", kat:"Berat" },
    { no:48, nama:"Zina / Asusila Berat", kat:"Berat" },
    { no:49, nama:"Judi / Taruhan", kat:"Berat" },
    { no:50, nama:"Berkelahi (Cedera Serius)", kat:"Berat" },
    { no:51, nama:"Bawa Senjata Tajam", kat:"Berat" },
    { no:52, nama:"Kabur (Minggat) lama", kat:"Berat" },
    { no:53, nama:"Bullying Sistematis (Trauma)", kat:"Berat" },
    { no:54, nama:"Melawan/Ancam Guru (Fisik)", kat:"Berat" },
    { no:55, nama:"Merusak Fasilitas (Berat)", kat:"Berat" },
    { no:56, nama:"Demo/Merusak nama baik", kat:"Berat" },
    { no:57, nama:"Paham Radikal", kat:"Berat" },
    { no:58, nama:"Hasut tindakan kriminal", kat:"Berat" },
    { no:59, nama:"Pemerasan (Malak)", kat:"Berat" },
    { no:60, nama:"Menipu Orang Tua/Pondok", kat:"Berat" },
    { no:61, nama:"Palsukan surat penting", kat:"Berat" },
    { no:62, nama:"Hubungan sejenis (Homoseksual)", kat:"Berat" },
    { no:63, nama:"Pemberontakan massal", kat:"Berat" },
    { no:64, nama:"Pelanggaran Sedang Berulang", kat:"Berat" },
    { no:65, nama:"Pelanggaran Berat Lainnya", kat:"Berat" }
  ];

  const POIN_DENDA = { "Ringan": -10, "Sedang": -30, "Berat": -100 };

  const currentUser = JSON.parse(localStorage.getItem('cahayaCurrentUser') || '{}');
  const kelompok = JSON.parse(localStorage.getItem('kelompokNaqib') || '[]');

  document.addEventListener('DOMContentLoaded', () => {
    if (!currentUser || currentUser.role !== 'naqib') {
      alert("Sesi habis. Login kembali."); window.location.href='../index.html'; return;
    }

    const selectSantri = document.getElementById('namaSantri');
    selectSantri.innerHTML = '<option value="">-- Pilih Santri --</option>';
    if(kelompok.length === 0) {
        selectSantri.innerHTML = '<option value="">(Kosong) Data Usrah tidak ditemukan</option>';
    } else {
        kelompok.forEach(nama => {
            const opt = document.createElement('option');
            opt.value = nama; opt.text = nama;
            selectSantri.appendChild(opt);
        });
    }

    const selectPel = document.getElementById('namaPelanggaran');
    DAFTAR_PELANGGARAN.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.no;
        opt.text = `${p.no}. ${p.nama} (${p.kat})`;
        selectPel.appendChild(opt);
    });
  });

  window.autoSetKategori = function() {
    const no = document.getElementById('namaPelanggaran').value;
    const inputKat = document.getElementById('kategoriDisplay');
    const divPoin = document.getElementById('previewPoin');

    if (!no) {
        inputKat.value = ""; divPoin.innerHTML = ""; return;
    }

    const data = DAFTAR_PELANGGARAN.find(p => p.no == no);
    if (data) {
        inputKat.value = data.kat; 
        const denda = POIN_DENDA[data.kat];
        divPoin.innerHTML = `Sanksi Poin Kedisiplinan: <br><span class="poin-number">${denda}</span>`;
    }
  };

  window.simpanPelanggaran = function() {
    const santri = document.getElementById('namaSantri').value;
    const noPelanggaran = document.getElementById('namaPelanggaran').value;
    const ket = document.getElementById('keterangan').value;
    const tindakLanjut = document.getElementById('tindakLanjut').value;
    const naqib = currentUser.username || "Naqib";

    if (!santri || !noPelanggaran) { alert("⚠️ Lengkapi Nama Santri dan Jenis Pelanggaran!"); return; }

    const dataPel = DAFTAR_PELANGGARAN.find(p => p.no == noPelanggaran);
    const denda = POIN_DENDA[dataPel.kat];

    if(!confirm(`⚠️ KONFIRMASI TINDAK KASUS\n\nSantri: ${santri}\nKasus: ${dataPel.nama}\n\nPoin santri akan dikurangi ${denda}. Lanjutkan?`)) return;

    const btn = document.getElementById('btnEksekusi');
    btn.innerHTML = "⏳ MENGIRIM DATA..."; btn.disabled = true;

    const logKasus = {
      tanggal: new Date().toISOString().split('T')[0],
      santri: santri,
      kategori: dataPel.kat,
      namaPelanggaran: dataPel.nama,
      keterangan: ket,
      tindakLanjut: tindakLanjut,
      naqib: naqib,
      waktuSimpan: new Date().toISOString()
    };

    const logPoin = {
      namaSantri: santri,
      poin: denda,
      keterangan: `[PELANGGARAN ${dataPel.kat.toUpperCase()}] ${dataPel.nama}`,
      admin: naqib,
      waktu: new Date().toISOString()
    };

    Promise.all([
        push(ref(db, 'cahaya_app/pelanggaran_santri'), logKasus),
        push(ref(db, 'cahaya_app/poin_manual'), logPoin)
    ]).then(() => {
        alert("✅ Kasus tercatat & Poin berhasil dipotong.");
        
        const tbody = document.querySelector('#tabelPelanggaran tbody');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${tbody.children.length+1}</td><td>${santri}</td><td>${dataPel.nama}</td><td>${tindakLanjut || '-'}</td>`;
        tbody.prepend(tr);

        document.getElementById('keterangan').value = '';
        document.getElementById('tindakLanjut').value = '';
        btn.innerHTML = "EKSEKUSI POTONG POIN"; btn.disabled = false;
    }).catch(e => {
        alert("Error Database: " + e.message);
        btn.innerHTML = "EKSEKUSI POTONG POIN"; btn.disabled = false;
    });
  };
</script>

</body>
</html>
