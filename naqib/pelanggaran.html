<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP - Form Pelanggaran Santri</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --primary: #dc2626; --bg-gradient: radial-gradient(circle at top left, #fef2f2, #fff1f2 40%, #fff); }
    body { font-family: 'Poppins', sans-serif; background: var(--bg-gradient); color: #7f1d1d; margin: 0; padding: 0; }

    header { background: linear-gradient(135deg, #b91c1c, #ef4444); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(220, 38, 38, 0.3); }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }

    main { padding: 20px; max-width: 800px; margin: 0 auto; }

    .card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #fecaca; }
    
    label { display: block; font-weight: 600; margin-top: 15px; color: #991b1b; }
    select, textarea, input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #fca5a5; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; }
    select:focus, textarea:focus { outline: none; border-color: #dc2626; }
    
    /* Field Kategori Otomatis (Read-Only) */
    .auto-field { background: #f3f4f6; color: #6b7280; border-color: #d1d5db; cursor: not-allowed; font-weight: bold; }

    .poin-preview { margin-top: 10px; font-weight: bold; text-align: right; color: #dc2626; font-size: 0.9rem; }

    button.btn-save { background: #dc2626; color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; margin-top: 25px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4); }
    button.btn-save:hover { background: #b91c1c; transform: translateY(-2px); }

    /* Tabel Riwayat */
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 30px; font-size: 0.85rem; }
    thead th { text-align: left; padding: 10px; color: #7f1d1d; }
    tbody tr { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    tbody td { padding: 12px; border-top: 1px solid #fee2e2; }
    tbody td:first-child { border-left: 1px solid #fee2e2; border-radius: 10px 0 0 10px; }
    tbody td:last-child { border-right: 1px solid #fee2e2; border-radius: 0 10px 10px 0; }
  </style>
</head>
<body>

<header>
  <h1>🚨 Input Pelanggaran</h1>
  <button onclick="window.location.href='dashboard.html'">Kembali</button>
</header>

<main>
  <div style="background:#fef2f2; padding:12px; border-radius:8px; border:1px solid #fecaca; font-size:0.9rem; color:#b91c1c; margin-bottom:20px;">
    <strong>Info Naqib:</strong> Data santri otomatis diambil dari anggota Usrah Anda.
  </div>

  <div class="card">
    <label>Nama Santri (Usrah Anda)</label>
    <select id="namaSantri">
      <option value="">-- Memuat Data --</option>
    </select>

    <label>Jenis Pelanggaran</label>
    <select id="namaPelanggaran" onchange="autoSetKategori()">
      <option value="">-- Pilih Pelanggaran --</option>
      </select>

    <label>Kategori (Otomatis)</label>
    <input type="text" id="kategoriDisplay" class="auto-field" readonly placeholder="Otomatis terisi...">
    
    <div id="previewPoin" class="poin-preview"></div>

    <label>Keterangan Tambahan / Kronologi</label>
    <textarea id="keterangan" rows="2" placeholder="Detail kejadian..."></textarea>

    <label>Tindak Lanjut dan Konskuensi</label>
    <textarea id="tindakLanjut" rows="2" placeholder="Contoh: Push up, membersihkan WC, nasihat..."></textarea>

    <button class="btn-save" onclick="simpanPelanggaran()">⚖️ HUKUM & POTONG POIN</button>
  </div>

  <h3 style="margin-top:40px; color:#991b1b;">Riwayat Input Hari Ini</h3>
  <table id="tabelPelanggaran">
    <thead>
      <tr><th>No</th><th>Santri</th><th>Pelanggaran</th><th>Hukuman</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  // === DATABASE 65 PELANGGARAN ===
  const DAFTAR_PELANGGARAN = [
    // RINGAN (-10)
    { no:1, nama:"Seragam tidak sesuai", kat:"Ringan" },
    { no:2, nama:"Membuat keributan di masjid", kat:"Ringan" },
    { no:3, nama:"Bermain ketika dzikir", kat:"Ringan" },
    { no:4, nama:"Tidak puasa sunnah", kat:"Ringan" },
    { no:5, nama:"Berkata kotor/tidak sopan", kat:"Ringan" },
    { no:6, nama:"Terlambat bangun tidur", kat:"Ringan" },
    { no:7, nama:"Terlambat kegiatan wajib", kat:"Ringan" },
    { no:8, nama:"Tidak berbahasa resmi", kat:"Ringan" },
    { no:9, nama:"Pakaian tidak rapi keluar kamar", kat:"Ringan" },
    { no:10, nama:"Gantung pakaian kotor di kamar", kat:"Ringan" },
    { no:11, nama:"Sandal tidak di rak", kat:"Ringan" },
    { no:12, nama:"Barang berserakan", kat:"Ringan" },
    { no:13, nama:"Lalai piket kebersihan", kat:"Ringan" },
    { no:14, nama:"Buang sampah sembarangan", kat:"Ringan" },
    { no:15, nama:"Ribut saat istirahat", kat:"Ringan" },
    { no:16, nama:"Tidur saat jam belajar", kat:"Ringan" },
    { no:17, nama:"Coret-coret buku/alat", kat:"Ringan" },
    { no:18, nama:"Baca komik/majalah tidak mendidik", kat:"Ringan" },
    { no:19, nama:"Di kamar saat jam kegiatan", kat:"Ringan" },
    { no:20, nama:"Ke masjid tanpa perlengkapan", kat:"Ringan" },
    { no:21, nama:"Potong rambut model aneh", kat:"Ringan" },
    { no:22, nama:"Pakaian ketat/mencolok", kat:"Ringan" },
    { no:23, nama:"Tidak cuci piring", kat:"Ringan" },
    { no:24, nama:"Tempat tidur berantakan", kat:"Ringan" },
    { no:25, nama:"Masuk kamar orang lain", kat:"Ringan" },

    // SEDANG (-30)
    { no:26, nama:"Keluar pondok tanpa izin (sebentar)", kat:"Sedang" },
    { no:27, nama:"Merokok / Vaping", kat:"Sedang" },
    { no:28, nama:"Simpan HP/Elektronik (Ringan)", kat:"Sedang" },
    { no:29, nama:"Vandalisme ringan fasilitas", kat:"Sedang" },
    { no:30, nama:"Berkelahi ringan/cekcok", kat:"Sedang" },
    { no:31, nama:"Berbohong kepada pengurus", kat:"Sedang" },
    { no:32, nama:"Simpan konten tidak pantas", kat:"Sedang" },
    { no:33, nama:"Mengganggu santri lain (fisik)", kat:"Sedang" },
    { no:34, nama:"Bawa uang saku berlebih", kat:"Sedang" },
    { no:35, nama:"Alpa Ujian/KBM", kat:"Sedang" },
    { no:36, nama:"Rambut gondrong", kat:"Sedang" },
    { no:37, nama:"Kosmetik berlebihan", kat:"Sedang" },
    { no:38, nama:"Bawa alat masak/bahaya api", kat:"Sedang" },
    { no:39, nama:"Perundungan verbal (Ejekan)", kat:"Sedang" },
    { no:40, nama:"Palsukan tanda tangan ringan", kat:"Sedang" },
    { no:41, nama:"Melanggar jam malam", kat:"Sedang" },
    { no:42, nama:"Aktivitas membahayakan", kat:"Sedang" },
    { no:43, nama:"Sebar gosip/isu", kat:"Sedang" },
    { no:44, nama:"Main Medsos tanpa izin", kat:"Sedang" },
    { no:45, nama:"Pelanggaran ringan berulang (3x)", kat:"Sedang" },

    // BERAT (-100)
    { no:46, nama:"Mencuri (Sariqah)", kat:"Berat" },
    { no:47, nama:"Narkoba / Miras", kat:"Berat" },
    { no:48, nama:"Zina / Asusila Berat", kat:"Berat" },
    { no:49, nama:"Judi / Taruhan", kat:"Berat" },
    { no:50, nama:"Berkelahi (Cedera Serius)", kat:"Berat" },
    { no:51, nama:"Bawa Senjata Tajam", kat:"Berat" },
    { no:52, nama:"Kabur (Minggat) lama", kat:"Berat" },
    { no:53, nama:"Bullying Sistematis (Trauma)", kat:"Berat" },
    { no:54, nama:"Melawan/Ancam Guru (Fisik)", kat:"Berat" },
    { no:55, nama:"Merusak Fasilitas (Berat)", kat:"Berat" },
    { no:56, nama:"Demo/Merusak nama baik", kat:"Berat" },
    { no:57, nama:"Paham Radikal", kat:"Berat" },
    { no:58, nama:"Hasut tindakan kriminal", kat:"Berat" },
    { no:59, nama:"Pemerasan (Malak)", kat:"Berat" },
    { no:60, nama:"Menipu Orang Tua/Pondok", kat:"Berat" },
    { no:61, nama:"Palsukan surat penting", kat:"Berat" },
    { no:62, nama:"Hubungan sejenis (Homoseksual)", kat:"Berat" },
    { no:63, nama:"Pemberontakan massal", kat:"Berat" },
    { no:64, nama:"Pelanggaran Sedang Berulang", kat:"Berat" },
    { no:65, nama:"Pelanggaran Berat Lainnya", kat:"Berat" }
  ];

  const POIN_DENDA = { "Ringan": -10, "Sedang": -30, "Berat": -100 };

  const currentUser = JSON.parse(localStorage.getItem('cahayaCurrentUser') || '{}');
  const kelompok = JSON.parse(localStorage.getItem('kelompokNaqib') || '[]');

  document.addEventListener('DOMContentLoaded', () => {
    // 1. Validasi Login
    if (!currentUser || currentUser.role !== 'naqib') {
      alert("Sesi habis. Login kembali."); window.location.href='../index.html'; return;
    }

    // 2. Isi Dropdown Santri (Dari Usrah)
    const selectSantri = document.getElementById('namaSantri');
    selectSantri.innerHTML = '<option value="">-- Pilih Santri --</option>';
    if(kelompok.length === 0) {
        const opt = document.createElement('option');
        opt.text = "Tidak ada data anggota usrah";
        selectSantri.appendChild(opt);
    } else {
        kelompok.forEach(nama => {
            const opt = document.createElement('option');
            opt.value = nama;
            opt.text = nama;
            selectSantri.appendChild(opt);
        });
    }

    // 3. Isi Dropdown Pelanggaran
    const selectPel = document.getElementById('namaPelanggaran');
    DAFTAR_PELANGGARAN.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.no; // Simpan ID/Nomor sebagai value
        opt.text = `${p.no}. ${p.nama} (${p.kat})`;
        selectPel.appendChild(opt);
    });
  });

  // === FUNGSI OTOMATISASI KATEGORI ===
  window.autoSetKategori = function() {
    const no = document.getElementById('namaPelanggaran').value;
    const inputKat = document.getElementById('kategoriDisplay');
    const divPoin = document.getElementById('previewPoin');

    if (!no) {
        inputKat.value = "";
        divPoin.textContent = "";
        return;
    }

    // Cari data berdasarkan nomor
    const data = DAFTAR_PELANGGARAN.find(p => p.no == no);
    if (data) {
        inputKat.value = data.kat; // Isi otomatis
        const denda = POIN_DENDA[data.kat];
        divPoin.innerHTML = `Potongan Poin: <span style="font-size:1.2rem">${denda}</span>`;
    }
  };

  // === SIMPAN DATA ===
  window.simpanPelanggaran = function() {
    const santri = document.getElementById('namaSantri').value;
    const noPelanggaran = document.getElementById('namaPelanggaran').value;
    const ket = document.getElementById('keterangan').value;
    const tindakLanjut = document.getElementById('tindakLanjut').value;
    const naqib = currentUser.username || "Naqib";

    if (!santri || !noPelanggaran) { alert("Pilih Santri dan Jenis Pelanggaran!"); return; }

    const dataPel = DAFTAR_PELANGGARAN.find(p => p.no == noPelanggaran);
    const denda = POIN_DENDA[dataPel.kat];

    // Konfirmasi
    if(!confirm(`⚠️ KONFIRMASI HUKUMAN\n\nSantri: ${santri}\nKasus: ${dataPel.nama}\nKategori: ${dataPel.kat}\n\nPoin akan berkurang ${denda}. Lanjutkan?`)) return;

    // 1. Simpan Log Kasus
    const logKasus = {
      tanggal: new Date().toISOString().split('T')[0],
      santri: santri,
      kategori: dataPel.kat,
      namaPelanggaran: dataPel.nama,
      keterangan: ket,
      tindakLanjut: tindakLanjut,
      naqib: naqib,
      waktuSimpan: new Date().toISOString()
    };

    // 2. Simpan Log Poin (Untuk Rapor)
    const logPoin = {
      namaSantri: santri,
      poin: denda,
      keterangan: `[PELANGGARAN ${dataPel.kat}] ${dataPel.nama}`,
      admin: naqib,
      waktu: new Date().toISOString()
    };

    Promise.all([
        push(ref(db, 'cahaya_app/pelanggaran_santri'), logKasus),
        push(ref(db, 'cahaya_app/poin_manual'), logPoin)
    ]).then(() => {
        alert("✅ Data tersimpan & Poin dikurangi.");
        
        // Update Tabel Preview
        const tbody = document.querySelector('#tabelPelanggaran tbody');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${tbody.children.length+1}</td><td>${santri}</td><td>${dataPel.nama}</td><td>${tindakLanjut || '-'}</td>`;
        tbody.prepend(tr);

        // Reset
        document.getElementById('keterangan').value = '';
        document.getElementById('tindakLanjut').value = '';
    }).catch(e => alert("Error: " + e.message));
  };
</script>

</body>
</html>
