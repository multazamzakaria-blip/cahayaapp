<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP – Absensi Naqib</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* STYLE DASAR */
    :root { --primary: #2563eb; --primary-dark: #1e40af; --green: #dcfce7; --orange: #ffedd5; --red: #fee2e2; }
    body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top left, #dbeafe, #eef2ff 40%, #f8fafc); color: #0f172a; margin: 0; }
    header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
    header h1 { font-size: 1.1rem; margin:0; }
    header button { border: none; background: rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    main { background: white; margin: 20px auto; padding: 20px; border-radius: 16px; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    
    label { display: block; font-weight: 600; margin-top: 10px; }
    select, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing:border-box; }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 15px; }
    tbody tr { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    td { padding: 10px; text-align: center; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
    td:first-child { text-align: left; border-left: 1px solid #f1f5f9; border-radius: 8px 0 0 8px; }
    td:last-child { border-right: 1px solid #f1f5f9; border-radius: 0 8px 8px 0; }

    tr.hadir { background-color: #f0fdf4; border-left: 4px solid #22c55e; }
    tr.telat { background-color: #fff7ed; border-left: 4px solid #f97316; }
    tr.alfa  { background-color: #fef2f2; border-left: 4px solid #ef4444; }

    button.primary { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 99px; margin-top: 20px; font-weight: bold; cursor: pointer; }
    button.secondary { background: #64748b; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

<header>
  <h1>📝 Absensi Naqib</h1>
  <button onclick="window.location.href='dashboard.html'">Kembali</button>
</header>

<main>
  <label>Tanggal</label>
  <input type="date" id="tanggal">

  <label>Program / Kegiatan</label>
  <select id="program">
    <optgroup label="Ibadah Utama (Wajib +50)">
      <option value="Shalat Subuh">Shalat Subuh</option>
      <option value="Shalat Isya">Shalat Isya</option>
      <option value="Shalat Tahajjud">Shalat Tahajjud</option>
      <option value="Puasa Kamis">Puasa Kamis</option>
    </optgroup>
    <optgroup label="Ibadah Standar (Wajib +30)">
      <option value="Shalat Zuhur">Shalat Zuhur</option>
      <option value="Shalat Ashar">Shalat Ashar</option>
      <option value="Shalat Maghrib">Shalat Maghrib</option>
    </optgroup>
    <optgroup label="Kedisiplinan & Fisik (+15/20)">
      <option value="Joging Pagi">Joging Pagi (+15)</option>
      <option value="Makan">Makan Bersama (+15)</option>
      <option value="Apel">Apel / Upacara (+20)</option>
      <option value="Piket">Piket Kebersihan (+20)</option>
      </optgroup>
  </select>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
    <h3>Daftar Santri</h3>
    <button class="secondary" onclick="markAll()">✅ Semua Hadir</button>
  </div>

  <table id="tabelSantri">
    <thead>
      <tr>
        <th>Nama</th>
        <th>H</th>
        <th>T</th>
        <th>I</th>
        <th>S</th>
        <th>A</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button class="primary" onclick="simpan()">💾 SIMPAN ABSENSI</button>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // === KAMUS POIN (UPDATE: Hapus Puasa Senin & Olahraga Sore) ===
  const BOBOT_POIN = {
    // Tier 1 (50)
    "Shalat Subuh": 50, 
    "Shalat Isya": 50, 
    "Shalat Tahajjud": 50, 
    "Puasa Kamis": 100,
    
    // Tier 2 (30)
    "Shalat Zuhur": 30, 
    "Shalat Ashar": 30, 
    "Shalat Maghrib": 30,
    
    // Tier 3 (20/15)
    "Joging Pagi": 15, 
    "Makan": 15,
    "Piket": 20,
    "Apel": 20,
    
    "Lainnya": 20
  };

  const user = JSON.parse(localStorage.getItem('cahayaCurrentUser') || '{}');
  const kelompok = JSON.parse(localStorage.getItem('kelompokNaqib') || '[]');

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
    
    const tbody = document.querySelector('#tabelSantri tbody');
    if(kelompok.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6">Belum ada data kelompok. Silakan login ulang.</td></tr>';
      return;
    }

    kelompok.forEach((nama, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${nama}</td>
        <td><input type="radio" name="s_${i}" value="Hadir" checked></td>
        <td><input type="radio" name="s_${i}" value="Terlambat"></td>
        <td><input type="radio" name="s_${i}" value="Izin"></td>
        <td><input type="radio" name="s_${i}" value="Sakit"></td>
        <td><input type="radio" name="s_${i}" value="Alfa"></td>
      `;
      tbody.appendChild(tr);
      
      tr.classList.add('hadir');
      tr.querySelectorAll('input').forEach(r => {
        r.addEventListener('change', () => {
           tr.className = '';
           if(r.value === 'Hadir') tr.classList.add('hadir');
           if(r.value === 'Terlambat') tr.classList.add('telat');
           if(r.value === 'Alfa') tr.classList.add('alfa');
        });
      });
    });
  });

  window.markAll = function() {
    document.querySelectorAll('input[value="Hadir"]').forEach(r => {
        r.checked = true;
        r.dispatchEvent(new Event('change')); 
    });
  };

  window.simpan = function() {
    const tanggal = document.getElementById('tanggal').value;
    const program = document.getElementById('program').value;
    
    // Ambil Bobot Dasar
    let poinDasar = BOBOT_POIN[program] || 20;

    const dataAbsen = [];
    kelompok.forEach((nama, i) => {
      const status = document.querySelector(`input[name="s_${i}"]:checked`)?.value || 'Hadir';
      
      let poinFinal = 0;
      
      // === RUMUS (PERSENTASE DENDA) ===
      if (status === 'Hadir') {
          poinFinal = poinDasar;
      } 
      else if (status === 'Terlambat') {
          // Minus 50%
          poinFinal = -(poinDasar * 0.5); 
      } 
      else if (status === 'Alfa') {
          // Minus 100%
          poinFinal = -poinDasar; 
      } 
      else {
          // Izin / Sakit
          poinFinal = 0; 
      }

      dataAbsen.push({ nama, status, poin: poinFinal });
    });

    const log = {
      tanggal, program, naqib: user.username || "Naqib",
      data: dataAbsen, waktu: new Date().toISOString()
    };

    push(ref(db, 'cahaya_app/absensi_program_harian'), log)
      .then(() => alert(`✅ Absensi Tersimpan!`))
      .catch(e => alert("Gagal: " + e.message));
  };
</script>

</body>
</html>
