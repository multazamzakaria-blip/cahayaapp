<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>CAHAYA APP – Absensi Naqib</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --accent-gold: #d4af37;
      --accent-gold-light: #fef08a;
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(212, 175, 55, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --st-hadir: rgba(16, 185, 129, 0.15);
      --st-hadir-border: rgba(16, 185, 129, 0.5);
      --st-telat: rgba(245, 158, 11, 0.15);
      --st-telat-border: rgba(245, 158, 11, 0.5);
      --st-alfa: rgba(239, 68, 68, 0.15);
      --st-alfa-border: rgba(239, 68, 68, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1), transparent 40%),
        linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Background Texture */
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23d4af37' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
      pointer-events: none; z-index: -1;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(20px) saturate(150%);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--accent-gold); letter-spacing: 1px; }
    .btn-back {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.3s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }

    main { max-width: 900px; margin: 40px auto; padding: 0 20px; animation: fadeInUp 0.8s ease backwards; }
    @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7);
      position: relative;
      margin-bottom: 40px;
    }

    /* FORM ELEMENTS */
    .form-group { margin-bottom: 25px; }
    label { display: block; font-weight: 600; color: var(--accent-gold); margin-bottom: 8px; font-size: 0.95rem; letter-spacing: 0.5px; text-transform: uppercase; }
    
    select, input[type="date"] {
      width: 100%; padding: 14px 20px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4); color: white;
      font-family: inherit; font-size: 1rem;
      transition: all 0.3s; outline: none;
    }
    select:focus, input[type="date"]:focus {
      border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); background: rgba(0,0,0,0.6);
    }
    /* Ganti icon kalender jadi putih */
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    /* TABLE */
    .table-header-flex { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; margin-bottom: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
    .table-header-flex h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--text-main); margin: 0; }
    
    .btn-mark-all {
      background: rgba(16, 185, 129, 0.2); color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4); padding: 8px 16px;
      border-radius: 50px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-mark-all:hover { background: rgba(16, 185, 129, 0.4); color: white; }

    table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
    thead th { color: var(--text-muted); font-weight: 500; font-size: 0.85rem; text-align: center; padding-bottom: 5px; }
    thead th:first-child { text-align: left; padding-left: 20px; }

    tbody tr {
      background: rgba(255,255,255,0.03);
      border-radius: 16px; transition: all 0.3s ease;
    }
    tbody td { padding: 15px 10px; text-align: center; border-top: 1px solid transparent; border-bottom: 1px solid transparent; }
    tbody td:first-child { text-align: left; padding-left: 20px; border-radius: 16px 0 0 16px; border-left: 1px solid transparent; font-weight: 500; letter-spacing: 0.5px; }
    tbody td:last-child { border-radius: 0 16px 16px 0; border-right: 1px solid transparent; }

    /* RADIO BUTTONS CUSTOM */
    input[type="radio"] { 
        appearance: none; width: 22px; height: 22px; 
        border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
        outline: none; cursor: pointer; position: relative; transition: 0.2s;
        background: rgba(0,0,0,0.2);
    }
    input[type="radio"]:checked::before {
        content: ''; position: absolute; top: 4px; left: 4px; width: 10px; height: 10px;
        border-radius: 50%; background: white;
    }

    /* STATUS ROW HIGHLIGHTS */
    tr.hadir { background: var(--st-hadir); }
    tr.hadir td:first-child { border-left-color: var(--st-hadir-border); }
    tr.hadir input[type="radio"][value="Hadir"]:checked { background: #10b981; border-color: #34d399; }

    tr.telat { background: var(--st-telat); }
    tr.telat td:first-child { border-left-color: var(--st-telat-border); }
    tr.telat input[type="radio"][value="Terlambat"]:checked { background: #f59e0b; border-color: #fbbf24; }

    tr.alfa { background: var(--st-alfa); }
    tr.alfa td:first-child { border-left-color: var(--st-alfa-border); }
    tr.alfa input[type="radio"][value="Alfa"]:checked { background: #ef4444; border-color: #f87171; }

    /* BUTTON SAVE */
    .btn-save {
      width: 100%; padding: 18px; border-radius: 16px; border: none;
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
      color: var(--primary-dark); font-family: inherit; font-size: 1.1rem;
      font-weight: 700; letter-spacing: 1px; cursor: pointer; margin-top: 30px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); transition: all 0.3s;
    }
    .btn-save:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5); filter: brightness(1.1); }

    @media(max-width: 600px) {
      .card { padding: 25px 20px; }
      table { font-size: 0.85rem; }
      tbody td:first-child { padding-left: 10px; }
      input[type="radio"] { width: 18px; height: 18px; }
      input[type="radio"]:checked::before { top: 3px; left: 3px; width: 8px; height: 8px; }
    }
  </style>
</head>
<body>

<header>
  <h1>📝 Log Absensi</h1>
  <button class="btn-back" onclick="window.location.href='dashboard.html'">Kembali</button>
</header>

<main>
  <div class="card">
    
    <div class="form-group">
      <label>📅 Tanggal Pelaksanaan</label>
      <input type="date" id="tanggal">
    </div>

    <div class="form-group">
      <label>🕋 Program / Kegiatan</label>
      <select id="program">
        <option value="">-- Pilih Program --</option>
        <optgroup label="Ibadah Utama (Wajib +50)">
          <option value="Shalat Subuh">Shalat Subuh</option>
          <option value="Shalat Isya">Shalat Isya</option>
          <option value="Shalat Tahajjud">Shalat Tahajjud</option>
          <option value="Puasa Kamis">Puasa Kamis</option>
        </optgroup>
        <optgroup label="Ibadah Standar (Wajib +30)">
          <option value="Shalat Zuhur">Shalat Zuhur</option>
          <option value="Shalat Ashar">Shalat Ashar</option>
          <option value="Shalat Maghrib">Shalat Maghrib</option>
        </optgroup>
        <optgroup label="Kedisiplinan & Fisik (+15/20)">
          <option value="Makan Sahur Bersama">Makan Sahur Bersama (+15)</option>
          <option value="Joging Pagi">Joging Pagi (+15)</option>
          <option value="Makan">Makan Siang Bersama (+15)</option>
          <option value="Makan Malam Bersama">Makan Malam Bersama (+15)</option>
          <option value="Apel">Apel / Upacara (+20)</option>
          <option value="Piket">Piket Kebersihan (+20)</option>
        </optgroup>
      </select>
    </div>

    <div class="table-header-flex">
      <h3>Daftar Santri Usrah</h3>
      <button class="btn-mark-all" onclick="markAll()">✓ Set Semua Hadir</button>
    </div>

    <table id="tabelSantri">
      <thead>
        <tr>
          <th>Nama Lengkap</th>
          <th title="Hadir">H</th>
          <th title="Terlambat">T</th>
          <th title="Izin">I</th>
          <th title="Sakit">S</th>
          <th title="Alfa">A</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button class="btn-save" onclick="simpan()">💾 SIMPAN LOG ABSENSI</button>

  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // === KAMUS POIN ===
  const BOBOT_POIN = {
    "Shalat Subuh": 50, "Shalat Isya": 50, "Shalat Tahajjud": 50, "Puasa Kamis": 100,
    "Shalat Zuhur": 30, "Shalat Ashar": 30, "Shalat Maghrib": 30,
    "Makan Sahur Bersama": 15, "Joging Pagi": 15, "Makan": 15, "Makan Malam Bersama": 15,
    "Piket": 20, "Apel": 20
  };

  const user = JSON.parse(localStorage.getItem('cahayaCurrentUser') || '{}');
  const kelompok = JSON.parse(localStorage.getItem('kelompokNaqib') || '[]');

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
    
    const tbody = document.querySelector('#tabelSantri tbody');
    if(kelompok.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; opacity:0.7;">Sesi habis atau data kelompok kosong. Silakan login ulang.</td></tr>';
      return;
    }

    kelompok.forEach((nama, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${nama}</td>
        <td><input type="radio" name="s_${i}" value="Hadir" checked></td>
        <td><input type="radio" name="s_${i}" value="Terlambat"></td>
        <td><input type="radio" name="s_${i}" value="Izin"></td>
        <td><input type="radio" name="s_${i}" value="Sakit"></td>
        <td><input type="radio" name="s_${i}" value="Alfa"></td>
      `;
      tbody.appendChild(tr);
      
      // Default class
      tr.classList.add('hadir');
      
      // Listener untuk ubah warna baris saat radio dipilih
      tr.querySelectorAll('input').forEach(r => {
        r.addEventListener('change', () => {
           tr.className = '';
           if(r.value === 'Hadir') tr.classList.add('hadir');
           else if(r.value === 'Terlambat') tr.classList.add('telat');
           else if(r.value === 'Alfa') tr.classList.add('alfa');
           // Izin & Sakit dibiarkan netral (tanpa class warna khusus)
        });
      });
    });
  });

  window.markAll = function() {
    document.querySelectorAll('input[value="Hadir"]').forEach(r => {
        r.checked = true;
        r.dispatchEvent(new Event('change')); // Memicu perubahan warna baris
    });
  };

  window.simpan = function() {
    const tanggal = document.getElementById('tanggal').value;
    const program = document.getElementById('program').value;
    
    if(!tanggal || !program) {
        alert("⚠️ Mohon lengkapi Tanggal dan Program Kegiatan terlebih dahulu.");
        return;
    }

    // Ambil Bobot Dasar
    let poinDasar = BOBOT_POIN[program] || 20;
    const dataAbsen = [];

    kelompok.forEach((nama, i) => {
      const status = document.querySelector(`input[name="s_${i}"]:checked`)?.value || 'Hadir';
      let poinFinal = 0;
      
      // === RUMUS (PERSENTASE DENDA) ===
      if (status === 'Hadir') poinFinal = poinDasar;
      else if (status === 'Terlambat') poinFinal = -(poinDasar * 0.5); // -50%
      else if (status === 'Alfa') poinFinal = -poinDasar; // -100%
      else poinFinal = 0; // Izin/Sakit

      dataAbsen.push({ nama, status, poin: poinFinal });
    });

    const log = {
      tanggal, program, naqib: user.username || "Naqib",
      data: dataAbsen, waktu: new Date().toISOString()
    };

    const btn = document.querySelector('.btn-save');
    btn.innerHTML = "⏳ MENYIMPAN...";
    btn.disabled = true;

    push(ref(db, 'cahaya_app/absensi_program_harian'), log)
      .then(() => {
          alert(`✅ BERHASIL!\nAbsensi program "${program}" telah tersimpan di database.`);
          btn.innerHTML = "💾 SIMPAN LOG ABSENSI";
          btn.disabled = false;
      })
      .catch(e => {
          alert("Gagal menyimpan: " + e.message);
          btn.innerHTML = "💾 SIMPAN LOG ABSENSI";
          btn.disabled = false;
      });
  };
</script>

</body>
</html>
