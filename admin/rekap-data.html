<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAHAYA APP – Rekap Data</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#1f2937;}
header{background:#0f766e;color:white;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;}
header h1{margin:0;font-size:1.2rem;font-weight:700;}
main{padding:24px;max-width:1100px;margin:auto;}
h2{color:#0f766e;font-size:1.3rem;margin-bottom:18px;}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 4px 10px rgba(0,0,0,0.06);margin-bottom:20px;}
.form-row{margin-bottom:14px;}
label{display:block;font-size:0.9rem;margin-bottom:4px;font-weight:600;color:#4b5563;}
select,input[type="date"]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #d1d5db;font-size:0.95rem;box-sizing:border-box;}
button{background:#0f766e;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:0.95rem;}
button:hover{background:#115e59;}
.back-btn{background:#e5e7eb;color:#111827;margin-right:8px;}
.back-btn:hover{background:#d1d5db;}
#hasilInfo{font-size:0.9rem;color:#111827;margin-top:10px;line-height:1.5;white-space:pre-line;}
.table-wrapper{overflow-x:auto;margin-top:12px;}
table{width:100%;border-collapse:collapse;font-size:0.85rem;margin-top:6px;background:white;border-radius:10px;overflow:hidden;}
th,td{padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:left;}
th{background:#0f766e;color:white;position:sticky;top:0;}
tr:nth-child(even) td{background:#f9fafb;}
.status-box{display:inline-block;padding:3px 8px;border-radius:6px;color:white;font-weight:bold;}
.status-hadir{background:#16a34a;}
.status-izin{background:#2563eb;}
.status-sakit{background:#eab308;}
.status-alfa{background:#dc2626;}
</style>
</head>
<body>
<header>
  <h1>Rekap Data – CAHAYA APP</h1>
  <button class="back-btn" onclick="history.back()">⬅ Kembali</button>
</header>

<main>
  <h2>📑 Pengaturan Rekap Data</h2>
  <div class="card">
    <div class="form-row">
      <label>Jenis Data</label>
      <select id="jenisData" onchange="updateForm()">
        <option value="absensi_program">Absensi Program</option>
        <option value="absensi_belajar">Absensi Pembelajaran</option>
      </select>
    </div>
    <div class="form-row">
      <label>Rentang Waktu</label>
      <select id="rentang" onchange="toggleTanggal()">
        <option value="hari">Hari Ini</option>
        <option value="pekan">Pekan Ini</option>
        <option value="bulan">Bulan Ini</option>
        <option value="rentang">Rentang Waktu Tertentu</option>
      </select>
      <div id="tanggalWrap" style="display:none;margin-top:8px;">
        <label>Dari</label><input type="date" id="tglAwal">
        <label>Sampai</label><input type="date" id="tglAkhir">
      </div>
    </div>
    <div class="form-row">
      <button onclick="tampilkan()">Tampilkan Rekap</button>
      <button id="exportBtn" onclick="exportExcel()" disabled>Export Excel</button>
    </div>
    <div id="hasilInfo"></div>

    <div class="table-wrapper">
      <table id="rekapTable">
        <thead>
          <tr id="theadRow">
            <th>No</th>
            <th>Tanggal</th>
            <th>Nama Santri</th>
            <th>Naqib / Guru</th>
            <th>Kelas</th>
            <th>Program / Mapel</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rekapBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
  authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
  databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
  projectId: "absensi-santri-fajrul-islam",
  storageBucket: "absensi-santri-fajrul-islam.appspot.com",
  messagingSenderId: "739928369926",
  appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Mapping jenis data → path Firebase
const PATHS = {
  absensi_program: "cahaya_app/absensi_program_harian",
  absensi_belajar: "cahaya_app/absensi_pembelajaran"
};

// Simpan hasil terakhir untuk export
let lastRows = [];
let lastJenis = "";

// Ambil tanggal dari rentang waktu
function getRangeDates(mode) {
  const now = new Date();
  let start, end;
  if (mode === "hari") {
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    end   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
  } else if (mode === "pekan") {
    const first = now.getDate() - now.getDay();
    start = new Date(now.getFullYear(), now.getMonth(), first);
    end   = new Date(now.getFullYear(), now.getMonth(), first + 6, 23, 59, 59);
  } else if (mode === "bulan") {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end   = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
  } else {
    const s = document.getElementById("tglAwal").value;
    const e = document.getElementById("tglAkhir").value;
    if (!s || !e) { alert("Lengkapi tanggal mulai dan akhir."); return null; }
    start = new Date(s);
    end   = new Date(e + "T23:59:59");
  }
  return { start, end };
}

window.toggleTanggal = () => {
  const val = document.getElementById("rentang").value;
  document.getElementById("tanggalWrap").style.display = val === "rentang" ? "block" : "none";
};

window.updateForm = () => {
  const jenis = document.getElementById("jenisData").value;
  const thead = document.getElementById("theadRow");
  if (jenis === "absensi_program") {
    thead.innerHTML = `
      <th>No</th><th>Tanggal</th><th>Nama Santri</th><th>Nama Naqib</th>
      <th>Kelas</th><th>Program</th><th>Status</th>`;
  } else {
    thead.innerHTML = `
      <th>No</th><th>Tanggal</th><th>Nama Santri</th><th>Nama Guru</th>
      <th>Kelas</th><th>Mapel</th><th>Status</th>`;
  }
};

// Ambil data dari Firebase dan tampilkan
window.tampilkan = async () => {
  const jenis = document.getElementById("jenisData").value;
  const rentang = document.getElementById("rentang").value;
  const hasil = document.getElementById("hasilInfo");
  const tbody = document.getElementById("rekapBody");
  const exportBtn = document.getElementById("exportBtn");

  tbody.innerHTML = "";
  hasil.textContent = "⏳ Mengambil data...";
  exportBtn.disabled = true;

  const range = getRangeDates(rentang);
  if (!range) return;
  const { start, end } = range;

  const snap = await get(child(ref(db), PATHS[jenis]));
  if (!snap.exists()) { hasil.textContent = "❌ Tidak ada data."; return; }

  const data = snap.val();
  const rows = [];

  for (const [key, val] of Object.entries(data)) {
    const tanggal = new Date(val.tanggal || val.tgl || val.waktuSimpan || "");
    if (isNaN(tanggal)) continue;
    if (tanggal < start || tanggal > end) continue;

    const namaSantri = val.namaSantri || val.santri || val.nama || "-";
    const kelas = val.kelas || val.namaKelas || "-";
    const status = (val.status || val.kehadiran || "-").toLowerCase();
    const statusClass =
      status.includes("hadir") ? "status-hadir" :
      status.includes("izin")  ? "status-izin"  :
      status.includes("sakit") ? "status-sakit" : "status-alfa";

    if (jenis === "absensi_program") {
      rows.push({
        tanggal: tanggal.toLocaleDateString("id-ID"),
        santri: namaSantri,
        naqib: val.namaNaqib || val.naqib || "-",
        kelas,
        program: val.namaProgram || val.program || "-",
        status: status,
        statusClass
      });
    } else {
      rows.push({
        tanggal: tanggal.toLocaleDateString("id-ID"),
        santri: namaSantri,
        guru: val.namaGuru || val.guru || "-",
        kelas,
        mapel: val.namaMapel || val.mapel || "-",
        status: status,
        statusClass
      });
    }
  }

  if (!rows.length) { hasil.textContent = "ℹ️ Tidak ada data di rentang waktu ini."; return; }

  // isi tabel
  tbody.innerHTML = rows.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${r.tanggal}</td>
      <td>${r.santri}</td>
      <td>${r.naqib || r.guru}</td>
      <td>${r.kelas}</td>
      <td>${r.program || r.mapel}</td>
      <td><span class="status-box ${r.statusClass}">${r.status}</span></td>
    </tr>`).join("");

  hasil.textContent = `✅ Ditemukan ${rows.length} data ${jenis==='absensi_program'?'Absensi Program':'Absensi Pembelajaran'}.`;
  exportBtn.disabled = false;
  lastRows = rows;
  lastJenis = jenis;
};

// Export Excel
window.exportExcel = () => {
  if (!lastRows.length) return alert("Belum ada data.");
  const sheet = XLSX.utils.json_to_sheet(lastRows.map((r,i)=>({
    No:i+1,
    Tanggal:r.tanggal,
    "Nama Santri":r.santri,
    "Naqib/Guru":r.naqib || r.guru,
    Kelas:r.kelas,
    "Program/Mapel":r.program || r.mapel,
    Status:r.status
  })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,sheet,"Rekap");
  const namaFile = `Rekap_${lastJenis}_${new Date().toISOString().split('T')[0]}.xlsx`;
  XLSX.writeFile(wb,namaFile);
};

// init
updateForm();
</script>
</body>
</html>
