  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db);
  window.dbRef = dbRef; // supaya bisa dipakai di script luar

  window.getFirebaseData = async function() {
    const [
      assesGuruSnap,
      assesNaqibSnap,
      absNaqibSnap,
      absKbmSnap,

      tahfizSnap,

    ] = await Promise.all([

    return {

      absensiKbm: absKbmSnap.exists() ? Object.values(absKbmSnap.val()) : [],
      ujian: ujianSnap.exists() ? Object.values(ujianSnap.val()) : [],
      tahfiz: tahfizSnap.exists() ? Object.values(tahfizSnap.val()) : [],

    };
  };
</script>

<script>
let jsPDFLib;
window.addEventListener("load", () => {
  if (window.jspdf && window.jspdf.jsPDF) jsPDFLib = window.jspdf.jsPDF;
  const tahunSelect = document.getElementById("tahunSelect");
  const tNow = new Date().getFullYear();
  for (let t = tNow - 2; t <= tNow + 1; t++) {
    const opt = document.createElement("option");
    opt.value = t; opt.textContent = t; if (t === tNow) opt.selected = true;
    tahunSelect.appendChild(opt);
  }
});

function parseDate(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function isSameMonthYear(tgl,b,t){ const d=parseDate(tgl); return d&&d.getMonth()===b&&d.getFullYear()===t; }

async function generateReports() {
  const bulan = +document.getElementById("bulanSelect").value;
  const tahun = +document.getElementById("tahunSelect").value;
  const container = document.getElementById("laporanContainer");
  container.innerHTML = "";

  if (isNaN(bulan) || isNaN(tahun)) return container.innerHTML="<p class='muted'>Pilih bulan dan tahun.</p>";

  const data = await window.getFirebaseData();
  const { assesmentGuru, assesmentNaqib, absensiNaqib, absensiKbm, ujian, tahfiz, pelanggaranAll } = data;

  const namaSet = new Set([
    ...assesmentGuru.map(a=>a.namaSantri),
    ...assesmentNaqib.map(a=>a.namaSantri),
    ...absensiNaqib.flatMap(a=>(a.data||[]).map(d=>d.nama)),
    ...absensiKbm.flatMap(a=>(a.data||[]).map(d=>d.nama)),
    ...ujian.map(u=>u.santri),
    ...tahfiz.flatMap(t=>(t.data||[]).map(d=>d.nama)),
    ...pelanggaranAll.map(p=>p.santri)
  ].filter(Boolean));

  if (!namaSet.size) return container.innerHTML="<p class='muted'>Belum ada data.</p>";

  namaSet.forEach(nama=>{
    container.appendChild(buatLaporanSantri({
      nama, bulan, tahun,
      assesmentGuru, assesmentNaqib, absensiNaqib, absensiKbm,
      ujian, tahfiz, pelanggaranAll
    }));
  });
}

function hitungKehadiranGabungan(nama, bulan, tahun, absensiNaqib, absensiGuru) {
  const kehadiran = {};
  function tambah(prog, status) {
    if (!kehadiran[prog]) kehadiran[prog] = {hadir:0, izin:0, sakit:0, alfa:0, total:0};
    const s = (status || "").toLowerCase();
    if (kehadiran[prog][s] !== undefined) kehadiran[prog][s]++;
    kehadiran[prog].total++;
  }

  absensiNaqib.forEach(log => {
    if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
    (log.data || []).forEach(d => {
      if (d.nama === nama) tambah(log.program || "Program Harian", d.status);
    });
  });

  absensiGuru.forEach(log => {
    if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
    (log.data || []).forEach(d => {
      if (d.nama === nama) tambah(log.mapel || "KBM", d.status);
    });
  });

  const result = Object.entries(kehadiran).map(([prog,v],i)=>{
    const toP = x => (v.total ? Math.round((x / v.total) * 100) : 0);
    return {
      no: i+1,
      program: prog,
      hadir: toP(v.hadir),
      izin: toP(v.izin),
      sakit: toP(v.sakit),
      alfa: toP(v.alfa)
    };
  });

  if (result.length) {
    const avg = x => Math.round(result.reduce((s,r)=>s + r[x],0) / result.length);
    result.push({
      no: "",
      program: "<b>Rata-rata</b>",
      hadir: avg("hadir"),
      izin: avg("izin"),
      sakit: avg("sakit"),
      alfa: avg("alfa")
    });
  }
  return result;
}

// ========= BANGUN KARTU LAPORAN PER SANTRI =========
function buatLaporanSantri(ctx) {
  const {
    nama,
    bulan,
    tahun,
    assesmentGuru,
    assesmentNaqib,
    absensiNaqib,
    absensiKbm,
    ujian,
    tahfiz,
    pelanggaranAll,
  } = ctx;

  const namaUpper = (nama || "").toUpperCase();
  const namaBulan = [
    "Januari","Februari","Maret","April","Mei","Juni",
    "Juli","Agustus","September","Oktober","November","Desember"
  ][bulan];

  // ---- Ambil asesmen terbaru ----
  const ases = assesmentNaqib
  .filter(a =>
    a.namaSantri === nama &&
    isSameMonthYear(a.tanggal, bulan, tahun)
  )
  .sort((a,b)=> new Date(a.waktuSimpan) - new Date(b.waktuSimpan))
  .at(-1) || {};


  const narasiSpiritual =
  ases.narasiSpiritual ||
  "Belum ada catatan dimensi Cinta Allah (Spiritual) bulan ini.";

const narasiRel =
  ases.narasiRelasional ||
  "Belum ada catatan dimensi Akhlak Mulia (Relasional) bulan ini.";

const narasiEmo =
  ases.narasiEmosional ||
  "Belum ada catatan dimensi Hati Bersih (Emosional) bulan ini.";

const narasiIntellectual =
  ases.narasiIntelektual ||
  "Belum ada catatan dimensi Akal Cerdas (Intelektual) bulan ini.";

const narasiFis =
  ases.narasiFisik ||
  "Belum ada catatan dimensi Fisik Berdaya (Physical) bulan ini.";

const namaNaqib = ases.naqib || "-";
const namaNaqibUpper = namaNaqib.toUpperCase();
const namaBulanUpper = (namaBulan || "").toUpperCase();

  const wrapper = document.createElement("div");
  wrapper.className = "laporan-card";
  wrapper.dataset.santri = nama;
  wrapper.dataset.bulan = namaBulan;
  wrapper.dataset.tahun = tahun;

  // === HEADER LAPORAN ===
  wrapper.innerHTML = `
<div class="laporan-header-executive">

  <div class="header-exec-top">

    <div class="logo-exec">
      <img src="logofi.png" alt="Logo Pesantren">
      <div class="logo-text">
        <div class="line1">PESANTREN CAHAYA</div>
        <div class="line2">FAJRUL ISLAM</div>
        <div class="line3">HOLISTIC ISLAMIC SCHOOL</div>
      </div>
    </div>

    <div class="judul-exec">
      <h1>LAPORAN<br>BULANAN SANTRI</h1>
    </div>

  </div>

  <div class="exec-divider"></div>

  <div class="identitas-exec">
    <div>
      <p><span>Nama Santri</span> : <b>${namaUpper}</b></p>
      <p><span>Nama Naqib</span> : <b>${namaNaqibUpper}</b></p>
    </div>

    <div style="text-align:right">
      <p><span>Bulan</span> : <b>${namaBulanUpper}</b></p>
      <p><span>Tahun</span> : <b>${tahun}</b></p>
    </div>
  </div>

</div>


    <div class="section-title">🌈 Dimensi CAHAYA</div>
    <div class="dim-card"><h4>🕋 Cinta Allah (Spiritual)</h4><p>${narasiSpiritual}</p></div>
    <div class="dim-card"><h4>🤝 Akhlak Mulia (Relational)</h4><p>${narasiRel}</p></div>
    <div class="dim-card"><h4>💓 Hati Bersih (Emotional)</h4><p>${narasiEmo}</p></div>
    <div class="dim-card"><h4>🧠 Akal Cerdas (Intellectual)</h4><p>${narasiIntellectual}</p></div>
    <div class="dim-card"><h4>🏃‍♂️ Fisik Berdaya (Physical)</h4><p>${narasiFis}</p></div>
  `;
wrapper.innerHTML += `
<div class="section-title">📈 Fokus Perbaikan Bulan Ini</div>
<p><b>Dimensi Fokus:</b> ${(ases.fokusBulanIni || []).join(", ") || "-"}</p>
<p><b>Spesifik Perbaikan:</b><br>${ases.spesifikBulanIni || "-"}</p>

<div class="section-title">📊 Hasil Perbaikan Bulan Ini</div>
<p><b>Status:</b> ${ases.hasilPerbaikan || "-"}</p>
<p><b>Evaluasi:</b><br>${ases.evaluasiBulanIni || "-"}</p>

<div class="section-title">🚀 Fokus Perbaikan Bulan Berikutnya</div>
<p><b>Dimensi Fokus:</b> ${(ases.fokusBulanDepan || []).join(", ") || "-"}</p>
<p><b>Spesifik Perbaikan:</b><br>${ases.spesifikBulanDepan || "-"}</p>
`;
  // === Kehadiran ===
  const hadir = hitungKehadiranGabungan(nama, bulan, tahun, absensiNaqib, absensiKbm);
  wrapper.innerHTML += `
  <div class="section-title">🗓️ Laporan Kehadiran</div>
  ${
    hadir.length ? `
    <table>
      <thead>
        <tr>
          <th>No</th><th>Program</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th>
        </tr>
      </thead>
      <tbody>
        ${hadir.map(r=>`
          <tr>
            <td>${r.no}</td>
            <td>${r.program}</td>
            <td>${r.hadir}%</td>
            <td>${r.izin}%</td>
            <td>${r.sakit}%</td>
            <td>${r.alfa}%</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
    ` : `<p class='muted'>Belum ada data kehadiran.</p>`
  }`;

  // === Nilai Ujian ===
  const nilaiUjian = ujian
  .filter(
    (u) =>
      (u.santri || "").toLowerCase() === nama.toLowerCase() &&
      isSameMonthYear(u.tanggal, bulan, tahun)
  )
  .filter(
    (u, i, self) =>
      i ===
      self.findIndex(
        (x) =>
          x.santri === u.santri &&
          x.mapel === u.mapel &&
          x.materi === u.materi &&
          x.tanggal === u.tanggal
      )
  );

let rataUjian = 0;
if (nilaiUjian.length) {
  rataUjian = Math.round(
    nilaiUjian.reduce((s, u) => s + (+u.nilai || 0), 0) / nilaiUjian.length
  );
}
    wrapper.innerHTML += `
  <div class="section-title">🧾 Laporan Nilai Ujian</div>
  ${
    nilaiUjian.length ? `
    <table>
      <thead>
        <tr>
          <th>No</th><th>Mata Pelajaran</th><th>Materi</th><th>Nilai</th><th>Keterangan</th>
        </tr>
      </thead>
      <tbody>
        ${
          nilaiUjian.map((u,i)=>`
            <tr>
              <td>${i+1}</td>
              <td>${u.mapel || "-"}</td>
              <td>${u.materi || "-"}</td>

        }
        <tr>

          <td colspan="2">${rataUjian}</td>
        </tr>
      </tbody>
    </table>
    ` : `<p class='muted'>Belum ada data ujian.</p>`
  }`;

  // === Tahfiz ===
  const dataTahfiz = tahfiz
    .filter(t => isSameMonthYear(t.tanggal, bulan, tahun))
    .flatMap(t => t.data || [])
    .filter(d => d.nama === nama);

  wrapper.innerHTML += `
  <div class="section-title">📖 Laporan Setoran Tahfiz</div>
  ${
    dataTahfiz.length ? `
    <table>
      <thead>
        <tr>
          <th>No</th><th>Setoran</th><th>Kesalahan</th><th>Nilai</th><th>Keterangan</th>

          `).join("")
        }

  }`;

  // === Pelanggaran (sinkron dengan format baru) ===
const pelanggaran = pelanggaranAll
  .filter(p => p.santri === nama && isSameMonthYear(p.tanggal, bulan, tahun));

wrapper.innerHTML += `
<div class="section-title">⚠️ Laporan Pelanggaran</div>
${
  pelanggaran.length ? `
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Tanggal</th>
        <th>Nama Pelanggaran</th>
        <th>Kategori</th>
        <th>Keterangan / Kronologi</th>
        <th>Tindak Lanjut</th>
        <th>Konsekuensi</th>
      </tr>
    </thead>
    <tbody>
      ${
        pelanggaran.map((p,i)=>`
          <tr>
            <td>${i+1}</td>
            <td>${p.tanggal || "-"}</td>
            <td>${p.namaPelanggaran || "-"}</td>
            <td>${p.kategori || "-"}</td>
            <td>${p.keterangan || p.ket || "-"}</td>
            <td>${p.tindakLanjut || "-"}</td>
            <td>${p.konsekuensi || "-"}</td>
          </tr>
        `).join("")
      }
    </tbody>
  </table>
  ` : `<p class='muted'>Tidak ada pelanggaran bulan ini.</p>`
}
`;

  // === tombol export ===
  wrapper.innerHTML += `
    <div class="export-buttons">
      <button onclick="exportPDF('${nama.replace(/'/g,"\\'")}')">
        ⬇️ Export PDF Santri Ini
      </button>
    </div>
  `;

  return wrapper;
}

// ====== EXPORT PDF ======
async function exportPDF(nama){

  const el = document.querySelector(`.laporan-card[data-santri="${nama}"]`);
  if (!el) {
    alert("Laporan tidak ditemukan.");
    return;
  }

  const bulan = el.dataset.bulan || "";
  const tahun = el.dataset.tahun || "";

  const canvas = await html2canvas(el,{
    scale: 1.2,
    useCORS: true,
    scrollY: 0
  });

  const pdf = new jsPDFLib("p","mm","a4");

  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  const margin = 10;
  const footerSpace = 15;

  const usableHeight = pageHeight - margin - footerSpace;
  const imgWidth = pageWidth - 20;

  const ratio = imgWidth / canvas.width;
  const pageCanvasHeight = usableHeight / ratio;

  let renderedHeight = 0;
  let pageCount = 0;

  while (renderedHeight < canvas.height) {

    const pageCanvas = document.createElement("canvas");
    pageCanvas.width = canvas.width;
    pageCanvas.height = Math.min(pageCanvasHeight, canvas.height - renderedHeight);

    const ctx = pageCanvas.getContext("2d");

    ctx.drawImage(
      canvas,
      0,
      renderedHeight,
      canvas.width,
      pageCanvas.height,
      0,
      0,
      canvas.width,
      pageCanvas.height
    );

const imgData = pageCanvas.toDataURL("image/jpeg", 0.75);


    if (pageCount > 0) pdf.addPage();

    pdf.addImage(
      imgData,
      "PNG",
      10,
      margin,
      imgWidth,
      pageCanvas.height * ratio
    );

    renderedHeight += pageCanvas.height;
    pageCount++;
  }

// ===== Tambahkan Tanda Tangan di Halaman Terakhir =====
const totalPages = pdf.getNumberOfPages();
pdf.setPage(totalPages);

pdf.setFontSize(12);
pdf.setTextColor(40);

pdf.text("Mengetahui,", pageWidth / 2, pageHeight - 45, { align: "center" });
pdf.text("Direktur Pesantren Cahaya Fajrul Islam", pageWidth / 2, pageHeight - 38, { align: "center" });

pdf.setFont(undefined, "bold");
pdf.text("Multazam Zakaria, M.Pd.", pageWidth / 2, pageHeight - 20, { align: "center" });
pdf.setFont(undefined, "normal");


// Pindah ke halaman terakhir
pdf.setPage(totalPages);

pdf.setFontSize(12);
pdf.setTextColor(40);

// Blok tanda tangan (center)
pdf.text("Mengetahui,", pageWidth / 2, pageHeight - 45, { align: "center" });
pdf.text("Direktur Pesantren Cahaya Fajrul Islam", pageWidth / 2, pageHeight - 38, { align: "center" });

// Ruang tanda tangan (jarak kosong)
pdf.setFont(undefined, "bold");
pdf.text("Multazam Zakaria, M.Pd.", pageWidth / 2, pageHeight - 20, { align: "center" });
pdf.setFont(undefined, "normal");


// ===== Footer Nomor Halaman =====
for(let i = 1; i <= totalPages; i++){
  pdf.setPage(i);
  pdf.setFontSize(10);
  pdf.setTextColor(120);
  pdf.text(
    `Halaman ${i} dari ${totalPages} halaman`,
    pageWidth / 2,
    pageHeight - 10,
    { align: "center" }
  );
}

const cleanName = nama.toUpperCase().replace(/\s+/g,"_");
pdf.save(`Laporan_${cleanName}_${bulan}_${tahun}.pdf`);
}


async function exportAllPDF(){
  const cards = document.querySelectorAll(".laporan-card");
  if (!cards.length) {
    alert("Tidak ada laporan.");
    return;
  }
  for (let i = 0; i < cards.length; i++){
    const n = cards[i].dataset.santri;
    await exportPDF(n);
    await new Promise(r=>setTimeout(r,700));
  }
  alert("✅ Semua laporan berhasil diekspor!");
}
