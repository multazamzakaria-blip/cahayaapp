<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Bulanan Anak - CAHAYA APP</title>

  <link rel="stylesheet" href="../wali-style.css">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f9fafb;
      color: #1f2937;
      margin: 0;
    }

    header {
      background: #0f766e;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-buttons button {
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .btn-danger:hover { background: #dc2626; }

    main {
      max-width: 1100px;
      margin: 1rem auto 3rem;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .section-title {
      font-weight: 700;
      color: #0f766e;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .filter-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    select {
      padding: 0.6rem 0.8rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    button {
      padding: 0.6rem 1.2rem;
      background: #0f766e;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover {
      background: #115e59;
      transform: translateY(-1px);
    }

    .laporan-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .laporan-header {
      text-align: center;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    .laporan-header h2 {
      font-size: 1.3rem;
      color: #0f172a;
      font-weight: 700;
    }

    .laporan-header h3 {
      font-size: 1.1rem;
      color: #334155;
      font-weight: 600;
    }

    .section-sub {
      margin-top: 1.5rem;
      margin-bottom: 0.6rem;
      color: #0f766e;
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dim-card {
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 0.9rem 1rem;
      margin-bottom: 0.8rem;
    }

    .dim-card h4 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
    }

    .dim-card p {
      font-size: 0.93rem;
      color: #374151;
      margin-top: 0.3rem;
      white-space: pre-line;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      font-size: 0.9rem;
      text-align: center;
    }

    th {
      background: #f3f4f6;
      color: #1f2937;
      font-weight: 600;
    }

    /* === Warna Kehadiran === */
    .hadir-cell { background: #dcfce7; color: #065f46; font-weight: 600; }
    .izin-cell  { background: #dbeafe; color: #1e40af; font-weight: 600; }
    .sakit-cell { background: #fef9c3; color: #854d0e; font-weight: 600; }
    .alfa-cell  { background: #fee2e2; color: #991b1b; font-weight: 600; }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #6b7280;
    }

    /* === Responsif === */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .filter-box {
        flex-direction: column;
        align-items: center;
      }

      table, th, td {
        font-size: 0.8rem;
      }

      .card {
        padding: 1.2rem;
      }

      .laporan-card {
        padding: 1rem;
      }

      button, select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>📊 Laporan Bulanan Anak</h1>
    <div class="nav-buttons">
      <button class="btn-secondary" onclick="goDashboard()">⬅️ Dashboard</button>
      <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2 class="section-title">📅 Pilih Bulan Laporan</h2>
      <div class="filter-box">
        <select id="bulanSelect"></select>
        <select id="tahunSelect"></select>
        <button onclick="generateReport()">Tampilkan Laporan</button>
      </div>
    </div>

    <div id="laporanContainer">
      <p style="text-align:center;color:#6b7280;">Silakan pilih bulan dan tahun untuk melihat laporan anak.</p>
    </div>
  </main>

  <footer>© 2025 Pesantren Fajrul Islam — CAHAYA APP</footer>

  <!-- SCRIPT ASLI KAMU -->
  <script type="module" src="./progres-bulanan-script.js"></script>
</body>
</html>
