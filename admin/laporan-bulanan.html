    .header-exec-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .logo-exec { display: flex; align-items: center; gap: 15px; }
    .logo-exec img { width: 90px; height: auto; }
    .logo-text { line-height: 1.2; }
    .logo-text .line1 { font-weight: 700; font-size: 18px; letter-spacing: 1px; color: #1e293b; }
    .logo-text .line2 { font-weight: 800; font-size: 24px; color: #1e293b; }
    .judul-exec h1 { margin: 0; font-size: 32px; font-weight: 800; line-height: 1.1; letter-spacing: 1px; color: #c17c1c; text-align: right; }
    .exec-divider { height: 3px; width: 100%; margin: 20px 0 25px 0; background: linear-gradient(to right,#c17c1c,#1e3a8a); border-radius: 4px; }
    .identitas-exec { background: #ffffff; border-radius: 16px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); display: flex; justify-content: space-between; font-size: 16px; border: 1px solid #e5e7eb; }
    .identitas-exec span { color: #64748b; font-weight: 500; font-size: 15px; }
    .identitas-exec b { font-weight: 700; color: #1e293b; }

    /* CONTENT STYLE */
    .section-title { margin-top: 30px; margin-bottom: 12px; font-weight: 800; color: #0f766e; display: flex; align-items: center; gap: 10px; font-size: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
    
    .dim-card { border-radius: 12px; padding: 18px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 16px; margin-bottom: 12px; }
    .dim-card h4 { margin: 0 0 6px; font-size: 17px; color: #0f766e; }
    .dim-card p { margin: 0; white-space: pre-line; text-align: justify; line-height: 1.7; color: #334155; }

    /* TABLE STYLE */
    .table-wrapper { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 12px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { border: 1px solid #e2e8f0; padding: 14px 18px; text-align: left; font-size: 15px; }
    th { background: #f1f5f9; font-weight: 700; color: #1e293b; white-space: nowrap; }
    td { color: #334155; }
    tr:nth-child(even) { background-color: #f8fafc; }

    .muted { color: #94a3b8; font-size: 16px; }
    
    /* NIHIL PELANGGARAN */
    .nihil-pelanggaran {
        background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0;

    }

    /* EXPORT BUTTONS */

<script type="module">

  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.dbRef = dbRef;

  window.getFirebaseData = async function() {

    ] = await Promise.all([

    return {

      assesmentNaqib: assesNaqibSnap.exists() ? Object.values(assesNaqibSnap.val()) : [],
      absensiNaqib: absNaqibSnap.exists() ? Object.values(absNaqibSnap.val()) : [],
      absensiKbm: absKbmSnap.exists() ? Object.values(absKbmSnap.val()) : [],
      ujian: ujianSnap.exists() ? Object.values(ujianSnap.val()) : [],
      tahfiz: tahfizSnap.exists() ? Object.values(tahfizSnap.val()) : [],
      pelanggaranAll: pelanggaranSnap.exists() ? Object.values(pelanggaranSnap.val()) : [],
    };
  };
</script>

<script>
// === HELPER: LOAD GAMBAR UNTUK PDF ===
function loadImage(url) {
    return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => {
            console.warn("Gambar tidak ditemukan:", url);
            resolve(null);
        };
        img.src = url;
    });
}

// === HELPER: NORMALISASI DATA ===
function normalize(str) {
    return (str || "").toLowerCase().trim().replace(/\s+/g, ' ');
}
function parseDate(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function isSameMonthYear(tgl,b,t){ const d=parseDate(tgl); return d && d.getMonth()===b && d.getFullYear()===t; }

// === INIT ===
let jsPDFLib;
window.addEventListener("load", () => {
    if (window.jspdf && window.jspdf.jsPDF) jsPDFLib = window.jspdf.jsPDF;
    
    const tahunSelect = document.getElementById("tahunSelect");
    const tNow = new Date().getFullYear();
    for (let t = tNow - 1; t <= tNow + 1; t++) {
        const opt = document.createElement("option");
        opt.value = t; opt.textContent = t; 
        if (t === tNow) opt.selected = true;
        tahunSelect.appendChild(opt);
    }
});

// === LOGIKA UTAMA ===
async function generateReports() {
  const bulan = +document.getElementById("bulanSelect").value;
  const tahun = +document.getElementById("tahunSelect").value;
  const container = document.getElementById("laporanContainer");
  container.innerHTML = "<p class='muted'>⏳ Sedang memuat data semua santri...</p>";

  if (isNaN(bulan) || isNaN(tahun)) {
      container.innerHTML="<p class='muted'>Pilih bulan dan tahun terlebih dahulu.</p>";
      return;
  }

  const data = await window.getFirebaseData();
  const { assesmentGuru, assesmentNaqib, absensiNaqib, absensiKbm, ujian, tahfiz, pelanggaranAll } = data;

  // Kumpulkan semua santri yang ada datanya di bulan ini
  const namaSet = new Set([
      ...assesmentGuru.map(a=>normalize(a.namaSantri)),
      ...assesmentNaqib.map(a=>normalize(a.namaSantri)),
      ...absensiNaqib.flatMap(a=>(a.data||[]).map(d=>normalize(d.nama))),
      ...absensiKbm.flatMap(a=>(a.data||[]).map(d=>normalize(d.nama))),
      ...ujian.map(u=>normalize(u.santri)),
      ...tahfiz.flatMap(t=>(t.data||[]).map(d=>normalize(d.nama))),
      ...pelanggaranAll.map(p=>normalize(p.santri))
  ].filter(Boolean));

  if (!namaSet.size) {
      container.innerHTML="<p class='muted'>Belum ada data untuk periode ini.</p>";
      return;
  }

  container.innerHTML = "";

  // Loop setiap nama dan buatkan laporan
  namaSet.forEach(namaKey => {
      // Cari nama asli (Title Case)
      let namaAsli = namaKey; 
      const refData = assesmentNaqib.find(a => normalize(a.namaSantri) === namaKey) || 
                      assesmentGuru.find(a => normalize(a.namaSantri) === namaKey);
      if (refData) namaAsli = refData.namaSantri;

      const laporanHTML = buatLaporanSantri({
          nama: namaAsli, 
          namaKey: namaKey,
          bulan, tahun,
          ...data 
      });
      container.appendChild(laporanHTML);
  });
}

// === HITUNG KEHADIRAN (ANTI DUPLIKAT) ===
function hitungKehadiranGabungan(namaKey, bulan, tahun, absensiNaqib, absensiGuru) {
  const statusPerHari = {};

  function catatStatus(tanggal, program, status) {
    const key = `${tanggal}_${program}`; 
    statusPerHari[key] = status; 
  }

  absensiNaqib
    .filter(log => isSameMonthYear(log.tanggal, bulan, tahun))
    .sort((a,b) => new Date(a.waktuSimpan || a.tanggal) - new Date(b.waktuSimpan || b.tanggal))
    .forEach(log => {
        (log.data || []).forEach(d => {
            if (normalize(d.nama) === namaKey) catatStatus(log.tanggal, log.program || "Harian", d.status);
        });
    });

  absensiGuru
    .filter(log => isSameMonthYear(log.tanggal, bulan, tahun))
    .sort((a,b) => new Date(a.waktuSimpan || a.tanggal) - new Date(b.waktuSimpan || b.tanggal))
    .forEach(log => {
        (log.data || []).forEach(d => {
            if (normalize(d.nama) === namaKey) catatStatus(log.tanggal, log.mapel || "KBM", d.status);
        });
    });

  const rekap = {}; 
  Object.entries(statusPerHari).forEach(([key, status]) => {
      const program = key.split('_')[1];
      if (!rekap[program]) rekap[program] = {hadir:0, izin:0, sakit:0, alfa:0, total:0};
      const s = (status || "").toLowerCase();
      if (rekap[program][s] !== undefined) rekap[program][s]++;
      rekap[program].total++;
  });

  const result = Object.entries(rekap).map(([prog, v]) => {
      const toP = x => (v.total ? Math.round((x / v.total) * 100) : 0);
      return { program: prog, hadir: toP(v.hadir), izin: toP(v.izin), sakit: toP(v.sakit), alfa: toP(v.alfa) };
  });

  return result;
}

// === RENDER KARTU (EXECUTIVE) ===
function buatLaporanSantri(ctx) {
  const { nama, namaKey, bulan, tahun, assesmentGuru, assesmentNaqib, absensiNaqib, absensiKbm, ujian, tahfiz, pelanggaranAll } = ctx;

  const namaUpper = (nama || "").toUpperCase();
  const namaBulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][bulan];

  let ases = assesmentNaqib.filter(a => normalize(a.namaSantri) === namaKey && isSameMonthYear(a.tanggal, bulan, tahun)).sort((a,b)=> new Date(a.waktuSimpan) - new Date(b.waktuSimpan)).at(-1);
  if (!ases || !ases.narasiSpiritual) ases = assesmentGuru.filter(a => normalize(a.namaSantri) === namaKey && isSameMonthYear(a.tanggal, bulan, tahun)).sort((a,b)=> new Date(a.waktuSimpan) - new Date(b.waktuSimpan)).at(-1) || {};

  const def = "Belum ada catatan.";
  const narasiSpiritual = ases.narasiSpiritual || def;
  const narasiRel = ases.narasiRelasional || def;
  const narasiEmo = ases.narasiEmosional || def;
  const narasiIntellectual = ases.narasiIntelektual || def;
  const narasiFis = ases.narasiFisik || def;
  const namaNaqib = (ases.naqib || "-").toUpperCase();
  const namaBulanUpper = (namaBulan || "").toUpperCase();

  const wrapper = document.createElement("div");
  wrapper.className = "laporan-card";
  wrapper.dataset.santri = nama; 
  wrapper.dataset.bulan = namaBulan;
  wrapper.dataset.tahun = tahun;

  wrapper.innerHTML = `
  <div class="laporan-header-executive">
    <div class="header-exec-top">
      <div class="logo-exec">
        <img src="../logofi.png" alt="Logo" onerror="this.src='logofi.png'">
        <div class="logo-text">
          <div class="line1">PESANTREN CAHAYA</div>
          <div class="line2">FAJRUL ISLAM</div>
          <div class="line3">HOLISTIC ISLAMIC SCHOOL</div>
        </div>
      </div>
      <div class="judul-exec">
        <h1>LAPORAN<br>BULANAN SANTRI</h1>
      </div>
    </div>
    <div class="exec-divider"></div>
    <div class="identitas-exec">
      <div>
        <p><span>Nama Santri</span> : <b>${namaUpper}</b></p>
        <p><span>Nama Naqib/Guru</span> : <b>${namaNaqib}</b></p>
      </div>
      <div style="text-align:right">
        <p><span>Bulan</span> : <b>${namaBulanUpper}</b></p>
        <p><span>Tahun</span> : <b>${tahun}</b></p>
      </div>
    </div>
  </div>

  <div class="section-title">🌈 Dimensi CAHAYA</div>
  <div class="dim-card"><h4>🕋 Cinta Allah</h4><p>${narasiSpiritual}</p></div>
  <div class="dim-card"><h4>🤝 Akhlak Mulia</h4><p>${narasiRel}</p></div>
  <div class="dim-card"><h4>💓 Hati Bersih</h4><p>${narasiEmo}</p></div>
  <div class="dim-card"><h4>🧠 Akal Cerdas</h4><p>${narasiIntellectual}</p></div>
  <div class="dim-card"><h4>🏃‍♂️ Fisik Berdaya</h4><p>${narasiFis}</p></div>
  
  <div class="section-title">📈 Fokus Perbaikan Bulan Ini</div>
  <div class="dim-card">
    <p><b>Dimensi Fokus:</b> ${(ases.fokusBulanIni || []).join(", ") || "-"}</p>
    <p><b>Spesifik Perbaikan:</b><br>${ases.spesifikBulanIni || "-"}</p>
  </div>

  <div class="section-title">📊 Hasil Perbaikan Bulan Ini</div>
  <div class="dim-card">
    <p><b>Status:</b> ${ases.hasilPerbaikan || "-"}</p>
    <p><b>Evaluasi:</b><br>${ases.evaluasiBulanIni || "-"}</p>
  </div>

  <div class="section-title">🚀 Fokus Perbaikan Bulan Berikutnya</div>
  <div class="dim-card">
    <p><b>Dimensi Fokus:</b> ${(ases.fokusBulanDepan || []).join(", ") || "-"}</p>
    <p><b>Spesifik Perbaikan:</b><br>${ases.spesifikBulanDepan || "-"}</p>
  </div>
  `;

  const hadir = hitungKehadiranGabungan(namaKey, bulan, tahun, absensiNaqib, absensiKbm);
  wrapper.innerHTML += `<div class="section-title">🗓️ Laporan Kehadiran</div>` + (hadir.length ? 
    `<div class="table-wrapper"><table><thead><tr><th>Program</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th></tr></thead><tbody>${hadir.map(r=>`<tr><td>${r.program}</td><td>${r.hadir}%</td><td>${r.izin}%</td><td>${r.sakit}%</td><td>${r.alfa}%</td></tr>`).join("")}</tbody></table></div>` : `<p class='muted'>-</p>`);

  const nilaiUjian = ujian.filter(u => normalize(u.santri) === namaKey && isSameMonthYear(u.tanggal, bulan, tahun));
  const rataUjian = nilaiUjian.length ? Math.round(nilaiUjian.reduce((s, u) => s + (+u.nilai || 0), 0) / nilaiUjian.length) : 0;
  wrapper.innerHTML += `<div class="section-title">🧾 Nilai Ujian</div>` + (nilaiUjian.length ? 
    `<div class="table-wrapper"><table><thead><tr><th>Mapel</th><th>Materi</th><th>Nilai</th><th>Ket</th></tr></thead><tbody>${nilaiUjian.map(u=>`<tr><td>${u.mapel}</td><td>${u.materi}</td><td>${u.nilai}</td><td>${u.nilai>=75?"✅":"❌"}</td></tr>`).join("")}<tr><td colspan="2"><b>Rata-rata</b></td><td colspan="2">${rataUjian}</td></tr></tbody></table></div>` : `<p class='muted'>-</p>`);

  // FIX TAHFIZ (Anti Duplikat & Keterangan)
  const logsTahfizBulanIni = tahfiz.filter(t => isSameMonthYear(t.tanggal, bulan, tahun)).sort((a,b) => new Date(a.waktuSimpan) - new Date(b.waktuSimpan));
  const mapTahfiz = {};
  logsTahfizBulanIni.forEach(log => {
      const santriData = (log.data || []).find(d => normalize(d.nama) === namaKey);
      if (santriData) mapTahfiz[log.tanggal] = santriData;
  });
  const dataTahfiz = Object.keys(mapTahfiz).sort().map(k => mapTahfiz[k]);

  wrapper.innerHTML += `<div class="section-title">📖 Tahfiz</div>` + (dataTahfiz.length ? 
    `<div class="table-wrapper"><table><thead><tr><th>Setoran</th><th>Nilai</th><th>Ket</th></tr></thead><tbody>${dataTahfiz.map(d=>`<tr><td>${d.surat||d.setoran}</td><td>${d.nilai}</td><td>${d.keterangan || d.ket || "-"}</td></tr>`).join("")}</tbody></table></div>` : `<p class='muted'>-</p>`);

  // FIX PELANGGARAN
  const pelanggaran = pelanggaranAll.filter(p => normalize(p.santri) === namaKey && isSameMonthYear(p.tanggal, bulan, tahun));
  wrapper.innerHTML += `<div class="section-title">⚠️ Catatan Pelanggaran</div>`;
  if(pelanggaran.length > 0) {
      wrapper.innerHTML += `<div class="table-wrapper"><table><thead><tr><th>Tgl</th><th>Kasus</th><th>Tindak Lanjut</th></tr></thead><tbody>${pelanggaran.map(p=>`<tr><td>${p.tanggal}</td><td>${p.namaPelanggaran}</td><td>${p.tindakLanjut}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
      wrapper.innerHTML += `<div class="nihil-pelanggaran">✅ Alhamdulillah, tidak ada catatan pelanggaran bulan ini.</div>`;
  }

  wrapper.innerHTML += `
    <div class="export-buttons">
      <button onclick="exportPDF('${nama.replace(/'/g,"\\'")}')">⬇️ Download PDF Santri Ini</button>
    </div>`;

  return wrapper;
}

// ====== EXPORT PDF ======
async function exportPDF(nama){
  const el = document.querySelector(`.laporan-card[data-santri="${nama}"]`);
  if (!el) { alert("Laporan tidak ditemukan."); return; }

  const btn = el.querySelector("button");
  const oldText = btn.innerText;
  btn.innerText = "⏳ Memproses..."; btn.disabled = true;

  try {
      const originalStyle = el.getAttribute('style');
      el.style.width = "800px"; el.style.maxWidth = "none"; el.style.position = "absolute"; el.style.left = "-9999px"; 
      document.body.appendChild(el.cloneNode(true)); 

      const canvas = await html2canvas(el, { scale: 1.5, useCORS: true, scrollY: 0, windowWidth: 1024 });
      el.style.width = ""; el.style.maxWidth = ""; el.style.position = ""; el.style.left = "";

      const pdf = new jsPDFLib("p","mm","a4");
      const imgWidth = 190; const pageHeight = 295;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      let heightLeft = imgHeight; let position = 10;

      pdf.addImage(canvas.toDataURL("image/jpeg", 0.85), "JPEG", 10, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;

      while (heightLeft >= 0) {
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.85), "JPEG", 10, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }

      // TANDA TANGAN
      pdf.setPage(pdf.getNumberOfPages());
      const footerY = 280; const centerX = 150; 
      pdf.setFontSize(11); pdf.setTextColor(40);
      
      pdf.text("Mengetahui,", centerX, footerY - 30, {align:"center"});
      pdf.text("Direktur Pesantren Cahaya Fajrul Islam", centerX, footerY - 25, {align:"center"});

      const ttdImage = await loadImage('ttd.jpg'); // Path file ttd di folder admin
      if (ttdImage) pdf.addImage(ttdImage, 'JPEG', centerX - 15, footerY - 23, 30, 15); 

      pdf.setFont(undefined, 'bold');
      pdf.text("Multazam Zakaria, MPd", centerX, footerY - 5, {align:"center"});

      const bulan = el.dataset.bulan; const tahun = el.dataset.tahun;
      const cleanName = nama.toUpperCase().replace(/[^a-zA-Z0-9]/g,"_");
      pdf.save(`Laporan_${cleanName}_${bulan}_${tahun}.pdf`);

  } catch (e) {
      alert("Gagal export: " + e.message);
  } finally {
      btn.innerText = oldText; btn.disabled = false;
  }
}

async function exportAllPDF(){
  const cards = document.querySelectorAll(".laporan-card");
  if (!cards.length) { alert("Tidak ada laporan."); return; }
  for (let i = 0; i < cards.length; i++){
      const n = cards[i].dataset.santri;
      await exportPDF(n);
      await new Promise(r=>setTimeout(r,700));
  }
  alert("✅ Semua laporan berhasil diekspor!");
}

function logout(){
  localStorage.removeItem("cahayaCurrentUser");
  window.location.href = "index.html";
}
function goDashboard(){
  window.location.href = "index.html";
}
