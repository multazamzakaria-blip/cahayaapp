<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CAHAYA APP – Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f766e;
  --primary-dark:#0c4f4a;
  --accent:#14b8a6;
  --danger:#dc2626;
  --bg-gradient: linear-gradient(135deg,#0f172a,#0f766e 60%,#14b8a6);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg-gradient);
  min-height:100vh;
  color:#1e293b;
}

/* ================= HEADER ================= */
header{
  backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.08);
  border-bottom:1px solid rgba(255,255,255,0.15);
  color:white;
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-weight:800;
  letter-spacing:.5px;
  font-size:1.4rem;
}

.header-actions button{
  border:none;
  padding:10px 18px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  margin-left:10px;
  transition:.25s;
}

.btn-logout{
  background:rgba(255,255,255,0.15);
  color:white;
}

.btn-logout:hover{
  background:rgba(255,255,255,0.25);
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-danger:hover{
  background:#b91c1c;
}

/* ================= MAIN ================= */
main{
  padding:50px 40px;
  max-width:1200px;
  margin:auto;
}

.dashboard-title{
  color:white;
  font-size:1.8rem;
  font-weight:700;
  margin-bottom:30px;
  letter-spacing:.5px;
}

/* ================= CARD GRID ================= */
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:24px;
}

.menu-card{
  background:rgba(255,255,255,0.95);
  border-radius:22px;
  padding:28px;
  text-align:center;
  cursor:pointer;
  transition:.35s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  position:relative;
  overflow:hidden;
}

.menu-card:before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at center, rgba(20,184,166,0.2), transparent 60%);
  transform:scale(0);
  transition:.4s;
}

.menu-card:hover:before{
  transform:scale(1);
}

.menu-card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 18px 40px rgba(0,0,0,0.25);
}

.menu-icon{
  font-size:2.2rem;
  margin-bottom:14px;
}

.menu-title{
  font-weight:700;
  font-size:1.05rem;
  color:#0f172a;
}

/* ================= MODAL ================= */
.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(5px);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal{
  background:white;
  width:450px;
  border-radius:22px;
  padding:32px;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
  animation:fadeIn .3s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.modal h2{
  margin-top:0;
  color:var(--primary);
}

select,input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-bottom:14px;
  font-family:inherit;
}

.modal-buttons{
  text-align:right;
}

.modal-buttons button{
  border:none;
  padding:10px 16px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  margin-left:8px;
}

.btn-cancel{
  background:#e5e7eb;
}

.btn-confirm{
  background:var(--danger);
  color:white;
}

/* ================= RESPONSIVE ================= */
@media(max-width:600px){
  header{padding:16px}
  main{padding:30px 20px}
}
</style>
</head>

<body>

<header>
  <h1>CAHAYA APP – Admin Panel</h1>
  <div class="header-actions">
    <button class="btn-logout" onclick="logout()">Keluar</button>
    <button class="btn-danger" onclick="openDeleteDialog()">Hapus Database</button>
  </div>
</header>

<main>
  <div class="dashboard-title">Dashboard Administrator</div>

  <div class="menu-grid">

    <div class="menu-card" onclick="go('laporan-bulanan.html')">
      <div class="menu-icon">🗓️</div>
      <div class="menu-title">Laporan Bulanan Santri</div>
    </div>

    <div class="menu-card" onclick="go('rekap-data.html')">
      <div class="menu-icon">📑</div>
      <div class="menu-title">Rekap Data</div>
    </div>

  </div>
</main>

<!-- MODAL -->
<div id="deleteModal" class="modal-overlay">
  <div class="modal">
    <h2>Hapus Data</h2>

    <select>
      <option>Semua Database</option>
      <option>Asesmen CAHAYA</option>
      <option>Absensi</option>
      <option>Nilai Ujian</option>
      <option>Pelanggaran</option>
    </select>

    <select>
      <option>Hari Ini</option>
      <option>Pekan Ini</option>
      <option>Bulan Ini</option>
      <option>Rentang Tanggal</option>
    </select>

    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeDeleteDialog()">Batal</button>
      <button class="btn-confirm">Hapus</button>
    </div>
  </div>
</div>

<script>
function go(page){window.location.href=page}
function logout(){localStorage.removeItem('cahayaCurrentUser');window.location.href='../index.html'}
function openDeleteDialog(){document.getElementById('deleteModal').style.display='flex'}
function closeDeleteDialog(){document.getElementById('deleteModal').style.display='none'}
</script>

</body>
</html>
