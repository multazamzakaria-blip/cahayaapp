<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Laporan Liburan Santri</title>

<style>
:root{
  --primary:#0f766e;
  --primary-soft:#ecfdf5;
  --success:#047857;
  --danger:#b91c1c;
  --bg:#f4f6fa;
  --card:#ffffff;
  --muted:#6b7280;
}

*{box-sizing:border-box}
body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  margin:0;
  color:#1f2937;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#0f766e,#115e59);
  color:white;
  padding:16px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
header h1{
  margin:0;
  font-size:1.35rem;
}
.back{
  background:rgba(255,255,255,.15);
  color:white;
  border:none;
  padding:8px 16px;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
}
.back:hover{background:rgba(255,255,255,.25)}

main{
  padding:28px;
  max-width:1350px;
  margin:auto;
}

/* FILTER */
.filter-box{
  background:var(--card);
  padding:18px 20px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
  margin-bottom:22px;
  display:flex;
  gap:14px;
  align-items:center;
  flex-wrap:wrap;
}
.filter-box label{
  font-weight:700;
  color:#065f46;
}
.filter-box select{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #d1fae5;
}
.filter-box button{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  font-weight:700;
  cursor:pointer;
}
.filter-box button:hover{opacity:.9}

/* TABLE */
.table-wrap{
  background:var(--card);
  border-radius:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.1);
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}
th,td{
  padding:14px 16px;
  border-bottom:1px solid #e5e7eb;
  vertical-align:top;
  font-size:.9rem;
}
th{
  background:var(--primary-soft);
  color:#065f46;
  font-weight:800;
}
tr:hover td{background:#f9fafb}

/* STATUS */
.badge{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  font-size:.75rem;
  font-weight:800;
}
.ok{background:#d1fae5;color:var(--success)}
.no{background:#fee2e2;color:var(--danger)}

/* CHECKLIST JELAS */
.checklist{
  display:grid;
  grid-template-columns: repeat(2, minmax(180px,auto));
  gap:6px 16px;
  font-size:.82rem;
}
.item{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:600;
}
.yes{color:var(--success)}
.noo{color:var(--danger)}

/* REFLEKSI */
.refleksi{
  max-width:420px;
  font-size:.85rem;
  line-height:1.5;
  color:#374151;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}
</style>
</head>

<body>
<header>
  <h1>📝 Cek Laporan Liburan Santri</h1>
  <button class="back" onclick="window.location.href='index.html'">⬅ Kembali</button>
</header>

<main>

<div class="filter-box">
  <label>Filter Tanggal:</label>
  <select id="filterTanggal">
    <option value="">Semua</option>
    <option value="2026-01-01">1 Januari 2026</option>
    <option value="2026-01-02">2 Januari 2026</option>
    <option value="2026-01-03">3 Januari 2026</option>
    <option value="2026-01-04">4 Januari 2026</option>
    <option value="2026-01-05">5 Januari 2026</option>
    <option value="2026-01-06">6 Januari 2026</option>
  </select>
  <button onclick="loadData()">🔄 Refresh</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Nama Santri</th>
  <th>Tanggal</th>
  <th>Kegiatan Wajib</th>
  <th>Refleksi Wali</th>
  <th>Status</th>
</tr>
</thead>
<tbody id="dataBody">
<tr><td colspan="5" class="empty">Memuat data...</td></tr>
</tbody>
</table>
</div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0Eza852WuQL2R8U-yHpVnM3o8NMxZolI",
  authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
  projectId: "absensi-santri-fajrul-islam",
  storageBucket: "absensi-santri-fajrul-islam.firebasestorage.app",
  messagingSenderId: "739982369926",
  appId: "1:739982369926:web:7e5375c3ddbaf0584cdd07"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

window.loadData = async function(){
  const tbody = document.getElementById("dataBody");
  tbody.innerHTML = "<tr><td colspan='5' class='empty'>Memuat data...</td></tr>";

  const tgl = document.getElementById("filterTanggal").value;
  let qRef = collection(db,"laporan_liburan");
  if(tgl) qRef = query(qRef, where("tanggal","==",tgl));

  const snap = await getDocs(qRef);
  if(snap.empty){
    tbody.innerHTML = "<tr><td colspan='5' class='empty'>Tidak ada data.</td></tr>";
    return;
  }

  /* AMBIL LAPORAN TERAKHIR PER SANTRI + TANGGAL */
  const latest = {};
  snap.forEach(doc=>{
    const d = doc.data();
    const key = `${d.namaSantri}_${d.tanggal}`;
    const w = d.waktuSubmit?.toDate ? d.waktuSubmit.toDate() : new Date(0);
    if(!latest[key] || w > latest[key].w){
      latest[key] = {...d,w};
    }
  });

  tbody.innerHTML = "";
  Object.values(latest).forEach(d=>{
    const c = d.checklist || {};
    const total = Object.values(c).filter(v=>v).length;
    const status = total >= 5
      ? `<span class="badge ok">Lengkap</span>`
      : `<span class="badge no">Belum</span>`;

    tbody.innerHTML += `
    <tr>
      <td><b>${d.namaSantri || "-"}</b></td>
      <td>${d.tanggal}</td>
      <td>
        <div class="checklist">
          <div class="item ${c.shalat?'yes':'noo'}">🕌 Shalat ${c.shalat?'✔':'✘'}</div>
          <div class="item ${c.tilawah?'yes':'noo'}">📖 Tilawah ${c.tilawah?'✔':'✘'}</div>
          <div class="item ${c.tashnif?'yes':'noo'}">✍️ Tashnif ${c.tashnif?'✔':'✘'}</div>
          <div class="item ${c.khidmat?'yes':'noo'}">🤝 Khidmat ${c.khidmat?'✔':'✘'}</div>
          <div class="item ${c.tahajud?'yes':'noo'}">🌙 Tahajud ${c.tahajud?'✔':'✘'}</div>
          <div class="item ${c.wirid?'yes':'noo'}">📿 Wirid ${c.wirid?'✔':'✘'}</div>
        </div>
      </td>
      <td class="refleksi">${d.refleksi || "-"}</td>
      <td>${status}</td>
    </tr>`;
  });
};

loadData();
</script>

</body>
</html>
