<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Petugas - CAHAYA APP</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; margin: 0; color: white;
    }
    .box {
      background: rgba(255,255,255,0.1);
      padding: 36px; border-radius: 20px;
      backdrop-filter: blur(10px); text-align: center;
      width: 90%; max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    input, button {
      width: 100%; padding: 10px; margin-bottom: 10px;
      border-radius: 10px; border: none;
    }
    button {
      background: #facc15; color: #1f2937; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="../logofi.png" width="80" style="border-radius:50%">
    <h2>Login Petugas</h2>
    <p>Masukkan akun petugas resmi</p>

    <input type="text" id="username" placeholder="Email (contoh: multazam@cahayaapp.id)">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Masuk</button>
  </div>

  <script type="module">
    // Import Firebase SDK modular
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    // 🔧 Konfigurasi Firebase kamu
    const firebaseConfig = {
      apiKey: "AIzaSyB0Eza852WuQL2R8U-yHpVnM3o8NMxZolI",
      authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
      databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
      projectId: "absensi-santri-fajrul-islam",
      storageBucket: "absensi-santri-fajrul-islam.firebasestorage.app",
      messagingSenderId: "739982369926",
      appId: "1:739982369926:web:7e5375c3ddbaf0584cdd07"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById("loginBtn");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    loginBtn.addEventListener("click", async () => {
      const email = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Simpan data pengguna
        localStorage.setItem("cahayaCurrentUser", JSON.stringify({
          uid: user.uid,
          email: user.email,
          role: "petugas"
        }));

        alert("✅ Login berhasil!");
        location.href = "../petugas/index.html"; // arahkan ke dashboard petugas

      } catch (error) {
        alert("❌ Login gagal: periksa email & password.");
        console.error(error);
      }
    });
  </script>
</body>
</html>
