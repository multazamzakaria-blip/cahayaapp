<section>
  <h2>📅 Laporan Harian Santri</h2>
  <div id="laporan-harian"></div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain:"absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL:"https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId:"absensi-santri-fajrul-islam",
    storageBucket:"absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId:"739928369926",
    appId:"1:739928369926:web:7e95375c3ddba0f584cdd07"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const user = JSON.parse(localStorage.getItem("waliSantri"));
  const laporanDiv = document.getElementById("laporan-harian");
  if (!user) {
    laporanDiv.innerHTML = "Silakan login ulang.";
  } else {
    laporanDiv.innerHTML = "Memuat data untuk " + user.namaAnak + "...";
    const snap = await get(child(ref(db), "cahaya_app/absensi_program_harian"));
    if (snap.exists()) {
      let html = "<table><tr><th>Tanggal</th><th>Program</th><th>Status</th></tr>";
      Object.values(snap.val()).forEach(d => {
        d.data?.forEach(s => {
          if (s.nama === user.namaAnak) {
            html += `<tr><td>${d.tanggal}</td><td>${d.program}</td><td>${s.status}</td></tr>`;
          }
        });
      });
      html += "</table>";
      laporanDiv.innerHTML = html;
    } else {
      laporanDiv.innerHTML = "Belum ada data harian.";
    }
  }
  </script>
</section>
