<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Harian – CAHAYA APP</title>
<link rel="stylesheet" href="wali-style.css">
</head>
<body>
<header><h1>Laporan Harian Santri</h1></header>
<main>
  <div class="card" id="info"></div>
  <div class="card" id="laporan"></div>
  <button class="logout" onclick="logoutWali()">Kembali</button>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { checkWaliLogin, logoutWali } from './wali-script.js';

const app = initializeApp({ apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
  authDomain:"absensi-santri-fajrul-islam.firebaseapp.com",
  databaseURL:"https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
  projectId:"absensi-santri-fajrul-islam",
  storageBucket:"absensi-santri-fajrul-islam.appspot.com",
  messagingSenderId:"739928369926",
  appId:"1:739928369926:web:7e95375c3ddba0f584cdd07"});
const db=getDatabase(app);
const user=checkWaliLogin(); window.logoutWali=logoutWali;

if(user){
  document.getElementById("info").innerHTML=`Menampilkan data harian untuk <b>${user.namaAnak}</b>`;
  const snap=await get(child(ref(db),"cahaya_app/absensi_program_harian"));
  let html="<h3>Absensi Program Harian</h3><table><tr><th>Tanggal</th><th>Program</th><th>Status</th></tr>";
  if(snap.exists()){
    Object.values(snap.val()).forEach(d=>{
      d.data?.forEach(s=>{
        if(s.nama===user.namaAnak) html+=`<tr><td>${d.tanggal}</td><td>${d.program}</td><td>${s.status}</td></tr>`;
      });
    });
  }
  html+="</table>";
  document.getElementById("laporan").innerHTML=html;
}
</script>
</body>
</html>
