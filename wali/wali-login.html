<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Wali Santri - CAHAYA APP</title>
<link rel="stylesheet" href="wali-style.css">
</head>
<body class="centered">
  <div class="login-card">
    <h2>🔑 Login Wali Santri</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="loginWali()">Masuk</button>
    <p style="margin-top:10px;font-size:0.9em;opacity:0.8;">
      <i>Wali yang sudah login tidak perlu login ulang.</i>
    </p>
  </div>
<script>
  // === AUTO REDIRECT JIKA SUDAH LOGIN ===
  const currentUser = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
  if (currentUser && currentUser.role === "wali") {
    window.location.href = "wali-dashboard.html"; // langsung ke dashboard wali
  }

  // === LOGIN FUNCTION ===
  const waliList = [
    // ... daftar user wali kamu di sini ...
  ];

  function login() {
    const u = username.value.trim().toLowerCase();
    const p = password.value.trim();
    const wali = waliList.find(w => w.username.toLowerCase() === u && w.password === p);

    if (!wali) {
      alert("❌ Username atau password salah.");
      return;
    }

    // simpan dengan struktur unified agar dikenali juga oleh dashboard
    const currentUser = {
      role: "wali",
      namaAnak: wali.nama,
      username: wali.username,
    };

    localStorage.setItem("cahayaCurrentUser", JSON.stringify(currentUser));
    window.location.href = "wali-dashboard.html";
  }
</script>

<script>
/* --- CEK LOGIN OTOMATIS --- */
const existing = localStorage.getItem("waliSantri");
if (existing) {
  // sudah login, langsung arahkan ke dashboard
  window.location.href = "wali-dashboard.html";
}

/* --- LOGIN MANUAL --- */
function loginWali() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (user === "" || pass === "") {
    alert("Silakan isi username dan password terlebih dahulu.");
    return;
  }

  // simulasi data login wali (nanti bisa diganti verifikasi Firebase)
  const data = {
    nama: "Ayah/Bunda Najmihadi Syauqii Tamaam",
    namaAnak: "Najmihadi Syauqii Tamaam",
    username: user
  };

  localStorage.setItem("waliSantri", JSON.stringify(data));

  // langsung alihkan ke dashboard
  window.location.href = "wali-dashboard.html";
}
</script>
</body>
</html>
