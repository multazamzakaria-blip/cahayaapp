<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laporan Bulanan – CAHAYA APP</title>
<link rel="stylesheet" href="wali-style.css" />
</head>
<body>
<header><h1>Laporan Bulanan Santri</h1></header>

<main>
  <div class="card" id="info"></div>
  <div class="card" id="laporan"></div>
  <button class="logout" onclick="logoutWali()">Kembali</button>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { checkWaliLogin, logoutWali } from "./wali-script.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
  authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
  databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
  projectId: "absensi-santri-fajrul-islam",
  storageBucket: "absensi-santri-fajrul-islam.appspot.com",
  messagingSenderId: "739928369926",
  appId: "1:739928369926:web:7e95375c3ddba0f584cdd07",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const user = checkWaliLogin();
window.logoutWali = logoutWali;

if (user) {
  const now = new Date();
  const bulan = now.getMonth() + 1;
  const tahun = now.getFullYear();
  document.getElementById("info").innerHTML = `
    <b>${user.namaAnak}</b><br>Bulan: ${bulan}/${tahun}
  `;

  const snap = await get(child(ref(db), "cahaya_app/absensi_program_harian"));
  let html = "<h3>Rekap Bulanan Absensi Program Harian</h3><table><tr><th>Tanggal</th><th>Program</th><th>Status</th></tr>";
  let total = { Hadir: 0, Izin: 0, Sakit: 0, Alfa: 0 };

  if (snap.exists()) {
    Object.values(snap.val()).forEach((d) => {
      const t = new Date(d.tanggal);
      if (t.getMonth() + 1 === bulan && t.getFullYear() === tahun) {
        d.data?.forEach((s) => {
          if (s.nama === user.namaAnak) {
            html += `<tr><td>${d.tanggal}</td><td>${d.program}</td><td>${s.status}</td></tr>`;
            total[s.status] = (total[s.status] || 0) + 1;
          }
        });
      }
    });
  }

  html += "</table>";
  html += `<p><b>Total:</b> Hadir ${total.Hadir || 0}, Izin ${total.Izin || 0}, Sakit ${total.Sakit || 0}, Alfa ${total.Alfa || 0}</p>`;
  document.getElementById("laporan").innerHTML = html;
}
</script>
</body>
</html>
