<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Bulanan - Wali Santri | CAHAYA APP</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans', sans-serif; background: #f4f6fa; margin: 0; color: #1f2937; font-size: 17px; line-height: 1.8; }
    header { background: #0f766e; color: white; padding: 18px 28px; text-align: center; font-weight: bold; }
    main { padding: 24px; max-width: 900px; margin: auto; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; justify-content: center; }
    select, button { padding: 10px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 16px; }
    button { background: #0f766e; color: white; cursor: pointer; font-weight: bold; border: none; transition: 0.2s; }
    button:hover { background: #115e59; transform: translateY(-1px); }
    .muted { color: #6b7280; font-size: 16px; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 16px; }
    th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: left; }
    th { background: #f3f4f6; }
    .laporan-card { border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; background: white; }
    .laporan-header { text-align: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; margin-bottom: 16px; }
    .laporan-header h1 { font-size: 24px; color: #1e3a8a; margin: 0; }
    .laporan-header h2 { font-size: 20px; color: #1e3a8a; margin: 4px 0; }
    .laporan-header h3 { font-size: 19px; margin: 4px 0 10px; }
    .identitas-grid { display: flex; justify-content: space-between; font-size: 16px; max-width: 600px; margin: 0 auto; }
    .section-title { margin-top: 22px; margin-bottom: 8px; font-weight: bold; color: #0f766e; display: flex; align-items: center; gap: 8px; font-size: 18px; }
    .dim-card { border-radius: 12px; padding: 12px 14px; background: #f9fafb; border: 1px solid #e5e7eb; margin-bottom: 10px; }
    .dim-card h4 { margin: 0 0 6px; font-size: 17px; color: #0f172a; }
    .dim-card p { margin: 0; white-space: pre-line; }
    .export-buttons { text-align: center; margin-top: 18px; }
    .export-buttons button { background: #2563eb; padding: 10px 16px; font-size: 16px; }
    .export-buttons button:hover { background: #1e40af; }
    @media (max-width:600px) {
      body{font-size:15px;}
      .identitas-grid{flex-direction:column;gap:4px;}
      th,td{font-size:14px;}
      .laporan-header h1{font-size:20px;}
    }
  </style>
</head>
<body>
<header>📊 LAPORAN BULANAN SANTRI</header>
<main>
  <div class="card">
    <div class="controls">
      <select id="bulanSelect">
        <option value="">-- Pilih Bulan --</option>
        <option value="0">Januari</option><option value="1">Februari</option><option value="2">Maret</option>
        <option value="3">April</option><option value="4">Mei</option><option value="5">Juni</option>
        <option value="6">Juli</option><option value="7">Agustus</option><option value="8">September</option>
        <option value="9">Oktober</option><option value="10">November</option><option value="11">Desember</option>
      </select>
      <select id="tahunSelect"></select>
      <button onclick="generateLaporan()">Tampilkan Laporan</button>
    </div>
    <div id="laporanContainer">
      <p class="muted">Pilih bulan dan tahun untuk melihat laporan anak Anda.</p>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
import { checkWaliLogin } from '../wali-script.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const user = checkWaliLogin();
if (!user) window.location.href = "../index.html";

const firebaseConfig = {
  apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
  authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
  databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
  projectId: "absensi-santri-fajrul-islam",
  storageBucket: "absensi-santri-fajrul-islam.appspot.com",
  messagingSenderId: "739928369926",
  appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dbRef = ref(db);

window.addEventListener("load", () => {
  const tahunSelect = document.getElementById("tahunSelect");
  const tNow = new Date().getFullYear();
  for (let t = tNow - 2; t <= tNow + 1; t++) {
    const opt = document.createElement("option");
    opt.value = t; opt.textContent = t; if (t === tNow) opt.selected = true;
    tahunSelect.appendChild(opt);
  }
});

function parseDate(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function isSameMonthYear(tgl,b,t){ const d=parseDate(tgl); return d&&d.getMonth()===b&&d.getFullYear()===t; }

async function getFirebaseData() {
  const [
    assesGuruSnap, assesNaqibSnap, absNaqibSnap, absKbmSnap, ujianSnap, tahfizSnap, pelanggaranSnap
  ] = await Promise.all([
    get(child(dbRef,"cahaya_app/assesment_cahaya_santri")),
    get(child(dbRef,"cahaya_app/assesment_cahaya_naqib")),
    get(child(dbRef,"cahaya_app/absensi_program_harian")),
    get(child(dbRef,"cahaya_app/absensi_pembelajaran")),
    get(child(dbRef,"cahaya_app/nilai_ujian")),
    get(child(dbRef,"cahaya_app/setoran_tahfiz")),
    get(child(dbRef,"cahaya_app/pelanggaran_santri"))
  ]);
  return {
    assesmentGuru: assesGuruSnap.exists()?Object.values(assesGuruSnap.val()):[],
    assesmentNaqib: assesNaqibSnap.exists()?Object.values(assesNaqibSnap.val()):[],
    absensiNaqib: absNaqibSnap.exists()?Object.values(absNaqibSnap.val()):[],
    absensiKbm: absKbmSnap.exists()?Object.values(absKbmSnap.val()):[],
    ujian: ujianSnap.exists()?Object.values(ujianSnap.val()):[],
    tahfiz: tahfizSnap.exists()?Object.values(tahfizSnap.val()):[],
    pelanggaranAll: pelanggaranSnap.exists()?Object.values(pelanggaranSnap.val()):[],
  };
}

window.generateLaporan = async function(){
  const bulan = +document.getElementById("bulanSelect").value;
  const tahun = +document.getElementById("tahunSelect").value;
  const container = document.getElementById("laporanContainer");
  container.innerHTML = "<p class='muted'>Memuat data...</p>";

  if (isNaN(bulan) || isNaN(tahun)) {
    container.innerHTML = "<p class='muted'>Pilih bulan dan tahun.</p>";
    return;
  }

  const data = await getFirebaseData();
  const nama = user.namaAnak;

  const ctx = {
    nama, bulan, tahun,
    ...data
  };
  container.innerHTML = "";
  container.appendChild(buatLaporanSantri(ctx));
}

function hitungKehadiranGabungan(nama, bulan, tahun, absensiNaqib, absensiGuru) {
  const kehadiran = {};
  function tambah(prog, status) {
    if (!kehadiran[prog]) kehadiran[prog] = {hadir:0, izin:0, sakit:0, alfa:0, total:0};
    const s = (status || "").toLowerCase();
    if (kehadiran[prog][s] !== undefined) kehadiran[prog][s]++;
    kehadiran[prog].total++;
  }

  absensiNaqib.forEach(log => {
    if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
    (log.data||[]).forEach(d=>{
      if(d.nama===nama) tambah(log.program||"Program Harian", d.status);
    });
  });

  absensiGuru.forEach(log=>{
    if(!isSameMonthYear(log.tanggal,bulan,tahun)) return;
    (log.data||[]).forEach(d=>{
      if(d.nama===nama) tambah(log.mapel||"KBM", d.status);
    });
  });

  const result = Object.entries(kehadiran).map(([prog,v],i)=>{
    const toP=x=>(v.total?Math.round((x/v.total)*100):0);
    return{no:i+1,program:prog,hadir:toP(v.hadir),izin:toP(v.izin),sakit:toP(v.sakit),alfa:toP(v.alfa)};
  });

  if(result.length){
    const avg=x=>Math.round(result.reduce((s,r)=>s+r[x],0)/result.length);
    result.push({no:"",program:"<b>Rata-rata</b>",hadir:avg("hadir"),izin:avg("izin"),sakit:avg("sakit"),alfa:avg("alfa")});
  }
  return result;
}

function buatLaporanSantri(ctx){
  const {nama,bulan,tahun,assesmentGuru,assesmentNaqib,absensiNaqib,absensiKbm,ujian,tahfiz,pelanggaranAll}=ctx;
  const namaUpper=nama.toUpperCase();
  const namaBulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][bulan];

  const asesGuru=assesmentGuru.filter(a=>a.namaSantri===nama&&isSameMonthYear(a.tgl||a.tanggal,bulan,tahun)).at(-1)||{};
  const asesNaqib=assesmentNaqib.filter(a=>a.namaSantri===nama&&isSameMonthYear(a.tgl||a.tanggal,bulan,tahun)).at(-1)||{};

  const narasiSpiritual=asesGuru.narasiSpiritual||asesGuru.catatanSpiritual||"Belum ada catatan Spiritual.";
  const narasiIntellectual=asesGuru.narasiIntellectual||asesGuru.catatanAkal||"Belum ada catatan Akal Cerdas.";
  const narasiRel=asesNaqib.narasiRelational||asesNaqib.catatanRelasi||"Belum ada catatan Akhlak Mulia.";
  const narasiEmo=asesNaqib.narasiEmotional||asesNaqib.catatanHati||"Belum ada catatan Hati Bersih.";
  const narasiFis=asesNaqib.narasiPhysical||asesNaqib.catatanFisik||"Belum ada catatan Fisik Berdaya.";
  const namaNaqib=asesNaqib.naqibName||asesNaqib.namaNaqib||"-";

  const wrapper=document.createElement("div");
  wrapper.className="laporan-card";
  wrapper.dataset.santri=nama; wrapper.dataset.bulan=namaBulan; wrapper.dataset.tahun=tahun;

  wrapper.innerHTML=`
    <div class="laporan-header">
      <h1>📋 LAPORAN BULANAN SANTRI</h1>
      <h2>PESANTREN CAHAYA FAJRUL ISLAM</h2>
      <h3>${namaUpper}</h3>
      <div class="identitas-grid">
        <div><b>Nama Naqib:</b> ${namaNaqib}</div>
        <div><b>Bulan/Tahun:</b> ${namaBulan} ${tahun}</div>
      </div>
    </div>

    <div class="section-title">🌈 Dimensi CAHAYA</div>
    <div class="dim-card"><h4>🕋 Cinta Allah (Spiritual)</h4><p>${narasiSpiritual}</p></div>
    <div class="dim-card"><h4>🤝 Akhlak Mulia (Relational)</h4><p>${narasiRel}</p></div>
    <div class="dim-card"><h4>💓 Hati Bersih (Emotional)</h4><p>${narasiEmo}</p></div>
    <div class="dim-card"><h4>🧠 Akal Cerdas (Intellectual)</h4><p>${narasiIntellectual}</p></div>
    <div class="dim-card"><h4>🏃‍♂️ Fisik Berdaya (Physical)</h4><p>${narasiFis}</p></div>
  `;

  const hadir=hitungKehadiranGabungan(nama,bulan,tahun,absensiNaqib,absensiKbm);
  wrapper.innerHTML+=`
  <div class="section-title">🗓️ Laporan Kehadiran</div>
  ${
    hadir.length?`
    <table><thead><tr><th>No</th><th>Program</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th></tr></thead>
    <tbody>${hadir.map(r=>`<tr><td>${r.no}</td><td>${r.program}</td><td>${r.hadir}%</td><td>${r.izin}%</td><td>${r.sakit}%</td><td>${r.alfa}%</td></tr>`).join("")}</tbody></table>
    `:`<p class='muted'>Belum ada data kehadiran.</p>`
  }`;

  const nilaiUjian=ujian.filter(u=>u.santri===nama&&isSameMonthYear(u.tanggal,bulan,tahun));
  let rata=nilaiUjian.length?Math.round(nilaiUjian.reduce((s,u)=>s+(+u.nilai||0),0)/nilaiUjian.length):0;
  wrapper.innerHTML+=`
  <div class="section-title">🧾 Nilai Ujian</div>
  ${
    nilaiUjian.length?`
    <table><thead><tr><th>No</th><th>Mata Pelajaran</th><th>Materi</th><th>Nilai</th><th>Keterangan</th></tr></thead>
    <tbody>${nilaiUjian.map((u,i)=>`<tr><td>${i+1}</td><td>${u.mapel}</td><td>${u.materi}</td><td>${u.nilai}</td><td>${u.nilai>=75?"✅ Tuntas":"❌ Belum Tuntas"}</td></tr>`).join("")}
    <tr><td colspan="3"><b>Rata-rata</b></td><td colspan="2">${rata}</td></tr></tbody></table>
    `:`<p class='muted'>Belum ada data ujian.</p>`
  }`;

  const dataTahfiz=tahfiz.filter(t=>isSameMonthYear(t.tanggal,bulan,tahun)).flatMap(t=>t.data||[]).filter(d=>d.nama===nama);
  wrapper.innerHTML+=`
  <div class="section-title">📖 Setoran Tahfiz</div>
  ${
    dataTahfiz.length?`
    <table><thead><tr><th>No</th><th>Setoran</th><th>Kesalahan</th><th>Nilai</th><th>Keterangan</th></tr></thead>
    <tbody>${dataTahfiz.map((d,i)=>`<tr><td>${i+1}</td><td>${d.surat||d.setoran||"-"}</td><td>${d.kesalahan||"-"}</td><td>${d.nilai||"-"}</td><td>${d.keterangan||"-"}</td></tr>`).join("")}</tbody></table>
    `:`<p class='muted'>Belum ada setoran tahfiz.</p>`
  }`;

  const pelanggaran=pelanggaranAll.filter(p=>p.santri===nama&&isSameMonthYear(p.tanggal,bulan,tahun));
  wrapper.innerHTML+=`
  <div class="section-title">⚠️ Pelanggaran</div>
  ${
    pelanggaran.length?`
    <table><thead><tr><th>No</th><th>Tanggal</th><th>Pelanggaran</th><th>Kategori</th><th>Keterangan</th><th>Tindak Lanjut</th><th>Konsekuensi</th></tr></thead>
    <tbody>${pelanggaran.map((p,i)=>`<tr><td>${i+1}</td><td>${p.tanggal}</td><td>${p.namaPelanggaran}</td><td>${p.kategori}</td><td>${p.keterangan||p.ket||"-"}</td><td>${p.tindakLanjut}</td><td>${p.konsekuensi}</td></tr>`).join("")}</tbody></table>
    `:`<p class='muted'>Tidak ada pelanggaran bulan ini.</p>`
  }`;

  wrapper.innerHTML+=`
  <div class="export-buttons">
    <button onclick="exportPDF('${nama}')">⬇️ Download PDF</button>
  </div>`;
  return wrapper;
}

window.exportPDF=async function(nama){
  const el=document.querySelector(`.laporan-card[data-santri="${nama}"]`);
  const bulan=el.dataset.bulan, tahun=el.dataset.tahun;
  const canvas=await html2canvas(el,{scale:2,useCORS:true,scrollY:0});
  const imgData=canvas.toDataURL("image/png");
  const pdf=new window.jspdf.jsPDF("p","mm","a4");
  const pageWidth=pdf.internal.pageSize.getWidth();
  const imgWidth=pageWidth-20;
  const imgHeight=(canvas.height*imgWidth)/canvas.width;
  pdf.addImage(imgData,"PNG",10,10,imgWidth,imgHeight);
  const clean=nama.toUpperCase().replace(/\s+/g,"_");
  pdf.save(`Laporan_${clean}_${bulan}_${tahun}.pdf`);
}
</script>
</body>
</html>
