<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Harian Santri – CAHAYA APP</title>
  <style>
    :root {
      --bg1: #0f766e;
      --bg2: #064e3b;
      --card: rgba(15, 23, 42, 0.35);
      --border-soft: rgba(148, 163, 184, 0.4);
      --accent: #22c55e;
      --text-main: #f9fafb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #0f766e 0%, #022c22 55%, #020617 100%);
      color: var(--text-main);
      min-height: 100vh;
    }
    .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }

    /* ======= TOP BAR ======= */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
    }
    .top-left-label {
      font-weight: 600; font-size: 0.95rem;
      padding: 8px 16px; border-radius: 999px;
      background: rgba(15, 118, 110, 0.9);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      white-space: nowrap;
    }
    .filter-area {
      display: flex; align-items: center; gap: 10px;
      flex-wrap: nowrap; justify-content: flex-end;
    }
    .filter-area span { font-size: 0.9rem; opacity: 0.9; white-space: nowrap; }
    .filter-area input[type="date"] {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.6);
      padding: 6px 10px; color: #e5e7eb; font-size: 0.9rem;
      flex: 1;
    }
    .filter-area input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .btn-main {
      border-radius: 999px; border: none; padding: 7px 14px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      display: inline-flex; align-items: center; gap: 6px;
      transition: 0.2s; white-space: nowrap;
    }
    .btn-main:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

    @media (max-width: 640px) {
      .top-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .filter-area {
        width: 100%; justify-content: space-between;
        flex-wrap: nowrap;
      }
      .filter-area input[type="date"] { width: 100%; }
      .btn-main { padding: 7px 12px; font-size: 0.85rem; }
    }

    /* ========== SISANYA GAYA SEBELUMNYA TIDAK BERUBAH ========== */
  </style>
</head>

<body>
<div class="page">
  <div class="top-bar">
    <div class="top-left-label">📊 Laporan Harian</div>
    <div class="filter-area">
      <span>Tanggal:</span>
      <input type="date" id="tanggalInput">
      <button class="btn-main" id="btnTampil">🔍 Tampilkan Progres</button>
    </div>
  </div>

  <div id="tabs" class="tabs">
    <button class="tab-btn active" data-tab="program">📋 Program</button>
    <button class="tab-btn" data-tab="pembelajaran">📘 Pembelajaran</button>
    <button class="tab-btn" data-tab="tahfiz">📖 Tahfiz</button>
    <button class="tab-btn" data-tab="pelanggaran">⚠️ Pelanggaran</button>
  </div>

  <main id="panelContainer">
    <p class="hint">Pilih tanggal, lalu klik <b>Tampilkan Progres</b> untuk melihat laporan harian santri.</p>
  </main>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam — CAHAYA APP</footer>
</div>


<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const tanggalInput = document.getElementById("tanggalInput");
  const btnTampil = document.getElementById("btnTampil");
  const tabsEl = document.getElementById("tabs");
  const panelContainer = document.getElementById("panelContainer");

  const currentUser = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
  if (!currentUser || currentUser.role !== "wali") {
    alert("Silakan login sebagai Wali Santri."); window.location.href = "../index.html";
  }

  tanggalInput.value = new Date().toISOString().split("T")[0];

  let dailyData = { program: [], pembelajaran: [], tahfiz: [], pelanggaran: [], tanggal: null };

  function badgeStatus(statusRaw) {
    const s = (statusRaw || "").toString().toLowerCase();
    if (s.includes("hadir")) return `<span class="badge badge-hadir">Hadir</span>`;
    if (s.includes("izin"))  return `<span class="badge badge-izin">Izin</span>`;
    if (s.includes("sakit")) return `<span class="badge badge-sakit">Sakit</span>`;
    if (s.includes("alfa"))  return `<span class="badge badge-alfa">Alfa</span>`;
    return statusRaw || "-";
  }

  // render tiap tab
  function renderProgramTab() {
    const rows = dailyData.program;
    if (!rows.length)
      return `<div class="card"><div class="card-header"><div class="card-icon">📋</div><div><div class="card-title">Absensi Program Harian</div><div class="card-subtitle">Rekap kehadiran program santri.</div></div></div><div class="no-data">Belum ada data absensi program harian.</div></div>`;
    return `<div class="card"><div class="card-header"><div class="card-icon">📋</div><div><div class="card-title">Absensi Program Harian</div></div></div><table><thead><tr><th>Program</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.program||"-"}</td><td>${badgeStatus(r.status)}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function renderPembelajaranTab() {
    const rows = dailyData.pembelajaran;
    if (!rows.length)
      return `<div class="card"><div class="card-header"><div class="card-icon">📘</div><div><div class="card-title">Absensi Pembelajaran</div></div></div><div class="no-data">Belum ada data pembelajaran hari ini.</div></div>`;
    return `<div class="card"><div class="card-header"><div class="card-icon">📘</div><div><div class="card-title">Absensi Pembelajaran</div></div></div><table><thead><tr><th>Mata Pelajaran</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.mapel||"-"}</td><td>${badgeStatus(r.status)}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function renderTahfizTab() {
    const rows = dailyData.tahfiz;
    if (!rows.length)
      return `<div class="card"><div class="card-header"><div class="card-icon">📖</div><div><div class="card-title">Setoran Tahfiz</div></div></div><div class="no-data">Belum ada setoran tahfiz hari ini.</div></div>`;
    return `<div class="card"><div class="card-header"><div class="card-icon">📖</div><div><div class="card-title">Setoran Tahfiz</div></div></div><table><thead><tr><th>Setoran</th><th>Jumlah Ayat</th><th>Nilai</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.setoran||"-"}</td><td>${r.ayat||"-"}</td><td>${r.nilai||"-"}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function renderPelanggaranTab() {
    const rows = dailyData.pelanggaran;
    if (!rows.length)
      return `<div class="card"><div class="card-header"><div class="card-icon">⚠️</div><div><div class="card-title">Pelanggaran</div></div></div><div class="no-data">Tidak ada pelanggaran hari ini.</div></div>`;
    return `<div class="card"><div class="card-header"><div class="card-icon">⚠️</div><div><div class="card-title">Pelanggaran</div></div></div><table><thead><tr><th>Keterangan</th><th>Tindak Lanjut</th><th>Konsekuensi</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.keterangan||"-"}</td><td>${r.tindakLanjut||"-"}</td><td>${r.konsekuensi||"-"}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function renderActiveTab(name){
    if(name==="program") panelContainer.innerHTML=renderProgramTab();
    if(name==="pembelajaran") panelContainer.innerHTML=renderPembelajaranTab();
    if(name==="tahfiz") panelContainer.innerHTML=renderTahfizTab();
    if(name==="pelanggaran") panelContainer.innerHTML=renderPelanggaranTab();
  }

  tabsEl.addEventListener("click",e=>{
    const btn=e.target.closest(".tab-btn"); if(!btn)return;
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    renderActiveTab(btn.dataset.tab);
  });

  async function loadDailyData(tanggal){
    const namaUpper=(currentUser.namaAnak||"").trim().toUpperCase();
    panelContainer.innerHTML=`<p class="hint">🔄 Memuat data...</p>`;
    try{
      const dbRoot=ref(db);
      const [absProg,absKbm,tahfizSnap,pelSnap]=await Promise.all([
        get(child(dbRoot,"cahaya_app/absensi_program_harian")),
        get(child(dbRoot,"cahaya_app/absensi_pembelajaran")),
        get(child(dbRoot,"cahaya_app/setoran_tahfiz")),
        get(child(dbRoot,"cahaya_app/pelanggaran_santri"))
      ]);
      const prog=[],pemb=[],tah=[],pel=[];
      if(absProg.exists())Object.values(absProg.val()).forEach(l=>{if(l.tanggal===tanggal)(l.data||[]).forEach(s=>{if((s.nama||"").trim().toUpperCase()===namaUpper)prog.push({program:l.program,status:s.status});});});
      if(absKbm.exists())Object.values(absKbm.val()).forEach(l=>{if(l.tanggal===tanggal)(l.data||[]).forEach(s=>{if((s.nama||"").trim().toUpperCase()===namaUpper)pemb.push({mapel:l.mapel,status:s.status});});});
      if(tahfizSnap.exists())Object.values(tahfizSnap.val()).forEach(l=>{if(l.tanggal===tanggal)(l.data||[]).forEach(s=>{if((s.nama||"").trim().toUpperCase()===namaUpper)tah.push({setoran:s.setoran||s.surat,ayat:s.ayat,nilai:s.nilai});});});
      if(pelSnap.exists())Object.values(pelSnap.val()).forEach(p=>{if(p.tanggal===tanggal&&(p.santri||"").trim().toUpperCase()===namaUpper)pel.push({keterangan:p.keterangan,tindakLanjut:p.tindakLanjut,konsekuensi:p.konsekuensi});});
      dailyData={program:prog,pembelajaran:pemb,tahfiz:tah,pelanggaran:pel,tanggal};
      tabsEl.style.display="flex"; document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelector('.tab-btn[data-tab="program"]').classList.add("active");
      renderActiveTab("program");
    }catch(err){
      panelContainer.innerHTML=`<p class="hint" style="color:#f87171;">❌ Gagal memuat data: ${err.message}</p>`;
    }
  }

  btnTampil.addEventListener("click",()=>{
    const tgl=tanggalInput.value;
    if(!tgl)return alert("Silakan pilih tanggal terlebih dahulu.");
    loadDailyData(tgl);
  });
</script>
</body>
</html>
