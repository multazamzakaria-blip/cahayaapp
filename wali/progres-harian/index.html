<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progres Harian Santri - CAHAYA APP</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>📅 Progres Harian Santri</h1>
    <button id="backBtn">⬅️ Kembali</button>
  </header>

  <main>
    <section class="info-box">
      <h2>Assalamu’alaikum, <span id="waliNama">Wali Santri</span></h2>
      <p>Berikut laporan aktivitas harian santri Anda.</p>
    </section>

    <section class="filter-box">
      <label for="tanggal">Pilih Tanggal:</label>
      <input type="date" id="tanggal" />
      <button id="filterBtn">Tampilkan</button>
    </section>

    <section class="tabel-box">
      <table>
        <thead>
          <tr>
            <th>Waktu</th>
            <th>Kegiatan</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody id="tabelData">
          <tr><td colspan="3" class="empty">Silakan pilih tanggal untuk melihat data.</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>© 2025 CAHAYA APP | Pesantren Fajrul Islam</p>
  </footer>
</body>
</html>
