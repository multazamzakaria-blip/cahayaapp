<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Harian Santri - CAHAYA APP</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      margin: 0;
      color: #e2e8f0;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }

    /* === HEADER === */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #10b981;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: default;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-right label {
      font-weight: 500;
      color: #fff;
    }

    .header-right input {
      background: rgba(255,255,255,0.15);
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      color: #fff;
      font-weight: 500;
    }

    .header-right input::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    .header-right button {
      background: #0d9488;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .header-right button:hover {
      background: #14b8a6;
    }

    /* === CARD === */
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      padding: 16px;
      margin-bottom: 20px;
    }

    .card h2 {
      color: #fff;
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    th, td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    th {
      background: rgba(255,255,255,0.08);
      color: #f1f5f9;
    }

    /* === STATUS BADGES === */
    .status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      color: white;
    }

    .hadir { background: #16a34a; }
    .izin { background: #0ea5e9; }
    .sakit { background: #eab308; color: #111; }
    .alfa { background: #dc2626; }

    /* === FOOTER === */
    footer {
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
      margin-top: 40px;
    }

    @media (max-width: 640px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-right {
        width: 100%;
        justify-content: space-between;
      }
      table { font-size: 0.78rem; }
      th, td { padding: 6px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <button class="tab-btn">📅 Laporan Harian</button>
      </div>
      <div class="header-right">
        <label for="tanggal">Tanggal:</label>
        <input type="date" id="tanggal" value="${new Date().toISOString().split('T')[0]}">
        <button id="tampilkan">Tampilkan Progres</button>
      </div>
    </div>

    <div id="laporan">
      <p style="text-align:center;opacity:0.8;">Pilih tanggal, lalu klik <b>Tampilkan Progres</b> untuk melihat laporan harian santri.</p>
    </div>

    <footer>© 2025 Pesantren Cahaya Fajrul Islam — CAHAYA APP</footer>
  </div>

  <script type="module">
    import { checkWaliLogin, logoutWali } from "../wali-script.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
      authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
      databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
      projectId: "absensi-santri-fajrul-islam",
      storageBucket: "absensi-santri-fajrul-islam.appspot.com",
      messagingSenderId: "739928369926",
      appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
    });

    const db = getDatabase(app);
    const user = checkWaliLogin();
    if (!user) window.location.href = "../index.html";
    const nama = user.namaAnak.toUpperCase().trim();

    const laporanDiv = document.getElementById("laporan");
    const tanggalInput = document.getElementById("tanggal");
    const btnTampilkan = document.getElementById("tampilkan");

    btnTampilkan.addEventListener("click", () => loadProgresHarian(tanggalInput.value));

    async function loadProgresHarian(tanggal) {
      if (!tanggal) return alert("Pilih tanggal terlebih dahulu!");
      laporanDiv.innerHTML = `
        <div class="card"><h2>📋 Absensi Program Harian</h2><div id="prog">Memuat...</div></div>
        <div class="card"><h2>📘 Absensi Pembelajaran</h2><div id="pemb">Memuat...</div></div>
        <div class="card"><h2>📖 Setoran Tahfiz</h2><div id="tahfiz">Memuat...</div></div>
        <div class="card"><h2>⚠️ Pelanggaran</h2><div id="pelanggaran">Memuat...</div></div>
      `;

      await loadData("cahaya_app/absensi_program_harian", tanggal, nama, "prog", "program", "status");
      await loadData("cahaya_app/absensi_pembelajaran", tanggal, nama, "pemb", "mapel", "status");
      await loadData("cahaya_app/setoran_tahfiz", tanggal, nama, "tahfiz", "setoran", "nilai");
      await loadPelanggaran(tanggal, nama);
    }

    async function loadData(path, tanggal, nama, targetId, col1, col2) {
      const target = document.getElementById(targetId);
      try {
        const snap = await get(child(ref(db), path));
        let html = `<table><tr><th>${capitalize(col1)}</th><th>${capitalize(col2)}</th></tr>`;
        let ditemukan = false;

        if (snap.exists()) {
          Object.values(snap.val()).forEach(d => {
            if (d.tanggal === tanggal && d.data) {
              d.data.forEach(s => {
                if ((s.nama || "").trim().toUpperCase() === nama) {
                  ditemukan = true;
                  const val = (s[col2] || d[col2] || "-").toLowerCase();
                  const kelas =
                    val.includes("hadir") ? "hadir" :
                    val.includes("izin") ? "izin" :
                    val.includes("sakit") ? "sakit" :
                    val.includes("alfa") ? "alfa" : "";
                  html += `<tr><td>${s[col1] || d[col1] || "-"}</td><td><span class="status ${kelas}">${s[col2] || "-"}</span></td></tr>`;
                }
              });
            }
          });
        }

        html += "</table>";
        target.innerHTML = ditemukan ? html : "Belum ada data.";
      } catch (err) {
        target.innerHTML = `❌ Gagal memuat data: ${err.message}`;
      }
    }

    async function loadPelanggaran(tanggal, nama) {
      const target = document.getElementById("pelanggaran");
      try {
        const snap = await get(child(ref(db), "cahaya_app/pelanggaran_santri"));
        if (!snap.exists()) return target.textContent = "Belum ada data pelanggaran.";
        let html = `<table><tr><th>Pelanggaran</th><th>Keterangan</th><th>Tindak Lanjut</th></tr>`;
        let ditemukan = false;
        Object.values(snap.val()).forEach(p => {
          if (p.tanggal === tanggal && (p.santri || "").trim().toUpperCase() === nama) {
            ditemukan = true;
            html += `<tr><td>${p.namaPelanggaran || "-"}</td><td>${p.keterangan || "-"}</td><td>${p.tindakLanjut || "-"}</td></tr>`;
          }
        });
        html += "</table>";
        target.innerHTML = ditemukan ? html : "Tidak ada pelanggaran hari ini.";
      } catch (err) {
        target.textContent = "❌ Gagal memuat pelanggaran: " + err.message;
      }
    }

    function capitalize(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }
  </script>
</body>
</html>
