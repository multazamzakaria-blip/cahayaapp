<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Harian Santri – CAHAYA APP</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #020617;
      --primary-blue: #0f172a;
      --accent-gold: #d4af37;
      --accent-gold-light: #fef08a;
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(212, 175, 55, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      background: 
        radial-gradient(circle at top right, rgba(212, 175, 55, 0.1), transparent 40%),
        radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.05), transparent 40%),
        linear-gradient(135deg, var(--primary-dark), var(--primary-blue), #1e293b);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Background Texture */
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23d4af37' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
      pointer-events: none; z-index: -1;
    }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent-gold); letter-spacing: 1px; }
    .btn-back {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); padding: 8px 16px; border-radius: 50px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.3s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }

    .page { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; animation: fadeInUp 0.8s ease backwards; }
    @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* APP TITLE */
    .app-title { text-align: center; margin-bottom: 40px; position: relative; }
    .app-title h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--text-main); margin-bottom: 5px; letter-spacing: 1px; }
    .app-title p { color: var(--accent-gold); font-size: 0.95rem; text-transform: uppercase; letter-spacing: 2px; }

    /* TOP BAR & FILTER */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 20px; margin-bottom: 30px;
      background: var(--glass-bg); backdrop-filter: blur(10px);
      padding: 20px 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }
    .top-left-label {
      font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.2rem;
      color: var(--accent-gold-light); display: flex; align-items: center; gap: 10px;
    }

    .filter-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filter-area span { font-size: 0.9rem; color: var(--text-muted); }
    
    .filter-area input[type="date"] {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-main); border-radius: 12px; padding: 10px 15px; font-size: 0.95rem; font-family: inherit;
      outline: none; transition: 0.3s;
    }
    .filter-area input[type="date"]:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }
    .filter-area input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    
    .btn-main {
      border-radius: 12px; border: none; padding: 12px 20px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit;
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
      color: var(--primary-dark); box-shadow: 0 5px 15px rgba(212,175,55,0.3);
      transition: 0.3s; white-space: nowrap; letter-spacing: 0.5px;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(212,175,55,0.5); filter: brightness(1.1); }

    /* TABS */
    .tabs { display: none; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
    .tab-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted); border-radius: 50px; padding: 10px 25px; font-size: 0.95rem; font-family: inherit;
      cursor: pointer; transition: all 0.3s;
    }
    .tab-btn.active {
      background: rgba(212, 175, 55, 0.15); border-color: var(--accent-gold);
      color: var(--accent-gold-light); font-weight: 600; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
    }
    .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.1); color: var(--text-main); }

    /* CARD PANELS */
    .card {
      background: var(--glass-bg); border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); padding: 30px; margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(15px);
      animation: fadeInUp 0.4s ease;
    }
    .card-header { 
        font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.2rem; 
        margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--accent-gold);
        border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
    }
    
    /* TABLE */
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 0.95rem; }
    th { background: rgba(255,255,255,0.02); font-weight: 500; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; color: var(--text-muted); padding: 12px 15px; text-align: left;}
    td { padding: 16px 15px; background: rgba(255,255,255,0.03); color: var(--text-main); }
    tr td:first-child { border-radius: 12px 0 0 12px; }
    tr td:last-child { border-radius: 0 12px 12px 0; }
    tr:hover td { background: rgba(255,255,255,0.06); }
    
    /* BADGES */
    .badge { display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-hadir { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-telat { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-izin { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }
    .badge-sakit { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .badge-alfa { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .poin-plus { color: #34d399; font-weight: bold; }
    .poin-minus { color: #f87171; font-weight: bold; }
    .poin-neutral { color: var(--text-muted); }

    .no-data { text-align: center; opacity: 0.6; padding: 40px; font-style: italic; background: rgba(0,0,0,0.2); border-radius: 16px; border: 1px dashed rgba(255,255,255,0.05); }
    
    footer { text-align: center; font-size: 0.85rem; opacity: 0.5; margin-top: 50px; font-family: 'Playfair Display'; letter-spacing: 1px;}

    @media (max-width: 640px) {
      .top-bar { flex-direction: column; align-items: stretch; }
      .filter-area { justify-content: space-between; width: 100%; }
      .btn-main { width: 100%; }
      table { font-size: 0.85rem; }
      th, td { padding: 12px 10px; }
      .card { padding: 25px 15px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Laporan Harian</h1>
  <button class="btn-back" onclick="window.location.href='../dashboard/index.html'">Kembali</button>
</header>

<div class="page">
  <div class="app-title">
    <h2>CAHAYA APP</h2>
    <p>Portal Wali Santri</p>
  </div>

  <div class="top-bar">
    <div class="top-left-label">📊 Progres Harian Ananda</div>
    <div class="filter-area">
      <span>Tanggal:</span>
      <input type="date" id="tanggalInput">
      <button class="btn-main" id="btnTampil">Tampilkan Progres</button>
    </div>
  </div>

  <div id="tabs" class="tabs">
    <button class="tab-btn active" data-tab="program">📋 Ibadah & Asrama</button>
    <button class="tab-btn" data-tab="pembelajaran">📘 Sekolah & KBM</button>
    <button class="tab-btn" data-tab="pelanggaran">⚠️ Tindak Kasus</button>
  </div>

  <main id="panelContainer" style="padding:0; margin:0; animation:none; max-width:100%">
    <div style="text-align:center; padding: 50px; background: rgba(0,0,0,0.3); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);">
      <p style="font-family:'Playfair Display'; font-size:1.5rem; color:var(--accent-gold); margin-bottom:10px;" id="welcomeMsg">Assalamu'alaikum</p>
      <p style="color:var(--text-muted);">Silakan pilih tanggal dan klik <b>Tampilkan Progres</b> untuk melihat aktivitas Ananda.</p>
    </div>
  </main>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  const tanggalInput = document.getElementById("tanggalInput");
  const btnTampil = document.getElementById("btnTampil");
  const tabsEl = document.getElementById("tabs");
  const panelContainer = document.getElementById("panelContainer");

  const currentUser = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
  if (!currentUser || currentUser.role !== "wali") {
      window.location.href = "../../index.html";
  } else {
      document.getElementById('welcomeMsg').innerText = `Assalamu'alaikum, Wali dari ${currentUser.namaAnak || 'Ananda'}`;
  }

  tanggalInput.value = new Date().toISOString().split("T")[0];
  let dailyData = { program: [], pembelajaran: [], pelanggaran: [] };

  function badgeStatus(s) {
    s = (s||"").trim();
    const lower = s.toLowerCase();
    if(lower === "hadir") return `<span class="badge badge-hadir">Hadir</span>`;
    if(lower.includes("telat") || lower.includes("terlambat")) return `<span class="badge badge-telat">Terlambat</span>`;
    if(lower === "izin") return `<span class="badge badge-izin">Izin</span>`;
    if(lower === "sakit") return `<span class="badge badge-sakit">Sakit</span>`;
    if(lower === "alfa" || lower === "alpha") return `<span class="badge badge-alfa">Alfa</span>`;
    return `<span class="badge" style="background:rgba(255,255,255,0.1);color:white">${s || "-"}</span>`;
  }

  function formatPoin(p) {
    const poin = parseInt(p) || 0;
    if (poin > 0) return `<span class="poin-plus">+${poin}</span>`;
    if (poin < 0) return `<span class="poin-minus">${poin}</span>`;
    return `<span class="poin-neutral">0</span>`;
  }

  function renderProgram() {
    if (!dailyData.program.length) return `<div class="card"><div class="card-header">📋 Ibadah & Asrama</div><div class="no-data">Belum ada aktivitas yang tercatat untuk tanggal ini.</div></div>`;
    return `
      <div class="card">
        <div class="card-header">📋 Log Ibadah & Asrama</div>
        <table>
          <tr><th width="50%">Kegiatan / Program</th><th width="30%">Kehadiran</th><th width="20%" style="text-align:right">Poin</th></tr>
          ${dailyData.program.map(p=>`<tr><td>${p.program}</td><td>${badgeStatus(p.status)}</td><td style="text-align:right">${formatPoin(p.poin)}</td></tr>`).join("")}
        </table>
      </div>`;
  }

  function renderPembelajaran() {
    if (!dailyData.pembelajaran.length) return `<div class="card"><div class="card-header">📘 Sekolah & KBM</div><div class="no-data">Belum ada absen kelas yang tercatat untuk tanggal ini.</div></div>`;
    return `
      <div class="card">
        <div class="card-header">📘 Absensi Kelas / Sekolah</div>
        <table>
          <tr><th width="50%">Mata Pelajaran</th><th width="30%">Kehadiran</th><th width="20%" style="text-align:right">Poin</th></tr>
          ${dailyData.pembelajaran.map(p=>`<tr><td>${p.mapel}<br><span style="font-size:0.75rem;opacity:0.6">${p.jenis || ''}</span></td><td>${badgeStatus(p.status)}</td><td style="text-align:right">${formatPoin(p.poin)}</td></tr>`).join("")}
        </table>
      </div>`;
  }

  function renderPelanggaran() {
    if (!dailyData.pelanggaran.length) return `<div class="card"><div class="card-header" style="color:#34d399">✨ Tindak Kasus</div><div class="no-data" style="border-color:rgba(16,185,129,0.2)">Alhamdulillah, Ananda tidak memiliki catatan pelanggaran hari ini.</div></div>`;
    return `
      <div class="card" style="border: 1px solid rgba(239,68,68,0.3); background: rgba(239,68,68,0.05)">
        <div class="card-header" style="color:#f87171">⚠️ Catatan Pelanggaran</div>
        <table>
          <tr><th width="35%">Jenis Pelanggaran</th><th width="45%">Tindak Lanjut / Sanksi</th><th width="20%" style="text-align:right">Kategori</th></tr>
          ${dailyData.pelanggaran.map(p=>`<tr>
            <td><strong style="color:white">${p.namaPelanggaran}</strong><br><span style="font-size:0.8rem;opacity:0.7">${p.keterangan || ''}</span></td>
            <td>${p.tindakLanjut || '-'}</td>
            <td style="text-align:right"><span class="badge badge-alfa">${p.kategori}</span></td>
          </tr>`).join("")}
        </table>
      </div>`;
  }

  function renderTab(name){
    if(name === "program") panelContainer.innerHTML = renderProgram();
    else if(name === "pembelajaran") panelContainer.innerHTML = renderPembelajaran();
    else if(name === "pelanggaran") panelContainer.innerHTML = renderPelanggaran();
  }

  tabsEl.addEventListener("click", e=>{
    const btn = e.target.closest(".tab-btn");
    if(!btn) return;
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    renderTab(btn.dataset.tab);
  });

  async function loadData(tanggal) {
    const namaAnak = (currentUser.namaAnak || "").trim().toUpperCase();
    if(!namaAnak) {
        panelContainer.innerHTML = `<div class="no-data" style="color:#f87171">❌ Error: Akun tidak tertaut dengan data santri.</div>`; return;
    }

    panelContainer.innerHTML = `<div style="text-align:center; padding: 50px; color: var(--accent-gold); font-style:italic;">⏳ Mengambil data aktivitas Ananda...</div>`;
    
    const root = ref(db);
    const [snapProg, snapKbm, snapPel] = await Promise.all([
      get(child(root,"cahaya_app/absensi_program_harian")),
      get(child(root,"cahaya_app/absensi_pembelajaran")),
      get(child(root,"cahaya_app/pelanggaran_santri"))
    ]);

    const progs=[], kbms=[], pels=[];

    if(snapProg.exists()) {
        snapProg.forEach(c => {
            const val = c.val();
            if(val.tanggal === tanggal && val.data) {
                val.data.forEach(s => { if((s.nama||"").trim().toUpperCase() === namaAnak) progs.push({program: val.program, status: s.status, poin: s.poin}); });
            }
        });
    }

    if(snapKbm.exists()) {
        snapKbm.forEach(c => {
            const val = c.val();
            if(val.tanggal === tanggal && val.data) {
                val.data.forEach(s => { if((s.nama||"").trim().toUpperCase() === namaAnak) kbms.push({mapel: val.mapel, jenis: val.jenis, status: s.status, poin: s.poin}); });
            }
        });
    }

    if(snapPel.exists()) {
        snapPel.forEach(c => {
            const val = c.val();
            if(val.tanggal === tanggal && (val.santri||"").trim().toUpperCase() === namaAnak) {
                pels.push({namaPelanggaran: val.namaPelanggaran, kategori: val.kategori, keterangan: val.keterangan, tindakLanjut: val.tindakLanjut});
            }
        });
    }

    dailyData = { program: progs, pembelajaran: kbms, pelanggaran: pels };
    tabsEl.style.display = "flex";
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelector('.tab-btn[data-tab="program"]').classList.add("active");
    renderTab("program");
  }

  btnTampil.addEventListener("click", ()=>{
    const tgl = tanggalInput.value;
    if(!tgl) return alert("Pilih tanggal terlebih dahulu");
    loadData(tgl);
  });
</script>
</body>
</html>
