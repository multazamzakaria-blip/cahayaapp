<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Bulanan Anak - CAHAYA APP</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans', sans-serif; background: #f4f6fa; margin: 0; color: #1f2937; }
    header { background: #0f766e; color: white; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 22px; font-weight: 700; }
    main { padding: 30px; max-width: 1200px; margin: auto; }
    .card { background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 30px; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    select, button { padding: 12px 16px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 18px; }
    button { background: #0f766e; color: white; cursor: pointer; font-weight: bold; border: none; transition: 0.2s; }
    button:hover { background: #115e59; transform: translateY(-1px); }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .btn-secondary:hover { background: #d1d5db; }
    .laporan-card { background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .laporan-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; }
    .laporan-header h1 { font-size: 26px; color: #1e3a8a; margin: 0; font-weight: 800; }
    .laporan-header h3 { font-size: 20px; margin: 8px 0; color: #111827; }
    .section { margin-top: 28px; }
    .section h2 { color: #0f766e; font-size: 20px; margin-bottom: 10px; display:flex;align-items:center;gap:6px;}
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 17px; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
    th { background: #f3f4f6; font-weight: 700; }
    .muted { color: #6b7280; font-style: italic; }
  </style>
</head>

<body>
<header>
  <h1>📊 Laporan Bulanan Anak</h1>
  <div>
    <button class="btn-secondary" onclick="goDashboard()">⬅️ Dashboard</button>
    <button onclick="logout()">Keluar</button>
  </div>
</header>

<main>
  <div class="card">
    <h2>📅 Pilih Bulan Laporan</h2>
    <div class="controls">
      <select id="bulanSelect">
        <option value="">-- Pilih Bulan --</option>
        <option value="0">Januari</option><option value="1">Februari</option><option value="2">Maret</option>
        <option value="3">April</option><option value="4">Mei</option><option value="5">Juni</option>
        <option value="6">Juli</option><option value="7">Agustus</option><option value="8">September</option>
        <option value="9">Oktober</option><option value="10">November</option><option value="11">Desember</option>
      </select>
      <select id="tahunSelect"></select>
      <button onclick="generateLaporan()">Tampilkan Laporan</button>
    </div>
    <div id="laporanContainer">
      <p class="muted">Silakan pilih bulan dan tahun untuk melihat laporan anak Anda.</p>
    </div>
  </div>
</main>

<!-- ===== FIREBASE ===== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db);

  window.getFirebaseData = async function() {
    const [
      assesGuruSnap, assesNaqibSnap, absNaqibSnap, absKbmSnap, ujianSnap, tahfizSnap, pelanggaranSnap
    ] = await Promise.all([
      get(child(dbRef, "cahaya_app/assesment_cahaya_santri")),
      get(child(dbRef, "cahaya_app/assesment_cahaya_naqib")),
      get(child(dbRef, "cahaya_app/absensi_program_harian")),
      get(child(dbRef, "cahaya_app/absensi_pembelajaran")),
      get(child(dbRef, "cahaya_app/nilai_ujian")),
      get(child(dbRef, "cahaya_app/setoran_tahfiz")),
      get(child(dbRef, "cahaya_app/pelanggaran_santri")),
    ]);

    return {
      assesmentGuru: assesGuruSnap.exists() ? Object.values(assesGuruSnap.val()) : [],
      assesmentNaqib: assesNaqibSnap.exists() ? Object.values(assesNaqibSnap.val()) : [],
      absensiNaqib: absNaqibSnap.exists() ? Object.values(absNaqibSnap.val()) : [],
      absensiKbm: absKbmSnap.exists() ? Object.values(absKbmSnap.val()) : [],
      ujian: ujianSnap.exists() ? Object.values(ujianSnap.val()) : [],
      tahfiz: tahfizSnap.exists() ? Object.values(tahfizSnap.val()) : [],
      pelanggaranAll: pelanggaranSnap.exists() ? Object.values(pelanggaranSnap.val()) : [],
    };
  };
</script>

<script>
window.addEventListener("load", () => {
  const tahunSelect = document.getElementById("tahunSelect");
  const now = new Date().getFullYear();
  for (let i = now - 2; i <= now + 1; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i;
    if (i === now) opt.selected = true;
    tahunSelect.appendChild(opt);
  }
});

function logout(){
  localStorage.removeItem("cahayaCurrentUser");
  window.location.href = "../../index.html";
}
function goDashboard(){
  window.location.href = "../dashboard/";
}

function parseDate(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function isSameMonthYear(tgl,b,t){ const d=parseDate(tgl); return d&&d.getMonth()===b&&d.getFullYear()===t; }

async function generateLaporan() {
  const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
  if (!user || user.role !== "wali") return (window.location.href="../../index.html");

  const namaAnak = user.namaAnak || user.nama || user.label?.replace(/^Wali\s+/i, "") || "";
  const bulan = +document.getElementById("bulanSelect").value;
  const tahun = +document.getElementById("tahunSelect").value;
  const container = document.getElementById("laporanContainer");
  container.innerHTML = "<p class='muted'>🔄 Memuat data dari Firebase...</p>";

  if (isNaN(bulan) || isNaN(tahun))
    return (container.innerHTML = "<p class='muted'>Pilih bulan dan tahun.</p>");

  const { assesmentGuru, assesmentNaqib, absensiNaqib, absensiKbm, ujian, tahfiz, pelanggaranAll } = await window.getFirebaseData();

  // === Filter sesuai nama dan bulan ===
  const filterNama = (n) => (n || "").trim().toLowerCase() === namaAnak.toLowerCase();
  const asesGuru = assesmentGuru.find(a => filterNama(a.namaSantri) && isSameMonthYear(a.tgl||a.tanggal, bulan, tahun)) || {};
  const asesNaqib = assesmentNaqib.find(a => filterNama(a.namaSantri) && isSameMonthYear(a.tgl||a.tanggal, bulan, tahun)) || {};

  if (!asesGuru.namaSantri && !asesNaqib.namaSantri)
    return container.innerHTML = `<p class="muted">Tidak ada data bulan ini untuk <b>${namaAnak}</b>.</p>`;

  // === Kehadiran ===
  const hadirData = {};
  function tambahHadir(program, status){
    if(!hadirData[program]) hadirData[program] = {hadir:0, izin:0, sakit:0, alfa:0, total:0};
    status = (status||"").toLowerCase();
    if(hadirData[program][status]!==undefined) hadirData[program][status]++;
    hadirData[program].total++;
  }
  absensiNaqib.forEach(log=>{
    if(!isSameMonthYear(log.tanggal, bulan, tahun)) return;
    (log.data||[]).forEach(d=>{ if(filterNama(d.nama)) tambahHadir(log.program||"Program Harian", d.status); });
  });
  absensiKbm.forEach(log=>{
    if(!isSameMonthYear(log.tanggal, bulan, tahun)) return;
    (log.data||[]).forEach(d=>{ if(filterNama(d.nama)) tambahHadir(log.mapel||"KBM", d.status); });
  });
  const hadirRows = Object.entries(hadirData).map(([prog,v],i)=>{
    const pct = (x)=> v.total?Math.round((x/v.total)*100):0;
    return `<tr><td>${i+1}</td><td>${prog}</td><td>${pct(v.hadir)}%</td><td>${pct(v.izin)}%</td><td>${pct(v.sakit)}%</td><td>${pct(v.alfa)}%</td></tr>`;
  });

  // === Ujian ===
  const ujianData = ujian.filter(u => filterNama(u.santri) && isSameMonthYear(u.tanggal, bulan, tahun));
  const rata = ujianData.length ? Math.round(ujianData.reduce((a,b)=>a+(+b.nilai||0),0)/ujianData.length) : 0;

  // === Tahfiz ===
  const tahfizData = tahfiz.filter(t => isSameMonthYear(t.tanggal, bulan, tahun))
    .flatMap(t => t.data||[]).filter(d => filterNama(d.nama));

  // === Pelanggaran ===
  const pelanggaran = pelanggaranAll.filter(p => filterNama(p.santri) && isSameMonthYear(p.tanggal, bulan, tahun));

  // === Cetak HTML ===
  container.innerHTML = `
  <div class="laporan-card">
    <div class="laporan-header">
      <h1>Laporan Bulanan Anak</h1>
      <h3>${namaAnak.toUpperCase()}</h3>
      <p>${new Date(tahun, bulan).toLocaleString("id-ID",{month:"long",year:"numeric"})}</p>
    </div>

    <div class="section">
      <h2>🌈 Dimensi CAHAYA</h2>
      <p><b>🕋 Cinta Allah:</b> ${asesGuru.narasiSpiritual || "Belum ada catatan."}</p>
      <p><b>🤝 Akhlak Mulia:</b> ${asesNaqib.narasiRelational || "Belum ada catatan."}</p>
      <p><b>💓 Hati Bersih:</b> ${asesNaqib.narasiEmotional || "Belum ada catatan."}</p>
      <p><b>🧠 Akal Cerdas:</b> ${asesGuru.narasiIntellectual || "Belum ada catatan."}</p>
      <p><b>🏃‍♂️ Fisik Berdaya:</b> ${asesNaqib.narasiPhysical || "Belum ada catatan."}</p>
    </div>

    <div class="section">
  <h2>📅 Kehadiran</h2>
  ${
    hadirRows.length
      ? (() => {
          // hitung rata-rata kehadiran
          const keys = Object.keys(hadirData);
          const totalProg = keys.length;
          const avg = { hadir:0, izin:0, sakit:0, alfa:0 };
          keys.forEach(k => {
            const v = hadirData[k];
            const pct = (x)=> v.total?Math.round((x/v.total)*100):0;
            avg.hadir += pct(v.hadir);
            avg.izin += pct(v.izin);
            avg.sakit += pct(v.sakit);
            avg.alfa += pct(v.alfa);
          });
          avg.hadir = Math.round(avg.hadir / totalProg);
          avg.izin = Math.round(avg.izin / totalProg);
          avg.sakit = Math.round(avg.sakit / totalProg);
          avg.alfa = Math.round(avg.alfa / totalProg);

          return `
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Program</th>
                <th>Hadir</th>
                <th>Izin</th>
                <th>Sakit</th>
                <th>Alfa</th>
              </tr>
            </thead>
            <tbody>
              ${Object.entries(hadirData).map(([prog,v],i)=>{
                const pct = (x)=> v.total?Math.round((x/v.total)*100):0;
                return `
                  <tr>
                    <td>${i+1}</td>
                    <td>${prog}</td>
                    <td class="hadir-cell">${pct(v.hadir)}%</td>
                    <td class="izin-cell">${pct(v.izin)}%</td>
                    <td class="sakit-cell">${pct(v.sakit)}%</td>
                    <td class="alfa-cell">${pct(v.alfa)}%</td>
                  </tr>`;
              }).join("")}
              <tr style="font-weight:bold;background:#f3f4f6;">
                <td colspan="2">Rata-rata</td>
                <td class="hadir-cell">${avg.hadir}%</td>
                <td class="izin-cell">${avg.izin}%</td>
                <td class="sakit-cell">${avg.sakit}%</td>
                <td class="alfa-cell">${avg.alfa}%</td>
              </tr>
            </tbody>
          </table>`;
        })()
      : `<p class='muted'>Belum ada data kehadiran bulan ini.</p>`
  }
</div>


    <div class="section">
      <h2>🧾 Nilai Ujian</h2>
      ${
        ujianData.length
        ? `<table><tr><th>No</th><th>Mapel</th><th>Materi</th><th>Nilai</th><th>Keterangan</th></tr>
        ${ujianData.map((u,i)=>`<tr><td>${i+1}</td><td>${u.mapel||"-"}</td><td>${u.materi||"-"}</td><td>${u.nilai||"-"}</td><td>${u.nilai>=75?"✅ Tuntas":"❌ Belum Tuntas"}</td></tr>`).join("")}
        <tr><td colspan="3"><b>Rata-rata</b></td><td colspan="2">${rata}</td></tr></table>`
        : `<p class='muted'>Belum ada nilai ujian bulan ini.</p>`
      }
    </div>

    <div class="section">
  <h2>📖 Setoran Tahfiz</h2>
  ${
    tahfizData.length
      ? `<table>
          <thead>
            <tr>
              <th>No</th>
              <th>Tanggal</th>
              <th>Program</th>
              <th>Kelompok</th>
              <th>Setoran Hari Ini</th>
              <th>Jumlah Ayat</th>
              <th>Kesalahan</th>
              <th>Nilai</th>
              <th>Keterangan</th>
            </tr>
          </thead>
          <tbody>
            ${tahfiz
              .filter(t => isSameMonthYear(t.tanggal, bulan, tahun))
              .flatMap(t => (t.data || [])
                .filter(d => filterNama(d.nama))
                .map((d, i) => `
                  <tr>
                    <td>${i + 1}</td>
                    <td>${t.tanggal || '-'}</td>
                    <td>${t.program || '-'}</td>
                    <td>${t.kelompok || '-'}</td>
                    <td>${d.setoran || '-'}</td>
                    <td>${d.ayat || '-'}</td>
                    <td>${d.kesalahan || '-'}</td>
                    <td>${d.nilai || '-'}</td>
                    <td>${d.ket || d.keterangan || '-'}</td>
                  </tr>
                `)
              ).join('')}
          </tbody>
        </table>`
      : `<p class='muted'>Belum ada setoran tahfiz bulan ini.</p>`
  }
</div>

    <div class="section">
      <h2>⚠️ Pelanggaran</h2>
      ${
        pelanggaran.length
        ? `<table><tr><th>No</th><th>Tanggal</th><th>Pelanggaran</th><th>Kategori</th><th>Keterangan</th><th>Tindak Lanjut</th><th>Konsekuensi</th></tr>
        ${pelanggaran.map((p,i)=>`<tr><td>${i+1}</td><td>${p.tanggal||"-"}</td><td>${p.namaPelanggaran||"-"}</td><td>${p.kategori||"-"}</td><td>${p.keterangan||"-"}</td><td>${p.tindakLanjut||"-"}</td><td>${p.konsekuensi||"-"}</td></tr>`).join("")}</table>`
        : `<p class='muted'>Tidak ada pelanggaran bulan ini.</p>`
      }
    </div>
  </div>`;
}
</script>
</body>
</html>
