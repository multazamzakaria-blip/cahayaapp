    .header-exec-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:35px; }
    .logo-exec{ display:flex; align-items:center; gap:18px; }
    .logo-exec img{ width:95px; height:auto; }
    .logo-text{ line-height:1.2; }
    .logo-text .line1{ font-weight:700; font-size:18px; letter-spacing:1px; }
    .logo-text .line2{ font-weight:800; font-size:24px; }
    .logo-text .line3{ font-size:13px; color:#c17c1c; letter-spacing:1px; }
    .judul-exec{ text-align:right; }
    .judul-exec h1{ margin:0; font-size:34px; font-weight:800; line-height:1.1; letter-spacing:2px; color:#c17c1c; }
    .exec-divider{ height:3px; width:100%; margin:20px 0 25px 0; background:linear-gradient(to right,#c17c1c,#1e3a8a); border-radius:4px; }
    .identitas-exec{ background:#ffffff; border-radius:20px; padding:25px 35px; box-shadow:0 12px 35px rgba(0,0,0,0.05); display:flex; justify-content:space-between; font-size:16px; border:1px solid #e5e7eb; }

    .dim-card p { margin: 0; white-space: pre-line; font-size: 18px; text-align:justify; line-height:1.9; }
    .muted { color: #6b7280; font-size: 17px; text-align: center; display: block; margin-top: 20px;}
    .export-buttons { text-align: center; margin-top: 25px; }
    .export-buttons button { background: #2563eb; padding: 12px 24px; font-size: 17px; }
    .export-buttons button:hover { background: #1e40af; }
    
    @media (max-width: 600px) {
      .header-exec-top { flex-direction: column; gap: 20px; text-align: center; }
      .identitas-exec { flex-direction: column; gap: 15px; }
      .identitas-exec div { text-align: left !important; }
      main { padding: 15px; }
      .laporan-header-executive { padding: 25px; }
    }
  </style>
</head>

    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",

    storageBucket: "absensi-santri-fajrul-islam.appspot.com",

<script>
// === CEK LOGIN & INITIALISASI ===
let jsPDFLib;
let currentSantriName = ""; 

window.addEventListener("load", () => {
    // 1. Cek Login
    const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "{}");
    
    // Pastikan user adalah wali dan punya data anak
    if (user.role !== 'wali' || !user.namaAnak) {
        alert("Sesi habis atau tidak valid. Silakan login kembali.");
        window.location.href = "../../index.html"; 
        return;
    }

    currentSantriName = user.namaAnak;
    document.getElementById("namaSantriTitle").innerText = currentSantriName;

    // 2. Load JSPDF
    if (window.jspdf && window.jspdf.jsPDF) jsPDFLib = window.jspdf.jsPDF;

    // 3. Isi Dropdown Tahun
    const tahunSelect = document.getElementById("tahunSelect");
    const tNow = new Date().getFullYear();
    for (let t = tNow - 1; t <= tNow + 1; t++) {
        const opt = document.createElement("option");
        opt.value = t; opt.textContent = t; 
        if (t === tNow) opt.selected = true;
        tahunSelect.appendChild(opt);
    }
});

// === HELPER PENTING (PENYAMA NAMA) ===
// Agar "Ahmad" == "ahmad "
function normalize(str) {
    return (str || "").toLowerCase().trim().replace(/\s+/g, ' ');
}

function parseDate(s){ 
    if(!s) return null; 
    const p=s.split("-"); 
    return new Date(+p[0],+p[1]-1,+p[2]); 
}

function isSameMonthYear(tgl,b,t){ 
    const d=parseDate(tgl); 
    return d && d.getMonth()===b && d.getFullYear()===t; 
}

// === LOGIKA UTAMA: TAMPILKAN LAPORAN ===
async function generateReports() {
  const bulan = +document.getElementById("bulanSelect").value;
  const tahun = +document.getElementById("tahunSelect").value;
  const container = document.getElementById("laporanContainer");
  container.innerHTML = "<p class='muted'>⏳ Sedang memuat data...</p>";

  if (isNaN(bulan) || isNaN(tahun)) {
      container.innerHTML="<p class='muted'>Pilih bulan dan tahun terlebih dahulu.</p>";
      return;
  }

  const data = await window.getFirebaseData();
  
  // === KUNCI UTAMA: HANYA TAMPILKAN DATA ANAK YANG LOGIN ===
  const laporanHTML = buatLaporanSantri({
      nama: currentSantriName, // Nama Tampilan
      namaKey: normalize(currentSantriName), // Nama untuk Pencarian (lowercase)
      bulan, 
      tahun,
      ...data 
  });

  container.innerHTML = "";
  container.appendChild(laporanHTML);
}

// === FUNGSI HITUNG KEHADIRAN (FILTER SESUAI ANAK) ===
function hitungKehadiranGabungan(namaKey, bulan, tahun, absensiNaqib, absensiGuru) {
  const kehadiran = {};
  
  function tambah(prog, status) {
    if (!kehadiran[prog]) kehadiran[prog] = {hadir:0, izin:0, sakit:0, alfa:0, total:0};
    const s = (status || "").toLowerCase();
    if (kehadiran[prog][s] !== undefined) kehadiran[prog][s]++;
    kehadiran[prog].total++;
  }

  // Cek Data Naqib
  absensiNaqib.forEach(log => {
    if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
    (log.data || []).forEach(d => {
      // Filter hanya jika nama cocok
      if (normalize(d.nama) === namaKey) {
          tambah(log.program || "Program Harian", d.status);
      }
    });
  });

  // Cek Data Guru
  absensiGuru.forEach(log => {
    if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
    (log.data || []).forEach(d => {
      // Filter hanya jika nama cocok
      if (normalize(d.nama) === namaKey) {
          tambah(log.mapel || "KBM", d.status);
      }
    });
  });

  const result = Object.entries(kehadiran).map(([prog,v],i)=>{
    const toP = x => (v.total ? Math.round((x / v.total) * 100) : 0);
    return {
      no: i+1, program: prog,
      hadir: toP(v.hadir), izin: toP(v.izin), sakit: toP(v.sakit), alfa: toP(v.alfa)
    };
  });

  if (result.length) {
    const avg = x => Math.round(result.reduce((s,r)=>s + r[x],0) / result.length);
    result.push({ no: "", program: "<b>Rata-rata</b>", hadir: avg("hadir"), izin: avg("izin"), sakit: avg("sakit"), alfa: avg("alfa") });
  }
  return result;
}

// === FUNGSI RENDER KARTU (HANYA SATU KARTU) ===
function buatLaporanSantri(ctx) {
  const { 
      nama, namaKey, // namaKey = nama yang sudah di-normalize
      bulan, tahun, 
      assesmentGuru, assesmentNaqib, absensiNaqib, absensiKbm, 
      ujian, tahfiz, pelanggaranAll 
  } = ctx;

  const namaUpper = (nama || "").toUpperCase();
  const namaBulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][bulan];

  // ---- ASESMEN (Cari Naqib dulu, kalau tidak ada cari Guru) ----
  let ases = assesmentNaqib
    .filter(a => normalize(a.namaSantri) === namaKey && isSameMonthYear(a.tanggal, bulan, tahun))
    .sort((a,b)=> new Date(a.waktuSimpan) - new Date(b.waktuSimpan))
    .at(-1);

  if (!ases || !ases.narasiSpiritual) {
      ases = assesmentGuru
        .filter(a => normalize(a.namaSantri) === namaKey && isSameMonthYear(a.tanggal, bulan, tahun))
        .sort((a,b)=> new Date(a.waktuSimpan) - new Date(b.waktuSimpan))
        .at(-1) || {};
  }

  const def = "Belum ada catatan bulan ini.";
  const narasiSpiritual = ases.narasiSpiritual || def;
  const narasiRel = ases.narasiRelasional || def;
  const narasiEmo = ases.narasiEmosional || def;
  const narasiIntellectual = ases.narasiIntelektual || def;
  const narasiFis = ases.narasiFisik || def;
  
  const namaNaqib = (ases.naqib || "-").toUpperCase();
  const namaBulanUpper = (namaBulan || "").toUpperCase();

  const wrapper = document.createElement("div");
  wrapper.className = "laporan-card";
  wrapper.dataset.santri = nama;
  wrapper.dataset.bulan = namaBulan;
  wrapper.dataset.tahun = tahun;

  // Header Gambar (Path Mundur 2 level: ../../logofi.png)
  wrapper.innerHTML = `
  <div class="laporan-header-executive">
    <div class="header-exec-top">
      <div class="logo-exec">
        <img src="../../logofi.png" alt="Logo Pesantren" onerror="this.src='logofi.png'"> 
        <div class="logo-text">
          <div class="line1">PESANTREN CAHAYA</div>
          <div class="line2">FAJRUL ISLAM</div>
          <div class="line3">HOLISTIC ISLAMIC SCHOOL</div>
        </div>
      </div>
      <div class="judul-exec">
        <h1>LAPORAN<br>BULANAN SANTRI</h1>
      </div>
    </div>
    <div class="exec-divider"></div>
    <div class="identitas-exec">
      <div>
        <p><span>Nama Santri</span> : <b>${namaUpper}</b></p>
        <p><span>Nama Naqib/Guru</span> : <b>${namaNaqib}</b></p>
      </div>
      <div style="text-align:right">
        <p><span>Bulan</span> : <b>${namaBulanUpper}</b></p>
        <p><span>Tahun</span> : <b>${tahun}</b></p>
      </div>
    </div>
  </div>

  <div class="section-title">🌈 Dimensi CAHAYA</div>
  <div class="dim-card"><h4>🕋 Cinta Allah (Spiritual)</h4><p>${narasiSpiritual}</p></div>
  <div class="dim-card"><h4>🤝 Akhlak Mulia (Relational)</h4><p>${narasiRel}</p></div>
  <div class="dim-card"><h4>💓 Hati Bersih (Emotional)</h4><p>${narasiEmo}</p></div>
  <div class="dim-card"><h4>🧠 Akal Cerdas (Intellectual)</h4><p>${narasiIntellectual}</p></div>
  <div class="dim-card"><h4>🏃‍♂️ Fisik Berdaya (Physical)</h4><p>${narasiFis}</p></div>
  
  <div class="section-title">📈 Fokus Perbaikan Bulan Ini</div>
  <p><b>Dimensi Fokus:</b> ${(ases.fokusBulanIni || []).join(", ") || "-"}</p>
  <p><b>Spesifik Perbaikan:</b><br>${ases.spesifikBulanIni || "-"}</p>

  <div class="section-title">📊 Hasil Perbaikan Bulan Ini</div>
  <p><b>Status:</b> ${ases.hasilPerbaikan || "-"}</p>
  <p><b>Evaluasi:</b><br>${ases.evaluasiBulanIni || "-"}</p>

  <div class="section-title">🚀 Fokus Perbaikan Bulan Berikutnya</div>
  <p><b>Dimensi Fokus:</b> ${(ases.fokusBulanDepan || []).join(", ") || "-"}</p>
  <p><b>Spesifik Perbaikan:</b><br>${ases.spesifikBulanDepan || "-"}</p>
  `;

  // === Kehadiran ===
  const hadir = hitungKehadiranGabungan(namaKey, bulan, tahun, absensiNaqib, absensiKbm);
  wrapper.innerHTML += `<div class="section-title">🗓️ Laporan Kehadiran</div>` + (hadir.length ? 
    `<table><thead><tr><th>No</th><th>Program</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th></tr></thead><tbody>
    ${hadir.map(r=>`<tr><td>${r.no}</td><td>${r.program}</td><td>${r.hadir}%</td><td>${r.izin}%</td><td>${r.sakit}%</td><td>${r.alfa}%</td></tr>`).join("")}
    </tbody></table>` : `<p class='muted'>Belum ada data kehadiran.</p>`);

  // === Nilai Ujian ===
  const nilaiUjian = ujian.filter(u => normalize(u.santri) === namaKey && isSameMonthYear(u.tanggal, bulan, tahun));
  const rataUjian = nilaiUjian.length ? Math.round(nilaiUjian.reduce((s, u) => s + (+u.nilai || 0), 0) / nilaiUjian.length) : 0;
  
  wrapper.innerHTML += `<div class="section-title">🧾 Laporan Nilai Ujian</div>` + (nilaiUjian.length ? 
    `<table><thead><tr><th>No</th><th>Mata Pelajaran</th><th>Materi</th><th>Nilai</th><th>Ket</th></tr></thead><tbody>
    ${nilaiUjian.map((u,i)=>`<tr><td>${i+1}</td><td>${u.mapel}</td><td>${u.materi}</td><td>${u.nilai}</td><td>${u.nilai>=75?"✅":"❌"}</td></tr>`).join("")}
    <tr><td colspan="3"><b>Rata-rata</b></td><td colspan="2">${rataUjian}</td></tr></tbody></table>` : `<p class='muted'>Belum ada data ujian.</p>`);

  // === Tahfiz ===
  const dataTahfiz = tahfiz
    .filter(t => isSameMonthYear(t.tanggal, bulan, tahun))
    .flatMap(t => t.data || [])
    .filter(d => normalize(d.nama) === namaKey);

  wrapper.innerHTML += `<div class="section-title">📖 Laporan Setoran Tahfiz</div>` + (dataTahfiz.length ? 
    `<table><thead><tr><th>No</th><th>Setoran</th><th>Kesalahan</th><th>Nilai</th><th>Keterangan</th></tr></thead><tbody>
    ${dataTahfiz.map((d,i)=>`<tr><td>${i+1}</td><td>${d.surat||d.setoran}</td><td>${d.kesalahan||"-"}</td><td>${d.nilai}</td><td>${d.keterangan}</td></tr>`).join("")}
    </tbody></table>` : `<p class='muted'>Belum ada setoran tahfiz.</p>`);

  // === Pelanggaran ===
  const pelanggaran = pelanggaranAll.filter(p => normalize(p.santri) === namaKey && isSameMonthYear(p.tanggal, bulan, tahun));
  wrapper.innerHTML += `<div class="section-title">⚠️ Laporan Pelanggaran</div>` + (pelanggaran.length ? 
    `<table><thead><tr><th>No</th><th>Tanggal</th><th>Nama Pelanggaran</th><th>Tindak Lanjut</th></tr></thead><tbody>
    ${pelanggaran.map((p,i)=>`<tr><td>${i+1}</td><td>${p.tanggal}</td><td>${p.namaPelanggaran}</td><td>${p.tindakLanjut}</td></tr>`).join("")}
    </tbody></table>` : `<p class='muted'>Alhamdulillah, tidak ada pelanggaran.</p>`);

  // Tombol Export
  wrapper.innerHTML += `
    <div class="export-buttons">
      <button onclick="exportPDF()">⬇️ Download Laporan PDF</button>
    </div>`;

  return wrapper;
}

// ====== EXPORT PDF ======
async function exportPDF(){
  const el = document.querySelector(".laporan-card");
  if (!el) return;

  const bulan = el.dataset.bulan || "";
  const tahun = el.dataset.tahun || "";
  const nama = el.dataset.santri || "Santri";

  const btn = document.querySelector(".export-buttons button");
  const oldText = btn.innerText;
  btn.innerText = "⏳ Memproses PDF...";
  btn.disabled = true;

  try {
      const canvas = await html2canvas(el, { scale: 1.2, useCORS: true, scrollY: 0 });
      const pdf = new jsPDFLib("p","mm","a4");
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const footerSpace = 15;
      const usableHeight = pageHeight - margin - footerSpace;
      const imgWidth = pageWidth - 20;
      const ratio = imgWidth / canvas.width;
      const pageCanvasHeight = usableHeight / ratio;

      let renderedHeight = 0;
      let pageCount = 0;

      while (renderedHeight < canvas.height) {
        const pageCanvas = document.createElement("canvas");
        pageCanvas.width = canvas.width;
        pageCanvas.height = Math.min(pageCanvasHeight, canvas.height - renderedHeight);
        const ctx = pageCanvas.getContext("2d");
        ctx.drawImage(canvas, 0, renderedHeight, canvas.width, pageCanvas.height, 0, 0, canvas.width, pageCanvas.height);
        
        if (pageCount > 0) pdf.addPage();
        pdf.addImage(pageCanvas.toDataURL("image/jpeg", 0.75), "PNG", 10, margin, imgWidth, pageCanvas.height * ratio);
        
        renderedHeight += pageCanvas.height;
        pageCount++;
      }

      pdf.setPage(pdf.getNumberOfPages());
      pdf.setFontSize(12); pdf.setTextColor(40);
      pdf.text("Mengetahui,", pageWidth/2, pageHeight-45, {align:"center"});
      pdf.text("Direktur Pesantren Cahaya Fajrul Islam", pageWidth/2, pageHeight-38, {align:"center"});
      pdf.setFont(undefined, "bold");
      pdf.text("Multazam Zakaria, M.Pd.", pageWidth/2, pageHeight-20, {align:"center"});

      const cleanName = nama.toUpperCase().replace(/[^a-zA-Z0-9]/g,"_");
      pdf.save(`Laporan_${cleanName}_${bulan}_${tahun}.pdf`);
  } catch (e) {
      alert("Gagal export PDF: " + e.message);
      console.error(e);
  } finally {
      btn.innerText = oldText;
      btn.disabled = false;
  }
}

function logout(){
  localStorage.removeItem("cahayaCurrentUser");
  window.location.href = "../../index.html"; // Kembali ke login utama
}
</script>
