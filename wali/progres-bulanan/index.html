<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Bulanan Anak - CAHAYA APP</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f9fafb;
      color: #1f2937;
      margin: 0;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
    }

    .nav-buttons button {
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger:hover { background: #dc2626; }

    main { max-width: 1100px; margin: 1rem auto 3rem; padding: 1rem; }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .filter-box { display: flex; justify-content: center; flex-wrap: wrap; gap: .7rem; }

    select, button {
      padding: .6rem .8rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: .95rem;
    }

    button {
      background: #0f766e;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover { background: #115e59; }

    .laporan-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .laporan-header {
      text-align: center;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    .laporan-header h2 { font-size: 1.3rem; color: #0f172a; font-weight: 700; }
    .laporan-header h3 { font-size: 1.1rem; color: #334155; font-weight: 600; }

    .section-title {
      margin-top: 1.5rem;
      margin-bottom: .6rem;
      color: #0f766e;
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .dim-card {
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: .9rem 1rem;
      margin-bottom: .8rem;
    }

    .dim-card h4 { margin: 0; font-size: 1rem; font-weight: 600; color: #0f172a; }
    .dim-card p { font-size: .93rem; color: #374151; margin-top: .3rem; white-space: pre-line; }

    table { width: 100%; border-collapse: collapse; margin-top: .5rem; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; font-size: .9rem; text-align: center; }
    th { background: #f3f4f6; color: #1f2937; font-weight: 600; }

    .hadir-cell { background: #dcfce7; color: #065f46; font-weight: 600; }
    .izin-cell  { background: #dbeafe; color: #1e40af; font-weight: 600; }
    .sakit-cell { background: #fef9c3; color: #854d0e; font-weight: 600; }
    .alfa-cell  { background: #fee2e2; color: #991b1b; font-weight: 600; }

    footer { text-align: center; padding: 1.5rem; font-size: .9rem; color: #6b7280; }

    @media (max-width: 768px) {
      .filter-box { flex-direction: column; align-items: center; }
      select, button { width: 100%; }
      table, th, td { font-size: .8rem; }
    }
  </style>
</head>

<body>
  <header>
    <h1>📊 Laporan Bulanan Anak</h1>
    <div class="nav-buttons">
      <button class="btn-secondary" onclick="goDashboard()">⬅️ Dashboard</button>
      <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2 class="section-title">📅 Pilih Bulan Laporan</h2>
      <div class="filter-box">
        <select id="bulanSelect"><option value="">Bulan</option></select>
        <select id="tahunSelect"><option value="">Tahun</option></select>
        <button onclick="generateReport()">Tampilkan Laporan</button>
      </div>
    </div>

    <div id="laporanContainer">
      <p style="text-align:center;color:#6b7280;">Silakan pilih bulan dan tahun untuk melihat laporan anak.</p>
    </div>
  </main>

  <footer>© 2025 Pesantren Fajrul Islam — CAHAYA APP</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
      authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
      databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
      projectId: "absensi-santri-fajrul-islam",
      storageBucket: "absensi-santri-fajrul-islam.appspot.com",
      messagingSenderId: "739928369926",
      appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db);
    const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
    if (!user || user.role !== "wali") window.location.href = "../../index.html";

    const anak = user.nama || user.santri || user.namaAnak;

    const bulanNama = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const bulanSelect = document.getElementById("bulanSelect");
    const tahunSelect = document.getElementById("tahunSelect");

    bulanNama.forEach((b,i)=>{ const o=document.createElement("option");o.value=i;o.textContent=b;if(i===new Date().getMonth())o.selected=true;bulanSelect.appendChild(o); });
    const thn=new Date().getFullYear();
    for(let t=thn-1;t<=thn+1;t++){const o=document.createElement("option");o.value=t;o.textContent=t;if(t===thn)o.selected=true;tahunSelect.appendChild(o);}

    function parseDate(s){if(!s)return null;const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
    function isSameMonthYear(t,b,y){const d=parseDate(t);return d&&d.getMonth()===b&&d.getFullYear()===y;}

    async function getData(){
      const snaps = await Promise.all([
        get(child(dbRef,"cahaya_app/assesment_cahaya_santri")),
        get(child(dbRef,"cahaya_app/assesment_cahaya_naqib")),
        get(child(dbRef,"cahaya_app/absensi_program_harian")),
        get(child(dbRef,"cahaya_app/absensi_pembelajaran")),
        get(child(dbRef,"cahaya_app/nilai_ujian")),
        get(child(dbRef,"cahaya_app/setoran_tahfiz")),
        get(child(dbRef,"cahaya_app/pelanggaran_santri")),
      ]);
      return {
        assesmentGuru: snaps[0].exists()?Object.values(snaps[0].val()):[],
        assesmentNaqib: snaps[1].exists()?Object.values(snaps[1].val()):[],
        absensiNaqib: snaps[2].exists()?Object.values(snaps[2].val()):[],
        absensiKbm: snaps[3].exists()?Object.values(snaps[3].val()):[],
        ujian: snaps[4].exists()?Object.values(snaps[4].val()):[],
        tahfiz: snaps[5].exists()?Object.values(snaps[5].val()):[],
        pelanggaran: snaps[6].exists()?Object.values(snaps[6].val()):[],
      };
    }

    async function generateReport(){
      const bulan=+bulanSelect.value,tahun=+tahunSelect.value;
      const container=document.getElementById("laporanContainer");
      container.innerHTML="<p style='text-align:center'>⏳ Mengambil data...</p>";
      const data=await getData();
      const {assesmentGuru,assesmentNaqib,absensiNaqib,absensiKbm,ujian,tahfiz,pelanggaran}=data;
      const narasiGuru=assesmentGuru.find(a=>a.namaSantri===anak&&isSameMonthYear(a.tanggal,bulan,tahun))||{};
      const narasiNaqib=assesmentNaqib.find(a=>a.namaSantri===anak&&isSameMonthYear(a.tanggal,bulan,tahun))||{};
      const namaBulan=bulanNama[bulan];
      const card=document.createElement("div");
      card.className="laporan-card";
      card.innerHTML=`
      <div class="laporan-header"><h2>Laporan Bulanan Anak</h2><h3>${anak}</h3><p>${namaBulan} ${tahun}</p></div>
      <div class="section-title">🌈 Dimensi CAHAYA</div>
      <div class="dim-card"><h4>🕋 Cinta Allah (Spiritual)</h4><p>${narasiGuru.narasiSpiritual||"Belum ada catatan."}</p></div>
      <div class="dim-card"><h4>🤝 Akhlak Mulia (Relational)</h4><p>${narasiNaqib.narasiRelational||"Belum ada catatan."}</p></div>
      <div class="dim-card"><h4>💓 Hati Bersih (Emotional)</h4><p>${narasiNaqib.narasiEmotional||"Belum ada catatan."}</p></div>
      <div class="dim-card"><h4>🧠 Akal Cerdas (Intellectual)</h4><p>${narasiGuru.narasiIntellectual||"Belum ada catatan."}</p></div>
      <div class="dim-card"><h4>🏃‍♂️ Fisik Berdaya (Physical)</h4><p>${narasiNaqib.narasiPhysical||"Belum ada catatan."}</p></div>`;
      container.innerHTML="";
      container.appendChild(card);
    }

    window.goDashboard=()=>window.location.href="../dashboard/";
    window.logout=()=>{localStorage.removeItem("cahayaCurrentUser");window.location.href="../../index.html";};
  </script>
</body>
</html>
