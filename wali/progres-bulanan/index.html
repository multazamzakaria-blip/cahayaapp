<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Bulanan Anak - CAHAYA APP</title>

  <link rel="stylesheet" href="../wali-style.css">

  <style>
    /* ====== TAMBAHAN SPESIFIK HALAMAN ====== */
    main {
      max-width: 1100px;
      margin: 1rem auto 3rem;
      padding: 1rem;
    }

    .card header {
      background: none;
      padding: 0;
      box-shadow: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .filter-box {
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .laporan-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .laporan-header {
      text-align: center;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    .laporan-header h2 {
      font-size: 1.3rem;
      color: #0f172a;
      font-weight: 700;
    }

    .laporan-header h3 {
      font-size: 1.1rem;
      color: #334155;
      font-weight: 600;
    }

    .section-title {
      margin-top: 1.5rem;
      margin-bottom: 0.6rem;
      color: #0f766e;
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dim-card {
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 0.9rem 1rem;
      margin-bottom: 0.8rem;
    }

    .dim-card h4 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
    }

    .dim-card p {
      font-size: 0.95rem;
      color: #374151;
      margin-top: 0.3rem;
      white-space: pre-line;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      background: white;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      font-size: 0.9rem;
      text-align: center;
    }

    th {
      background: #f3f4f6;
      color: #1f2937;
    }

    /* === Kehadiran Cell Warna === */
    .hadir-cell { background: #dcfce7; color: #065f46; font-weight: 600; }
    .izin-cell  { background: #dbeafe; color: #1e40af; font-weight: 600; }
    .sakit-cell { background: #fef9c3; color: #854d0e; font-weight: 600; }
    .alfa-cell  { background: #fee2e2; color: #991b1b; font-weight: 600; }

    /* === Responsif Mobile === */
    @media (max-width: 768px) {
      .laporan-card {
        padding: 1rem;
        border-radius: 12px;
      }

      table, th, td {
        font-size: 0.8rem;
        padding: 6px;
      }

      .section-title {
        font-size: 1rem;
      }

      .dim-card h4 { font-size: 0.95rem; }
      .dim-card p { font-size: 0.85rem; }
    }
  </style>
</head>

<body>
  <header>
    <h1>📊 Laporan Bulanan Anak</h1>
    <div class="nav-buttons">
      <button class="btn-secondary" onclick="goDashboard()">⬅️ Dashboard</button>
      <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2 class="section-title">📅 Pilih Bulan Laporan</h2>
      <div class="filter-box">
        <select id="bulanSelect">
          <option value="">Bulan</option>
        </select>
        <select id="tahunSelect">
          <option value="">Tahun</option>
        </select>
        <button onclick="generateReport()">Tampilkan Laporan</button>
      </div>
    </div>

    <div id="laporanContainer">
      <p class="muted">Silakan pilih bulan dan tahun untuk melihat laporan anak.</p>
    </div>
  </main>

  <footer>© 2025 Pesantren Fajrul Islam — CAHAYA APP</footer>

  <!-- 🔥 Firebase dan Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
      authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
      databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
      projectId: "absensi-santri-fajrul-islam",
      storageBucket: "absensi-santri-fajrul-islam.appspot.com",
      messagingSenderId: "739928369926",
      appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db);

    // === Ambil user wali dari localStorage ===
    const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "null");
    if (!user || user.role !== "wali") {
      window.location.href = "../../index.html";
    }

    const anak = user.namaAnak;
    const bulanSelect = document.getElementById("bulanSelect");
    const tahunSelect = document.getElementById("tahunSelect");

    // isi dropdown bulan & tahun
    const bulanNama = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    bulanNama.forEach((b,i)=>{
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = b;
      if (i === new Date().getMonth()) opt.selected = true;
      bulanSelect.appendChild(opt);
    });

    const tahunSekarang = new Date().getFullYear();
    for(let t=tahunSekarang-1; t<=tahunSekarang+1; t++){
      const opt=document.createElement("option");
      opt.value=t;
      opt.textContent=t;
      if(t===tahunSekarang) opt.selected=true;
      tahunSelect.appendChild(opt);
    }

    // fungsi bantu
    function parseDate(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
    function isSameMonthYear(tgl,b,t){ const d=parseDate(tgl); return d&&d.getMonth()===b&&d.getFullYear()===t; }

    // ambil data firebase
    async function getData() {
      const snaps = await Promise.all([
        get(child(dbRef, "cahaya_app/assesment_cahaya_santri")),
        get(child(dbRef, "cahaya_app/assesment_cahaya_naqib")),
        get(child(dbRef, "cahaya_app/absensi_program_harian")),
        get(child(dbRef, "cahaya_app/absensi_pembelajaran")),
        get(child(dbRef, "cahaya_app/nilai_ujian")),
        get(child(dbRef, "cahaya_app/setoran_tahfiz")),
        get(child(dbRef, "cahaya_app/pelanggaran_santri")),
      ]);
      return {
        assesmentGuru: snaps[0].exists()?Object.values(snaps[0].val()):[],
        assesmentNaqib: snaps[1].exists()?Object.values(snaps[1].val()):[],
        absensiNaqib: snaps[2].exists()?Object.values(snaps[2].val()):[],
        absensiKbm: snaps[3].exists()?Object.values(snaps[3].val()):[],
        ujian: snaps[4].exists()?Object.values(snaps[4].val()):[],
        tahfiz: snaps[5].exists()?Object.values(snaps[5].val()):[],
        pelanggaran: snaps[6].exists()?Object.values(snaps[6].val()):[],
      };
    }

    // tampil laporan
   async function generateReport(){
  const bulan = +bulanSelect.value;
  const tahun = +tahunSelect.value;
  const container = document.getElementById("laporanContainer");
  container.innerHTML = "<p class='muted'>⏳ Mengambil data...</p>";

  const data = await getData();
  const { assesmentGuru, assesmentNaqib } = data;

  const anak = user.nama || user.santri || user.namaAnak;
  console.log("🧠 Anak:", anak);
  console.log("📚 Data Guru:", assesmentGuru);
  console.log("📘 Data Naqib:", assesmentNaqib);

  const narasiGuru = assesmentGuru.find(a =>
    (a.namaSantri || "").toLowerCase().trim() === anak.toLowerCase().trim() &&
    isSameMonthYear(a.tanggal || a.tgl, bulan, tahun)
  ) || {};

  const narasiNaqib = assesmentNaqib.find(a =>
    (a.namaSantri || "").toLowerCase().trim() === anak.toLowerCase().trim() &&
    isSameMonthYear(a.tanggal || a.tgl, bulan, tahun)
  ) || {};

  const namaBulan = bulanNama[bulan];
  const card = document.createElement("div");
  card.className = "laporan-card";
  card.innerHTML = `
    <div class="laporan-header">
      <h2>Laporan Bulanan Anak</h2>
      <h3>${anak}</h3>
      <p>${namaBulan} ${tahun}</p>
    </div>

    <div class="section-title">🌈 Dimensi CAHAYA</div>
    <div class="dim-card"><h4>🕋 Cinta Allah (Spiritual)</h4><p>${narasiGuru.narasiSpiritual || narasiGuru.catatanSpiritual || "Belum ada catatan."}</p></div>
    <div class="dim-card"><h4>🤝 Akhlak Mulia (Relational)</h4><p>${narasiNaqib.narasiRelational || narasiNaqib.catatanRelasi || "Belum ada catatan."}</p></div>
    <div class="dim-card"><h4>💓 Hati Bersih (Emotional)</h4><p>${narasiNaqib.narasiEmotional || narasiNaqib.catatanHati || "Belum ada catatan."}</p></div>
    <div class="dim-card"><h4>🧠 Akal Cerdas (Intellectual)</h4><p>${narasiGuru.narasiIntellectual || narasiGuru.catatanAkal || "Belum ada catatan."}</p></div>
    <div class="dim-card"><h4>🏃‍♂️ Fisik Berdaya (Physical)</h4><p>${narasiNaqib.narasiPhysical || narasiNaqib.catatanFisik || "Belum ada catatan."}</p></div>
  `;

  container.innerHTML = "";
  container.appendChild(card);
}


    // tombol navigasi
    window.goDashboard = () => window.location.href = "../dashboard/";
    window.logout = () => { localStorage.removeItem("cahayaCurrentUser"); window.location.href = "../../index.html"; };
  </script>
</body>
</html>
