    /* HEADER */
    header { background: #1e3a8a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    
    /* MAIN */
    main { padding: 20px; max-width: 1000px; margin: auto; }
    
    /* CARD */
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); margin-bottom: 30px; }
    
    /* CONTROLS */
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
    select, button { padding: 12px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 15px; width: 100%; max-width: 200px; box-sizing: border-box; }
    button { background: #1e3a8a; color: white; cursor: pointer; font-weight: bold; border: none; transition: 0.2s; max-width: 150px; }
    button:hover { background: #1e40af; transform: translateY(-1px); }
    .btn-secondary { background: #e5e7eb; color: #111827; max-width: fit-content; font-size: 14px; padding: 8px 12px; }
    
    /* === LAPORAN EXECUTIVE STYLE === */
    .laporan-card { border: 1px solid #e5e7eb; border-radius: 16px; padding: 25px; margin-bottom: 30px; background: white; position: relative; }
    
    .laporan-header-executive {
      background: linear-gradient(135deg,#fefcde,#fcfbef,#faffdb);
      border-radius: 20px; padding: 30px; 
      box-shadow: 0 15px 40px rgba(15,23,42,0.05);
      position: relative; overflow: hidden; margin-bottom: 25px; border: 1px solid #e5e7eb;
    }
    .laporan-header-executive::before {
      content: ""; position: absolute; top: -50px; right: -70px; width: 250px; height: 180px;
      background: linear-gradient(135deg,#1e3a8a,#0f766e); opacity: 0.05; border-radius: 50px; transform: rotate(-8deg); pointer-events: none;
    }
    
    .header-exec-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .logo-exec { display: flex; align-items: center; gap: 15px; }
    .logo-exec img { width: 80px; height: auto; }
    .logo-text { line-height: 1.2; }
    .logo-text .line1 { font-weight: 700; font-size: 16px; letter-spacing: 1px; color: #1e293b; }
    .logo-text .line2 { font-weight: 800; font-size: 20px; color: #1e293b; }
    .judul-exec h1 { margin: 0; font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: 1px; color: #c17c1c; text-align: right; }
    .exec-divider { height: 3px; width: 100%; margin: 15px 0 20px 0; background: linear-gradient(to right,#c17c1c,#1e3a8a); border-radius: 4px; }
    .identitas-exec { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); display: flex; justify-content: space-between; font-size: 15px; border: 1px solid #e5e7eb; }
    .identitas-exec span { color: #64748b; font-weight: 500; font-size: 14px; }
    .identitas-exec b { font-weight: 700; color: #1e293b; }

    /* CONTENT STYLE */
    .section-title { margin-top: 25px; margin-bottom: 10px; font-weight: 800; color: #1e3a8a; display: flex; align-items: center; gap: 8px; font-size: 18px; border-bottom: 2px solid #f1f5f9; padding-bottom: 5px; }
    
    .dim-card { border-radius: 12px; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 15px; margin-bottom: 10px; }
    .dim-card h4 { margin: 0 0 5px; font-size: 16px; color: #0f766e; }
    .dim-card p { margin: 0; white-space: pre-line; text-align: justify; line-height: 1.7; color: #334155; }

    /* RESPONSIVE TABLE */
    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; border-radius: 10px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { border: 1px solid #e2e8f0; padding: 12px 15px; text-align: left; font-size: 14px; }
    th { background: #f1f5f9; font-weight: 700; color: #1e293b; white-space: nowrap; }
    td { color: #334155; }
    tr:nth-child(even) { background-color: #f8fafc; }

    .muted { color: #94a3b8; font-size: 15px; text-align: center; margin-top: 20px; }
    
    /* NIHIL PELANGGARAN STYLE */
    .nihil-pelanggaran {

    }

    .export-buttons button { background: #2563eb; padding: 12px 20px; font-size: 15px; width: 100%; max-width: 300px; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }

    @media (max-width: 600px) {

      .identitas-exec div { text-align: center !important; }
      .btn-secondary { font-size: 12px; padding: 6px 10px; }
    }
  </style>
</head>

let jsPDFLib;

window.addEventListener("load", () => {

    const user = JSON.parse(localStorage.getItem("cahayaCurrentUser") || "{}");
    if (user.role !== 'wali' || !user.namaAnak) {

    const tNow = new Date().getFullYear();
    for (let t = tNow - 1; t <= tNow + 1; t++) {
        const opt = document.createElement("option");

        if (t === tNow) opt.selected = true;
        tahunSelect.appendChild(opt);

// === HELPER ===
function normalize(str) {
    return (str || "").toLowerCase().trim().replace(/\s+/g, ' ');
}
function parseDate(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function isSameMonthYear(tgl,b,t){ const d=parseDate(tgl); return d && d.getMonth()===b && d.getFullYear()===t; }

async function generateReports() {
  const bulan = +document.getElementById("bulanSelect").value;
  const tahun = +document.getElementById("tahunSelect").value;
  const container = document.getElementById("laporanContainer");
  container.innerHTML = "<p class='muted'>⏳ Sedang memuat data...</p>";

  if (isNaN(bulan) || isNaN(tahun)) {
      container.innerHTML="<p class='muted'>Pilih bulan dan tahun terlebih dahulu.</p>";
      return;
  }

  const data = await window.getFirebaseData();
  const namaKey = normalize(currentSantriName);

  console.log("Mencari data untuk:", currentSantriName, "Key:", namaKey); // DEBUG

  const laporanHTML = buatLaporanSantri({
      nama: currentSantriName, 
      namaKey: namaKey,
      bulan, tahun,
      ...data 
  });

  container.innerHTML = "";
  container.appendChild(laporanHTML);
}

function hitungKehadiranGabungan(namaKey, bulan, tahun, absensiNaqib, absensiGuru) {
  const kehadiran = {};
  function tambah(prog, status) {
    if (!kehadiran[prog]) kehadiran[prog] = {hadir:0, izin:0, sakit:0, alfa:0, total:0};
    const s = (status || "").toLowerCase();
    if (kehadiran[prog][s] !== undefined) kehadiran[prog][s]++;
    kehadiran[prog].total++;
  }
  absensiNaqib.forEach(log => { if (isSameMonthYear(log.tanggal, bulan, tahun)) (log.data || []).forEach(d => { if (normalize(d.nama) === namaKey) tambah(log.program || "Harian", d.status); }); });
  absensiGuru.forEach(log => { if (isSameMonthYear(log.tanggal, bulan, tahun)) (log.data || []).forEach(d => { if (normalize(d.nama) === namaKey) tambah(log.mapel || "KBM", d.status); }); });

  const result = Object.entries(kehadiran).map(([prog,v])=>{
    const toP = x => (v.total ? Math.round((x / v.total) * 100) : 0);
    return { program: prog, hadir: toP(v.hadir), izin: toP(v.izin), sakit: toP(v.sakit), alfa: toP(v.alfa) };
  });
  return result;
}

function buatLaporanSantri(ctx) {
  const { nama, namaKey, bulan, tahun, assesmentGuru, assesmentNaqib, absensiNaqib, absensiKbm, ujian, tahfiz, pelanggaranAll } = ctx;

  const namaUpper = (nama || "").toUpperCase();
  const namaBulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][bulan];

  let ases = assesmentNaqib.filter(a => normalize(a.namaSantri) === namaKey && isSameMonthYear(a.tanggal, bulan, tahun)).sort((a,b)=> new Date(a.waktuSimpan) - new Date(b.waktuSimpan)).at(-1);
  if (!ases || !ases.narasiSpiritual) ases = assesmentGuru.filter(a => normalize(a.namaSantri) === namaKey && isSameMonthYear(a.tanggal, bulan, tahun)).sort((a,b)=> new Date(a.waktuSimpan) - new Date(b.waktuSimpan)).at(-1) || {};

  const def = "Belum ada catatan.";
  const narasiSpiritual = ases.narasiSpiritual || def;
  const narasiRel = ases.narasiRelasional || def;
  const narasiEmo = ases.narasiEmosional || def;
  const narasiIntellectual = ases.narasiIntelektual || def;
  const narasiFis = ases.narasiFisik || def;
  const namaNaqib = (ases.naqib || "-").toUpperCase();
  const namaBulanUpper = (namaBulan || "").toUpperCase();

  const wrapper = document.createElement("div");
  wrapper.className = "laporan-card";
  wrapper.dataset.santri = nama;
  wrapper.dataset.bulan = namaBulan;
  wrapper.dataset.tahun = tahun;

  // Header Executive
  wrapper.innerHTML = `
  <div class="laporan-header-executive">
    <div class="header-exec-top">
      <div class="logo-exec">
        <img src="../../logofi.png" alt="Logo" onerror="this.src='logofi.png'">
        <div class="logo-text">
          <div class="line1">PESANTREN CAHAYA</div>
          <div class="line2">FAJRUL ISLAM</div>
          <div class="line3">HOLISTIC ISLAMIC SCHOOL</div>
        </div>
      </div>
      <div class="judul-exec">
        <h1>LAPORAN<br>BULANAN SANTRI</h1>
      </div>
    </div>
    <div class="exec-divider"></div>
    <div class="identitas-exec">
      <div>
        <p><span>Nama Santri</span> : <b>${namaUpper}</b></p>
        <p><span>Nama Naqib/Guru</span> : <b>${namaNaqib}</b></p>
      </div>
      <div style="text-align:right">
        <p><span>Bulan</span> : <b>${namaBulanUpper}</b></p>
        <p><span>Tahun</span> : <b>${tahun}</b></p>
      </div>
    </div>
  </div>

  <div class="section-title">🌈 Dimensi CAHAYA</div>
  <div class="dim-card"><h4>🕋 Cinta Allah</h4><p>${narasiSpiritual}</p></div>
  <div class="dim-card"><h4>🤝 Akhlak Mulia</h4><p>${narasiRel}</p></div>
  <div class="dim-card"><h4>💓 Hati Bersih</h4><p>${narasiEmo}</p></div>
  <div class="dim-card"><h4>🧠 Akal Cerdas</h4><p>${narasiIntellectual}</p></div>
  <div class="dim-card"><h4>🏃‍♂️ Fisik Berdaya</h4><p>${narasiFis}</p></div>
  
  <div class="section-title">📈 Fokus Perbaikan Bulan Ini</div>
  <div class="dim-card">
    <p><b>Dimensi Fokus:</b> ${(ases.fokusBulanIni || []).join(", ") || "-"}</p>
    <p><b>Spesifik Perbaikan:</b><br>${ases.spesifikBulanIni || "-"}</p>
  </div>

  <div class="section-title">📊 Hasil Perbaikan Bulan Ini</div>
  <div class="dim-card">
    <p><b>Status:</b> ${ases.hasilPerbaikan || "-"}</p>
    <p><b>Evaluasi:</b><br>${ases.evaluasiBulanIni || "-"}</p>
  </div>

  <div class="section-title">🚀 Fokus Perbaikan Bulan Berikutnya</div>
  <div class="dim-card">
    <p><b>Dimensi Fokus:</b> ${(ases.fokusBulanDepan || []).join(", ") || "-"}</p>
    <p><b>Spesifik Perbaikan:</b><br>${ases.spesifikBulanDepan || "-"}</p>
  </div>
  `;

  // Kehadiran (Table Wrapped)
  const hadir = hitungKehadiranGabungan(namaKey, bulan, tahun, absensiNaqib, absensiKbm);
  wrapper.innerHTML += `<div class="section-title">🗓️ Kehadiran</div>` + (hadir.length ? 
    `<div class="table-wrapper">
      <table>
        <thead><tr><th>Program</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th></tr></thead>
        <tbody>${hadir.map(r=>`<tr><td>${r.program}</td><td>${r.hadir}%</td><td>${r.izin}%</td><td>${r.sakit}%</td><td>${r.alfa}%</td></tr>`).join("")}</tbody>
      </table>
    </div>` : `<p class='muted'>-</p>`);

  // Ujian (Table Wrapped)
  const nilaiUjian = ujian.filter(u => normalize(u.santri) === namaKey && isSameMonthYear(u.tanggal, bulan, tahun));
  const rataUjian = nilaiUjian.length ? Math.round(nilaiUjian.reduce((s, u) => s + (+u.nilai || 0), 0) / nilaiUjian.length) : 0;
  
  wrapper.innerHTML += `<div class="section-title">🧾 Nilai Ujian</div>` + (nilaiUjian.length ? 
    `<div class="table-wrapper">
      <table>
        <thead><tr><th>Mapel</th><th>Materi</th><th>Nilai</th><th>Ket</th></tr></thead>
        <tbody>
          ${nilaiUjian.map(u=>`<tr><td>${u.mapel}</td><td>${u.materi}</td><td>${u.nilai}</td><td>${u.nilai>=75?"✅":"❌"}</td></tr>`).join("")}
          <tr><td colspan="2"><b>Rata-rata</b></td><td colspan="2">${rataUjian}</td></tr>
        </tbody>
      </table>
    </div>` : `<p class='muted'>-</p>`);

  // Tahfiz (Table Wrapped) - FIX KETERANGAN DI SINI (Data Lama & Baru Muncul)
  const dataTahfiz = tahfiz.filter(t => isSameMonthYear(t.tanggal, bulan, tahun)).flatMap(t => t.data || []).filter(d => normalize(d.nama) === namaKey);
  wrapper.innerHTML += `<div class="section-title">📖 Tahfiz</div>` + (dataTahfiz.length ? 
    `<div class="table-wrapper">
      <table>
        <thead><tr><th>Setoran</th><th>Nilai</th><th>Ket</th></tr></thead>
        <tbody>${dataTahfiz.map(d=>`<tr><td>${d.surat||d.setoran}</td><td>${d.nilai}</td><td>${d.keterangan || d.ket || "-"}</td></tr>`).join("")}</tbody>
      </table>
    </div>` : `<p class='muted'>-</p>`);

  // Pelanggaran (Table Wrapped & Nihil Message)
  const pelanggaran = pelanggaranAll.filter(p => normalize(p.santri) === namaKey && isSameMonthYear(p.tanggal, bulan, tahun));
  
  wrapper.innerHTML += `<div class="section-title">⚠️ Catatan Pelanggaran</div>`;
  
  if(pelanggaran.length > 0) {
      wrapper.innerHTML += `
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Tgl</th><th>Kasus</th><th>Tindak Lanjut</th></tr></thead>
          <tbody>${pelanggaran.map(p=>`<tr><td>${p.tanggal}</td><td>${p.namaPelanggaran}</td><td>${p.tindakLanjut}</td></tr>`).join("")}</tbody>
        </table>
      </div>`;
  } else {
      wrapper.innerHTML += `<div class="nihil-pelanggaran">✅ Alhamdulillah, tidak ada catatan pelanggaran bulan ini.</div>`;
  }

  wrapper.innerHTML += `
    <div class="export-buttons">
      <button onclick="exportPDF('${nama.replace(/'/g,"\\'")}')">⬇️ Download PDF</button>
    </div>`;

  return wrapper;
}

// ====== EXPORT PDF ======
async function exportPDF(nama){
  const el = document.querySelector(".laporan-card");
  if (!el) return;

  const btn = document.querySelector(".export-buttons button");
  const oldText = btn.innerText;
  btn.innerText = "⏳ Memproses..."; btn.disabled = true;

  try {
      const originalStyle = el.getAttribute('style');
      el.style.width = "800px"; 
      el.style.maxWidth = "none";
      el.style.position = "absolute"; 
      el.style.left = "-9999px"; 
      document.body.appendChild(el.cloneNode(true)); 

      const canvas = await html2canvas(el, { scale: 1.5, useCORS: true, scrollY: 0, windowWidth: 1024 });
      
      el.style.width = ""; el.style.maxWidth = ""; el.style.position = ""; el.style.left = "";

      const pdf = new jsPDFLib("p","mm","a4");
      const imgWidth = 190; 
      const pageHeight = 295;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      let heightLeft = imgHeight;
      let position = 10;

      pdf.addImage(canvas.toDataURL("image/jpeg", 0.85), "JPEG", 10, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;

      while (heightLeft >= 0) {
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.85), "JPEG", 10, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }

      pdf.setPage(pdf.getNumberOfPages());
      pdf.setFontSize(10); pdf.setTextColor(50);
      const footerY = 280;
      pdf.text("Mengetahui, Direktur Pesantren", 140, footerY-15);
      pdf.setFont(undefined, 'bold');
      pdf.text("Multazam Zakaria, M.Pd.", 140, footerY-5);

      const cleanName = nama.toUpperCase().replace(/[^a-zA-Z0-9]/g,"_");
      pdf.save(`Laporan_${cleanName}.pdf`);
  } catch (e) {
      alert("Gagal export: " + e.message);
  } finally {
      btn.innerText = oldText; btn.disabled = false;
  }
}
