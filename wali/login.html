<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Wali Santri – CAHAYA APP</title>
  <link rel="stylesheet" href="wali-style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      flex-direction: column;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: white;
      color: #0f766e;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.25s;
    }

    button:hover { background: #f3f4f6; transform: translateY(-2px); }

    footer {
      position: fixed;
      bottom: 10px;
      color: #cbd5e1;
      font-size: 11px;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <img src="../logofi.png" alt="Logo Pesantren" style="width:80px;height:80px;margin-bottom:12px">
  <div class="card">
    <h2>👨‍👩‍👧 Login Wali Santri</h2>
    <p style="font-size:13px;color:#e2e8f0;margin-top:-8px;">Pesantren Cahaya Fajrul Islam</p>
    <input type="text" id="username" placeholder="Username Wali (contoh: bapak.ahmad)">
    <input type="password" id="password" placeholder="Password">
    <button onclick="loginWali()">Masuk</button>
    <button style="background:transparent;border:1px solid white;color:white;margin-top:12px" onclick="goBack()">⬅️ Kembali ke Portal</button>
  </div>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>

  <script>
    // ===============================
    // 👨‍👩‍👧 DATA AKUN WALI SANTRI
    // ===============================
    const waliUsers = [
      { username: "bapak.ahmad", password: "wali123", namaAnak: "AHMAD MAULANA" },
      { username: "ibu.fatimah", password: "wali123", namaAnak: "NILAM CAHYA" },
      { username: "bapak.dimas", password: "wali123", namaAnak: "MUHAMMAD FIRAAS AL INSYIROH" }
    ];

    // ===============================
    // 🔑 LOGIN FUNCTION
    // ===============================
    function loginWali() {
      const user = document.getElementById("username").value.trim().toLowerCase();
      const pass = document.getElementById("password").value.trim();
      const found = waliUsers.find(u => u.username === user && u.password === pass);

      if (!found) {
        alert("❌ Username atau password salah!");
        return;
      }

      // Simpan ke localStorage
      localStorage.setItem("cahayaWaliUser", JSON.stringify(found));

      // Arahkan ke dashboard wali
      window.location.href = "wali-santri.html";
    }

    function goBack() {
      window.location.href = "../index.html";
    }
  </script>
</body>
</html>
