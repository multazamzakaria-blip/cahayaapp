<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <link rel="stylesheet" href="wali-style.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      margin: 0;
      padding: 16px;
      color: white;
    }

    h2 { margin-top: 10px; }

    /* NAV MENU */
    .menu {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .menu button {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .menu button.active {
      background: #0d9488;
      font-weight: 600;
    }

    .filter {
      margin-top: 10px;
      text-align: center;
    }
    .filter input {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .filter input::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 8px;
    }
    th, td {
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px;
      text-align: left;
    }
    th {
      background: rgba(255,255,255,0.15);
    }
    .badge {
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-hadir { background: #16a34a; }
    .badge-izin { background: #0ea5e9; }
    .badge-sakit { background: #eab308; }
    .badge-alfa { background: #dc2626; }

    @media (max-width:600px) {
      th, td { font-size: 0.8rem; padding: 5px; }
      .menu button { font-size: 0.8rem; padding: 8px 12px; }
    }
  </style>
</head>

<body>
  <h1>🌞 Dashboard Wali Santri</h1>
  <div id="greeting"></div>

  <div class="menu">
    <button id="btnHarian" class="active">Laporan Harian</button>
    <button id="btnBulanan">Laporan Bulanan</button>
  </div>

  <div id="filterHarian" class="filter">
    <label for="tanggal">Tanggal: </label>
    <input type="date" id="tanggal" />
  </div>

  <div id="content"></div>

  <button style="margin-top:20px" onclick="logoutWali()">🚪 Keluar</button>

  <!-- === SCRIPT === -->
  <script type="module">
    import { checkWaliLogin, logoutWali } from './wali-script.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase config
    const app = initializeApp({
      apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
      authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
      databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
      projectId: "absensi-santri-fajrul-islam",
      storageBucket: "absensi-santri-fajrul-islam.appspot.com",
      messagingSenderId: "739928369926",
      appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
    });

    const db = getDatabase(app);
    const user = checkWaliLogin();
    if (!user) window.location.href = "wali-login.html";

    document.getElementById("greeting").innerHTML = 
      `👋 Assalamu’alaikum Ayah/Bunda <b>${user.namaAnak}</b>`;

    // === Event tombol ===
    const btnHarian = document.getElementById("btnHarian");
    const btnBulanan = document.getElementById("btnBulanan");
    const content = document.getElementById("content");
    const filterDiv = document.getElementById("filterHarian");
    const tanggalInput = document.getElementById("tanggal");

    const today = new Date().toISOString().split("T")[0];
    tanggalInput.value = today;

    btnHarian.addEventListener("click", () => {
      btnHarian.classList.add("active");
      btnBulanan.classList.remove("active");
      filterDiv.style.display = "block";
      loadLaporanHarian(tanggalInput.value);
    });

    btnBulanan.addEventListener("click", () => {
      btnBulanan.classList.add("active");
      btnHarian.classList.remove("active");
      filterDiv.style.display = "none";
      loadLaporanBulanan();
    });

    tanggalInput.addEventListener("change", () => loadLaporanHarian(tanggalInput.value));

    // === Load Laporan Harian ===
    async function loadLaporanHarian(tanggal) {
      content.innerHTML = `
        <div class="card"><h2>📋 Absensi Program Harian</h2><div id="prog">Memuat...</div></div>
        <div class="card"><h2>📖 Absensi Pembelajaran</h2><div id="pemb">Memuat...</div></div>
        <div class="card"><h2>🕋 Setoran Tahfiz</h2><div id="tahfiz">Memuat...</div></div>
        <div class="card"><h2>⚠️ Pelanggaran</h2><div id="pel">Memuat...</div></div>
      `;

      const nama = user.namaAnak;
      const elProg = document.getElementById("prog");
      const elPemb = document.getElementById("pemb");
      const elTahfiz = document.getElementById("tahfiz");
      const elPel = document.getElementById("pel");

      try {
        // 1️⃣ Program Harian
        const snapProg = await get(child(ref(db), "cahaya_app/absensi_program_harian"));
        elProg.innerHTML = renderTableAbsensi(snapProg, tanggal, nama);

        // 2️⃣ Pembelajaran
        const snapPemb = await get(child(ref(db), "cahaya_app/absensi_pembelajaran"));
        elPemb.innerHTML = renderTablePembelajaran(snapPemb, tanggal, nama);

        // 3️⃣ Tahfiz
        const snapTahfiz = await get(child(ref(db), "cahaya_app/setoran_tahfiz"));
        elTahfiz.innerHTML = renderTableTahfiz(snapTahfiz, tanggal, nama);

        // 4️⃣ Pelanggaran
        const snapPel = await get(child(ref(db), "cahaya_app/pelanggaran_santri"));
        elPel.innerHTML = renderTablePelanggaran(snapPel, tanggal, nama);

      } catch (e) {
        content.innerHTML = `<p>❌ Gagal memuat data: ${e.message}</p>`;
      }
    }

    // === Tabel Program Harian ===
    function renderTableAbsensi(snap, tanggal, nama) {
      if (!snap.exists()) return "Tidak ada data.";
      let html = `<table><tr><th>Tanggal</th><th>Program</th><th>Status</th></tr>`;
      Object.values(snap.val()).forEach(d => {
        if (d.tanggal === tanggal && d.data) {
          d.data.forEach(s => {
            if (s.nama === nama) {
              const color = getBadge(s.status);
              html += `<tr><td>${d.tanggal}</td><td>${d.program}</td><td>${color}</td></tr>`;
            }
          });
        }
      });
      return html + "</table>";
    }

    // === Tabel Pembelajaran ===
    function renderTablePembelajaran(snap, tanggal, nama) {
      if (!snap.exists()) return "Tidak ada data.";
      let html = `<table><tr><th>Tanggal</th><th>Mapel</th><th>Status</th></tr>`;
      Object.values(snap.val()).forEach(d => {
        if (d.tanggal === tanggal && d.data) {
          d.data.forEach(s => {
            if (s.nama === nama) {
              const color = getBadge(s.status);
              html += `<tr><td>${d.tanggal}</td><td>${d.mapel}</td><td>${color}</td></tr>`;
            }
          });
        }
      });
      return html + "</table>";
    }

    // === Tabel Tahfiz ===
    function renderTableTahfiz(snap, tanggal, nama) {
      if (!snap.exists()) return "Tidak ada data.";
      let html = `<table><tr><th>Tanggal</th><th>Setoran</th><th>Ayat</th><th>Nilai</th><th>Keterangan</th></tr>`;
      Object.values(snap.val()).forEach(d => {
        if (d.tanggal === tanggal && d.data) {
          d.data.forEach(x => {
            if (x.nama === nama) {
              html += `<tr><td>${d.tanggal}</td><td>${x.setoran}</td><td>${x.ayat}</td><td>${x.nilai}</td><td>${x.ket || '-'}</td></tr>`;
            }
          });
        }
      });
      return html + "</table>";
    }

    // === Tabel Pelanggaran ===
    function renderTablePelanggaran(snap, tanggal, nama) {
      if (!snap.exists()) return "Tidak ada data.";
      let html = `<table><tr><th>Tanggal</th><th>Pelanggaran</th><th>Kategori</th><th>Keterangan</th><th>Tindak Lanjut</th></tr>`;
      Object.values(snap.val()).forEach(d => {
        if (d.tanggal === tanggal && d.santri === nama) {
          html += `<tr><td>${d.tanggal}</td><td>${d.namaPelanggaran}</td><td>${d.kategori}</td><td>${d.keterangan || '-'}</td><td>${d.tindakLanjut || '-'}</td></tr>`;
        }
      });
      return html + "</table>";
    }

    // === Helper badge warna ===
    function getBadge(status) {
      const cls = status === "Hadir" ? "badge-hadir" :
                  status === "Izin" ? "badge-izin" :
                  status === "Sakit" ? "badge-sakit" : "badge-alfa";
      return `<span class="badge ${cls}">${status}</span>`;
    }

    // === Laporan Bulanan (sementara placeholder) ===
    function loadLaporanBulanan() {
      content.innerHTML = `
        <div class="card">
          <h2>📊 Laporan Bulanan</h2>
          <p>Fitur rekap bulanan akan menampilkan total kehadiran dan catatan anak selama 1 bulan.</p>
        </div>
      `;
    }

    // === Export global ===
    window.logoutWali = logoutWali;
    document.addEventListener("DOMContentLoaded", () => loadLaporanHarian(today));
  </script>
</body>
</html>
