<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <link rel="stylesheet" href="wali-style.css">
  <style>
    /* === ANIMASI === */
    #content {
      margin-top: 20px;
      width: 100%;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === GRID MENU === */
    .menu-grid {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }
    .menu-card {
      flex: 0 0 25%;
      min-width: 100px;
      scroll-snap-align: start;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .menu-card:hover { background: rgba(255,255,255,0.25); }
    .menu-card img { width: 40px; height: 40px; }
    .menu-card h4 { margin: 5px 0 0; font-size: 0.8rem; color: white; }

    /* === TAB NAVIGASI === */
    .tab-menu {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .tab-menu::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      white-space: nowrap;
    }
    .tab-btn.active { background: #0d9488; font-weight: 600; }

    /* === TABEL === */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px;
      text-align: left;
    }
    th { background: rgba(255,255,255,0.15); }
    .badge {
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-hadir { background: #16a34a; }
    .badge-izin { background: #0ea5e9; }
    .badge-sakit { background: #eab308; }
    .badge-alfa { background: #dc2626; }

    /* === FILTER === */
    .filter-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filter-bar label { font-size: 0.9rem; }
    .filter-bar input {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      color: white;
    }
    .filter-bar input::-webkit-calendar-picker-indicator { filter: invert(1); }
  </style>
</head>

<body>
  <div class="dashboard">
    <div class="greeting" id="greeting">👋 Assalamu’alaikum Walisantri</div>

    <!-- MENU GRID -->
    <div class="menu-grid">
      <div class="menu-card" onclick="loadPage('laporan-harian')">
        <img src="https://cdn-icons-png.flaticon.com/512/3185/3185656.png" alt="">
        <h4>Harian</h4>
      </div>
      <div class="menu-card" onclick="loadPage('laporan-pekanan')">
        <img src="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" alt="">
        <h4>Pekanan</h4>
      </div>
      <div class="menu-card" onclick="loadPage('laporan-bulanan')">
        <img src="https://cdn-icons-png.flaticon.com/512/841/841364.png" alt="">
        <h4>Bulanan</h4>
      </div>
      <div class="menu-card" onclick="loadPage('chat-pengurus')">
        <img src="https://cdn-icons-png.flaticon.com/512/2462/2462719.png" alt="">
        <h4>Chat</h4>
      </div>
    </div>

    <!-- KONTEN -->
    <div id="content" class="card"></div>

    <!-- LOGOUT -->
    <button class="logout" onclick="logoutWali()">Keluar</button>
  </div>

  <!-- === SCRIPT MODULE === -->
  <script type="module">
    import { checkWaliLogin, logoutWali } from './wali-script.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // === FIREBASE CONFIG ===
    const app = initializeApp({
      apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
      authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
      databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
      projectId: "absensi-santri-fajrul-islam",
      storageBucket: "absensi-santri-fajrul-islam.appspot.com",
      messagingSenderId: "739928369926",
      appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
    });
    const db = getDatabase(app);

    // === CEK LOGIN ===
    const user = checkWaliLogin();
    if (!user) {
      window.location.href = "wali-login.html";
    } else {
      document.getElementById("greeting").innerHTML = 
        `👋 Assalamu’alaikum Ayah/Bunda <b>${user.namaAnak}</b>`;
    }

    // === LOAD PAGE ===
    async function loadPage(page) {
      const container = document.getElementById("content");
      container.innerHTML = "<p>Sedang memuat...</p>";

      if (page === "laporan-harian") {
        await renderLaporanHarian();
      } else {
        container.innerHTML = `<h3>${page.replace('-', ' ').toUpperCase()} sedang dikembangkan...</h3>`;
      }
    }

    // === LAPORAN HARIAN ===
    async function renderLaporanHarian() {
      const container = document.getElementById("content");
      container.innerHTML = `
      <section class="laporan-harian">
        <h2>📅 Laporan Harian Santri</h2>
        <div class="filter-bar">
          <label for="filterTanggal">Filter Tanggal:</label>
          <input type="date" id="filterTanggal" value="${new Date().toISOString().split('T')[0]}" />
        </div>

        <div class="tab-menu">
          <button class="tab-btn active" data-tab="program">Program Harian</button>
          <button class="tab-btn" data-tab="pembelajaran">Pembelajaran</button>
          <button class="tab-btn" data-tab="tahfiz">Setoran Tahfiz</button>
          <button class="tab-btn" data-tab="pelanggaran">Pelanggaran</button>
        </div>

        <div class="tab-content">
          <div class="tab-pane active" id="tab-program"><h3>📋 Absensi Program Harian</h3><div id="program-content">Memuat data...</div></div>
          <div class="tab-pane" id="tab-pembelajaran"><h3>📖 Absensi Pembelajaran</h3><div id="pembelajaran-content">Memuat data...</div></div>
          <div class="tab-pane" id="tab-tahfiz"><h3>🕋 Setoran Tahfiz</h3><div id="tahfiz-content">Memuat data...</div></div>
          <div class="tab-pane" id="tab-pelanggaran"><h3>⚠️ Pelanggaran</h3><div id="pelanggaran-content">Memuat data...</div></div>
        </div>
      </section>`;

      const nama = user.namaAnak;
      const tanggalFilter = container.querySelector("#filterTanggal");
      tanggalFilter.addEventListener("change", () => loadAllData(tanggalFilter.value, nama));

      // Tab handler
      const tabBtns = container.querySelectorAll('.tab-btn');
      const tabPanes = container.querySelectorAll('.tab-pane');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => b.classList.remove('active'));
          tabPanes.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          container.querySelector('#tab-' + btn.dataset.tab).classList.add('active');
        });
      });

      await loadAllData(tanggalFilter.value, nama);
    }

    // === LOAD DATA DARI FIREBASE ===
    async function loadAllData(filterTanggal, nama) {
      const elProg = document.getElementById("program-content");
      const elPemb = document.getElementById("pembelajaran-content");
      const elTahfiz = document.getElementById("tahfiz-content");
      const elLanggar = document.getElementById("pelanggaran-content");

      elProg.textContent = elPemb.textContent = elTahfiz.textContent = elLanggar.textContent = "Memuat data...";

      try {
        // === 1. Program Harian ===
        const snapProg = await get(child(ref(db), "cahaya_app/absensi_program_harian"));
        renderFilteredTable(snapProg, elProg, filterTanggal, nama, ['tanggal', 'program', 'status']);

        // === 2. Pembelajaran ===
        const snapPemb = await get(child(ref(db), "cahaya_app/absensi_pembelajaran"));
        renderFilteredTable(snapPemb, elPemb, filterTanggal, nama, ['tanggal', 'mapel', 'status']);

        // === 3. Tahfiz ===
        const snapTahfiz = await get(child(ref(db), "cahaya_app/setoran_tahfiz"));
        if (snapTahfiz.exists()) {
          let html = "<table><tr><th>Tanggal</th><th>Surah</th><th>Ayat</th><th>Keterangan</th></tr>";
          Object.values(snapTahfiz.val()).forEach(d => {
            if (d.tanggal === filterTanggal && d.data) {
              d.data.forEach(x => {
                if (x.nama === nama) {
                  html += `<tr><td>${d.tanggal}</td><td>${x.setoran}</td><td>${x.ayat}</td><td>${x.ket || '-'}</td></tr>`;
                }
              });
            }
          });
          html += "</table>";
          elTahfiz.innerHTML = html || "Tidak ada data.";
        } else elTahfiz.textContent = "Belum ada setoran tahfiz.";

        // === 4. Pelanggaran ===
        const snapLanggar = await get(child(ref(db), "cahaya_app/pelanggaran_santri"));
        if (snapLanggar.exists()) {
          let html = `<table><tr>
            <th>Tanggal</th><th>Pelanggaran</th><th>Kategori</th><th>Keterangan</th><th>Tindakan</th><th>Konsekuensi</th></tr>`;
          Object.values(snapLanggar.val()).forEach(d => {
            if (d.santri === nama && d.tanggal === filterTanggal) {
              html += `<tr><td>${d.tanggal}</td><td>${d.namaPelanggaran}</td><td>${d.kategori}</td><td>${d.keterangan || '-'}</td><td>${d.tindakLanjut || '-'}</td><td>${d.konsekuensi || '-'}</td></tr>`;
            }
          });
          html += "</table>";
          elLanggar.innerHTML = html;
        } else elLanggar.textContent = "Tidak ada catatan pelanggaran.";

      } catch (err) {
        console.error(err);
        elProg.textContent = elPemb.textContent = elTahfiz.textContent = elLanggar.textContent = "Gagal memuat data.";
      }
    }

    // === RENDER TABEL UMUM ===
    function renderFilteredTable(snapshot, el, filterTanggal, nama, fields) {
      if (!snapshot.exists()) {
        el.textContent = "Tidak ada data.";
        return;
      }
      let html = `<table><tr>${fields.map(f => `<th>${f.toUpperCase()}</th>`).join('')}</tr>`;
      Object.values(snapshot.val()).forEach(d => {
        if (d.tanggal === filterTanggal && d.data) {
          d.data.forEach(s => {
            if (s.nama === nama) {
              const color = s.status === "Hadir" ? "badge-hadir"
                : s.status === "Izin" ? "badge-izin"
                : s.status === "Sakit" ? "badge-sakit" : "badge-alfa";
              html += `<tr>${fields.map(f =>
                f === 'status'
                ? `<td><span class="badge ${color}">${s.status}</span></td>`
                : `<td>${d[f] || '-'}</td>`
              ).join('')}</tr>`;
            }
          });
        }
      });
      html += "</table>";
      el.innerHTML = html;
    }

    // === GLOBAL ===
    window.loadPage = loadPage;
    window.logoutWali = logoutWali;
  </script>
</body>
</html>
