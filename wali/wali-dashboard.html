<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <link rel="stylesheet" href="wali-style.css">
  <style>
    /* Animasi fade */
    #content {
      margin-top: 20px;
      width: 100%;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #content section {
      animation: fadeIn 0.4s ease;
    }

    /* === GRID DEFAULT === */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
    }

    /* === KHUSUS HP: 1 LINE SCROLL === */
    @media (max-width: 768px) {
      .menu-grid {
        display: flex;
        overflow-x: auto;
        gap: 12px;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 10px;
      }

      .menu-card {
        flex: 0 0 45%; /* 2 kartu muat di layar kecil */
        min-width: 180px;
        scroll-snap-align: start;
      }

      /* Untuk layar HP sangat kecil (≤400px), 1 baris 4 langsung */
      @media (max-width: 400px) {
        .menu-card {
          flex: 0 0 25%; /* 4 kartu pas satu baris */
          min-width: 90px;
          padding: 10px 5px;
        }
        .menu-card img {
          width: 32px;
          height: 32px;
        }
        .menu-card h4 {
          font-size: 0.75rem;
        }
      }
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <div class="greeting" id="greeting">👋 Assalamu’alaikum Walisantri</div>

    <!-- MENU GRID -->
    <div class="menu-grid">
      <div class="menu-card" onclick="loadPage('laporan-harian.html')">
        <img src="https://cdn-icons-png.flaticon.com/512/3185/3185656.png" alt="">
        <h4>Harian</h4>
      </div>

      <div class="menu-card" onclick="loadPage('laporan-pekanan.html')">
        <img src="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" alt="">
        <h4>Pekanan</h4>
      </div>

      <div class="menu-card" onclick="loadPage('laporan-bulanan.html')">
        <img src="https://cdn-icons-png.flaticon.com/512/841/841364.png" alt="">
        <h4>Bulanan</h4>
      </div>

      <div class="menu-card" onclick="loadPage('chat-pengurus.html')">
        <img src="https://cdn-icons-png.flaticon.com/512/2462/2462719.png" alt="">
        <h4>Chat</h4>
      </div>
    </div>

    <!-- TEMPAT MUNCUL KONTEN -->
    <div id="content" class="card"></div>

    <!-- LOGOUT -->
    <button class="logout" onclick="logoutWali()">Keluar</button>
  </div>

  <script type="module">
    import { checkWaliLogin, logoutWali } from './wali-script.js';

    // === CEK LOGIN ===
    const user = checkWaliLogin();
    if (!user) {
      window.location.href = "wali-login.html";
    } else {
      document.getElementById("greeting").innerHTML = 
        `👋 Assalamu’alaikum Walisantri <b>${user.namaAnak}</b>`;
    }

    // === LOAD PAGE TANPA RELOAD ===
    async function loadPage(page) {
      const container = document.getElementById("content");
      container.innerHTML = "<p>Sedang memuat...</p>";
      try {
        const res = await fetch(`pages/${page}`);
        if (!res.ok) throw new Error("Gagal memuat halaman.");
        const html = await res.text();
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<p style='color:red;'>${err.message}</p>`;
      }
    }

    // === REGISTRASI KE GLOBAL ===
    window.loadPage = loadPage;
    window.logoutWali = logoutWali;
  </script>
</body>
</html>
