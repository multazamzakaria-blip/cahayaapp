<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      margin: 0;
      padding: 0;
    }

    /* === HEADER & SLIDE === */
    .welcome-slide {
      background: linear-gradient(90deg, #0d9488, #0f766e);
      color: white;
      padding: 16px 18px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 15px;
      text-align: center;
    }
    .slide-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .logo-slide {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }
    .slide-text h2 {
      margin: 0;
      line-height: 1.3;
      font-size: 1.4rem;
    }
    .slide-text b {
      font-size: 1.6rem;
      display: block;
    }
    .slide-text p {
      margin-top: 4px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .dashboard {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px 60px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    #greeting {
      font-size: 1rem;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    #greeting b {
      display: block;
      font-size: 1.1rem;
    }

    /* === MENU === */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .menu-card:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .menu-card img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
    }
    .menu-card h4 {
      margin: 0;
      font-size: 0.95rem;
      color: white;
    }

    /* === FILTER TOOLBAR === */
    .toolbar {
      display: none;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      text-align: center;
    }
    .toolbar input {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
    }
    .toolbar input::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    .toolbar button {
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }
    .toolbar button:hover {
      background: #115e59;
    }

    /* === CARD & TABLE === */
    .card {
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }
    .card.green { background: rgba(34, 197, 94, 0.15); }
    .card.blue { background: rgba(59, 130, 246, 0.15); }
    .card.purple { background: rgba(147, 51, 234, 0.15); }
    .card.red { background: rgba(239, 68, 68, 0.15); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px;
      text-align: left;
      word-wrap: break-word;
    }
    th {
      background: rgba(255, 255, 255, 0.15);
    }

    /* === STATUS BADGE === */
    .status-box {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      color: white;
      text-align: center;
      min-width: 60px;
    }
    .hadir { background: #16a34a; }
    .izin { background: #0ea5e9; }
    .sakit { background: #eab308; color: #111; }
    .alfa { background: #dc2626; }

    /* === BUTTON BAWAH === */
    .bottom-buttons {
      text-align: center;
      margin-top: 30px;
    }
    .bottom-buttons button {
      background: #0d9488;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .bottom-buttons button:hover {
      background: #115e59;
    }
    .logout {
      background: #dc2626;
    }
    .logout:hover {
      background: #b91c1c;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .toolbar { flex-direction: row; gap: 5px; }
      .toolbar input { font-size: 0.85rem; }
      .toolbar button { font-size: 0.85rem; padding: 6px 10px; }
    }
  </style>
</head>

<body>
<div class="dashboard">
  <div class="welcome-slide">
    <div class="slide-content">
      <img src="../logofi.png" alt="Logo Pesantren" class="logo-slide" />
      <div class="slide-text">
        <h2>Selamat Datang di<br><b>Cahaya App</b></h2>
        <p>Pesantren Cahaya Fajrul Islam</p>
      </div>
    </div>
  </div>

  <header>
    <h1>📊 Dashboard Wali Santri</h1>
    <div id="greeting"></div>
  </header>

  <div class="menu-grid">
    <div class="menu-card" id="btnHarian">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
      <h4>Progres Harian</h4>
    </div>
    <div class="menu-card" id="btnBulanan">
      <img src="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" />
      <h4>Progres Bulanan</h4>
    </div>
  </div>

  <div class="toolbar" id="filterToolbar"></div>

  <main id="content">
    <p style="text-align:center;opacity:0.8;">Klik salah satu menu di atas untuk melihat progres santri.</p>
  </main>

  <div class="bottom-buttons">
    <button onclick="scrollToTop()">⬆️ Kembali ke Atas</button>
    <button class="logout" onclick="logoutWali()">Keluar</button>
  </div>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
</div>

<script type="module">
  import { checkWaliLogin, logoutWali } from './wali-script.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  });
  const db = getDatabase(app);

  const user = checkWaliLogin();
  if (!user) window.location.href = "../index.html";
  document.getElementById("greeting").innerHTML = `👋 Assalamu’alaikum Ayah/Bunda<br><b>${user.namaAnak}</b>`;

  const content = document.getElementById("content");
  const toolbar = document.getElementById("filterToolbar");

  document.getElementById("btnHarian").addEventListener("click", () => {
    toolbar.style.display = "flex";
    toolbar.innerHTML = `
      <input type="date" id="tanggal" value="${new Date().toISOString().split("T")[0]}" />
      <button id="lihatProgres">Lihat Progres</button>
    `;
    document.getElementById("lihatProgres").onclick = () => {
      const tgl = document.getElementById("tanggal").value;
      if (!tgl) return alert("Pilih tanggal terlebih dahulu.");
      loadProgresHarian(tgl);
    };
    content.innerHTML = `<p style="text-align:center;">Silakan pilih tanggal, lalu klik "Lihat Progres".</p>`;
  });

  document.getElementById("btnBulanan").addEventListener("click", () => {
    toolbar.style.display = "flex";
    toolbar.innerHTML = `
      <input type="month" id="bulan" value="${new Date().toISOString().slice(0,7)}" />
      <button id="lihatProgresBulanan">Lihat Progres</button>
    `;
    document.getElementById("lihatProgresBulanan").onclick = () => {
      const bln = document.getElementById("bulan").value;
      if (!bln) return alert("Pilih bulan terlebih dahulu.");
      loadProgresBulanan(bln);
    };
    content.innerHTML = `<p style="text-align:center;">Silakan pilih bulan, lalu klik "Lihat Progres".</p>`;
  });

  async function loadProgresHarian(tanggal) {
    const nama = user.namaAnak.toUpperCase().trim();
    content.innerHTML = `
      <div class="card green"><h2>📋 Absensi Program Harian</h2><div id="prog">Memuat...</div></div>
      <div class="card blue"><h2>📘 Absensi Pembelajaran</h2><div id="pemb">Memuat...</div></div>
      <div class="card purple"><h2>📖 Setoran Tahfiz</h2><div id="tahfiz">Memuat...</div></div>
      <div class="card red"><h2>⚠️ Pelanggaran</h2><div id="pelanggaran">Memuat...</div></div>
    `;
    await loadData("cahaya_app/absensi_program_harian", tanggal, nama, "prog", "program", "status");
    await loadData("cahaya_app/absensi_pembelajaran", tanggal, nama, "pemb", "mapel", "status");
    await loadData("cahaya_app/setoran_tahfiz", tanggal, nama, "tahfiz", "setoran", "nilai");
    await loadPelanggaran(tanggal, nama);
  }

  async function loadPelanggaran(tanggal, nama) {
    const target = document.getElementById("pelanggaran");
    try {
      const snap = await get(child(ref(db), "cahaya_app/pelanggaran_santri"));
      if (!snap.exists()) return target.textContent = "Belum ada data pelanggaran.";
      let html = `<table><tr>
        <th>Pelanggaran</th><th>Kategori</th><th>Keterangan</th><th>Tindak Lanjut</th><th>Konsekuensi</th>
      </tr>`;
      let ditemukan = false;
      Object.values(snap.val()).forEach(p => {
        if (p.tanggal === tanggal && p.santri?.trim().toUpperCase() === nama) {
          ditemukan = true;
          html += `
            <tr>
              <td>${p.namaPelanggaran || "-"}</td>
              <td>${p.kategori || "-"}</td>
              <td>${p.keterangan || "-"}</td>
              <td>${p.tindakLanjut || "-"}</td>
              <td>${p.konsekuensi || "-"}</td>
            </tr>
          `;
        }
      });
      html += "</table>";
      target.innerHTML = ditemukan ? html : "Tidak ada pelanggaran hari ini.";
    } catch (err) {
      target.textContent = "❌ Gagal memuat pelanggaran: " + err.message;
    }
  }

  async function loadData(path, tanggal, nama, targetId, col1, col2) {
    const target = document.getElementById(targetId);
    try {
      const snap = await get(child(ref(db), path));
      let html = `<table><tr><th>${capitalize(col1)}</th><th>${capitalize(col2)}</th></tr>`;
      if (snap.exists()) {
        Object.values(snap.val()).forEach(d => {
          if (d.tanggal === tanggal && d.data) {
            d.data.forEach(s => {
              if (s.nama?.trim().toUpperCase() === nama) {
                const val = (s[col2] || d[col2] || "-").toLowerCase();
                const statusClass = val.includes("hadir") ? "hadir" :
                                    val.includes("izin") ? "izin" :
                                    val.includes("sakit") ? "sakit" :
                                    val.includes("alfa") ? "alfa" : "";
                html += `<tr><td>${s[col1] || d[col1] || "-"}</td><td><span class="status-box ${statusClass}">${s[col2]}</span></td></tr>`;
              }
            });
          }
        });
      }
      html += "</table>";
      target.innerHTML = html.includes("<tr><td") ? html : "Belum ada data.";
    } catch (e) {
      target.textContent = "❌ Gagal memuat data: " + e.message;
    }
  }

    async function loadProgresBulanan(bulan) {
    const namaSantri = user.namaAnak.trim();
    const [tahun, bulanIndex] = bulan.split("-");
    const bulanNum = parseInt(bulanIndex) - 1;

    content.innerHTML = `
      <div class='card blue' id='laporanBulanan'>
        <h2>📆 Laporan Bulanan Santri</h2>
        <p style='text-align:center;opacity:0.9;'>Memuat data ${namaSantri} bulan ${bulanIndex}/${tahun}...</p>
      </div>
    `;

    try {
      // ambil semua data dari Firebase
      const [
        assesGuruSnap,
        assesNaqibSnap,
        absNaqibSnap,
        absKbmSnap,
        ujianSnap,
        tahfizSnap,
        pelanggaranSnap
      ] = await Promise.all([
        get(child(ref(db), "cahaya_app/assesment_cahaya_santri")),
        get(child(ref(db), "cahaya_app/assesment_cahaya_naqib")),
        get(child(ref(db), "cahaya_app/absensi_program_harian")),
        get(child(ref(db), "cahaya_app/absensi_pembelajaran")),
        get(child(ref(db), "cahaya_app/nilai_ujian")),
        get(child(ref(db), "cahaya_app/setoran_tahfiz")),
        get(child(ref(db), "cahaya_app/pelanggaran_santri")),
      ]);

      // ubah ke array aman
      const assesGuru = assesGuruSnap.exists() ? Object.values(assesGuruSnap.val()) : [];
      const assesNaqib = assesNaqibSnap.exists() ? Object.values(assesNaqibSnap.val()) : [];
      const absHarian = absNaqibSnap.exists() ? Object.values(absNaqibSnap.val()) : [];
      const absKbm = absKbmSnap.exists() ? Object.values(absKbmSnap.val()) : [];
      const ujian = ujianSnap.exists() ? Object.values(ujianSnap.val()) : [];
      const tahfiz = tahfizSnap.exists() ? Object.values(tahfizSnap.val()) : [];
      const pelanggaran = pelanggaranSnap.exists() ? Object.values(pelanggaranSnap.val()) : [];

      function parseDate(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
      function isSameMonthYear(tgl,b,t){ const d=parseDate(tgl); return d&&d.getMonth()===b&&d.getFullYear()===t; }

      const namaUpper = namaSantri.toUpperCase();
      const namaBulan = [
        "Januari","Februari","Maret","April","Mei","Juni",
        "Juli","Agustus","September","Oktober","November","Desember"
      ][bulanNum];

      // cari data asesmen guru & naqib bulan ini
      const asesGuru = assesGuru.find(a => a.namaSantri === namaSantri && isSameMonthYear(a.tanggal || a.tgl, bulanNum, tahun)) || {};
      const asesNaqib = assesNaqib.find(a => a.namaSantri === namaSantri && isSameMonthYear(a.tanggal || a.tgl, bulanNum, tahun)) || {};

      // narasi
      const narasiSpiritual = asesGuru.narasiSpiritual || asesGuru.catatanSpiritual || "Belum ada catatan dimensi Spiritual (Cinta Allah).";
      const narasiRel = asesNaqib.narasiRelational || asesNaqib.catatanRelasi || "Belum ada catatan dimensi Relational (Akhlak Mulia).";
      const narasiEmo = asesNaqib.narasiEmotional || asesNaqib.catatanHati || "Belum ada catatan dimensi Emotional (Hati Bersih).";
      const narasiInt = asesGuru.narasiIntellectual || asesGuru.catatanAkal || "Belum ada catatan dimensi Intellectual (Akal Cerdas).";
      const narasiFis = asesNaqib.narasiPhysical || asesNaqib.catatanFisik || "Belum ada catatan dimensi Physical (Fisik Berdaya).";
      const namaNaqib = asesNaqib.naqibName || asesNaqib.namaNaqib || "-";

      // hitung kehadiran
      function hitungKehadiran(arr, field) {
        let hadir=0, izin=0, sakit=0, alfa=0, total=0;
        arr.forEach(log=>{
          if (!isSameMonthYear(log.tanggal, bulanNum, tahun)) return;
          (log.data||[]).forEach(d=>{
            if (d.nama?.trim().toUpperCase() === namaUpper) {
              const s=(d.status||"").toLowerCase();
              if(s.includes("hadir")) hadir++;
              else if(s.includes("izin")) izin++;
              else if(s.includes("sakit")) sakit++;
              else if(s.includes("alfa")) alfa++;
              total++;
            }
          });
        });
        const persen = x => total ? Math.round((x/total)*100) : 0;
        return { hadir: persen(hadir), izin: persen(izin), sakit: persen(sakit), alfa: persen(alfa), total };
      }

      const hadirProg = hitungKehadiran(absHarian,"program");
      const hadirKbm = hitungKehadiran(absKbm,"mapel");

      // nilai ujian
      const nilaiUjian = ujian.filter(u => u.santri === namaSantri && isSameMonthYear(u.tanggal, bulanNum, tahun));
      const rataUjian = nilaiUjian.length ? Math.round(nilaiUjian.reduce((s,u)=>s+(+u.nilai||0),0)/nilaiUjian.length) : 0;

      // tahfiz
      const dataTahfiz = tahfiz.filter(t=>isSameMonthYear(t.tanggal,bulanNum,tahun))
                               .flatMap(t=>t.data||[])
                               .filter(d=>d.nama===namaSantri);

      // pelanggaran
      const dataPelanggaran = pelanggaran.filter(p=>p.santri===namaSantri && isSameMonthYear(p.tanggal,bulanNum,tahun));

      // tampilkan hasil
      content.innerHTML = `
      <div class='card blue laporan-bulanan'>
        <h2 style='text-align:center;'>📋 LAPORAN BULANAN SANTRI</h2>
        <p style='text-align:center;margin-top:-10px;'>Pesantren Cahaya Fajrul Islam</p>
        <h3 style='text-align:center;margin-bottom:6px;'>${namaUpper}</h3>
        <p style='text-align:center;font-size:0.9rem;opacity:0.8;'>Bulan ${namaBulan} ${tahun}<br>Naqib: ${namaNaqib}</p>

        <div class='section'>
          <h4>🌈 Dimensi CAHAYA</h4>
          <p><b>🕋 Cinta Allah (Spiritual):</b> ${narasiSpiritual}</p>
          <p><b>🤝 Akhlak Mulia (Relational):</b> ${narasiRel}</p>
          <p><b>💓 Hati Bersih (Emotional):</b> ${narasiEmo}</p>
          <p><b>🧠 Akal Cerdas (Intellectual):</b> ${narasiInt}</p>
          <p><b>🏃‍♂️ Fisik Berdaya (Physical):</b> ${narasiFis}</p>
        </div>

        <div class='section'>
          <h4>🗓️ Rekap Kehadiran</h4>
          <table>
            <tr><th>Kegiatan</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th></tr>
            <tr><td>Program Harian</td><td>${hadirProg.hadir}%</td><td>${hadirProg.izin}%</td><td>${hadirProg.sakit}%</td><td>${hadirProg.alfa}%</td></tr>
            <tr><td>Pembelajaran (KBM)</td><td>${hadirKbm.hadir}%</td><td>${hadirKbm.izin}%</td><td>${hadirKbm.sakit}%</td><td>${hadirKbm.alfa}%</td></tr>
          </table>
        </div>

        <div class='section'>
          <h4>🧾 Nilai Ujian</h4>
          ${nilaiUjian.length ? `
          <table>
            <tr><th>No</th><th>Mapel</th><th>Materi</th><th>Nilai</th><th>Keterangan</th></tr>
            ${nilaiUjian.map((u,i)=>`
              <tr><td>${i+1}</td><td>${u.mapel||"-"}</td><td>${u.materi||"-"}</td><td>${u.nilai||"-"}</td><td>${u.nilai>=75?"✅ Tuntas":"❌ Belum Tuntas"}</td></tr>
            `).join("")}
            <tr><td colspan='3'><b>Rata-rata</b></td><td colspan='2'><b>${rataUjian}</b></td></tr>
          </table>
          ` : `<p style='opacity:0.8;'>Belum ada data ujian bulan ini.</p>`}
        </div>

        <div class='section'>
          <h4>📖 Setoran Tahfiz</h4>
          ${dataTahfiz.length ? `
          <table>
            <tr><th>No</th><th>Setoran</th><th>Kesalahan</th><th>Nilai</th><th>Keterangan</th></tr>
            ${dataTahfiz.map((d,i)=>`
              <tr><td>${i+1}</td><td>${d.surat||d.setoran||"-"}</td><td>${d.kesalahan||"-"}</td><td>${d.nilai||"-"}</td><td>${d.keterangan||"-"}</td></tr>
            `).join("")}
          </table>
          ` : `<p style='opacity:0.8;'>Belum ada setoran tahfiz bulan ini.</p>`}
        </div>

        <div class='section'>
          <h4>⚠️ Pelanggaran</h4>
          ${dataPelanggaran.length ? `
          <table>
            <tr><th>No</th><th>Tanggal</th><th>Pelanggaran</th><th>Kategori</th><th>Keterangan</th><th>Tindak Lanjut</th></tr>
            ${dataPelanggaran.map((p,i)=>`
              <tr><td>${i+1}</td><td>${p.tanggal||"-"}</td><td>${p.namaPelanggaran||"-"}</td><td>${p.kategori||"-"}</td><td>${p.keterangan||"-"}</td><td>${p.tindakLanjut||"-"}</td></tr>
            `).join("")}
          </table>
          ` : `<p style='opacity:0.8;'>Tidak ada pelanggaran bulan ini.</p>`}
        </div>

        <div style='text-align:center;margin-top:20px;'>
          <button onclick='exportPDF()' style='background:#2563eb;border:none;padding:10px 18px;border-radius:8px;color:white;cursor:pointer;font-weight:600;'>⬇️ Unduh PDF</button>
        </div>
      </div>
      `;

      // tambahkan library PDF
      if (!window.html2canvas) {
        const s1 = document.createElement("script");
        s1.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
        document.body.appendChild(s1);
      }
      if (!window.jspdf) {
        const s2 = document.createElement("script");
        s2.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
        document.body.appendChild(s2);
      }

      // fungsi export PDF
      window.exportPDF = async function() {
        const el = document.querySelector(".laporan-bulanan");
        if (!el) return alert("Laporan belum siap.");
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, scrollY: 0 });
        const imgData = canvas.toDataURL("image/png");
        const pdf = new window.jspdf.jsPDF("p","mm","a4");
        const pageWidth = pdf.internal.pageSize.getWidth();
        const imgWidth = pageWidth - 20;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        pdf.addImage(imgData, "PNG", 10, 10, imgWidth, imgHeight);
        const cleanName = namaSantri.toUpperCase().replace(/\s+/g,"_");
        pdf.save(`Laporan_${cleanName}_${namaBulan}_${tahun}.pdf`);
      };

    } catch (err) {
      content.innerHTML = `<div class='card red'><h2>❌ Gagal memuat laporan</h2><p>${err.message}</p></div>`;
    }
  }


  function capitalize(str){return str.charAt(0).toUpperCase()+str.slice(1);}
  window.scrollToTop = () => window.scrollTo({top:0,behavior:"smooth"});
  window.logoutWali = logoutWali;
</script>
</body>
