<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      margin: 0;
      padding: 0;
    }

    /* === HEADER & SLIDE === */
    .welcome-slide {
      background: linear-gradient(90deg, #0d9488, #0f766e);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 15px;
      text-align: center;
    }
    .slide-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .logo-slide {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }
    .dashboard {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px 60px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    #greeting {
      font-size: 1rem;
      margin-bottom: 12px;
    }

    /* === MENU === */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .menu-card:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .menu-card img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
    }
    .menu-card h4 {
      margin: 0;
      font-size: 0.95rem;
      color: white;
    }

    /* === FILTER TOOLBAR === */
    .toolbar {
      display: none;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      text-align: center;
    }
    .toolbar label {
      font-weight: 500;
    }
    .toolbar input {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
    }
    .toolbar input::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    .toolbar button {
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }
    .toolbar button:hover {
      background: #115e59;
    }

    /* === CARD & TABLE === */
    .card {
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }
    .card.green { background: rgba(34, 197, 94, 0.15); }
    .card.blue { background: rgba(59, 130, 246, 0.15); }
    .card.purple { background: rgba(147, 51, 234, 0.15); }
    .card.red { background: rgba(239, 68, 68, 0.15); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px;
      text-align: left;
      word-wrap: break-word;
    }
    th {
      background: rgba(255, 255, 255, 0.15);
    }

    /* === STATUS BADGE === */
    .status-box {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      color: white;
      text-align: center;
      min-width: 60px;
    }
    .hadir { background: #16a34a; }
    .izin { background: #0ea5e9; }
    .sakit { background: #eab308; color: #111; }
    .alfa { background: #dc2626; }

    /* === BUTTON BAWAH === */
    .bottom-buttons {
      text-align: center;
      margin-top: 30px;
    }
    .bottom-buttons button {
      background: #0d9488;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .bottom-buttons button:hover {
      background: #115e59;
    }
    .logout {
      background: #dc2626;
    }
    .logout:hover {
      background: #b91c1c;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .toolbar { flex-direction: row; gap: 5px; }
      .toolbar label { display: none; }
      .toolbar input { font-size: 0.85rem; }
      .toolbar button { font-size: 0.85rem; padding: 6px 10px; }
    }
  </style>
</head>

<body>
<div class="dashboard">
  <div class="welcome-slide">
    <div class="slide-content">
      <img src="../logofi.png" alt="Logo Pesantren" class="logo-slide" />
      <div>
        <h2>Selamat Datang di <b>Cahaya App</b></h2>
        <p>Pesantren Cahaya Fajrul Islam</p>
      </div>
    </div>
  </div>

  <header>
    <h1>📊 Dashboard Wali Santri</h1>
    <div id="greeting"></div>
  </header>

  <div class="menu-grid">
    <div class="menu-card" id="btnHarian">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
      <h4>Progres Harian</h4>
    </div>
    <div class="menu-card" id="btnBulanan">
      <img src="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" />
      <h4>Progres Bulanan</h4>
    </div>
  </div>

  <div class="toolbar" id="filterToolbar"></div>

  <main id="content">
    <p style="text-align:center;opacity:0.8;">Klik salah satu menu di atas untuk melihat progres santri.</p>
  </main>

  <div class="bottom-buttons">
    <button onclick="scrollToTop()">⬆️ Kembali ke Atas</button>
    <button class="logout" onclick="logoutWali()">Keluar</button>
  </div>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
</div>

<!-- LIBRARY UNTUK EXPORT PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
  import { checkWaliLogin, logoutWali } from './wali-script.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  });
  const db = getDatabase(app);

  const user = checkWaliLogin();
  if (!user) window.location.href = "../index.html";
  document.getElementById("greeting").innerHTML = `👋 Assalamu’alaikum Walisantri <b>${user.namaAnak}</b>`;

  const content = document.getElementById("content");
  const toolbar = document.getElementById("filterToolbar");

  // ====== MENU HARIAN (TIDAK DIUBAH) ======
  document.getElementById("btnHarian").addEventListener("click", () => {
    toolbar.style.display = "flex";
    toolbar.innerHTML = `
      <input type="date" id="tanggal" value="${new Date().toISOString().split("T")[0]}" />
      <button id="lihatProgres">Lihat Progres</button>
    `;
    document.getElementById("lihatProgres").onclick = () => {
      const tgl = document.getElementById("tanggal").value;
      if (!tgl) return alert("Pilih tanggal terlebih dahulu.");
      loadProgresHarian(tgl);
    };
    content.innerHTML = `<p style="text-align:center;">Silakan pilih tanggal, lalu klik "Lihat Progres".</p>`;
  });

  // ====== MENU BULANAN ======
  document.getElementById("btnBulanan").addEventListener("click", () => {
    toolbar.style.display = "flex";
    toolbar.innerHTML = `
      <input type="month" id="bulan" value="${new Date().toISOString().slice(0,7)}" />
      <button id="lihatProgresBulanan">Lihat Progres</button>
    `;
    document.getElementById("lihatProgresBulanan").onclick = () => {
      const bln = document.getElementById("bulan").value;
      if (!bln) return alert("Pilih bulan terlebih dahulu.");
      loadProgresBulanan(bln);
    };
    content.innerHTML = `<p style="text-align:center;">Silakan pilih bulan, lalu klik "Lihat Progres".</p>`;
  });

  // ====== PROGRES HARIAN (SAMA PERSIS DENGAN VERSI USTADZ) ======
  async function loadProgresHarian(tanggal) {
    const nama = user.namaAnak.toUpperCase().trim();
    content.innerHTML = `
      <div class="card green"><h2>📋 Absensi Program Harian</h2><div id="prog">Memuat...</div></div>
      <div class="card blue"><h2>📘 Absensi Pembelajaran</h2><div id="pemb">Memuat...</div></div>
      <div class="card purple"><h2>📖 Setoran Tahfiz</h2><div id="tahfiz">Memuat...</div></div>
      <div class="card red"><h2>⚠️ Pelanggaran</h2><div id="pelanggaran">Memuat...</div></div>
    `;
    await loadData("cahaya_app/absensi_program_harian", tanggal, nama, "prog", "program", "status");
    await loadData("cahaya_app/absensi_pembelajaran", tanggal, nama, "pemb", "mapel", "status");
    await loadData("cahaya_app/setoran_tahfiz", tanggal, nama, "tahfiz", "setoran", "nilai");
    await loadPelanggaran(tanggal, nama);
  }

  async function loadPelanggaran(tanggal, nama) {
    const target = document.getElementById("pelanggaran");
    try {
      const snap = await get(child(ref(db), "cahaya_app/pelanggaran_santri"));
      if (!snap.exists()) return target.textContent = "Belum ada data pelanggaran.";
      let html = `<table><tr>
        <th>Pelanggaran</th><th>Kategori</th><th>Keterangan</th><th>Tindak Lanjut</th><th>Konsekuensi</th>
      </tr>`;
      let ditemukan = false;
      Object.values(snap.val()).forEach(p => {
        if (p.tanggal === tanggal && p.santri?.trim().toUpperCase() === nama) {
          ditemukan = true;
          html += `
            <tr>
              <td>${p.namaPelanggaran || "-"}</td>
              <td>${p.kategori || "-"}</td>
              <td>${p.keterangan || "-"}</td>
              <td>${p.tindakLanjut || "-"}</td>
              <td>${p.konsekuensi || "-"}</td>
            </tr>
          `;
        }
      });
      html += "</table>";
      target.innerHTML = ditemukan ? html : "Tidak ada pelanggaran hari ini.";
    } catch (err) {
      target.textContent = "❌ Gagal memuat pelanggaran: " + err.message;
    }
  }

  async function loadData(path, tanggal, nama, targetId, col1, col2) {
    const target = document.getElementById(targetId);
    try {
      const snap = await get(child(ref(db), path));
      let html = `<table><tr><th>${capitalize(col1)}</th><th>${capitalize(col2)}</th></tr>`;
      if (snap.exists()) {
        Object.values(snap.val()).forEach(d => {
          if (d.tanggal === tanggal && d.data) {
            d.data.forEach(s => {
              if (s.nama?.trim().toUpperCase() === nama) {
                const val = (s[col2] || d[col2] || "-").toLowerCase();
                const statusClass = val.includes("hadir") ? "hadir" :
                                    val.includes("izin") ? "izin" :
                                    val.includes("sakit") ? "sakit" :
                                    val.includes("alfa") ? "alfa" : "";
                html += `<tr><td>${s[col1] || d[col1] || "-"}</td><td><span class="status-box ${statusClass}">${s[col2]}</span></td></tr>`;
              }
            });
          }
        });
      }
      html += "</table>";
      target.innerHTML = html.includes("<tr><td") ? html : "Belum ada data.";
    } catch (e) {
      target.textContent = "❌ Gagal memuat data: " + e.message;
    }
  }

  // ====== FUNGSI BANTU BULANAN ======
  function parseDate(s) {
    if (!s) return null;
    const p = s.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function isSameMonthYear(tgl, b, t) {
    const d = parseDate(tgl);
    return d && d.getMonth() === b && d.getFullYear() === t;
  }
  function capitalize(str){return str.charAt(0).toUpperCase()+str.slice(1);}

  function hitungKehadiranGabungan(namaUpper, bulan, tahun, absensiNaqib, absensiGuru) {
    const kehadiran = {};
    function tambah(prog, status) {
      if (!kehadiran[prog]) kehadiran[prog] = {hadir:0, izin:0, sakit:0, alfa:0, total:0};
      const s = (status || "").toLowerCase();
      if (kehadiran[prog][s] !== undefined) kehadiran[prog][s]++;
      kehadiran[prog].total++;
    }

    absensiNaqib.forEach(log => {
      if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
      (log.data || []).forEach(d => {
        if ((d.nama || "").trim().toUpperCase() === namaUpper) {
          tambah(log.program || "Program Harian", d.status);
        }
      });
    });

    absensiGuru.forEach(log => {
      if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
      (log.data || []).forEach(d => {
        if ((d.nama || "").trim().toUpperCase() === namaUpper) {
          tambah(log.mapel || "KBM", d.status);
        }
      });
    });

    const result = Object.entries(kehadiran).map(([prog, v], i) => {
      const toP = x => (v.total ? Math.round((x / v.total) * 100) : 0);
      return {
        no: i + 1,
        program: prog,
        hadir: toP(v.hadir),
        izin: toP(v.izin),
        sakit: toP(v.sakit),
        alfa: toP(v.alfa)
      };
    });

    if (result.length) {
      const avg = x => Math.round(result.reduce((s, r) => s + r[x], 0) / result.length);
      result.push({
        no: "",
        program: "<b>Rata-rata</b>",
        hadir: avg("hadir"),
        izin: avg("izin"),
        sakit: avg("sakit"),
        alfa: avg("alfa")
      });
    }
    return result;
  }

  // ====== PROGRES BULANAN (BARU) ======
  async function loadProgresBulanan(bulan) {
    const namaSantri = user.namaAnak.trim();
    const namaUpper = namaSantri.toUpperCase();
    const [tahunStr, bulanStr] = bulan.split("-");
    const tahun = parseInt(tahunStr, 10);
    const bulanIdx = parseInt(bulanStr, 10) - 1;

    const namaBulan = [
      "Januari","Februari","Maret","April","Mei","Juni",
      "Juli","Agustus","September","Oktober","November","Desember"
    ][bulanIdx] || bulanStr;

    content.innerHTML = `
      <div class="card blue" id="laporanBulananCard" 
           style="background:#ffffff;color:#111827;">
        <h2 style="text-align:center;margin-top:4px;">📊 Laporan Bulanan Santri</h2>
        <p style="text-align:center;margin:4px 0 10px 0;">Pesantren Cahaya Fajrul Islam</p>
        <h3 style="text-align:center;margin:4px 0;">${namaUpper}</h3>
        <p style="text-align:center;font-size:0.9rem;margin:2px 0 14px 0;">
          Bulan ${namaBulan} ${tahun}
        </p>
        <div id="laporanBulananBody">
          <p style="text-align:center;opacity:0.7;">Memuat data dari CAHAYA APP...</p>
        </div>
        <div style="text-align:center;margin-top:18px;">
          <button id="btnExportPdf"
            style="background:#2563eb;border:none;padding:10px 18px;border-radius:8px;color:white;font-weight:600;cursor:pointer;">
            ⬇️ Unduh PDF Laporan Bulanan
          </button>
        </div>
      </div>
    `;

    const bodyDiv = document.getElementById("laporanBulananBody");

    try {
      const [
        assesGuruSnap,
        assesNaqibSnap,
        absNaqibSnap,
        absKbmSnap,
        ujianSnap,
        tahfizSnap,
        pelanggaranSnap
      ] = await Promise.all([
        get(child(ref(db), "cahaya_app/assesment_cahaya_santri")),
        get(child(ref(db), "cahaya_app/assesment_cahaya_naqib")),
        get(child(ref(db), "cahaya_app/absensi_program_harian")),
        get(child(ref(db), "cahaya_app/absensi_pembelajaran")),
        get(child(ref(db), "cahaya_app/nilai_ujian")),
        get(child(ref(db), "cahaya_app/setoran_tahfiz")),
        get(child(ref(db), "cahaya_app/pelanggaran_santri")),
      ]);

      const assesmentGuru = assesGuruSnap.exists() ? Object.values(assesGuruSnap.val()) : [];
      const assesmentNaqib = assesNaqibSnap.exists() ? Object.values(assesNaqibSnap.val()) : [];
      const absensiNaqib = absNaqibSnap.exists() ? Object.values(absNaqibSnap.val()) : [];
      const absensiKbm = absKbmSnap.exists() ? Object.values(absKbmSnap.val()) : [];
      const ujian = ujianSnap.exists() ? Object.values(ujianSnap.val()) : [];
      const tahfiz = tahfizSnap.exists() ? Object.values(tahfizSnap.val()) : [];
      const pelanggaranAll = pelanggaranSnap.exists() ? Object.values(pelanggaranSnap.val()) : [];

      // ==== AMBIL ASESMENT GURU & NAQIB ====
      const asesGuru =
        assesmentGuru
          .filter(a =>
            a.namaSantri === namaSantri &&
            isSameMonthYear(a.tgl || a.tanggal, bulanIdx, tahun)
          )
          .at(-1) || {};

      const asesNaqib =
        assesmentNaqib
          .filter(a =>
            a.namaSantri === namaSantri &&
            isSameMonthYear(a.tgl || a.tanggal || a.tanggalAsesmen, bulanIdx, tahun)
          )
          .at(-1) || {};

      const narasiSpiritual =
        asesGuru.narasiSpiritual ||
        asesGuru.catatanSpiritual ||
        "Belum ada catatan asesmen Cinta Allah (Spiritual) bulan ini.";

      const narasiIntellectual =
        asesGuru.narasiIntellectual ||
        asesGuru.catatanInt ||
        asesGuru.catatanAkal ||
        "Belum ada catatan asesmen Akal Cerdas (Intellectual) bulan ini.";

      const narasiRel =
        asesNaqib.narasiRelational ||
        asesNaqib.catatanRelasi ||
        "Belum ada catatan dimensi Akhlak Mulia (Relational) bulan ini.";

      const narasiEmo =
        asesNaqib.narasiEmotional ||
        asesNaqib.catatanHati ||
        "Belum ada catatan dimensi Hati Bersih (Emotional) bulan ini.";

      const narasiFis =
        asesNaqib.narasiPhysical ||
        asesNaqib.catatanFisik ||
        "Belum ada catatan dimensi Fisik Berdaya (Physical) bulan ini.";

      const namaNaqib = asesNaqib.naqibName || asesNaqib.namaNaqib || "-";

      // ==== KEHADIRAN ====
      const hadirArr = hitungKehadiranGabungan(
        namaUpper,
        bulanIdx,
        tahun,
        absensiNaqib,
        absensiKbm
      );

      const htmlKehadiran = hadirArr.length ? `
        <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:0.8rem;">
          <thead>
            <tr style="background:#f3f4f6;">
              <th>No</th><th>Program</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th>
            </tr>
          </thead>
          <tbody>
            ${hadirArr.map(r => `
              <tr>
                <td>${r.no}</td>
                <td>${r.program}</td>
                <td style="color:#16a34a;">${r.hadir}%</td>
                <td style="color:#0ea5e9;">${r.izin}%</td>
                <td style="color:#eab308;">${r.sakit}%</td>
                <td style="color:#dc2626;">${r.alfa}%</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      ` : `<p style="font-size:0.9rem;opacity:0.8;">Belum ada data kehadiran bulan ini.</p>`;

      // ==== NILAI UJIAN ====
      const nilaiUjian = ujian
        .filter(u =>
          (u.santri || "").trim() === namaSantri &&
          isSameMonthYear(u.tanggal, bulanIdx, tahun)
        )
        .filter((u, i, self) =>
          i === self.findIndex(x =>
            x.santri === u.santri &&
            x.mapel === u.mapel &&
            x.materi === u.materi &&
            x.tanggal === u.tanggal
          )
        );

      let rataUjian = 0;
      if (nilaiUjian.length) {
        rataUjian = Math.round(
          nilaiUjian.reduce((s, u) => s + (+u.nilai || 0), 0) / nilaiUjian.length
        );
      }

      const htmlUjian = nilaiUjian.length ? `
        <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:0.8rem;">
          <thead>
            <tr style="background:#f3f4f6;">
              <th>No</th><th>Mata Pelajaran</th><th>Materi</th><th>Nilai</th><th>Keterangan</th>
            </tr>
          </thead>
          <tbody>
            ${nilaiUjian.map((u,i)=>`
              <tr>
                <td>${i+1}</td>
                <td>${u.mapel || "-"}</td>
                <td>${u.materi || "-"}</td>
                <td>${u.nilai || "-"}</td>
                <td>${u.nilai >= 75 ? "✅ Tuntas" : "❌ Belum Tuntas"}</td>
              </tr>
            `).join("")}
            <tr style="background:#f9fafb;font-weight:600;">
              <td colspan="3">Rata-rata</td>
              <td colspan="2">${rataUjian}</td>
            </tr>
          </tbody>
        </table>
      ` : `<p style="font-size:0.9rem;opacity:0.8;">Belum ada data nilai ujian bulan ini.</p>`;

      // ==== TAHFIZ ====
      const dataTahfiz = tahfiz
        .filter(t => isSameMonthYear(t.tanggal, bulanIdx, tahun))
        .flatMap(t => t.data || [])
        .filter(d => (d.nama || "").trim() === namaSantri);

      const htmlTahfiz = dataTahfiz.length ? `
        <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:0.8rem;">
          <thead>
            <tr style="background:#f3f4f6;">
              <th>No</th><th>Setoran</th><th>Jumlah/Kesalahan</th><th>Nilai</th><th>Keterangan</th>
            </tr>
          </thead>
          <tbody>
            ${dataTahfiz.map((d,i)=>`
              <tr>
                <td>${i+1}</td>
                <td>${d.surat || d.setoran || "-"}</td>
                <td>${(d.ayat ? d.ayat + " ayat; " : "") + (d.kesalahan || "-")}</td>
                <td>${d.nilai || "-"}</td>
                <td>${d.keterangan || "-"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      ` : `<p style="font-size:0.9rem;opacity:0.8;">Belum ada setoran tahfiz tercatat bulan ini.</p>`;

      // ==== PELANGGARAN ====
      const pelanggaran = pelanggaranAll
        .filter(p =>
          (p.santri || "").trim() === namaSantri &&
          isSameMonthYear(p.tanggal, bulanIdx, tahun)
        );

      const htmlPelanggaran = pelanggaran.length ? `
        <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:0.8rem;">
          <thead>
            <tr style="background:#f3f4f6;">
              <th>No</th><th>Tanggal</th><th>Nama Pelanggaran</th>
              <th>Kategori</th><th>Keterangan</th><th>Tindak Lanjut</th><th>Konsekuensi</th>
            </tr>
          </thead>
          <tbody>
            ${pelanggaran.map((p,i)=>`
              <tr>
                <td>${i+1}</td>
                <td>${p.tanggal || "-"}</td>
                <td>${p.namaPelanggaran || "-"}</td>
                <td>${p.kategori || "-"}</td>
                <td>${p.keterangan || "-"}</td>
                <td>${p.tindakLanjut || "-"}</td>
                <td>${p.konsekuensi || "-"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      ` : `<p style="font-size:0.9rem;opacity:0.8;">Tidak ada pelanggaran tercatat bulan ini.</p>`;

      // ====== SUSUN HTML LAPORAN ======
      bodyDiv.innerHTML = `
        <section style="margin-bottom:14px;">
          <h4 style="margin:8px 0;color:#0f766e;">🌈 Dimensi CAHAYA</h4>
          <p style="margin:4px 0;"><b>🕋 Cinta Allah (Spiritual):</b><br>${narasiSpiritual}</p>
          <p style="margin:4px 0;"><b>🤝 Akhlak Mulia (Relational):</b><br>${narasiRel}</p>
          <p style="margin:4px 0;"><b>💓 Hati Bersih (Emotional):</b><br>${narasiEmo}</p>
          <p style="margin:4px 0;"><b>🧠 Akal Cerdas (Intellectual):</b><br>${narasiIntellectual}</p>
          <p style="margin:4px 0;"><b>🏃‍♂️ Fisik Berdaya (Physical):</b><br>${narasiFis}</p>
          <p style="margin:6px 0;font-size:0.85rem;opacity:0.75;">
            Catatan Naqib: <b>${namaNaqib}</b>
          </p>
        </section>

        <section style="margin-bottom:14px;">
          <h4 style="margin:8px 0;color:#0f766e;">🗓️ Rekap Kehadiran Bulanan</h4>
          ${htmlKehadiran}
        </section>

        <section style="margin-bottom:14px;">
          <h4 style="margin:8px 0;color:#0f766e;">🧾 Rekap Nilai Ujian</h4>
          ${htmlUjian}
        </section>

        <section style="margin-bottom:14px;">
          <h4 style="margin:8px 0;color:#0f766e;">📖 Rekap Setoran Tahfiz</h4>
          ${htmlTahfiz}
        </section>

        <section style="margin-bottom:6px;">
          <h4 style="margin:8px 0;color:#0f766e;">⚠️ Rekap Pelanggaran</h4>
          ${htmlPelanggaran}
        </section>
      `;

      // ====== EVENT EXPORT PDF ======
      const btnExport = document.getElementById("btnExportPdf");
      btnExport.onclick = async () => {
        const card = document.getElementById("laporanBulananCard");
        if (!card) return;

        const canvas = await window.html2canvas(card, {
          scale: 2,
          useCORS: true,
          scrollY: 0
        });
        const imgData = canvas.toDataURL("image/png");
        const pdf = new window.jspdf.jsPDF("p","mm","a4");
        const pageWidth = pdf.internal.pageSize.getWidth();
        const imgWidth = pageWidth - 20;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        pdf.addImage(imgData,"PNG",10,10,imgWidth,imgHeight);
        const cleanName = namaUpper.replace(/\s+/g,"_");
        pdf.save(`Laporan_${cleanName}_${namaBulan}_${tahun}.pdf`);
      };

    } catch (err) {
      bodyDiv.innerHTML = `<p style="color:#b91c1c;">❌ Gagal memuat laporan bulanan: ${err.message}</p>`;
    }
  }

  // ====== GLOBAL ======
  window.scrollToTop = () => window.scrollTo({top:0,behavior:"smooth"});
  window.logoutWali = logoutWali;
</script>
</body>
</html>
