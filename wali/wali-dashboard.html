<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <link rel="stylesheet" href="wali-style.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      margin: 0;
      padding: 0;
    }

    /* === SLIDE WELCOME === */
    .welcome-slide {
      background: linear-gradient(90deg, #0d9488, #059669);
      padding: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dashboard {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    #greeting {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .logout {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    .menu button {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .menu button.active { background: #0d9488; font-weight: 600; }

    .filter input {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .filter input::-webkit-calendar-picker-indicator { filter: invert(1); }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 8px;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px;
      text-align: left;
      word-wrap: break-word;
    }

    th {
      background: rgba(255,255,255,0.15);
    }

    .badge {
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
    }

    .badge-hadir { background: #16a34a; }
    .badge-izin { background: #0ea5e9; }
    .badge-sakit { background: #eab308; }
    .badge-alfa { background: #dc2626; }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    @media (max-width:600px) {
      header h1 { font-size: 1.25rem; }
      #greeting { font-size: 0.9rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="welcome-slide">
    Selamat Datang di <b>Cahaya App</b> — Pesantren Cahaya Fajrul Islam
  </div>

  <div class="dashboard">
    <header>
      <h1>🦁 Dashboard Wali Santri</h1>
      <div id="greeting"></div>
      <button class="logout" onclick="logoutWali()">Keluar</button>
    </header>

    <div class="toolbar">
      <div class="menu">
        <button id="btnHarian" class="active">Laporan Harian</button>
        <button id="btnBulanan">Laporan Bulanan</button>
      </div>

      <div id="filterHarian" class="filter">
        <label for="tanggal">Tanggal:</label>
        <input type="date" id="tanggal" />
      </div>
    </div>

    <main id="content"></main>

    <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
  </div>

  <script type="module">
    import { checkWaliLogin, logoutWali } from './wali-script.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // === FIREBASE CONFIG ===
    const app = initializeApp({
      apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
      authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
      databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
      projectId: "absensi-santri-fajrul-islam",
      storageBucket: "absensi-santri-fajrul-islam.appspot.com",
      messagingSenderId: "739928369926",
      appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
    });

    const db = getDatabase(app);
    const user = checkWaliLogin();
    if (!user) window.location.href = "wali-login.html";

    document.getElementById("greeting").innerHTML =
      `👋 Assalamu’alaikum Ayah/Bunda <b>${user.namaAnak}</b>`;

    const content = document.getElementById("content");
    const tanggalInput = document.getElementById("tanggal");
    const today = new Date().toISOString().split("T")[0];
    tanggalInput.value = today;
    tanggalInput.addEventListener("change", () => loadLaporanHarian(tanggalInput.value));
    document.addEventListener("DOMContentLoaded", () => loadLaporanHarian(today));

    async function loadLaporanHarian(tanggal) {
      const nama = user.namaAnak.toUpperCase().trim();
      content.innerHTML = `
        <div class="card"><h2>📋 Absensi Program Harian</h2><div id="prog">Memuat...</div></div>
        <div class="card"><h2>📘 Absensi Pembelajaran</h2><div id="pemb">Memuat...</div></div>
      `;

      // === ABSENSI PROGRAM HARIAN ===
      const elProg = document.getElementById("prog");
      try {
        const snapProg = await get(child(ref(db), "cahaya_app/absensi_program_harian"));
        let html = `<table><tr><th>Program</th><th>Status</th></tr>`;
        if (snapProg.exists()) {
          Object.values(snapProg.val()).forEach(d => {
            if (d.tanggal === tanggal && d.data) {
              d.data.forEach(s => {
                if (s.nama.trim().toUpperCase() === nama) {
                  html += `<tr><td>${d.program}</td><td>${badge(s.status)}</td></tr>`;
                }
              });
            }
          });
        }
        html += "</table>";
        elProg.innerHTML = html.includes("<tr><td") ? html : "Belum ada data absensi program harian.";
      } catch (e) {
        elProg.textContent = "❌ Gagal memuat data: " + e.message;
      }

      // === ABSENSI PEMBELAJARAN ===
      const elPemb = document.getElementById("pemb");
      try {
        const snapPemb = await get(child(ref(db), "cahaya_app/absensi_pembelajaran"));
        let html = `<table><tr><th>Mapel</th><th>Status</th></tr>`;
        if (snapPemb.exists()) {
          Object.values(snapPemb.val()).forEach(d => {
            if (d.tanggal === tanggal && d.data) {
              d.data.forEach(s => {
                if (s.nama.trim().toUpperCase() === nama) {
                  html += `<tr><td>${d.mapel}</td><td>${badge(s.status)}</td></tr>`;
                }
              });
            }
          });
        }
        html += "</table>";
        elPemb.innerHTML = html.includes("<tr><td") ? html : "Belum ada data kehadiran pembelajaran.";
      } catch (e) {
        elPemb.textContent = "❌ Gagal memuat data: " + e.message;
      }
    }

    function badge(status) {
      const cls = status === "Hadir" ? "badge-hadir" :
                  status === "Izin" ? "badge-izin" :
                  status === "Sakit" ? "badge-sakit" : "badge-alfa";
      return `<span class="badge ${cls}">${status}</span>`;
    }

    window.logoutWali = logoutWali;
  </script>
</body>
</html>
