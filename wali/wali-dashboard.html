<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      margin: 0;
      padding: 0;
    }

    .dashboard {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    #greeting {
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .welcome-slide {
      background: linear-gradient(90deg, #0d9488, #0f766e);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 15px;
      text-align: center;
    }

    .slide-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .logo-slide {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .menu-card:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .menu-card img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
    }

    .toolbar {
      display: none;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      text-align: center;
    }

    .toolbar input {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
    }

    .toolbar button {
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    .card { border-radius: 12px; padding: 16px; margin-top: 14px; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3); overflow-x: auto; background: rgba(255,255,255,0.1); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: white; }
    th, td { border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px; text-align: left; }
    th { background: rgba(255, 255, 255, 0.15); }

    .bottom-buttons { text-align: center; margin-top: 30px; }
    .bottom-buttons button {
      background: #0d9488;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin: 5px;
      cursor: pointer;
      font-weight: 600;
    }

    .bottom-buttons .logout { background: #dc2626; }

    footer { text-align: center; margin-top: 20px; font-size: 0.8rem; opacity: 0.8; }
  </style>
</head>

<body>
<div class="dashboard">
  <div class="welcome-slide">
    <div class="slide-content">
      <img src="../logofi.png" alt="Logo Pesantren" class="logo-slide" />
      <div>
        <h2>Selamat Datang di <b>Cahaya App</b></h2>
        <p>Pesantren Cahaya Fajrul Islam</p>
      </div>
    </div>
  </div>

  <header>
    <h1>📊 Dashboard Wali Santri</h1>
    <div id="greeting"></div>
  </header>

  <div class="menu-grid">
    <div class="menu-card" id="btnHarian">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
      <h4>Progres Harian</h4>
    </div>
    <div class="menu-card" id="btnBulanan">
      <img src="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" />
      <h4>Progres Bulanan</h4>
    </div>
  </div>

  <div class="toolbar" id="filterToolbar"></div>
  <main id="content">
    <p style="text-align:center;opacity:0.8;">Klik salah satu menu di atas untuk melihat progres santri.</p>
  </main>

  <div class="bottom-buttons">
    <button onclick="scrollToTop()">⬆️ Kembali ke Atas</button>
    <button class="logout" onclick="logoutWali()">Keluar</button>
  </div>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- ✅ Script digabung langsung -->
<script type="module">
  import { checkWaliLogin, logoutWali } from './wali-script.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  });

  const db = getDatabase(app);
  const user = checkWaliLogin();
  if (!user) window.location.href = "../index.html";
  document.getElementById("greeting").innerHTML = `👋 Assalamu’alaikum Walisantri <b>${user.namaAnak}</b>`;

  const content = document.getElementById("content");
  const toolbar = document.getElementById("filterToolbar");

  // ======== PROGRES HARIAN =========
  document.getElementById("btnHarian").onclick = () => {
    toolbar.style.display = "flex";
    toolbar.innerHTML = `<input type="date" id="tanggal" value="${new Date().toISOString().split("T")[0]}"><button id="lihatProgres">Lihat Progres</button>`;
    document.getElementById("lihatProgres").onclick = () => loadProgresHarian(document.getElementById("tanggal").value);
    content.innerHTML = `<p style="text-align:center;">Silakan pilih tanggal, lalu klik "Lihat Progres".</p>`;
  };

  async function loadProgresHarian(tanggal) {
    const nama = user.namaAnak.toUpperCase().trim();
    content.innerHTML = `
      <div class="card"><h2>📋 Absensi Program Harian</h2><div id="prog">Memuat...</div></div>
      <div class="card"><h2>📘 Absensi Pembelajaran</h2><div id="pemb">Memuat...</div></div>
      <div class="card"><h2>📖 Setoran Tahfiz</h2><div id="tahfiz">Memuat...</div></div>
      <div class="card"><h2>⚠️ Pelanggaran</h2><div id="pelanggaran">Memuat...</div></div>
    `;
    await loadData("cahaya_app/absensi_program_harian", tanggal, nama, "prog", "program", "status");
    await loadData("cahaya_app/absensi_pembelajaran", tanggal, nama, "pemb", "mapel", "status");
    await loadData("cahaya_app/setoran_tahfiz", tanggal, nama, "tahfiz", "setoran", "nilai");
  }

  async function loadData(path, tanggal, nama, targetId, col1, col2) {
    const target = document.getElementById(targetId);
    try {
      const snap = await get(child(ref(db), path));
      let html = `<table><tr><th>${col1}</th><th>${col2}</th></tr>`;
      if (snap.exists()) {
        Object.values(snap.val()).forEach(d => {
          if (d.tanggal === tanggal && d.data) {
            d.data.forEach(s => {
              if (s.nama?.trim().toUpperCase() === nama) {
                html += `<tr><td>${s[col1] || d[col1]}</td><td>${s[col2] || d[col2]}</td></tr>`;
              }
            });
          }
        });
      }
      html += "</table>";
      target.innerHTML = html.includes("<tr><td") ? html : "Belum ada data.";
    } catch (e) {
      target.textContent = "❌ Gagal memuat data: " + e.message;
    }
  }

  // ======== PROGRES BULANAN =========
  document.getElementById("btnBulanan").onclick = () => {
    toolbar.style.display = "flex";
    toolbar.innerHTML = `<input type="month" id="bulan" value="${new Date().toISOString().slice(0,7)}"><button id="lihatProgresBulanan">Lihat Progres</button>`;
    document.getElementById("lihatProgresBulanan").onclick = () => alert("📅 Progres Bulanan aktif — data siap ditampilkan!");
  };

  window.scrollToTop = () => window.scrollTo({ top: 0, behavior: "smooth" });
  window.logoutWali = logoutWali;
</script>
</body>
</html>
