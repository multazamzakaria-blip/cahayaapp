<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      margin: 0;
      padding: 0;
    }

    /* HEADER & SLIDE */
    .welcome-slide {
      background: linear-gradient(90deg, #0d9488, #0f766e);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 15px;
      text-align: center;
    }
    .slide-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .logo-slide {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }
    .dashboard {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px 60px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    #greeting {
      font-size: 1rem;
      margin-bottom: 12px;
    }

    /* MENU */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .menu-card:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .menu-card img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
    }
    .menu-card h4 {
      margin: 0;
      font-size: 0.95rem;
      color: white;
    }

    /* TOOLBAR */
    .toolbar {
      display: none;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      text-align: center;
    }
    .toolbar input {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
    }
    .toolbar input::-webkit-calendar-picker-indicator { filter: invert(1); }
    .toolbar button {
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }
    .toolbar button:hover { background: #115e59; }

    /* CARD & TABLE */
    .card { border-radius: 12px; padding: 16px; margin-top: 14px; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3); overflow-x: auto; }
    .card.green { background: rgba(34, 197, 94, 0.15); }
    .card.blue { background: rgba(59, 130, 246, 0.15); }
    .card.purple { background: rgba(147, 51, 234, 0.15); }
    .card.red { background: rgba(239, 68, 68, 0.15); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px; text-align: left; word-wrap: break-word; }
    th { background: rgba(255, 255, 255, 0.15); }

    /* STATUS BADGE */
    .status-box {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      color: white;
      text-align: center;
      min-width: 60px;
    }
    .hadir { background: #16a34a; }
    .izin { background: #0ea5e9; }
    .sakit { background: #eab308; color: #111; }
    .alfa { background: #dc2626; }

    /* BUTTON BAWAH */
    .bottom-buttons { text-align: center; margin-top: 30px; }
    .bottom-buttons button {
      background: #0d9488;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .bottom-buttons button:hover { background: #115e59; }
    .logout { background: #dc2626; }
    .logout:hover { background: #b91c1c; }

    footer { text-align: center; margin-top: 20px; font-size: 0.8rem; opacity: 0.8; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .toolbar { flex-direction: row; gap: 5px; }
      .toolbar input { font-size: 0.85rem; }
      .toolbar button { font-size: 0.85rem; padding: 6px 10px; }
    }
  </style>
</head>

<body>
<div class="dashboard">
  <div class="welcome-slide">
    <div class="slide-content">
      <img src="../logofi.png" alt="Logo Pesantren" class="logo-slide" />
      <div>
        <h2>Selamat Datang di <b>Cahaya App</b></h2>
        <p>Pesantren Cahaya Fajrul Islam</p>
      </div>
    </div>
  </div>

  <header>
    <h1>📊 Dashboard Wali Santri</h1>
    <div id="greeting"></div>
  </header>

  <div class="menu-grid">
    <div class="menu-card" id="btnHarian">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
      <h4>Progres Harian</h4>
    </div>
    <div class="menu-card" id="btnBulanan">
      <img src="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" />
      <h4>Progres Bulanan</h4>
    </div>
  </div>

  <div class="toolbar" id="filterToolbar"></div>

  <main id="content">
    <p style="text-align:center;opacity:0.8;">Klik salah satu menu di atas untuk melihat progres santri.</p>
  </main>

  <div class="bottom-buttons">
    <button onclick="scrollToTop()">⬆️ Kembali ke Atas</button>
    <button class="logout" onclick="logoutWali()">Keluar</button>
  </div>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
</div>

<!-- LIBRARY EXPORT PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
  import('./wali-dashboard-script.js').catch(err => {
    console.error('Gagal memuat wali-dashboard-script.js:', err);
    alert('Script tidak bisa dimuat. Pastikan file wali-dashboard-script.js ada di folder yang sama.');
  });
</script>

</body>
</html>
