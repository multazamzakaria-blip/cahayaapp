<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      margin: 0;
      padding: 0;
    }

    /* === HEADER & SLIDE === */
    .welcome-slide {
      background: linear-gradient(90deg, #0d9488, #0f766e);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 15px;
      text-align: center;
    }
    .slide-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .logo-slide {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }
    .dashboard {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px 60px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    #greeting {
      font-size: 1rem;
      margin-bottom: 12px;
    }

    /* === MENU === */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .menu-card:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .menu-card img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
    }
    .menu-card h4 {
      margin: 0;
      font-size: 0.95rem;
      color: white;
    }

    /* === FILTER TOOLBAR === */
    .toolbar {
      display: none;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      text-align: center;
    }
    .toolbar label {
      font-weight: 500;
    }
    .toolbar input {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
    }
    .toolbar input::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    .toolbar button {
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }
    .toolbar button:hover {
      background: #115e59;
    }

    /* === CARD & TABLE === */
    .card {
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }
    .card.green { background: rgba(34, 197, 94, 0.15); }
    .card.blue { background: rgba(59, 130, 246, 0.15); }
    .card.purple { background: rgba(147, 51, 234, 0.15); }
    .card.red { background: rgba(239, 68, 68, 0.15); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px;
      text-align: left;
      word-wrap: break-word;
    }
    th {
      background: rgba(255, 255, 255, 0.15);
    }

    .status-box {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      color: white;
      text-align: center;
      min-width: 60px;
    }
    .hadir { background: #16a34a; }
    .izin { background: #0ea5e9; }
    .sakit { background: #eab308; color: #111; }
    .alfa { background: #dc2626; }

    .bottom-buttons {
      text-align: center;
      margin-top: 30px;
    }
    .bottom-buttons button {
      background: #0d9488;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .bottom-buttons button:hover {
      background: #115e59;
    }
    .logout {
      background: #dc2626;
    }
    .logout:hover {
      background: #b91c1c;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>
<div class="dashboard">
  <div class="welcome-slide">
    <div class="slide-content">
      <img src="../logofi.png" alt="Logo Pesantren" class="logo-slide" />
      <div>
        <h2>Selamat Datang di <b>Cahaya App</b></h2>
        <p>Pesantren Cahaya Fajrul Islam</p>
      </div>
    </div>
  </div>

  <header>
    <h1>📊 Dashboard Wali Santri</h1>
    <div id="greeting"></div>
  </header>

  <div class="menu-grid">
    <div class="menu-card" id="btnHarian">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
      <h4>Progres Harian</h4>
    </div>
    <div class="menu-card" id="btnBulanan">
      <img src="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" />
      <h4>Progres Bulanan</h4>
    </div>
  </div>

  <div class="toolbar" id="filterToolbar"></div>

  <main id="content">
    <p style="text-align:center;opacity:0.8;">Klik salah satu menu di atas untuk melihat progres santri.</p>
  </main>

  <div class="bottom-buttons">
    <button onclick="scrollToTop()">⬆️ Kembali ke Atas</button>
    <button class="logout" onclick="logoutWali()">Keluar</button>
  </div>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
</div>

<!-- pustaka PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
  import { checkWaliLogin, logoutWali } from './wali-script.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
    authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
    databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
    projectId: "absensi-santri-fajrul-islam",
    storageBucket: "absensi-santri-fajrul-islam.appspot.com",
    messagingSenderId: "739928369926",
    appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
  });
  const db = getDatabase(app);
  const dbRef = ref(db);

  const user = checkWaliLogin();
  if (!user) window.location.href = "../index.html";
  document.getElementById("greeting").innerHTML = `👋 Assalamu’alaikum Ayah/Bunda <b>${user.namaAnak}</b>`;

  const content = document.getElementById("content");
  const toolbar = document.getElementById("filterToolbar");

  document.getElementById("btnHarian").addEventListener("click", () => {
    toolbar.style.display = "flex";
    toolbar.innerHTML = `
      <input type="date" id="tanggal" value="${new Date().toISOString().split("T")[0]}" />
      <button id="lihatProgres">Lihat Progres</button>
    `;
    document.getElementById("lihatProgres").onclick = () => {
      const tgl = document.getElementById("tanggal").value;
      if (!tgl) return alert("Pilih tanggal terlebih dahulu.");
      loadProgresHarian(tgl);
    };
    content.innerHTML = `<p style="text-align:center;">Silakan pilih tanggal, lalu klik "Lihat Progres".</p>`;
  });

  document.getElementById("btnBulanan").addEventListener("click", () => {
    toolbar.style.display = "flex";
    toolbar.innerHTML = `
      <input type="month" id="bulan" value="${new Date().toISOString().slice(0,7)}" />
      <button id="lihatProgresBulanan">Lihat Progres</button>
    `;
    document.getElementById("lihatProgresBulanan").onclick = () => {
      const bln = document.getElementById("bulan").value;
      if (!bln) return alert("Pilih bulan terlebih dahulu.");
      loadProgresBulanan(bln);
    };
    content.innerHTML = `<p style="text-align:center;">Silakan pilih bulan, lalu klik "Lihat Progres".</p>`;
  });

  // === PROGRES HARIAN (TIDAK DIUBAH) ===
  async function loadProgresHarian(tanggal) {
    const nama = user.namaAnak.toUpperCase().trim();
    content.innerHTML = `
      <div class="card green"><h2>📋 Absensi Program Harian</h2><div id="prog">Memuat...</div></div>
      <div class="card blue"><h2>📘 Absensi Pembelajaran</h2><div id="pemb">Memuat...</div></div>
      <div class="card purple"><h2>📖 Setoran Tahfiz</h2><div id="tahfiz">Memuat...</div></div>
      <div class="card red"><h2>⚠️ Pelanggaran</h2><div id="pelanggaran">Memuat...</div></div>
    `;
    await Promise.all([
      loadData("cahaya_app/absensi_program_harian", tanggal, nama, "prog", "program", "status"),
      loadData("cahaya_app/absensi_pembelajaran", tanggal, nama, "pemb", "mapel", "status"),
      loadData("cahaya_app/setoran_tahfiz", tanggal, nama, "tahfiz", "setoran", "nilai"),
      loadPelanggaran(tanggal, nama)
    ]);
  }

  async function loadPelanggaran(tanggal, nama) {
    const target = document.getElementById("pelanggaran");
    try {
      const snap = await get(child(dbRef, "cahaya_app/pelanggaran_santri"));
      if (!snap.exists()) return target.textContent = "Belum ada data pelanggaran.";
      let html = `<table><tr>
        <th>Pelanggaran</th><th>Kategori</th><th>Keterangan</th><th>Tindak Lanjut</th><th>Konsekuensi</th>
      </tr>`;
      let ditemukan = false;
      Object.values(snap.val()).forEach(p => {
        if (p.tanggal === tanggal && (p.santri || "").trim().toUpperCase() === nama) {
          ditemukan = true;
          html += `
            <tr>
              <td>${p.namaPelanggaran || "-"}</td>
              <td>${p.kategori || "-"}</td>
              <td>${p.keterangan || "-"}</td>
              <td>${p.tindakLanjut || "-"}</td>
              <td>${p.konsekuensi || "-"}</td>
            </tr>`;
        }
      });
      html += "</table>";
      target.innerHTML = ditemukan ? html : "Tidak ada pelanggaran hari ini.";
    } catch (err) {
      target.textContent = "❌ Gagal memuat pelanggaran: " + err.message;
    }
  }

  async function loadData(path, tanggal, nama, targetId, col1, col2) {
    const target = document.getElementById(targetId);
    try {
      const snap = await get(child(dbRef, path));
      let html = `<table><tr><th>${capitalize(col1)}</th><th>${capitalize(col2)}</th></tr>`;
      if (snap.exists()) {
        Object.values(snap.val()).forEach(d => {
          if (d.tanggal === tanggal && d.data) {
            d.data.forEach(s => {
              if ((s.nama || "").trim().toUpperCase() === nama) {
                const val = (s[col2] || d[col2] || "-").toLowerCase();
                const statusClass = val.includes("hadir") ? "hadir" :
                                    val.includes("izin") ? "izin" :
                                    val.includes("sakit") ? "sakit" :
                                    val.includes("alfa") ? "alfa" : "";
                html += `<tr><td>${s[col1] || d[col1] || "-"}</td><td><span class="status-box ${statusClass}">${s[col2]}</span></td></tr>`;
              }
            });
          }
        });
      }
      html += "</table>";
      target.innerHTML = html.includes("<tr><td") ? html : "Belum ada data.";
    } catch (e) {
      target.textContent = "❌ Gagal memuat data: " + e.message;
    }
  }

  // === PROGRES BULANAN (LENGKAP) ===
  async function loadProgresBulanan(bulanStr) {
    const namaSantri = user.namaAnak.trim();
    const [tahunStr, bulanNumStr] = bulanStr.split("-");
    const tahun = parseInt(tahunStr);
    const bulan = parseInt(bulanNumStr) - 1;
    const namaUpper = namaSantri.toUpperCase();
    const bulanNama = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][bulan];
    content.innerHTML = `<div style="background:#f9fafb;color:#111;border-radius:12px;padding:20px;margin-top:10px;box-shadow:0 4px 14px rgba(0,0,0,0.25);" id="laporanBulanan">
      <h2 style="text-align:center;color:#0f766e;">📋 LAPORAN BULANAN SANTRI</h2>
      <h3 style="text-align:center;margin:4px 0;">${namaUpper}</h3>
      <p style="text-align:center;color:#374151;">Bulan ${bulanNama} ${tahun}</p>
      <div id="laporanIsi"><p style="text-align:center;">Memuat data...</p></div></div>`;

    const isi = document.getElementById("laporanIsi");
    function parseDate(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
    function isSameMonthYear(tgl,b,t){ const d=parseDate(tgl); return d && d.getMonth()===b && d.getFullYear()===t; }

    try {
      const [assesGuruSnap,assesNaqibSnap,absNaqibSnap,absKbmSnap,ujianSnap,tahfizSnap,pelanggaranSnap]=await Promise.all([
        get(child(dbRef,"cahaya_app/assesment_cahaya_santri")),
        get(child(dbRef,"cahaya_app/assesment_cahaya_naqib")),
        get(child(dbRef,"cahaya_app/absensi_program_harian")),
        get(child(dbRef,"cahaya_app/absensi_pembelajaran")),
        get(child(dbRef,"cahaya_app/nilai_ujian")),
        get(child(dbRef,"cahaya_app/setoran_tahfiz")),
        get(child(dbRef,"cahaya_app/pelanggaran_santri"))
      ]);

      const data={
        guru:assesGuruSnap.exists()?Object.values(assesGuruSnap.val()):[],
        naqib:assesNaqibSnap.exists()?Object.values(assesNaqibSnap.val()):[],
        absHarian:absNaqibSnap.exists()?Object.values(absNaqibSnap.val()):[],
        absKbm:absKbmSnap.exists()?Object.values(absKbmSnap.val()):[],
        ujian:ujianSnap.exists()?Object.values(ujianSnap.val()):[],
        tahfiz:tahfizSnap.exists()?Object.values(tahfizSnap.val()):[],
        pel:pelanggaranSnap.exists()?Object.values(pelanggaranSnap.val()):[]
      };

      const guru=data.guru.find(a=>a.namaSantri===namaSantri&&isSameMonthYear(a.tanggal,bulan,tahun))||{};
      const naqib=data.naqib.find(a=>a.namaSantri===namaSantri&&isSameMonthYear(a.tanggal,bulan,tahun))||{};
      const narasi={
        spiritual:guru.narasiSpiritual||"Belum ada catatan Spiritual.",
        relational:naqib.narasiRelational||"Belum ada catatan Relational.",
        emotional:naqib.narasiEmotional||"Belum ada catatan Emotional.",
        intellectual:guru.narasiIntellectual||"Belum ada catatan Intellectual.",
        physical:naqib.narasiPhysical||"Belum ada catatan Physical."
      };

      function hitungKehadiran(abs1,abs2){
        const res={};
        function add(p,s){if(!res[p])res[p]={hadir:0,izin:0,sakit:0,alfa:0,total:0};
          const st=(s||"").toLowerCase();if(res[p][st]!==undefined)res[p][st]++;res[p].total++;}
        abs1.forEach(a=>{if(!isSameMonthYear(a.tanggal,bulan,tahun))return;(a.data||[]).forEach(d=>{if((d.nama||"").toUpperCase()===namaUpper)add(a.program||"Program Harian",d.status);});});
        abs2.forEach(a=>{if(!isSameMonthYear(a.tanggal,bulan,tahun))return;(a.data||[]).forEach(d=>{if((d.nama||"").toUpperCase()===namaUpper)add(a.mapel||"KBM",d.status);});});
        return Object.entries(res).map(([p,v],i)=>({no:i+1,program:p,hadir:Math.round(v.hadir/v.total*100),izin:Math.round(v.izin/v.total*100),sakit:Math.round(v.sakit/v.total*100),alfa:Math.round(v.alfa/v.total*100)}));
      }

      const hadir=hitungKehadiran(data.absHarian,data.absKbm);
      const ujian=data.ujian.filter(u=>u.santri===namaSantri&&isSameMonthYear(u.tanggal,bulan,tahun));
      const tahfiz=data.tahfiz.filter(t=>isSameMonthYear(t.tanggal,bulan,tahun)).flatMap(t=>t.data||[]).filter(d=>d.nama===namaSantri);
      const pel=data.pel.filter(p=>p.santri===namaSantri&&isSameMonthYear(p.tanggal,bulan,tahun));

      isi.innerHTML=`<h3 style="color:#0f766e;">🌈 Dimensi CAHAYA</h3>
      ${Object.entries(narasi).map(([k,v])=>`<div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:0.85rem;">${v}</div>`).join("")}
      <h3 style="color:#0f766e;">📅 Kehadiran</h3>${hadir.length?`<table style="width:100%;border-collapse:collapse;font-size:0.8rem;">
      <tr><th>No</th><th>Program</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alfa</th></tr>
      ${hadir.map(r=>`<tr><td>${r.no}</td><td>${r.program}</td><td style='color:#16a34a;'>${r.hadir}%</td><td style='color:#0ea5e9;'>${r.izin}%</td><td style='color:#eab308;'>${r.sakit}%</td><td style='color:#dc2626;'>${r.alfa}%</td></tr>`).join("")}</table>`:"<p>Belum ada data kehadiran.</p>"}
      <h3 style="color:#0f766e;">🧾 Nilai Ujian</h3>${ujian.length?`<table style="width:100%;border-collapse:collapse;font-size:0.8rem;">
      <tr><th>No</th><th>Mapel</th><th>Materi</th><th>Nilai</th></tr>${ujian.map((u,i)=>`<tr><td>${i+1}</td><td>${u.mapel}</td><td>${u.materi}</td><td>${u.nilai}</td></tr>`).join("")}</table>`:"<p>Belum ada data ujian.</p>"}
      <h3 style="color:#0f766e;">📖 Setoran Tahfiz</h3>${tahfiz.length?`<table style="width:100%;border-collapse:collapse;font-size:0.8rem;">
      <tr><th>No</th><th>Setoran</th><th>Nilai</th></tr>${tahfiz.map((t,i)=>`<tr><td>${i+1}</td><td>${t.setoran||t.surat||"-"}</td><td>${t.nilai||"-"}</td></tr>`).join("")}</table>`:"<p>Belum ada setoran tahfiz.</p>"}
      <h3 style="color:#0f766e;">⚠️ Pelanggaran</h3>${pel.length?`<table style="width:100%;border-collapse:collapse;font-size:0.8rem;">
      <tr><th>No</th><th>Tanggal</th><th>Pelanggaran</th><th>Keterangan</th></tr>${pel.map((p,i)=>`<tr><td>${i+1}</td><td>${p.tanggal}</td><td>${p.namaPelanggaran}</td><td>${p.keterangan}</td></tr>`).join("")}</table>`:"<p>Tidak ada pelanggaran bulan ini.</p>"}
      <div style="text-align:center;margin-top:12px;"><button id="btnPdf" style="background:#2563eb;border:none;color:white;border-radius:8px;padding:8px 14px;font-weight:600;">⬇️ Unduh PDF</button></div>`;

      document.getElementById("btnPdf").onclick=async()=>{
        const el=document.getElementById("laporanBulanan");
        const canvas=await html2canvas(el,{scale:2,scrollY:0,useCORS:true});
        const imgData=canvas.toDataURL("image/png");
        const{jsPDF}=window.jspdf;
        const pdf=new jsPDF("p","mm","a4");
        const pageWidth=pdf.internal.pageSize.getWidth();
        const imgWidth=pageWidth-20;
        const imgHeight=(canvas.height*imgWidth)/canvas.width;
        pdf.addImage(imgData,"PNG",10,10,imgWidth,imgHeight);
        pdf.save(`Laporan_${namaSantri.replace(/\s+/g,"_")}_${bulanNama}_${tahun}.pdf`);
      };
    } catch(e){
      isi.innerHTML=`<p style="color:red;">Gagal memuat data: ${e.message}</p>`;
    }
  }

  function capitalize(str){return str?str.charAt(0).toUpperCase()+str.slice(1):"";}
  window.scrollToTop=()=>window.scrollTo({top:0,behavior:"smooth"});
  window.logoutWali=logoutWali;
</script>
</body>
</html>
