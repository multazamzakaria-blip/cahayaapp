<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wali Santri - CAHAYA APP</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      margin: 0;
      padding: 0;
    }

    .dashboard {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px 60px;
    }

    .welcome-slide {
      background: linear-gradient(90deg, #0d9488, #0f766e);
      color: white;
      padding: 16px 18px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 15px;
      text-align: center;
    }
    .slide-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .logo-slide {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }
    .slide-text h2 {
      margin: 0;
      line-height: 1.3;
      font-size: 1.4rem;
    }
    .slide-text b {
      font-size: 1.6rem;
      display: block;
    }
    .slide-text p {
      margin-top: 4px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    #greeting {
      font-size: 1rem;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    #greeting b {
      display: block;
      font-size: 1.1rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .menu-card:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .menu-card img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
    }
    .menu-card h4 {
      margin: 0;
      font-size: 0.95rem;
      color: white;
    }

    .toolbar {
      display: none;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      text-align: center;
    }
    .toolbar input {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
    }
    .toolbar input::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    .toolbar button {
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }
    .toolbar button:hover {
      background: #115e59;
    }

    .card {
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }
    .card.green { background: rgba(34, 197, 94, 0.15); }
    .card.blue { background: rgba(59, 130, 246, 0.15); }
    .card.purple { background: rgba(147, 51, 234, 0.15); }
    .card.red { background: rgba(239, 68, 68, 0.15); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px;
      text-align: left;
    }
    th {
      background: rgba(255, 255, 255, 0.15);
    }

    .status-box {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      color: white;
      text-align: center;
      min-width: 60px;
    }
    .hadir { background: #16a34a; }
    .izin { background: #0ea5e9; }
    .sakit { background: #eab308; color: #111; }
    .alfa { background: #dc2626; }

    .bottom-buttons {
      text-align: center;
      margin-top: 30px;
    }
    .bottom-buttons button {
      background: #0d9488;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .bottom-buttons button:hover {
      background: #115e59;
    }
    .logout {
      background: #dc2626;
    }
    .logout:hover {
      background: #b91c1c;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .toolbar { flex-direction: row; gap: 5px; }
      .toolbar input { font-size: 0.85rem; }
      .toolbar button { font-size: 0.85rem; padding: 6px 10px; }
    }
  </style>
</head>

<body>
<div class="dashboard">
  <div class="welcome-slide">
    <div class="slide-content">
      <img src="../logofi.png" alt="Logo Pesantren" class="logo-slide" />
      <div class="slide-text">
        <h2>Selamat Datang di<br><b>Cahaya App</b></h2>
        <p>Pesantren Cahaya Fajrul Islam</p>
      </div>
    </div>
  </div>

  <header>
    <h1>📊 Dashboard Wali Santri</h1>
    <div id="greeting"></div>
  </header>

  <div class="menu-grid">
    <div class="menu-card" id="btnHarian">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
      <h4>Progres Harian</h4>
    </div>
    <div class="menu-card" id="btnBulanan">
      <img src="https://cdn-icons-png.flaticon.com/512/3209/3209265.png" />
      <h4>Progres Bulanan</h4>
    </div>
  </div>

  <div class="toolbar" id="filterToolbar"></div>

  <main id="content">
    <p style="text-align:center;opacity:0.8;">Klik salah satu menu di atas untuk melihat progres santri.</p>
  </main>

  <div class="bottom-buttons">
    <button onclick="scrollToTop()">⬆️ Kembali ke Atas</button>
    <button class="logout" onclick="logoutWali()">Keluar</button>
  </div>

  <footer>© 2025 Pesantren Cahaya Fajrul Islam</footer>
</div>
  <!-- LIBRARY UNTUK EXPORT PDF (PROGRES BULANAN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- SCRIPT UTAMA DASHBOARD WALI -->
  <script type="module">
    import { checkWaliLogin, logoutWali } from './wali-script.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // --- Firebase config ---
    const app = initializeApp({
      apiKey: "AIzaSyB0Ez2a85ZwQLR28U-yHpVmM3o8NMxZoLI",
      authDomain: "absensi-santri-fajrul-islam.firebaseapp.com",
      databaseURL: "https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com",
      projectId: "absensi-santri-fajrul-islam",
      storageBucket: "absensi-santri-fajrul-islam.appspot.com",
      messagingSenderId: "739928369926",
      appId: "1:739928369926:web:7e95375c3ddba0f584cdd07"
    });
    const db = getDatabase(app);

    // --- Cek login wali ---
    const user = checkWaliLogin();
    if (!user) window.location.href = "../index.html";
    document.getElementById("greeting").innerHTML =
      `👋 Assalamu’alaikum Ayah/Bunda<br><b>${user.namaAnak}</b>`;

    const content  = document.getElementById("content");
    const toolbar  = document.getElementById("filterToolbar");
    const btnHarian  = document.getElementById("btnHarian");
    const btnBulanan = document.getElementById("btnBulanan");

    // ====== EVENT: PROGRES HARIAN ======
    btnHarian.addEventListener("click", () => {
      const today = new Date().toISOString().split("T")[0];
      toolbar.style.display = "flex";
      toolbar.innerHTML = `
        <input type="date" id="tanggal" value="${today}" />
        <button id="lihatProgres">Lihat Progres</button>
      `;
      document.getElementById("lihatProgres").onclick = () => {
        const tgl = document.getElementById("tanggal").value;
        if (!tgl) return alert("Pilih tanggal terlebih dahulu.");
        loadProgresHarian(tgl);
      };
      content.innerHTML =
        `<p style="text-align:center;">Silakan pilih tanggal, lalu klik "Lihat Progres".</p>`;
    });

    // ====== EVENT: PROGRES BULANAN ======
    btnBulanan.addEventListener("click", () => {
      const defaultMonth = new Date().toISOString().slice(0, 7); // yyyy-mm
      toolbar.style.display = "flex";
      toolbar.innerHTML = `
        <input type="month" id="bulan" value="${defaultMonth}" />
        <button id="lihatProgresBulanan">Lihat Progres</button>
      `;
      document.getElementById("lihatProgresBulanan").onclick = () => {
        const bln = document.getElementById("bulan").value;
        if (!bln) return alert("Pilih bulan terlebih dahulu.");
        loadProgresBulanan(bln);
      };
      content.innerHTML =
        `<p style="text-align:center;">Silakan pilih bulan, lalu klik "Lihat Progres".</p>`;
    });

    // ========= PROGRES HARIAN (TABEL + KOTAK WARNA) =========
    async function loadProgresHarian(tanggal) {
      const nama = user.namaAnak.toUpperCase().trim();

      // 4 kartu berwarna
      content.innerHTML = `
        <div class="card green">
          <h2>📋 Absensi Program Harian</h2>
          <div id="prog">Memuat...</div>
        </div>
        <div class="card blue">
          <h2>📘 Absensi Pembelajaran</h2>
          <div id="pemb">Memuat...</div>
        </div>
        <div class="card purple">
          <h2>📖 Setoran Tahfiz</h2>
          <div id="tahfiz">Memuat...</div>
        </div>
        <div class="card red">
          <h2>⚠️ Pelanggaran</h2>
          <div id="pelanggaran">Memuat...</div>
        </div>
      `;

      await loadDataHarian(
        "cahaya_app/absensi_program_harian",
        tanggal, nama, "prog", "program", "status"
      );
      await loadDataHarian(
        "cahaya_app/absensi_pembelajaran",
        tanggal, nama, "pemb", "mapel", "status"
      );
      await loadDataHarian(
        "cahaya_app/setoran_tahfiz",
        tanggal, nama, "tahfiz", "setoran", "nilai"
      );
      await loadPelanggaranHarian(tanggal, nama);
    }

    // --- helper tampil tabel untuk Harian ---
    async function loadDataHarian(path, tanggal, namaUpper, targetId, col1, col2) {
      const target = document.getElementById(targetId);
      try {
        const snap = await get(child(ref(db), path));
        let html = `<table><tr><th>${capitalize(col1)}</th><th>${capitalize(col2)}</th></tr>`;

        if (snap.exists()) {
          Object.values(snap.val()).forEach(d => {
            if (d.tanggal === tanggal && d.data) {
              d.data.forEach(s => {
                if (s.nama?.trim().toUpperCase() === namaUpper) {
                  const rawVal = (s[col2] || d[col2] || "-").toString();
                  const valLower = rawVal.toLowerCase();
                  let statusClass = "";
                  if (valLower.includes("hadir")) statusClass = "hadir";
                  else if (valLower.includes("izin")) statusClass = "izin";
                  else if (valLower.includes("sakit")) statusClass = "sakit";
                  else if (valLower.includes("alfa")) statusClass = "alfa";

                  const nilaiCell = col2 === "status"
                    ? `<span class="status-box ${statusClass}">${rawVal}</span>`
                    : rawVal || "-";

                  html += `
                    <tr>
                      <td>${s[col1] || d[col1] || "-"}</td>
                      <td>${nilaiCell}</td>
                    </tr>`;
                }
              });
            }
          });
        }

        html += "</table>";
        target.innerHTML =
          html.includes("<tr><td") ? html : "Belum ada data.";
      } catch (e) {
        target.textContent = "❌ Gagal memuat data: " + e.message;
      }
    }

    // --- Pelanggaran Harian ---
    async function loadPelanggaranHarian(tanggal, namaUpper) {
      const target = document.getElementById("pelanggaran");
      try {
        const snap = await get(child(ref(db), "cahaya_app/pelanggaran_santri"));
        if (!snap.exists()) {
          target.textContent = "Belum ada data pelanggaran.";
          return;
        }
        let html = `<table>
          <tr>
            <th>Pelanggaran</th>
            <th>Kategori</th>
            <th>Keterangan</th>
            <th>Tindak Lanjut</th>
            <th>Konsekuensi</th>
          </tr>`;
        let ditemukan = false;

        Object.values(snap.val()).forEach(p => {
          if (p.tanggal === tanggal &&
              p.santri?.trim().toUpperCase() === namaUpper) {
            ditemukan = true;
            html += `
              <tr>
                <td>${p.namaPelanggaran || "-"}</td>
                <td>${p.kategori || "-"}</td>
                <td>${p.keterangan || p.ket || "-"}</td>
                <td>${p.tindakLanjut || "-"}</td>
                <td>${p.konsekuensi || "-"}</td>
              </tr>
            `;
          }
        });

        html += "</table>";
        target.innerHTML = ditemukan
          ? html
          : "Tidak ada pelanggaran hari ini.";
      } catch (err) {
        target.textContent = "❌ Gagal memuat pelanggaran: " + err.message;
      }
    }

    // ====== HELPER UMUM ======
    function capitalize(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }
    function parseDate(s) {
      if (!s) return null;
      const p = s.split("-");
      return new Date(+p[0], +p[1] - 1, +p[2]);
    }
    function isSameMonthYear(tgl, bulan, tahun) {
      const d = parseDate(tgl);
      return d && d.getMonth() === bulan && d.getFullYear() === tahun;
    }

    window.scrollToTop = () =>
      window.scrollTo({ top: 0, behavior: "smooth" });
    window.logoutWali = logoutWali;
    // ========= PROGRES BULANAN (LAPORAN CAHAYA + PDF) =========
    async function loadProgresBulanan(bulan) {
      const namaSantri = user.namaAnak.trim();
      const [tahunStr, bulanStr] = bulan.split("-"); // "2025-11"
      const tahun = parseInt(tahunStr, 10);
      const bulanIndex = parseInt(bulanStr, 10) - 1;
      const namaUpper = namaSantri.toUpperCase();
      const namaBulan = [
        "Januari","Februari","Maret","April","Mei","Juni",
        "Juli","Agustus","September","Oktober","November","Desember"
      ][bulanIndex];

      // bungkus putih agar cakep saat export
      content.innerHTML = `
        <div style="
          background:#f4f6fa;
          padding:18px;
          border-radius:16px;
          box-shadow:0 4px 16px rgba(0,0,0,0.18);
        ">
          <div id="laporanBulananInner" style="background:white;border-radius:14px;padding:20px;">
            <p style="text-align:center;opacity:0.8;margin:0;">
              Memuat laporan bulanan ${namaSantri} bulan ${namaBulan} ${tahun}...
            </p>
          </div>
        </div>
      `;

      const laporanContainer = document.getElementById("laporanBulananInner");

      try {
        // ambil semua data terkait
        const [
          assesGuruSnap,
          assesNaqibSnap,
          absNaqibSnap,
          absKbmSnap,
          ujianSnap,
          tahfizSnap,
          pelanggaranSnap
        ] = await Promise.all([
          get(child(ref(db), "cahaya_app/assesment_cahaya_santri")),
          get(child(ref(db), "cahaya_app/assesment_cahaya_naqib")),
          get(child(ref(db), "cahaya_app/absensi_program_harian")),
          get(child(ref(db), "cahaya_app/absensi_pembelajaran")),
          get(child(ref(db), "cahaya_app/nilai_ujian")),
          get(child(ref(db), "cahaya_app/setoran_tahfiz")),
          get(child(ref(db), "cahaya_app/pelanggaran_santri")),
        ]);

        const data = {
          assesmentGuru : assesGuruSnap.exists()  ? Object.values(assesGuruSnap.val())  : [],
          assesmentNaqib: assesNaqibSnap.exists() ? Object.values(assesNaqibSnap.val()) : [],
          absensiNaqib  : absNaqibSnap.exists()   ? Object.values(absNaqibSnap.val())   : [],
          absensiKbm    : absKbmSnap.exists()     ? Object.values(absKbmSnap.val())     : [],
          ujian         : ujianSnap.exists()      ? Object.values(ujianSnap.val())      : [],
          tahfiz        : tahfizSnap.exists()     ? Object.values(tahfizSnap.val())     : [],
          pelanggaranAll: pelanggaranSnap.exists()? Object.values(pelanggaranSnap.val()): [],
        };

        // ---- fungsi kehadiran bulanan (program harian + KBM) ----
        function hitungKehadiranGabungan(nama, bulan, tahun, absensiNaqib, absensiGuru) {
          const kehadiran = {};
          function tambah(prog, status) {
            if (!kehadiran[prog]) {
              kehadiran[prog] = { hadir:0, izin:0, sakit:0, alfa:0, total:0 };
            }
            const s = (status || "").toLowerCase();
            if (kehadiran[prog][s] !== undefined) kehadiran[prog][s]++;
            kehadiran[prog].total++;
          }

          absensiNaqib.forEach(log => {
            if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
            (log.data || []).forEach(d => {
              if ((d.nama || "").toUpperCase() === namaUpper) {
                tambah(log.program || "Program Harian", d.status);
              }
            });
          });

          absensiGuru.forEach(log => {
            if (!isSameMonthYear(log.tanggal, bulan, tahun)) return;
            (log.data || []).forEach(d => {
              if ((d.nama || "").toUpperCase() === namaUpper) {
                tambah(log.mapel || "KBM", d.status);
              }
            });
          });

          const result = Object.entries(kehadiran).map(([prog, v], i) => {
            const toP = x => (v.total ? Math.round((x / v.total) * 100) : 0);
            return {
              no: i + 1,
              program: prog,
              hadir: toP(v.hadir),
              izin : toP(v.izin),
              sakit: toP(v.sakit),
              alfa : toP(v.alfa)
            };
          });

          if (result.length) {
            const avg = field =>
              Math.round(result.reduce((s, r) => s + r[field], 0) / result.length);
            result.push({
              no: "",
              program: "<b>Rata-rata</b>",
              hadir: avg("hadir"),
              izin : avg("izin"),
              sakit: avg("sakit"),
              alfa : avg("alfa")
            });
          }
          return result;
        }

        // ---- bangun laporan untuk 1 santri (mirip admin) ----
        const {
          assesmentGuru,
          assesmentNaqib,
          absensiNaqib,
          absensiKbm,
          ujian,
          tahfiz,
          pelanggaranAll
        } = data;

        const asesGuru =
          assesmentGuru
            .filter(a =>
              a.namaSantri === namaSantri &&
              isSameMonthYear(a.tgl || a.tanggal, bulanIndex, tahun)
            )
            .at(-1) || {};

        const asesNaqib =
          assesmentNaqib
            .filter(a =>
              a.namaSantri === namaSantri &&
              isSameMonthYear(a.tgl || a.tanggal, bulanIndex, tahun)
            )
            .at(-1) || {};

        const narasiSpiritual =
          asesGuru.narasiSpiritual ||
          asesGuru.catatanSpiritual ||
          "Belum ada catatan asesmen Cinta Allah (Spiritual) bulan ini.";

        const narasiIntellectual =
          asesGuru.narasiIntellectual ||
          asesGuru.catatanAkal ||
          "Belum ada catatan asesmen Akal Cerdas (Intellectual) bulan ini.";

        const narasiRel =
          asesNaqib.narasiRelational ||
          asesNaqib.catatanRelasi ||
          "Belum ada catatan dimensi Akhlak Mulia (Relational) bulan ini.";

        const narasiEmo =
          asesNaqib.narasiEmotional ||
          asesNaqib.catatanHati ||
          "Belum ada catatan dimensi Hati Bersih (Emotional) bulan ini.";

        const narasiFis =
          asesNaqib.narasiPhysical ||
          asesNaqib.catatanFisik ||
          "Belum ada catatan dimensi Fisik Berdaya (Physical) bulan ini.";

        const namaNaqib =
          asesNaqib.naqibName || asesNaqib.namaNaqib || "-";

        // === Kehadiran ===
        const dataKehadiran = hitungKehadiranGabungan(
          namaSantri, bulanIndex, tahun, absensiNaqib, absensiKbm
        );

        // === Nilai ujian ===
        const nilaiUjian = ujian
          .filter(u =>
            (u.santri || "").toLowerCase() === namaSantri.toLowerCase() &&
            isSameMonthYear(u.tanggal, bulanIndex, tahun)
          )
          .filter((u, i, self) =>
            i === self.findIndex(
              x =>
                x.santri === u.santri &&
                x.mapel === u.mapel &&
                x.materi === u.materi &&
                x.tanggal === u.tanggal
            )
          );
        let rataUjian = 0;
        if (nilaiUjian.length) {
          rataUjian = Math.round(
            nilaiUjian.reduce((s, u) => s + (+u.nilai || 0), 0) /
            nilaiUjian.length
          );
        }

        // === Tahfiz ===
        const dataTahfiz = tahfiz
          .filter(t => isSameMonthYear(t.tanggal, bulanIndex, tahun))
          .flatMap(t => t.data || [])
          .filter(d => d.nama === namaSantri);

        // === Pelanggaran ===
        const dataPelanggaran = pelanggaranAll
          .filter(p =>
            p.santri === namaSantri &&
            isSameMonthYear(p.tanggal, bulanIndex, tahun)
          );

        // ====== RENDER HTML LAPORAN (PUTIH) ======
        laporanContainer.innerHTML = `
          <div class="laporan-card" style="border:1px solid #e5e7eb;border-radius:16px;padding:24px;">

    // === Export PDF khusus Wali ===
    window.exportPDFWali = async function (namaUpper, bulanText, tahun) {
      const el = document.querySelector("#laporanBulananInner");
      if (!el || !window.jspdf || !window.jspdf.jsPDF) {
        alert("Gagal membuat PDF.");
        return;
      }
      const canvas = await html2canvas(el, {
        scale: 2,
        useCORS: true,
        scrollY: 0
      });
      const imgData = canvas.toDataURL("image/png");
      const pdf = new window.jspdf.jsPDF("p", "mm", "a4");
      const pageWidth = pdf.internal.pageSize.getWidth();
      const imgWidth = pageWidth - 20;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;

      pdf.addImage(imgData, "PNG", 10, 10, imgWidth, imgHeight);
      const safeName = namaUpper.replace(/\s+/g, "_");
      pdf.save(`Laporan_${safeName}_${bulanText}_${tahun}.pdf`);
    };
